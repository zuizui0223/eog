<text x="553" y="418" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#172033">C</text>
<rect class="panel" x="535" y="660" width="490" height="285" rx="16"/>
<text x="553" y="688" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#172033">D</text>
<rect class="panel" x="1055" y="660" width="490" height="285" rx="16"/>
<text x="1073" y="688" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#172033">E</text>
<text x="107" y="150" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#172033">Prospectively declared reference ladder</text>
