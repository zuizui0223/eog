<text x="903.3333333333335" y="330" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#526070">0.54</text>
<line class="grid" x1="1085.5555555555552" y1="225" x2="1085.5555555555552" y2="308"/>
<text x="1085.5555555555552" y="330" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#526070">0.58</text>
<line class="grid" x1="1267.7777777777778" y1="225" x2="1267.7777777777778" y2="308"/>
<text x="1267.7777777777778" y="330" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#526070">0.62</text>
<line class="grid" x1="1450.0" y1="225" x2="1450.0" y2="308"/>
<text x="1450.0" y="330" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#526070">0.66</text>
<line class="zero" x1="721.1111111111112" y1="225" x2="721.1111111111112" y2="308"/>
<line class="ci" x1="1216.2116652584755" y1="265" x2="1299.413607797449" y2="265"/>
<circle cx="1257.5122514517332" cy="265" r="8" fill="#2f855a"/>
<text x="1445" y="248" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="end" fill="#172033">mean concordance = 0.618  [0.609, 0.627]</text>
<text x="1445" y="278" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="end" fill="#526070">845 estimable taxa; null = 0.5</text>
<text x="1445" y="304" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#2f855a">Interpretation: structure retains conditional ordering information</text>
<text x="587" y="420" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#172033">Rich R3 reference: incremental predictive value</text>
<text x="587" y="448" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#526070">Primary endpoint: matched held-out log loss, C − R3; negative favours EOG</text>
<line class="grid" x1="630.0" y1="495" x2="630.0" y2="578"/>
<text x="630.0" y="600" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#526070">-0.004</text>
