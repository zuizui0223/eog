<text x="170" y="781" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#172033">+ species-conditioned EOG</text>
<text x="120" y="810" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#526070">geography-only connected frequency</text>
<text x="280.0" y="905" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#b94a48">Primary extension contrast: C − R3 only</text>
<text x="587" y="150" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#172033">Restricted reference: conditional ordering</text>
<text x="587" y="178" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#526070">Reference: climatic support + nearest outer-training source distance</text>
<line class="grid" x1="721.1111111111112" y1="225" x2="721.1111111111112" y2="308"/>
<text x="721.1111111111112" y="330" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#526070">0.50</text>
