<text x="120" y="233" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#94a3b8">R0</text>
<text x="170" y="233" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#172033">climate</text>
<text x="120" y="262" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#526070">5 CHELSA predictors</text>
<line x1="280.0" y1="308" x2="280.0" y2="332" stroke="#94a3b8" stroke-width="3"/>
<polygon points="280.0,334 272.0,322 288.0,322" fill="#94a3b8"/>
