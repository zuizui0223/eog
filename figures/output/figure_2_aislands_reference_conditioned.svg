<text x="170" y="507" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#172033">+ species-source pressure</text>
<text x="120" y="536" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#526070">unweighted + source-area weighted</text>
