<text x="170" y="644" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#172033">+ generic landscape context</text>
<text x="120" y="673" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#526070">surrounding landmass + generic stepping stones / network position</text>
<line x1="280.0" y1="719" x2="280.0" y2="743" stroke="#94a3b8" stroke-width="3"/>
<polygon points="280.0,745 272.0,733 288.0,733" fill="#94a3b8"/>
<rect x="100" y="753" width="360" height="103" rx="14" fill="#eef6ff" stroke="#4f79a7" stroke-width="2"/>
