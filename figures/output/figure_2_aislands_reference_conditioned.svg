<text x="120" y="370" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#94a3b8">R1</text>
<text x="170" y="370" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#172033">+ recipient geometry</text>
<text x="120" y="399" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#526070">area + mainland distance + nearest source</text>
<line x1="280.0" y1="445" x2="280.0" y2="469" stroke="#94a3b8" stroke-width="3"/>
<polygon points="280.0,471 272.0,459 288.0,459" fill="#94a3b8"/>
