<text x="1040.0" y="600" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#526070">+0.002</text>
<line class="grid" x1="1176.6666666666665" y1="495" x2="1176.6666666666665" y2="578"/>
<text x="1176.6666666666665" y="600" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#526070">+0.004</text>
<line class="grid" x1="1313.3333333333335" y1="495" x2="1313.3333333333335" y2="578"/>
<text x="1313.3333333333335" y="600" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#526070">+0.006</text>
<line class="grid" x1="1450.0" y1="495" x2="1450.0" y2="578"/>
<text x="1450.0" y="600" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#526070">+0.008</text>
<line class="zero" x1="903.3333333333333" y1="495" x2="903.3333333333333" y2="578"/>
<line class="ci" x1="1071.8722091458408" y1="535" x2="1211.3947930293057" y2="535"/>
<circle cx="1141.487409214807" cy="535" r="8" fill="#b94a48"/>
<text x="1445" y="518" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="end" fill="#172033">C − R3 = +0.00349  [+0.00247, +0.00451]</text>
<text x="1445" y="548" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="end" fill="#526070">886 estimable taxa; 4,231 / 4,430 folds evaluable</text>
<text x="1445" y="574" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#b94a48">Interpretation: adverse incremental predictive effect beyond R3</text>
<text x="587" y="690" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#172033">Species-level direction</text>
<text x="580" y="732" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#172033">Original conditional-concordance endpoint</text>
<rect x="580" y="750" width="288.21670428893907" height="28" fill="#2f855a"/>
<rect x="868.2167042889391" y="750" width="18.013544018058692" height="28" fill="#94a3b8"/>
<rect x="886.2302483069979" y="750" width="56.18510158013544" height="28" fill="#b94a48"/>
<rect x="942.4153498871333" y="750" width="17.584650112866818" height="28" fill="#e2e8f0"/>
<text x="580" y="796" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#526070">above 0.5: 672 | equal: 42 | below: 131 | N/E: 41</text>
<text x="580" y="845" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#172033">Strong-reference C − R3 endpoint</text>
<rect x="580" y="863" width="146.2528216704289" height="28" fill="#2f855a"/>
<rect x="726.2528216704288" y="863" width="233.7471783295711" height="28" fill="#b94a48"/>
<text x="580" y="909" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#526070">favourable: 341 | adverse: 545</text>
<text x="1107" y="690" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#172033">What the pair of results establishes</text>
<circle cx="1110" cy="731" r="14" fill="#334155"/>
<text x="1110" y="736" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">1</text>
<text x="1137" y="736" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#334155">The restricted-reference result earns a narrow structural-ordering claim.</text>
<circle cx="1110" cy="780" r="14" fill="#334155"/>
<text x="1110" y="785" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">2</text>
<text x="1137" y="785" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#334155">That signal does not survive as an incremental predictive gain beyond R3.</text>
<circle cx="1110" cy="829" r="14" fill="#334155"/>
<text x="1110" y="834" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">3</text>
<text x="1137" y="834" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#334155">The endpoints differ; they are not pooled or compared as one effect size.</text>
<circle cx="1110" cy="878" r="14" fill="#334155"/>
<text x="1110" y="883" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">4</text>
<text x="1137" y="883" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#334155">Reference depth is part of the estimand, not a nuisance detail.</text>
<text x="1300.0" y="923" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#526070">No movement / dispersal / colonisation probability is inferred.</text>
<text x="800" y="1018" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#172033">Positive under a restricted reference ≠ generally useful beyond a richer reference</text>
</svg>
