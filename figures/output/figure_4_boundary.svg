<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260">
<rect width="1600" height="1260" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<text x="60" y="55" font-size="28" font-weight="700" text-anchor="start" fill="#172033"><tspan x="60" dy="0">Figure 4 | Reference-conditioned evidence boundary</tspan></text>
<text x="60" y="88" font-size="16" font-weight="400" text-anchor="start" fill="#5c667a"><tspan x="60" dy="0">Three frozen tests answer different questions; every row uses its own metric scale.</tspan></text>
<rect x="50" y="120" width="1500" height="305" rx="18" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="80" y="158" font-size="22" font-weight="700" text-anchor="start" fill="#2b6cb0"><tspan x="80" dy="0">A-Islands | limited reference</tspan></text>
<text x="80" y="186" font-size="13" font-weight="400" text-anchor="start" fill="#5c667a"><tspan x="80" dy="0">845 estimable of 886 taxa | 842 spatial units</tspan></text>
<text x="80" y="222" font-size="13" font-weight="700" text-anchor="start" fill="#172033"><tspan x="80" dy="0">Declared reference</tspan></text>
<text x="80" y="245" font-size="12" font-weight="400" text-anchor="start" fill="#39445a"><tspan x="80" dy="0">CHELSA support + nearest outer-training source distance</tspan></text>
<text x="80" y="301" font-size="13" font-weight="700" text-anchor="start" fill="#172033"><tspan x="80" dy="0">Structural probe</tspan></text>
<text x="80" y="324" font-size="12" font-weight="400" text-anchor="start" fill="#39445a"><tspan x="80" dy="0">12-scenario connected frequency</tspan></text>
<text x="470" y="301" font-size="13" font-weight="700" text-anchor="start" fill="#172033"><tspan x="470" dy="0">Held-out endpoint</tspan></text>
<text x="470" y="324" font-size="12" font-weight="400" text-anchor="start" fill="#39445a"><tspan x="470" dy="0">five-fold spatial partition; 5×5 support-distance matching;</tspan><tspan x="470" dy="15">conditional occupied-vs-unoccupied concordance</tspan></text>
<text x="1060" y="216" font-size="12" font-weight="700" text-anchor="start" fill="#172033"><tspan x="1060" dy="0">conditional concordance</tspan></text>
<line x1="1060" y1="265" x2="1480" y2="265" stroke="#a0a8b8" stroke-width="3"/>
<line x1="1106.7" y1="247" x2="1106.7" y2="283" stroke="#39445a" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="1360.3" y1="265" x2="1402.9" y2="265" stroke="#2b6cb0" stroke-width="8" stroke-linecap="round"/>
<circle cx="1381.4" cy="265" r="9" fill="#2b6cb0" stroke="#ffffff" stroke-width="3"/>
<text x="1270" y="305" font-size="16" font-weight="700" text-anchor="middle" fill="#2b6cb0"><tspan x="1270" dy="0">0.618 [0.609–0.627]</tspan></text>
<text x="1060" y="331" font-size="11" font-weight="400" text-anchor="start" fill="#5c667a"><tspan x="1060" dy="0">higher than 0.5 favours added ordering</tspan><tspan x="1060" dy="18">information</tspan></text>
<text x="1060" y="367" font-size="13" font-weight="700" text-anchor="start" fill="#2b6cb0"><tspan x="1060" dy="0">Structural ordering remained after limited</tspan><tspan x="1060" dy="17">conditioning</tspan></text>
<rect x="50" y="460" width="1500" height="305" rx="18" fill="#faf5ff" stroke="#805ad5" stroke-width="2"/>
<text x="80" y="498" font-size="22" font-weight="700" text-anchor="start" fill="#805ad5"><tspan x="80" dy="0">A-Islands | prospective strong R3</tspan></text>
<text x="80" y="526" font-size="13" font-weight="400" text-anchor="start" fill="#5c667a"><tspan x="80" dy="0">886 estimable of 886 taxa | 842 spatial units</tspan></text>
<text x="80" y="562" font-size="13" font-weight="700" text-anchor="start" fill="#172033"><tspan x="80" dy="0">Declared reference</tspan></text>
<text x="80" y="585" font-size="12" font-weight="400" text-anchor="start" fill="#39445a"><tspan x="80" dy="0">R3: climate, area, mainland/source pressure, landmass, generic</tspan><tspan x="80" dy="15">stepping-stone/network terms</tspan></text>
<text x="80" y="641" font-size="13" font-weight="700" text-anchor="start" fill="#172033"><tspan x="80" dy="0">Structural probe</tspan></text>
<text x="80" y="664" font-size="12" font-weight="400" text-anchor="start" fill="#39445a"><tspan x="80" dy="0">geography-only species-conditioned connected frequency</tspan></text>
<text x="470" y="641" font-size="13" font-weight="700" text-anchor="start" fill="#172033"><tspan x="470" dy="0">Held-out endpoint</tspan></text>
<text x="470" y="664" font-size="12" font-weight="400" text-anchor="start" fill="#39445a"><tspan x="470" dy="0">same frozen five-fold partition; matched R3 versus C predictions;</tspan><tspan x="470" dy="15">candidate-minus-R3 held-out Bernoulli log loss</tspan></text>
<text x="1060" y="556" font-size="12" font-weight="700" text-anchor="start" fill="#172033"><tspan x="1060" dy="0">delta log loss: C minus R3</tspan></text>
<line x1="1060" y1="605" x2="1480" y2="605" stroke="#a0a8b8" stroke-width="3"/>
<line x1="1153.3" y1="587" x2="1153.3" y2="623" stroke="#39445a" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="1268.4" y1="605" x2="1363.7" y2="605" stroke="#805ad5" stroke-width="8" stroke-linecap="round"/>
<circle cx="1316.0" cy="605" r="9" fill="#805ad5" stroke="#ffffff" stroke-width="3"/>
<text x="1270" y="645" font-size="16" font-weight="700" text-anchor="middle" fill="#805ad5"><tspan x="1270" dy="0">+0.0035 [+0.0025 to +0.0045]</tspan></text>
<text x="1060" y="671" font-size="11" font-weight="400" text-anchor="start" fill="#5c667a"><tspan x="1060" dy="0">negative favours EOG; positive is worse</tspan></text>
<text x="1060" y="707" font-size="13" font-weight="700" text-anchor="start" fill="#805ad5"><tspan x="1060" dy="0">No predictive increment beyond R3; held-out loss</tspan><tspan x="1060" dy="17">increased</tspan></text>
<rect x="50" y="800" width="1500" height="305" rx="18" fill="#fffaf0" stroke="#b7791f" stroke-width="2"/>
<text x="80" y="838" font-size="22" font-weight="700" text-anchor="start" fill="#b7791f"><tspan x="80" dy="0">Tanzania forest birds | strong current-flow reference</tspan></text>
<text x="80" y="866" font-size="13" font-weight="400" text-anchor="start" fill="#5c667a"><tspan x="80" dy="0">60 estimable of 60 taxa | 14 spatial units</tspan></text>
<text x="80" y="902" font-size="13" font-weight="700" text-anchor="start" fill="#172033"><tspan x="80" dy="0">Declared reference</tspan></text>
<text x="80" y="925" font-size="12" font-weight="400" text-anchor="start" fill="#39445a"><tspan x="80" dy="0">patch area + nearest source + selected current flow + interaction</tspan></text>
<text x="80" y="981" font-size="13" font-weight="700" text-anchor="start" fill="#172033"><tspan x="80" dy="0">Structural probe</tspan></text>
<text x="80" y="1004" font-size="12" font-weight="400" text-anchor="start" fill="#39445a"><tspan x="80" dy="0">four-scenario geography-only connected frequency</tspan></text>
<text x="470" y="981" font-size="13" font-weight="700" text-anchor="start" fill="#172033"><tspan x="470" dy="0">Held-out endpoint</tspan></text>
<text x="470" y="1004" font-size="12" font-weight="400" text-anchor="start" fill="#39445a"><tspan x="470" dy="0">leave-one-fragment-out; candidate-minus-reference held-out</tspan><tspan x="470" dy="15">Bernoulli log loss</tspan></text>
<text x="1060" y="896" font-size="12" font-weight="700" text-anchor="start" fill="#172033"><tspan x="1060" dy="0">delta log loss: EOG minus reference</tspan></text>
<line x1="1060" y1="945" x2="1480" y2="945" stroke="#a0a8b8" stroke-width="3"/>
<line x1="1165.0" y1="927" x2="1165.0" y2="963" stroke="#39445a" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="1256.7" y1="945" x2="1420.5" y2="945" stroke="#b7791f" stroke-width="8" stroke-linecap="round"/>
<circle cx="1333.6" cy="945" r="9" fill="#b7791f" stroke="#ffffff" stroke-width="3"/>
<text x="1270" y="985" font-size="16" font-weight="700" text-anchor="middle" fill="#b7791f"><tspan x="1270" dy="0">+0.032 [+0.017 to +0.049]</tspan></text>
<text x="1060" y="1011" font-size="11" font-weight="400" text-anchor="start" fill="#5c667a"><tspan x="1060" dy="0">negative favours EOG; positive is worse</tspan></text>
<text x="1060" y="1047" font-size="13" font-weight="700" text-anchor="start" fill="#b7791f"><tspan x="1060" dy="0">No incremental benefit beyond current flow;</tspan><tspan x="1060" dy="17">primary LOSO loss increased</tspan></text>
<text x="60" y="1164" font-size="17" font-weight="700" text-anchor="start" fill="#172033"><tspan x="60" dy="0">Synthesis</tspan></text>
<text x="60" y="1192" font-size="14" font-weight="400" text-anchor="start" fill="#39445a"><tspan x="60" dy="0">The original island ordering signal survives a limited reference, but species-conditioned EOG does not improve either prospectively frozen strong</tspan><tspan x="60" dy="18">reference. Reference content and endpoint are therefore part of the structural claim.</tspan></text>
<text x="60" y="1230" font-size="13" font-weight="700" text-anchor="start" fill="#5c667a"><tspan x="60" dy="0">Separate scales are intentional; no cross-row effect-size magnitude comparison is implied.</tspan></text>
</svg>
