name: UWIN multicity endpoint3 Gate0

on:
  pull_request:
    paths:
      - 'validation/uwin_multicity_endpoint3/**'
      - 'tests/test_uwin_multicity_gate0_pre_response.py'
      - '.github/workflows/uwin-multicity-gate0.yml'
  push:
    branches:
      - 'execute/uwin-multicity-gate0-v1'
    paths:
      - 'validation/uwin_multicity_endpoint3/gate0_execute_once.json'

permissions:
  contents: read

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify UWIN response-blind Gate0
        run: pytest -q tests/test_uwin_multicity_gate0_pre_response.py
      - name: Compile Gate0 module
        run: python -m py_compile validation/uwin_multicity_endpoint3/gate0_pre_response.py
      - name: Verify authorization blobs
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('validation/uwin_multicity_endpoint3')
          auth=json.loads((root/'gate0_execution_authorization.json').read_text())
          assert auth['attempt_id']=='uwin_multicity_endpoint3_v1'
          assert auth['issue']==375
          assert auth['authorized_external_gets']==4
          assert auth['capture_history_requests_allowed']==0
          assert auth['live_execute_branch']=='execute/uwin-multicity-gate0-v1'
          bindings={
            'source_contract_git_blob_sha': root/'source_contract.json',
            'gate0_evaluator_git_blob_sha': root/'gate0_pre_response.py',
          }
          for key,path in bindings.items():
              observed=subprocess.check_output(['git','hash-object',str(path)],text=True).strip()
              assert observed==auth[key], (key, observed, auth[key])
          PY
      - name: Verify no live marker in proposal
        if: ${{ github.event_name == 'pull_request' }}
        run: test ! -e validation/uwin_multicity_endpoint3/gate0_execute_once.json

  live-gate0-once:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/execute/uwin-multicity-gate0-v1' }}
    needs: synthetic-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install EOG without dependency mutation
        run: python -m pip install -e . --no-deps
      - name: Verify one-shot execute marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('validation/uwin_multicity_endpoint3/gate0_execute_once.json')
          r=json.loads(p.read_text())
          assert r == {
            'attempt_id':'uwin_multicity_endpoint3_v1',
            'issue':375,
            'execute_once':True,
            'authorization':'gate0_execution_authorization.json'
          }
          PY
      - name: Execute UWIN safe-file Gate0 once
        run: python -m validation.uwin_multicity_endpoint3.gate0_pre_response
      - name: Audit terminal certificate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('validation/uwin_multicity_endpoint3/gate0_pre_response_certificate.json')
          r=json.loads(p.read_text())
          assert r['attempt_id']=='uwin_multicity_endpoint3_v1'
          assert r['issue']==375
          assert r['status'] in {'gate0_pre_response_ready','stop_pre_response_source_registry_or_geometry'}
          assert 0 <= r['safe_file_requests'] <= 4
          assert 0 <= r['safe_file_bytes_opened'] <= 1200000
          assert r['response_file_requests']==0
          assert r['response_header_bytes_opened']==0
          assert r['response_payload_bytes_opened']==0
          assert r['response_rows_opened']==0
          assert r['response_values_opened'] is False
          assert r['model_fits']==0 and r['heldout_scores']==0
          if r['status']=='gate0_pre_response_ready':
              assert r['candidate_site_count'] >= 80
              assert r['candidate_site_season_count'] >= 200
              assert len(r['geometry']['local_worlds']) >= 3
              assert r['geometry']['external_open']['world_id']=='external_open'
              assert r['normalized_problem_contract']['node_role']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: uwin-multicity-gate0-pre-response
          path: validation/uwin_multicity_endpoint3/gate0_pre_response_certificate.json
          if-no-files-found: error
