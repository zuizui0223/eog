name: Aland Glanville nonresponse transport authorization

on:
  push:
    branches:
      - agent/aland-glanville-preflight
    paths:
      - ".github/workflows/aland_glanville_nonresponse_transport.yml"
      - "validation/aland_glanville_paired_complementarity/source_contract.json"
  pull_request:
    paths:
      - ".github/workflows/aland_glanville_nonresponse_transport.yml"
      - "validation/aland_glanville_paired_complementarity/source_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Request download authorization for only the frozen nonresponse files
        run: |
          set -euo pipefail
          mkdir -p build/aland_glanville_transport
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import urllib.error
          import urllib.request

          contract = json.loads(Path(
              "validation/aland_glanville_paired_complementarity/source_contract.json"
          ).read_text())
          dataset_id = contract["fairdata_record_resolution"]["selected_preservation_record"]
          allowed_paths = (
              "/Butterflies/Patches final.csv",
              "/Butterflies/Variables_PAS_final.csv",
          )
          forbidden_fragments = (
              "locality visit",
              "nests final",
          )
          endpoint = "https://etsin.fairdata.fi/api/download/authorize"
          ua = "EOG-Aland-Glanville-nonresponse-transport-authorization/1.0"
          attempts = []

          for path in allowed_paths:
              low = path.casefold()
              if any(fragment in low for fragment in forbidden_fragments):
                  raise RuntimeError(f"refusing response-like path: {path}")
              payload = json.dumps({"cr_id": dataset_id, "file": path}).encode("utf-8")
              req = urllib.request.Request(
                  endpoint,
                  data=payload,
                  headers={
                      "User-Agent": ua,
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read(100_001)
                      status = getattr(response, "status", None)
                      content_type = response.headers.get("Content-Type")
                  if len(body) > 100_000:
                      raise RuntimeError("authorization response exceeded bounded cap")
                  parsed = json.loads(body.decode("utf-8"))
                  returned_url = parsed.get("url") if isinstance(parsed, dict) else None
                  attempts.append({
                      "path": path,
                      "status": status,
                      "content_type": content_type,
                      "authorized": status == 200 and isinstance(returned_url, str) and returned_url.startswith("https://"),
                      "returned_url_present": isinstance(returned_url, str),
                      "returned_url_host": (
                          urllib.request.urlparse(returned_url).netloc
                          if False else None
                      ),
                      "response_keys": sorted(parsed) if isinstance(parsed, dict) else [],
                      "error": None,
                  })
                  # Deliberately do not persist the short-lived download URL into the
                  # repository or follow it. A later frozen payload stage will request
                  # a fresh authorization and then GET only this exact nonresponse path.
              except urllib.error.HTTPError as exc:
                  body = exc.read(100_001)
                  attempts.append({
                      "path": path,
                      "status": exc.code,
                      "authorized": False,
                      "returned_url_present": False,
                      "response_keys": [],
                      "error": body.decode("utf-8", errors="replace")[:2000],
                  })
              except Exception as exc:
                  attempts.append({
                      "path": path,
                      "status": None,
                      "authorized": False,
                      "returned_url_present": False,
                      "response_keys": [],
                      "error": repr(exc),
                  })

          result = {
              "attempt_id": contract["attempt_id"],
              "dataset_id": dataset_id,
              "endpoint": endpoint,
              "allowed_paths": list(allowed_paths),
              "attempts": attempts,
              "authorization_requests": len(attempts),
              "file_payload_get_requests": 0,
              "file_payload_bytes_opened": 0,
              "response_file_authorization_requests": 0,
              "response_rows_opened": False,
              "response_values_opened": False,
          }
          Path(
              "build/aland_glanville_transport/authorization_probe.json"
          ).write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          if not all(attempt["authorized"] for attempt in attempts):
              raise SystemExit(3)
          PY
      - name: Assert no payload or response access
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("build/aland_glanville_transport/authorization_probe.json")
          if not path.exists():
              raise SystemExit("transport audit was not written")
          result = json.loads(path.read_text())
          assert result["file_payload_get_requests"] == 0
          assert result["file_payload_bytes_opened"] == 0
          assert result["response_file_authorization_requests"] == 0
          assert result["response_rows_opened"] is False
          assert result["response_values_opened"] is False
          print("Aland nonresponse transport authorization firewall PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aland-glanville-nonresponse-transport
          path: build/aland_glanville_transport/authorization_probe.json
          if-no-files-found: error
