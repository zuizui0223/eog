name: A-Islands isolation adequacy outcome ONCE

on:
  push:
    branches:
      - agent/aislands-isolation-adequacy-outcome

permissions:
  contents: read

jobs:
  authoritative-outcome:
    if: >-
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'EXECUTE frozen A-Islands isolation adequacy v1.3 exactly once'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require exact execution authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          authorization = json.loads(Path('validation/aislands_isolation_adequacy_20260812/outcome_execution_authorization.json').read_text())
          contract = json.loads(Path('validation/aislands_isolation_adequacy_20260812/preoutcome_contract.json').read_text())
          assert authorization['schema_version'] == 'eog_aislands_isolation_execution_authorization_v1'
          assert authorization['authorized_analysis'] == 'aislands_isolation_adequacy_v1_3_exactly_once'
          assert authorization['species_outcome_executions_before_this_commit'] == 0
          assert authorization['trigger_commit_message'] == 'EXECUTE frozen A-Islands isolation adequacy v1.3 exactly once'
          assert contract['schema_version'] == 'eog_aislands_isolation_adequacy_v1_3'
          assert contract['reference_design_status'] == 'final_before_extension_species_outcomes'
          assert contract['outcomes_inspected_for_this_extension'] is False
          PY

      - name: Install package and frozen audit dependencies
        run: |
          python -m pip install -e .
          python -m pip install pyshp==2.3.1 rasterio==1.4.3 pytest

      - name: Re-run all pre-outcome runner and contract tests
        run: |
          python -m pytest -q \
            tests/test_aislands_isolation_outcome_runner.py \
            tests/test_aislands_isolation_adequacy_contract.py \
            tests/test_island_isolation_reference.py \
            tests/test_aislands_polygon_area.py \
            tests/test_aislands_mainland_distance.py

      - name: Reproduce exact A-Islands v1.0 source
        run: |
          python benchmarks/fetch_aislands_zenodo.py \
            --record-id 10775809 \
            --expected-version 1.0 \
            --output-dir build/island_outcome_once/source

      - name: Reproduce frozen 886-taxon cohort
        run: |
          python benchmarks/aislands_species_screen.py \
            --island-data build/island_outcome_once/source/island_data.csv \
            --species-data build/island_outcome_once/source/species_data.csv \
            --output build/island_outcome_once/species_screen.csv \
            --min-present-islands 10 \
            --min-absent-islands 10 \
            --min-prevalence 0 \
            --max-prevalence 1
          python benchmarks/audit_aislands_taxon_status.py \
            --species-data build/island_outcome_once/source/species_data.csv \
            --species-screen build/island_outcome_once/species_screen.csv \
            --output-csv build/island_outcome_once/taxon_status_audit.csv \
            --output-summary build/island_outcome_once/taxon_status_summary.json
          python benchmarks/freeze_aislands_native_cohort.py \
            --status-audit build/island_outcome_once/taxon_status_audit.csv \
            --output-cohort build/island_outcome_once/frozen_taxon_cohort.csv \
            --output-summary build/island_outcome_once/frozen_taxon_cohort_summary.json

      - name: Rebuild exact 842-island audit
        run: |
          python benchmarks/audit_aislands_model_islands.py \
            --island-data build/island_outcome_once/source/island_data.csv \
            --species-data build/island_outcome_once/source/species_data.csv \
            --shapefile build/island_outcome_once/source/raw/A-Island_shape.shp \
            --projection build/island_outcome_once/source/raw/A-Island_shape.prj \
            --output-csv build/island_outcome_once/island_model_audit.csv \
            --output-summary build/island_outcome_once/island_model_audit_summary.json

      - name: Reproduce frozen five-fold spatial partition
        run: |
          python benchmarks/freeze_aislands_spatial_folds.py \
            --audit-csv build/island_outcome_once/island_model_audit.csv \
            --output-folds build/island_outcome_once/spatial_folds.csv \
            --output-summary build/island_outcome_once/spatial_folds_summary.json \
            --block-size-degrees 5 \
            --n-folds 5

      - name: Reproduce frozen CHELSA climate artifact
        run: |
          python benchmarks/extract_aislands_chelsa_climate.py \
            --island-audit build/island_outcome_once/island_model_audit.csv \
            --output-csv build/island_outcome_once/island_climate.csv \
            --output-manifest build/island_outcome_once/climate_manifest.json

      - name: Hard-match frozen cohort fold and climate fingerprints
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'frozen_taxon_cohort.csv': 'cf645d55b8bcc46be8a8dc5399db736bbcc20bb7114a72c79a5dee61ec918e12',
              'spatial_folds.csv': '221a925e289347069c89354d26acfab83fa3d4bc130b56f0178b8db30ab427fa',
              'island_climate.csv': '6ae7f4a78eea28f074ef3c3399368a4886b09d2d0714e723e957d0a99b524285',
          }
          root = Path('build/island_outcome_once')
          for name, accepted in expected.items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              print(name, actual)
              assert actual == accepted, (name, actual, accepted)
          PY

      - name: Rebuild exact 842-island area
        run: |
          python benchmarks/audit_aislands_polygon_area.py \
            --audit-csv build/island_outcome_once/island_model_audit.csv \
            --shapefile build/island_outcome_once/source/raw/A-Island_shape.shp \
            --projection build/island_outcome_once/source/raw/A-Island_shape.prj \
            --output-csv build/island_outcome_once/island_area.csv \
            --output-summary build/island_outcome_once/island_area_summary.json

      - name: Rebuild exact Natural Earth mainland and distances
        run: |
          python benchmarks/fetch_natural_earth_australia_mainland.py \
            --declared-version 5.1.1 \
            --output-dir build/island_outcome_once/mainland
          python benchmarks/build_aislands_mainland_distance.py \
            --island-audit-csv build/island_outcome_once/island_model_audit.csv \
            --mainland-ring-csv build/island_outcome_once/mainland/australia_continental_mainland_ring.csv \
            --output-csv build/island_outcome_once/mainland_distance.csv \
            --output-summary build/island_outcome_once/mainland_distance_summary.json

      - name: Hard-match every outcome-independent geographic fingerprint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          area = json.loads(Path('build/island_outcome_once/island_area_summary.json').read_text())
          mainland = json.loads(Path('build/island_outcome_once/mainland/mainland_source_manifest.json').read_text())
          distance = json.loads(Path('build/island_outcome_once/mainland_distance_summary.json').read_text())
          area_expected = json.loads(Path('validation/aislands_isolation_adequacy_20260812/area_gate_expected.json').read_text())
          mainland_expected = json.loads(Path('validation/aislands_isolation_adequacy_20260812/mainland_gate_expected.json').read_text())
          assert area['output_area_table_sha256'] == area_expected['derived_area']['area_table_sha256']
          assert area['output_area_table_sha256'] == '496789783a98e55e1b9552f6f6d28e7b4567ef0f52c795657c7e2fea9c60aae2'
          assert mainland['archive_sha256'] == mainland_expected['natural_earth']['archive_sha256']
          assert mainland['archive_sha256'] == 'ce1ac7036499a0edd641fbc093cd209a98f96a49d2eca8480aaacad35138a7f6'
          assert mainland['selected_mainland_ring_sha256'] == mainland_expected['australia_feature']['selected_mainland_ring_sha256']
          assert mainland['selected_mainland_ring_sha256'] == '18d151bfe8aee727677ba8beca6f244f80a9a3cb3b616de534cf4ba331f042a4'
          assert distance['output_distance_table_sha256'] == mainland_expected['mainland_distance']['distance_table_sha256']
          assert distance['output_distance_table_sha256'] == '7d6f52f03702dd0cfae061023a1b2f405e39397de73eaad21b97d24176c4f869'
          PY

      - name: Validate real schemas without scoring the extension
        run: |
          python benchmarks/validate_aislands_isolation_outcome_inputs.py \
            --repo-root . \
            --island-data build/island_outcome_once/source/island_data.csv \
            --species-data build/island_outcome_once/source/species_data.csv \
            --island-audit-csv build/island_outcome_once/island_model_audit.csv \
            --area-csv build/island_outcome_once/island_area.csv \
            --mainland-csv build/island_outcome_once/mainland_distance.csv \
            --output build/island_outcome_once/input_validation.json

      - name: Execute frozen 886-taxon C-minus-R3 analysis once
        run: |
          python benchmarks/run_aislands_isolation_adequacy.py \
            --repo-root . \
            --island-data build/island_outcome_once/source/island_data.csv \
            --species-data build/island_outcome_once/source/species_data.csv \
            --island-audit-csv build/island_outcome_once/island_model_audit.csv \
            --area-csv build/island_outcome_once/island_area.csv \
            --mainland-csv build/island_outcome_once/mainland_distance.csv \
            --output-dir build/island_outcome_once/outcome \
            --progress-every 50

      - name: Freeze execution provenance and checksums
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path('build/island_outcome_once/outcome')
          aggregate = json.loads((out / 'aggregate_result.json').read_text())
          assert aggregate['schema_version'] == 'eog_aislands_isolation_adequacy_outcome_v1'
          assert aggregate['status'] == 'first_and_only_authoritative_island_isolation_adequacy_execution'
          assert aggregate['taxa_declared'] == 886
          assert aggregate['primary']['contrast'] == 'C_minus_R3_matched_heldout_log_loss'
          assert aggregate['primary']['favourable_direction'] == 'negative'
          assert len(aggregate['result_fingerprint']) == 64

          files = [
              out / 'heldout_predictions.csv',
              out / 'fold_applicability_and_scores.csv',
              out / 'species_summary.csv',
              out / 'aggregate_result.json',
          ]
          checksums = {}
          for path in files:
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      h.update(chunk)
              checksums[path.name] = h.hexdigest()

          provenance = {
              'schema_version': 'eog_aislands_isolation_execution_provenance_v1',
              'git_commit': os.environ['GITHUB_SHA_VALUE'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID_VALUE']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT_VALUE']),
              'trigger_commit_message': 'EXECUTE frozen A-Islands isolation adequacy v1.3 exactly once',
              'contract_schema': 'eog_aislands_isolation_adequacy_v1_3',
              'result_fingerprint': aggregate['result_fingerprint'],
              'file_sha256': checksums,
              'authoritative_execution_count_declared': 1,
              'rerun_allowed': False,
          }
          (out / 'execution_provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          print(json.dumps(provenance, indent=2))
          PY
          gzip -9 -k build/island_outcome_once/outcome/heldout_predictions.csv

      - uses: actions/upload-artifact@v4
        with:
          name: aislands-isolation-adequacy-authoritative-outcome
          retention-days: 90
          path: |
            build/island_outcome_once/input_validation.json
            build/island_outcome_once/frozen_taxon_cohort_summary.json
            build/island_outcome_once/spatial_folds_summary.json
            build/island_outcome_once/climate_manifest.json
            build/island_outcome_once/island_model_audit_summary.json
            build/island_outcome_once/island_area_summary.json
            build/island_outcome_once/mainland/mainland_source_manifest.json
            build/island_outcome_once/mainland_distance_summary.json
            build/island_outcome_once/outcome/heldout_predictions.csv.gz
            build/island_outcome_once/outcome/fold_applicability_and_scores.csv
            build/island_outcome_once/outcome/species_summary.csv
            build/island_outcome_once/outcome/aggregate_result.json
            build/island_outcome_once/outcome/execution_provenance.json
          if-no-files-found: error
