name: EOG distribution-model synthetic benchmark

on:
  pull_request:
    paths:
      - "src/eog/distribution.py"
      - "src/eog/__init__.py"
      - "benchmarks/distribution_model_heldout_benchmark.py"
      - "benchmarks/distribution_structural_discrimination.py"
      - "tests/test_distribution_model.py"
      - "tests/test_distribution_model_heldout_benchmark.py"
      - "tests/test_distribution_structural_discrimination.py"
      - ".github/workflows/distribution-model-benchmark.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Run structural discrimination contract
        run: python benchmarks/distribution_structural_discrimination.py > distribution-structural-discrimination.json
      - name: Run held-out ranking benchmark
        run: python benchmarks/distribution_model_heldout_benchmark.py > distribution-heldout-ranking.json
      - name: Show held-out result
        run: cat distribution-heldout-ranking.json
      - name: Verify result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("distribution-heldout-ranking.json").read_text())
          assert result["all_checks_pass"] is True
          assert result["auc"]["environmental_support"] == 0.5
          assert result["auc"]["environmental_plus_nearest_source"] == 0.5
          assert result["auc"]["structural_accessibility"] == 1.0
          assert result["auc"]["eog_distribution_support"] == 1.0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eog-distribution-model-synthetic
          path: |
            distribution-structural-discrimination.json
            distribution-heldout-ranking.json
