name: EOG v3 joint-world engine

on:
  pull_request:
    paths:
      - "src/eog/v3/**"
      - "validation/eog_v3_joint_world_engine/**"
      - "benchmarks/run_eog_v3_joint_world_engine.py"
      - "tests/test_v3_joint_world_engine.py"
      - "tests/test_v3_cli.py"
      - ".github/workflows/eog-v3-joint-world-engine.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Run frozen v3 validation
        run: |
          python benchmarks/run_eog_v3_joint_world_engine.py \
            --output build/eog_v3_joint_world_engine/result_v1.json
      - name: Verify focused tests
        run: python -m pytest tests/test_v3_joint_world_engine.py tests/test_v3_cli.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: eog-v3-joint-world-engine
          path: build/eog_v3_joint_world_engine/result_v1.json
          if-no-files-found: error
