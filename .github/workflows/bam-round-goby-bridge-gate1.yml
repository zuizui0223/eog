name: BAM round-goby external bridge Gate1

on:
  workflow_dispatch:

jobs:
  gate1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test one-byte header firewall
        run: python -m pytest tests/test_bam_round_goby_external_bridge_gate1.py -q
      - name: Execute Gate1
        run: python -m validation.bam_round_goby_external_bridge_v1.gate1_schema
      - uses: actions/upload-artifact@v4
        with:
          name: bam-round-goby-bridge-gate1
          path: validation/bam_round_goby_external_bridge_v1/gate1_schema_certificate.json
          if-no-files-found: error
