name: NOAA small-mesh replication 3 Gate 0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/test_noaa_small_mesh_gate0.py tests/test_candidate_preflight.py -q
      - name: Reproduce terminal response-blind Gate 0
        run: |
          set +e
          python validation/noaa_small_mesh_replication_3/gate0_registry_effort.py
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("build/noaa_small_mesh_replication_3/gate0_registry_effort.json")
          result = json.loads(path.read_text(encoding="utf-8"))
          assert result["status"] == "stop_analysis_registry_not_closed"
          assert result["haul_audit"]["registry_station_year_count"] == 0
          assert result["request_ledger"][0]["bytes_opened"] == 0
          assert all(
              result["response_firewall"][key] in (0, False)
              for key in (
                  "response_payload_bytes_opened",
                  "response_header_bytes_opened",
                  "response_rows_opened",
                  "response_values_opened",
                  "model_fits",
                  "heldout_scores",
              )
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: noaa-small-mesh-replication-3-gate0
          path: build/noaa_small_mesh_replication_3/gate0_registry_effort.json
