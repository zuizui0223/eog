name: EOG v2 traversability confirmation

on:
  pull_request:
    paths:
      - ".github/workflows/traversability-confirmation.yml"
      - "src/eog/ecological_traversability.py"
      - "src/eog/v2/traversability.py"
      - "benchmarks/traversability_confirmation.py"
      - "benchmarks/traversability_confirmation_contract.json"
      - "tests/test_ecological_traversability.py"
      - "tests/test_traversability_confirmation_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run focused contracts
        run: |
          pytest -q \
            tests/test_ecological_traversability.py \
            tests/test_traversability_confirmation_contract.py \
            tests/test_v2_namespace.py \
            tests/test_v2_package_layout.py
      - name: Run frozen synthetic confirmation
        run: |
          mkdir -p benchmark_results/traversability
          python benchmarks/traversability_confirmation.py \
            --output benchmark_results/traversability/result.json \
            | tee benchmark_results/traversability/stdout.json
      - name: Display scientific decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('benchmark_results/traversability/result.json').read_text())
          print('decision:', result['decision'])
          print('fingerprint:', result['fingerprint'])
          for name, gate in result['gates'].items():
              print(name, gate)
          PY
      - name: Upload frozen result
        uses: actions/upload-artifact@v4
        with:
          name: eog-v2-traversability-confirmation
          path: benchmark_results/traversability
