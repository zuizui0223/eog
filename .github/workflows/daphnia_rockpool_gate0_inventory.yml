name: Daphnia rock-pool Gate 0 inventory

on:
  push:
    branches:
      - agent/daphnia-rockpool-gate0-screen
    paths:
      - ".github/workflows/daphnia_rockpool_gate0_inventory.yml"
      - "validation/daphnia_rockpool_two_layer/gate0_contract.json"
  pull_request:
    paths:
      - ".github/workflows/daphnia_rockpool_gate0_inventory.yml"
      - "validation/daphnia_rockpool_two_layer/gate0_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inventory Figshare metadata and ZIP directory without member bytes
        run: |
          set -euo pipefail
          mkdir -p build/daphnia_rockpool_gate0
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import struct
          import urllib.request

          ARTICLE_ID = 20329245
          EXPECTED_VERSION = 1
          API_URL = f"https://api.figshare.com/v2/articles/{ARTICLE_ID}"
          OUT = Path("build/daphnia_rockpool_gate0")
          UA = "eog-response-blind-daphnia-gate0/1.0"

          def get_json(url: str):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def range_get(url: str, start: int, end: int) -> bytes:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA,
                      "Range": f"bytes={start}-{end}",
                      "Accept-Encoding": "identity",
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  status = getattr(response, "status", None) or response.getcode()
                  if status != 206:
                      raise RuntimeError(
                          f"anonymous range request returned HTTP {status}; refusing full-file fallback"
                      )
                  body = response.read()
              expected = end - start + 1
              if len(body) != expected:
                  raise RuntimeError(f"range length mismatch: {len(body)} != {expected}")
              return body

          def central_directory(download_url: str, size: int):
              if size <= 22:
                  raise RuntimeError("ZIP file is too small to contain EOCD")
              tail_start = max(0, size - 65557)
              tail = range_get(download_url, tail_start, size - 1)
              marker = b"PK\x05\x06"
              pos = tail.rfind(marker)
              if pos < 0:
                  raise RuntimeError("ZIP EOCD not found in bounded tail range")
              if pos + 22 > len(tail):
                  raise RuntimeError("truncated ZIP EOCD")
              sig, disk_no, cd_disk, disk_entries, total_entries, cd_size, cd_offset, comment_len = struct.unpack_from(
                  "<4s4H2LH", tail, pos
              )
              if sig != marker:
                  raise RuntimeError("invalid ZIP EOCD signature")
              if disk_no != 0 or cd_disk != 0 or disk_entries != total_entries:
                  raise RuntimeError("multi-disk ZIP is not supported by response-blind inventory")
              if total_entries == 0xFFFF or cd_size == 0xFFFFFFFF or cd_offset == 0xFFFFFFFF:
                  raise RuntimeError("ZIP64 directory requires a separate bounded parser; refusing member access")
              if cd_offset + cd_size > size:
                  raise RuntimeError("central-directory bounds exceed declared file size")
              cd = range_get(download_url, cd_offset, cd_offset + cd_size - 1)
              rows = []
              offset = 0
              while offset < len(cd):
                  if offset + 46 > len(cd):
                      raise RuntimeError("truncated central-directory record")
                  fields = struct.unpack_from("<4s6H3I5H2I", cd, offset)
                  if fields[0] != b"PK\x01\x02":
                      raise RuntimeError(f"invalid central-directory signature at offset {offset}")
                  crc32 = fields[7]
                  compressed_size = fields[8]
                  uncompressed_size = fields[9]
                  name_len, extra_len, comment_len = fields[10], fields[11], fields[12]
                  local_header_offset = fields[17]
                  start = offset + 46
                  end = start + name_len
                  name = cd[start:end].decode("utf-8", errors="replace")
                  if compressed_size == 0xFFFFFFFF or uncompressed_size == 0xFFFFFFFF or local_header_offset == 0xFFFFFFFF:
                      raise RuntimeError(f"ZIP64 member metadata encountered for {name!r}; refusing member access")
                  lower = name.lower()
                  geometry_terms = (
                      "coord", "xy", "pool", "patch", "site", "location", "distance", "dist", "area", "depth", "island", "habitat"
                  )
                  response_terms = (
                      "occup", "presence", "absence", "survey", "daphnia", "magna", "pulex", "longispina", "species", "response"
                  )
                  rows.append({
                      "name": name,
                      "compressed_size": compressed_size,
                      "uncompressed_size": uncompressed_size,
                      "crc32": f"{crc32:08x}",
                      "local_header_offset": local_header_offset,
                      "geometry_name_hint": any(term in lower for term in geometry_terms),
                      "response_name_hint": any(term in lower for term in response_terms),
                  })
                  offset = end + extra_len + comment_len
              if offset != len(cd):
                  raise RuntimeError("central-directory parse did not end exactly at declared size")
              if len(rows) != total_entries:
                  raise RuntimeError(f"central-directory entry count mismatch: {len(rows)} != {total_entries}")
              return {
                  "entry_count": total_entries,
                  "central_directory_size": cd_size,
                  "central_directory_offset": cd_offset,
                  "members": rows,
              }

          result = {
              "candidate": "Luo et al. 2022 Tvärminne Daphnia rock-pool metacommunity",
              "figshare_article_id": ARTICLE_ID,
              "expected_version": EXPECTED_VERSION,
              "response_rows_opened": False,
              "response_member_bytes_downloaded": False,
              "archive_member_content_bytes_downloaded": False,
          }

          try:
              article = get_json(API_URL)
              files = []
              for row in article.get("files", []):
                  files.append({
                      "id": row.get("id"),
                      "name": row.get("name"),
                      "size": row.get("size"),
                      "is_link_only": row.get("is_link_only"),
                      "download_url": row.get("download_url"),
                      "supplied_md5": row.get("supplied_md5"),
                      "computed_md5": row.get("computed_md5"),
                  })
              if not files:
                  raise RuntimeError("Figshare article exposes no files")
              version = article.get("version")
              result.update({
                  "title": article.get("title"),
                  "doi": article.get("doi"),
                  "version": version,
                  "version_matches_frozen_contract": version == EXPECTED_VERSION,
                  "published_date": article.get("published_date"),
                  "modified_date": article.get("modified_date"),
                  "files": files,
              })
              (OUT / "figshare_metadata_inventory.json").write_text(
                  json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8"
              )
              if version != EXPECTED_VERSION:
                  raise RuntimeError(f"Figshare version drift: observed {version!r}, expected {EXPECTED_VERSION}")

              zip_files = [row for row in files if str(row.get("name") or "").lower().endswith(".zip")]
              if not zip_files:
                  raise RuntimeError("no top-level ZIP file found for bounded directory-only inspection")

              directories = []
              for row in zip_files:
                  if row.get("is_link_only"):
                      raise RuntimeError(f"ZIP file is link-only: {row['name']}")
                  if not row.get("download_url") or not isinstance(row.get("size"), int):
                      raise RuntimeError(f"ZIP metadata incomplete for {row['name']}")
                  directory = central_directory(row["download_url"], row["size"])
                  directories.append({
                      "file_id": row["id"],
                      "file_name": row["name"],
                      "file_size": row["size"],
                      "file_md5": row.get("computed_md5") or row.get("supplied_md5"),
                      **directory,
                  })

              result["zip_directories"] = directories
              result["status"] = "gate0_metadata_and_zip_directory_pass"
              result["next"] = (
                  "role-adjudicate archive members from names and published code documentation; "
                  "only then selectively extract clearly response-independent registry/geometry members"
              )
              (OUT / "gate0_inventory_result.json").write_text(
                  json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8"
              )
              print(json.dumps({
                  "status": result["status"],
                  "title": result.get("title"),
                  "doi": result.get("doi"),
                  "version": result.get("version"),
                  "top_level_files": [row["name"] for row in files],
                  "archive_members": [
                      member["name"]
                      for directory in directories
                      for member in directory["members"]
                  ],
                  "response_rows_opened": False,
                  "archive_member_content_bytes_downloaded": False,
              }, indent=2, sort_keys=True))
          except Exception as exc:
              result["status"] = "gate0_inventory_stop"
              result["stop_reason"] = str(exc)
              (OUT / "gate0_inventory_result.json").write_text(
                  json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8"
              )
              print(json.dumps(result, indent=2, sort_keys=True))
              raise
          PY
      - name: Assert response firewall
        if: success()
        run: |
          python - <<'PY'
          import json
          p=json.load(open('build/daphnia_rockpool_gate0/gate0_inventory_result.json'))
          assert p['response_rows_opened'] is False
          assert p['response_member_bytes_downloaded'] is False
          assert p['archive_member_content_bytes_downloaded'] is False
          assert p['status'] == 'gate0_metadata_and_zip_directory_pass'
          PY
      - name: Upload response-blind Gate 0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daphnia-rockpool-gate0-inventory
          path: build/daphnia_rockpool_gate0/*.json
          if-no-files-found: error
