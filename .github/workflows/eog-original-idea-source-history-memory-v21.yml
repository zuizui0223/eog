name: Original EOG source history memory v21

on:
  pull_request:
    paths:
      - "validation/eog_original_idea_source_history_memory_v21/**"
      - "benchmarks/run_eog_original_idea_source_history_memory_v21.py"
      - "tests/test_eog_original_idea_source_history_memory_v21.py"
      - ".github/workflows/eog-original-idea-source-history-memory-v21.yml"
  workflow_dispatch:

concurrency:
  group: original-eog-source-history-memory-v21-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test source-history invariants
        run: python -m pytest tests/test_eog_original_idea_source_history_memory_v21.py -q
      - name: Run frozen source-history benchmark
        run: |
          python benchmarks/run_eog_original_idea_source_history_memory_v21.py \
            --output build/eog_original_idea_source_history_memory_v21/result_v21.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-original-idea-source-history-memory-v21
          path: build/eog_original_idea_source_history_memory_v21/result_v21.json
          if-no-files-found: error
