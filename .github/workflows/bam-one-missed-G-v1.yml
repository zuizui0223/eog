name: BAM current-G one-missed-positive robustness (exploratory)

on:
  pull_request:
    paths:
      - "validation/bam_one_missed_G_v1/**"
      - "benchmarks/bam_one_missed_G_v1.py"
      - "benchmarks/audit_bam_one_missed_exact_queries_v1.py"
      - "tests/test_bam_one_missed_G_v1.py"
      - "docs/bam_one_missed_G_v1.md"
      - ".github/workflows/bam-one-missed-G-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-miss-finite-world-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original EOG
        run: python -m pip install -e ".[dev]"
      - name: Verify original generator and finite-world contracts
        run: |
          test "$(git hash-object src/eog/v2/known_truth_bam_generality.py)" = "ab852b02bccdfb2f065717f89b482b7cf15778d3"
          python -m pytest -q tests/test_bam_one_missed_G_v1.py tests/test_bam_geometry_response_envelopes_v1.py tests/test_bam_partial_local_assays_v1.py
      - name: Enumerate all D with zero or one omitted occupied cell
        run: |
          python benchmarks/bam_one_missed_G_v1.py --output-dir /tmp/eog_one_miss
          test -s /tmp/eog_one_miss/observed_fibres.csv
          test -s /tmp/eog_one_miss/original_G_robustness.csv
      - name: Exact post-result minimax decision-tree audit
        run: |
          python benchmarks/audit_bam_one_missed_exact_queries_v1.py --output /tmp/eog_one_miss/exact_minimum.json
      - name: Check known exploratory denominators and independent exact bounds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/eog_one_miss/summary.json').read_text())
          assert (result['systems'],result['original_worlds'],result['original_exact_G_fibres'])==(12,768,129)
          axis={x['release_axis']:x for x in result['results']}
          assert all(v['unique_observation_fibres']==2627 and v['fibre_has_multiple_possible_G']==48 for v in axis.values())
          assert {a:x['exact_G_baseline_known'] for a,x in axis.items()}=={'A':119,'B':124,'M':121}
          assert axis['M']['greedy_all_robust_true_G_by_budget']==[86,117,121,129]
          assert axis['M']['greedy_all_uniform_D_by_budget']==[2483,2570,2623,2627]
          assert axis['A']['greedy_all_robust_true_G_by_budget']==[64,115,124,129]
          assert axis['B']['greedy_all_robust_true_G_by_budget']==[81,110,127,129]
          assert axis['M']['hash_robust_true_G_by_budget']['median']==[86.,102.5,113.,122.]
          exact=json.loads(Path('/tmp/eog_one_miss/exact_minimum.json').read_text())
          assert exact['minimal_worst_case_query_depth_per_D']=={'0':2483,'1':87,'2':54,'3':3}
          assert exact['original_G_uniform_robustness_at_budget']=={'0':86,'1':117,'2':123,'3':129}
          print('ONE_MISS_POST_RESULT_EXPLORATORY_REPLAY_SUCCESS')
          PY
      - name: Save complete exploration and exact lower-bound tables
        uses: actions/upload-artifact@v4
        with:
          name: eog-bam-one-missed-positive-v1
          path: /tmp/eog_one_miss/*
