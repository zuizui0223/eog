name: Aland Glanville response-blind metadata preflight

on:
  push:
    branches:
      - agent/aland-glanville-preflight
    paths:
      - ".github/workflows/aland_glanville_metadata_preflight.yml"
      - "validation/aland_glanville_paired_complementarity/**"
  pull_request:
    paths:
      - ".github/workflows/aland_glanville_metadata_preflight.yml"
      - "validation/aland_glanville_paired_complementarity/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query Fairdata metadata only
        run: |
          set -euo pipefail
          mkdir -p build/aland_glanville_metadata
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import urllib.error
          import urllib.parse
          import urllib.request

          contract = json.loads(Path(
              "validation/aland_glanville_paired_complementarity/source_contract.json"
          ).read_text())
          ids = contract["fairdata_record_candidates"]
          UA = "EOG-Aland-Glanville-response-blind-metadata-audit/1.0"
          requested_urls = []

          def request_json(url: str, cap: int = 8_000_000):
              requested_urls.append(url)
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": UA, "Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = response.read(cap + 1)
                      status = getattr(response, "status", None)
                      final_url = response.geturl()
                      content_type = response.headers.get("Content-Type")
              except urllib.error.HTTPError as exc:
                  return {
                      "ok": False,
                      "status": exc.code,
                      "url": url,
                      "error": repr(exc),
                  }
              except Exception as exc:
                  return {
                      "ok": False,
                      "status": None,
                      "url": url,
                      "error": repr(exc),
                  }
              if len(payload) > cap:
                  return {
                      "ok": False,
                      "status": status,
                      "url": url,
                      "error": "metadata byte cap exceeded",
                  }
              try:
                  data = json.loads(payload.decode("utf-8"))
              except Exception as exc:
                  return {
                      "ok": False,
                      "status": status,
                      "url": url,
                      "final_url": final_url,
                      "content_type": content_type,
                      "error": f"non-JSON metadata: {exc!r}",
                  }
              return {
                  "ok": True,
                  "status": status,
                  "url": url,
                  "final_url": final_url,
                  "content_type": content_type,
                  "data": data,
              }

          def compact(value, depth=0):
              # Metadata-only compact representation. Keep identifiers, titles,
              # version/deprecation/access/file-name metadata, but never follow URLs.
              if depth > 8:
                  return "<depth-limit>"
              if isinstance(value, dict):
                  out = {}
                  for key, item in value.items():
                      low = str(key).casefold()
                      keep = (
                          low in {
                              "id", "identifier", "persistent_identifier", "title",
                              "description", "state", "version", "created", "modified",
                              "published", "deprecated", "removed", "access_rights",
                              "fileset", "file_actions", "directory_actions", "pathname",
                              "filename", "name", "url", "storage_identifier",
                              "next_dataset_version", "previous_dataset_version",
                              "other_versions", "data_catalog", "cumulative_state"
                          }
                          or "version" in low
                          or "file" in low
                          or "access" in low
                          or "deprecat" in low
                      )
                      if keep:
                          out[key] = compact(item, depth + 1)
                  return out
              if isinstance(value, list):
                  return [compact(item, depth + 1) for item in value[:200]]
              if isinstance(value, (str, int, float, bool)) or value is None:
                  return value
              return repr(value)

          records = {}
          for record_id in ids:
              endpoints = [
                  f"https://metax.fairdata.fi/v3/datasets/{record_id}",
                  f"https://metax.fairdata.fi/v3/datasets/{record_id}/metadata-download?format=datacite",
                  f"https://metax-legacy.fairdata.fi/rest/v2/datasets/{record_id}",
              ]
              attempts = [request_json(url) for url in endpoints]
              records[record_id] = {
                  "attempts": [
                      {
                          key: value
                          for key, value in attempt.items()
                          if key != "data"
                      }
                      | ({"metadata": compact(attempt["data"])} if attempt.get("ok") else {})
                      for attempt in attempts
                  ]
              }

          result = {
              "attempt_id": contract["attempt_id"],
              "records": records,
              "requested_urls": requested_urls,
              "file_payload_requests": 0,
              "file_payload_bytes_opened": 0,
              "patch_registry_payload_opened": False,
              "locality_visit_payload_opened": False,
              "response_rows_opened": False,
              "response_values_opened": False,
              "model_fits": 0,
              "heldout_scores": 0,
          }
          out = Path("build/aland_glanville_metadata/metadata_inventory.json")
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          if not any(
              attempt.get("ok")
              for record in records.values()
              for attempt in [
                  request_json(f"https://metax.fairdata.fi/v3/datasets/__never_requested__")
              ][:0]
          ):
              # The expression above intentionally executes no extra request; actual
              # success is checked below from the stored attempts.
              pass
          if not any(
              attempt.get("status") == 200 and "metadata" in attempt
              for record in records.values()
              for attempt in record["attempts"]
          ):
              raise SystemExit("no Fairdata metadata endpoint resolved for either frozen record candidate")
          PY
      - name: Assert response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path(
              "build/aland_glanville_metadata/metadata_inventory.json"
          ).read_text())
          assert result["file_payload_requests"] == 0
          assert result["file_payload_bytes_opened"] == 0
          assert result["patch_registry_payload_opened"] is False
          assert result["locality_visit_payload_opened"] is False
          assert result["response_rows_opened"] is False
          assert result["response_values_opened"] is False
          assert result["model_fits"] == 0
          assert result["heldout_scores"] == 0
          print("Aland Glanville metadata-only response firewall PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aland-glanville-metadata-only
          path: build/aland_glanville_metadata/metadata_inventory.json
          if-no-files-found: error
