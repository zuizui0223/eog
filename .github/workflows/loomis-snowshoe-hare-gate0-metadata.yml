name: Loomis snowshoe hare endpoint3 Gate0 metadata

on:
  push:
    branches:
      - execute/loomis-hare-gate0-metadata-v1
    paths:
      - validation/loomis_snowshoe_hare_endpoint3/gate0_execution_authorization.json
      - validation/loomis_snowshoe_hare_endpoint3/run_gate0_zenodo_metadata.py
      - .github/workflows/loomis-snowshoe-hare-gate0-metadata.yml

permissions:
  contents: read

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -U pytest
      - name: Verify frozen metadata gate without external data
        run: python -m pytest -q tests/test_loomis_snowshoe_hare_gate0_metadata.py
      - name: Compile one-shot runner
        run: python -m py_compile validation/loomis_snowshoe_hare_endpoint3/run_gate0_zenodo_metadata.py
      - name: Verify authorization boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('validation/loomis_snowshoe_hare_endpoint3/gate0_execution_authorization.json')
          x = json.loads(p.read_text())
          assert x['source_boundary_merge'] == 'd0163b3138ccaeb0a4da897e7189580210bea8a6'
          assert x['source_contract_git_blob_sha1'] == '38709da1a50c9b2c5ef285dd15bcfcacd16d1e72'
          assert x['authorized_branch'] == 'execute/loomis-hare-gate0-metadata-v1'
          assert x['authorized_workflow_run_number'] == 1
          assert x['authorized_workflow_run_attempt'] == 1
          assert x['file_payload_requests_authorized'] == 0
          assert x['response_rows_authorized'] == 0
          assert x['response_values_authorized'] is False
          assert x['model_fits_authorized'] == 0
          assert x['heldout_scores_authorized'] == 0
          PY

  live-gate0:
    needs: synthetic-boundary
    if: ${{ github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute Zenodo metadata-only Gate0 once
        run: python -m validation.loomis_snowshoe_hare_endpoint3.run_gate0_zenodo_metadata
      - name: Audit response/file firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/loomis_snowshoe_hare_endpoint3/gate0_metadata.json')
          x = json.loads(p.read_text())
          assert x['status'] in {
              'gate0_metadata_ready',
              'stop_pre_response_metadata_identity_or_transport',
          }
          for key in (
              'file_payload_requests',
              'file_payload_bytes_opened',
              'deployment_header_bytes_opened',
              'deployment_rows_opened',
              'detection_header_bytes_opened',
              'response_rows_opened',
              'model_fits',
              'heldout_scores',
          ):
              assert x[key] == 0, (key, x[key])
          assert x['response_values_opened'] is False
          assert x['counts_as_predictive_evidence'] is False
          if x['status'] == 'gate0_metadata_ready':
              assert x['required_file_count'] == 7
              assert len(x['required_file_identities']) == 7
              assert x['transport']['metadata_requests'] == 1
              assert x['transport']['metadata_bytes_opened'] > 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: loomis-snowshoe-hare-gate0-metadata
          path: build/loomis_snowshoe_hare_endpoint3/gate0_metadata.json
          if-no-files-found: error
