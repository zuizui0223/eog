name: Portal contextual representation final (consumed)

on:
  pull_request:
    paths:
      - 'benchmarks/portal_contextual_representation_final.py'
      - 'validation/contextual_representation_fresh_v1/portal_final_contract.json'
      - 'validation/contextual_representation_fresh_v1/portal_final_result.json'
      - '.github/workflows/portal-contextual-representation-final.yml'

jobs:
  consumed-endpoint-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert authoritative consumed result is retained
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('validation/contextual_representation_fresh_v1/portal_final_result.json').read_text())
          assert p['response_consumed'] is True
          assert p['terminal_class'] == 'adverse_contextual_added_value'
          assert p['authoritative_run'] == 34294382108
          assert p['authoritative_job'] == 102287689782
          assert p['artifact_id'] == 10082630749
          assert p['counts_as_fourth_closed_endpoint'] is False
          assert p['changes_closed_eog_wf'] is False
          PY

# The once-only biological-response endpoint was consumed on run 34294382108.
# No push-triggered live execution remains in the canonical repository.
