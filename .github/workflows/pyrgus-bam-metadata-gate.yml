name: Pyrgus BAM source metadata-only gate

# The DOI/file roster is now frozen by successful run 40859758110.
# Do not automatically re-acquire after a source receipt update.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install EOG core and tests
        run: python -m pip install -e ".[dev]"
      - name: Verify exact-response firewall with synthetic metadata
        run: python -m pytest -q tests/test_pyrgus_bam_metadata_gate_v1.py
      - name: Two-request DOI version/file metadata audit only
        run: |
          python benchmarks/run_pyrgus_bam_metadata_gate_v1.py \
            --receipt /tmp/eog_pyrgus_gate/metadata_receipt_v1.json
      - name: Archive terminal metadata outcome, including access STOPs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyrgus-bam-metadata-only
          path: /tmp/eog_pyrgus_gate/metadata_receipt_v1.json
          if-no-files-found: warn
