name: Original EOG randomized virtual-world validation v2

on:
  pull_request:
    paths:
      - "validation/eog_original_idea_virtual_worlds_v2/**"
      - "benchmarks/run_eog_original_idea_virtual_worlds_v2.py"
      - "tests/test_eog_original_idea_virtual_worlds_v2.py"
      - ".github/workflows/eog-original-idea-virtual-worlds-v2.yml"
  workflow_dispatch:

concurrency:
  group: original-eog-randomized-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test randomized panel
        run: python -m pytest tests/test_eog_original_idea_virtual_worlds_v2.py -q
      - name: Run frozen randomized benchmark
        run: |
          python benchmarks/run_eog_original_idea_virtual_worlds_v2.py \
            --output build/eog_original_idea_virtual_worlds_v2/result_v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-original-idea-virtual-worlds-v2
          path: build/eog_original_idea_virtual_worlds_v2/result_v2.json
          if-no-files-found: error
