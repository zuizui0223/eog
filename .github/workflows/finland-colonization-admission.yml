name: Finland colonization response-free admission

on:
  pull_request:
    paths:
      - ".github/workflows/finland-colonization-admission.yml"
      - "benchmarks/finland_colonization_preoutcome_admission.py"
      - "benchmarks/finland_colonization_prepare.py"
      - "docs/eog_v2_finland_colonization_preoutcome_contract.md"
      - "docs/eog_v2_finland_colonization_inference_freeze.md"
      - "src/eog/dynamic_island_reachability.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen package code and browser driver
        run: |
          python -m pip install -e .
          python -m pip install "playwright==1.55.0"
          google-chrome --version
      - name: Download authoritative Dryad file through public browser flow
        run: |
          mkdir -p benchmark_results/finland_colonization/raw
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          root = Path("benchmark_results/finland_colonization")
          raw = root / "raw" / "colonization_select.csv"
          landing = "https://datadryad.org/dataset/doi%3A10.5061/dryad.ffbg79cr6"

          with sync_playwright() as p:
              browser = p.chromium.launch(channel="chrome", headless=True)
              context = browser.new_context(accept_downloads=True)
              page = context.new_page()
              page.goto(landing, wait_until="domcontentloaded", timeout=120_000)
              page.wait_for_timeout(2000)
              links = page.locator("a[href*='/downloads/file_stream/']")
              count = links.count()
              if count != 1:
                  raise RuntimeError(f"expected exactly one Dryad file link, found {count}")
              href = links.first.get_attribute("href")
              if not href:
                  raise RuntimeError("Dryad file link has no href")
              (root / "dryad_file_stream_url.txt").write_text(
                  (href if href.startswith("http") else "https://datadryad.org" + href) + "\n",
                  encoding="utf-8",
              )
              with page.expect_download(timeout=240_000) as download_info:
                  links.first.click()
              download = download_info.value
              download.save_as(raw)
              (root / "dryad_suggested_filename.txt").write_text(
                  download.suggested_filename + "\n", encoding="utf-8"
              )
              browser.close()

          if not raw.exists():
              raise RuntimeError("browser download did not create colonization_select.csv")
          size = raw.stat().st_size
          if size < 100_000_000:
              raise RuntimeError(f"downloaded Dryad file is implausibly small: {size} bytes")
          with raw.open("rb") as handle:
              header = handle.readline(65536).decode("utf-8-sig", errors="strict")
          required = {"outcome", "spp.name", "holmkod", "Historical_total_log", "Dist_to_historical_log"}
          columns = {value.strip() for value in header.rstrip("\r\n").split(",")}
          missing = required - columns
          if missing:
              raise RuntimeError(f"downloaded file header lacks required columns: {sorted(missing)}")
          (root / "transport_header.txt").write_text(header, encoding="utf-8")
          (root / "raw_path.txt").write_text(str(raw) + "\n", encoding="utf-8")
          PY
          RAW="$(cat benchmark_results/finland_colonization/raw_path.txt)"
          sha256sum "$RAW" > benchmark_results/finland_colonization/raw_csv_sha256.txt
          stat --printf='%s\n' "$RAW" > benchmark_results/finland_colonization/raw_size_bytes.txt
          ls -lh "$RAW"
      - name: Run response-free source reconstruction admission
        run: |
          RAW="$(cat benchmark_results/finland_colonization/raw_path.txt)"
          python benchmarks/finland_colonization_preoutcome_admission.py \
            --input "$RAW" \
            --output benchmark_results/finland_colonization/admission.json
      - name: Freeze response-free predictor bundle
        run: |
          RAW="$(cat benchmark_results/finland_colonization/raw_path.txt)"
          python benchmarks/finland_colonization_prepare.py \
            --input "$RAW" \
            --bundle benchmark_results/finland_colonization/features.npz \
            --manifest benchmark_results/finland_colonization/feature_manifest.json \
            > benchmark_results/finland_colonization/prepare_stdout.json
      - name: Verify response firewall and provenance agreement
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("benchmark_results/finland_colonization")
          admission = json.loads((root / "admission.json").read_text())
          manifest = json.loads((root / "feature_manifest.json").read_text())
          raw = Path((root / "raw_path.txt").read_text().strip())
          digest = hashlib.sha256(raw.read_bytes()).hexdigest()

          assert admission["status"] == "finland-colonization-response-free-admission"
          assert admission["outcome_values_accessed"] is False
          assert admission["admitted"] is True
          assert admission["n_islands"] == 471
          assert admission["n_sourceful_species"] >= 100
          assert all(check["passed"] for check in admission["checks"].values())
          assert manifest["schema"] == "eog_v2_finland_colonization_response_free_bundle_v1"
          assert manifest["outcome_values_accessed"] is False
          assert manifest["raw_sha256"] == admission["raw_sha256"] == digest
          assert manifest["n_species_analysis_response_free"] >= 100
          assert len(manifest["feature_bundle_fingerprint"]) == 64
          PY
      - name: Remove raw data before artifact upload
        if: always()
        run: rm -rf benchmark_results/finland_colonization/raw
      - name: Upload response-free admission artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finland-colonization-response-free-admission
          path: |
            benchmark_results/finland_colonization/admission.json
            benchmark_results/finland_colonization/features.npz
            benchmark_results/finland_colonization/feature_manifest.json
            benchmark_results/finland_colonization/prepare_stdout.json
            benchmark_results/finland_colonization/raw_csv_sha256.txt
            benchmark_results/finland_colonization/raw_size_bytes.txt
            benchmark_results/finland_colonization/dryad_file_stream_url.txt
            benchmark_results/finland_colonization/dryad_suggested_filename.txt
            benchmark_results/finland_colonization/transport_header.txt
          if-no-files-found: warn
