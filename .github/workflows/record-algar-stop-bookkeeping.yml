name: Record Algar STOP bookkeeping

on:
  push:
    branches:
      - 'record/algar-gate0-stop'
    paths:
      - '.github/workflows/record-algar-stop-bookkeeping.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal ledger and denominator patch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ledger_path = Path('validation/paper_ready_replication/candidate_flow_ledger.json')
          text = ledger_path.read_text(encoding='utf-8')
          lines = text.splitlines()
          hits = [i for i, line in enumerate(lines) if '{"issue":375,' in line]
          assert len(hits) == 1, hits
          i = hits[0]
          assert lines[i + 1].strip() == '],'
          assert not lines[i].rstrip().endswith(',')
          assert not any('{"issue":378,' in line for line in lines)
          row = {
              'issue': 378,
              'system': 'Algar Restoration white-tailed deer camera-week detection',
              'ecosystem_or_context': 'boreal restoration camera-trap monitoring with complete seven-day site occasions',
              'terminal_stage': 'response_independent_geometry_registry',
              'reason': 'the prospectively frozen response-blind Gate0 found coordinate drift across deployments for ALG069 under the fixed 1e-9-degree consistency rule; the attempt stopped before images.csv access and was not repaired by averaging coordinates, dropping the site, or retuning tolerance',
              'biological_response_access': 'none',
              'safe_file_requests': 5,
              'safe_file_bytes_opened': 64276,
              'images_requests': 0,
              'images_header_bytes_opened': 0,
              'images_payload_bytes_opened': 0,
              'images_rows_opened': 0,
              'response_values_opened': False,
              'model_fits': 0,
              'heldout_scores': 0,
              'gate0_run_id': 34004544321,
              'gate0_job_id': 101409317204,
              'gate0_head_sha': '085950fb12ebc4139cbe7d997c7e4378ad5a907b',
              'gate0_artifact_id': 9980528437,
              'gate0_artifact_digest': 'sha256:0a117907f579e89a0f89c9872cb7f4fdff1bb846eb50ff31f4b5b634b0bd4662',
              'gate0_fingerprint': '8bfb521bb6add68bf3fda1cee56115258141c45901bddb11a64df6ba0f94a426',
              'counts_as_predictive_evidence': False,
          }
          lines[i] = lines[i] + ','
          lines.insert(i + 1, '    ' + json.dumps(row, ensure_ascii=False, separators=(',', ':')))
          old = '    "fresh_candidate_stops_listed": 28,'
          new = '    "fresh_candidate_stops_listed": 29,'
          assert lines.count(old) == 1
          lines[lines.index(old)] = new
          ledger_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          test_path = Path('tests/test_paper_ready_candidate_flow_ledger.py')
          test = test_path.read_text(encoding='utf-8')
          old_assert = 'assert summary["fresh_candidate_stops_listed"] == len(stops) == 28'
          new_assert = 'assert summary["fresh_candidate_stops_listed"] == len(stops) == 29'
          assert test.count(old_assert) == 1
          test_path.write_text(test.replace(old_assert, new_assert), encoding='utf-8')

          parsed = json.loads(ledger_path.read_text(encoding='utf-8'))
          assert len(parsed['fresh_candidate_stops']) == 29
          assert parsed['fresh_candidate_stops'][-1]['issue'] == 378
          assert parsed['current_denominator_summary']['fresh_candidate_stops_listed'] == 29
          PY
      - name: Commit bookkeeping patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/paper_ready_replication/candidate_flow_ledger.json tests/test_paper_ready_candidate_flow_ledger.py
          git diff --cached --check
          git commit -m 'Record Algar as 29th protocol STOP'
          git push origin HEAD:record/algar-gate0-stop
