name: BAM Great Lakes barrier bridge Gate1

on:
  pull_request:
    paths:
      - "validation/bam_greatlakes_barrier_external_bridge_v1/gate0_dryad_identity_certificate.json"
      - "validation/bam_greatlakes_barrier_external_bridge_v1/gate1_execution_authorization.json"
      - "validation/bam_greatlakes_barrier_external_bridge_v1/gate1_readme.py"
      - "tests/test_bam_greatlakes_barrier_gate1.py"
      - ".github/workflows/bam-greatlakes-barrier-gate1.yml"
  workflow_dispatch:

jobs:
  gate1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test README-only Gate1 boundary
        run: python -m pytest tests/test_bam_greatlakes_barrier_gate1.py -q
      - name: Run README-only Gate1
        run: python -m validation.bam_greatlakes_barrier_external_bridge_v1.gate1_readme
      - uses: actions/upload-artifact@v4
        with:
          name: bam-greatlakes-barrier-gate1
          path: validation/bam_greatlakes_barrier_external_bridge_v1/gate1_readme_certificate.json
          if-no-files-found: error
