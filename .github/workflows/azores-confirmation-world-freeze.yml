name: Azores confirmation world freeze

on:
  push:
    branches:
      - agent/azores-worldset-confirmation-world-freeze
    paths:
      - benchmarks/azores_confirmation_world_contract.json
      - benchmarks/freeze_azores_world_universe.py
      - tests/test_azores_confirmation_world_freeze.py
      - validation/azores_confirmation/azores_climate.csv
      - validation/azores_confirmation/climate_freeze_record.json
      - .github/workflows/azores-confirmation-world-freeze.yml
  workflow_dispatch:

jobs:
  world-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lock Gate 4 contract before world construction
        run: |
          python -m pip install pytest numpy
          python -m pytest -q tests/test_azores_confirmation_world_freeze.py

      - name: Freeze exact response-blind 20-world universe
        run: |
          mkdir -p results/azores_world_freeze
          python benchmarks/freeze_azores_world_universe.py \
            --climate validation/azores_confirmation/azores_climate.csv \
            --output-json results/azores_world_freeze/worlds.json \
            --output-manifest results/azores_world_freeze/world_freeze_manifest.json

      - name: Verify response firewall and family counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('results/azores_world_freeze/worlds.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('results/azores_world_freeze/world_freeze_manifest.json').read_text(encoding='utf-8'))
          expected = {
              'geography_only': 4,
              'chelsa_q50': 4,
              'chelsa_q75': 4,
              'worldclim_q50': 4,
              'worldclim_q75': 4,
          }
          assert payload['world_count'] == 20
          assert payload['family_counts'] == expected
          assert manifest['family_counts'] == expected
          assert payload['species_incidence_used'] is False
          assert payload['heldout_outcomes_scored'] is False
          assert payload['predictive_model_fitted'] is False
          print(json.dumps({
              'status': manifest['status'],
              'world_count': manifest['world_count'],
              'family_counts': manifest['family_counts'],
              'worlds_json_sha256': manifest['worlds_json_sha256'],
              'world_universe_fingerprint': manifest['world_universe_fingerprint'],
              'species_incidence_used': manifest['species_incidence_used'],
              'heldout_outcomes_scored': manifest['heldout_outcomes_scored'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload pre-outcome world freeze
        uses: actions/upload-artifact@v4
        with:
          name: azores-world-freeze
          path: |
            results/azores_world_freeze/worlds.json
            results/azores_world_freeze/world_freeze_manifest.json
          if-no-files-found: error
