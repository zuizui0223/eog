name: Spotted lanternfly independent two-layer outcome ONCE

on:
  pull_request:
    paths:
      - ".github/workflows/slf_eogwf_outcome_once.yml"
      - "benchmarks/run_slf_eogwf_once.py"
      - "validation/slf_two_layer/gate2_prediction_contract.json"
      - "validation/slf_two_layer/runtime_lock.txt"
      - "validation/slf_two_layer/pre_response_smoke_result.json"

permissions:
  contents: read

jobs:
  outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prove runner and scientific contract equal the smoke-frozen versions
        run: |
          frozen='dcba7ec1a668de38d6748d44d24b6bac08ec2e7e'
          curl -L --fail "https://raw.githubusercontent.com/zuizui0223/eog/${frozen}/benchmarks/run_slf_eogwf_once.py" -o /tmp/frozen_runner.py
          curl -L --fail "https://raw.githubusercontent.com/zuizui0223/eog/${frozen}/validation/slf_two_layer/gate2_prediction_contract.json" -o /tmp/frozen_contract.json
          curl -L --fail "https://raw.githubusercontent.com/zuizui0223/eog/${frozen}/validation/slf_two_layer/runtime_lock.txt" -o /tmp/frozen_runtime.txt
          cmp benchmarks/run_slf_eogwf_once.py /tmp/frozen_runner.py
          cmp validation/slf_two_layer/gate2_prediction_contract.json /tmp/frozen_contract.json
          cmp validation/slf_two_layer/runtime_lock.txt /tmp/frozen_runtime.txt
          echo "smoke-frozen runner/contract/runtime are unchanged"
      - name: Install frozen runtime and EOG
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/slf_two_layer/runtime_lock.txt
          python -m pip install . --no-deps
          python - <<'PY'
          import numpy, pandas, sklearn
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          print('sklearn', sklearn.__version__)
          PY
      - name: Fetch exact response-independent Census geometry
        run: |
          curl -L --fail --retry 3 \
            'https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2020_Gazetteer/2020_Gaz_counties_national.zip' \
            -o /tmp/2020_Gaz_counties_national.zip
          test "$(sha256sum /tmp/2020_Gaz_counties_national.zip | awk '{print $1}')" = "02ef546e4c4f9c032c19616eabb9526caa016f778f41ede3b8c9755dacce20ef"
      - name: Open exact frozen SLF response once
        run: |
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/danielstrombom/SLFS/f0cf5345346ece720b6d6fde18c91072fdcc9b01/Maps/data_2_temporal.csv' \
            -o /tmp/data_2_temporal.csv
          python - <<'PY'
          import hashlib
          p='/tmp/data_2_temporal.csv'
          b=open(p,'rb').read()
          blob=hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
          sha=hashlib.sha256(b).hexdigest()
          assert blob=='e845dcc72080089d11c3f1078766cc14cdeb2340', blob
          assert sha=='9af3fba4e4a45b6bf8c0b11f869a82188297d34c76745535db00238d2020cb4c', sha
          print('response bytes verified; frozen runner may now inspect rows')
          PY
      - name: Execute frozen independent validation once
        run: |
          mkdir -p build/slf_outcome
          python benchmarks/run_slf_eogwf_once.py \
            --census-zip /tmp/2020_Gaz_counties_national.zip \
            --response /tmp/data_2_temporal.csv \
            --output build/slf_outcome/slf_eogwf_result.json
      - name: Upload immutable outcome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slf-two-layer-independent-outcome
          path: build/slf_outcome
          if-no-files-found: warn
      - name: Remove source bytes
        if: always()
        run: rm -f /tmp/2020_Gaz_counties_national.zip /tmp/data_2_temporal.csv /tmp/frozen_runner.py /tmp/frozen_contract.json /tmp/frozen_runtime.txt
