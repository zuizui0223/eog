name: Record Forest First STOP bookkeeping

on:
  push:
    branches:
      - 'record/forest-first-gate0-stop'
    paths:
      - '.github/workflows/record-forest-first-stop-bookkeeping.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal ledger and denominator patch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ledger_path = Path('validation/paper_ready_replication/candidate_flow_ledger.json')
          text = ledger_path.read_text(encoding='utf-8')
          lines = text.splitlines()
          hits = [i for i, line in enumerate(lines) if '{"issue":378,' in line]
          assert len(hits) == 1, hits
          i = hits[0]
          assert lines[i + 1].strip() == '],'
          assert not lines[i].rstrip().endswith(',')
          assert not any('{"issue":381,' in line for line in lines)
          row = {
              'issue': 381,
              'system': 'Forest First Colombia — Odocoileus cariacou',
              'ecosystem_or_context': 'tropical terrestrial camera-trap monitoring in a Forest First Colombia restoration landscape',
              'terminal_stage': 'response_blind_archive_range_transport',
              'reason': 'the prospectively frozen version-3 IPT archive size probe requested Range bytes=0-0 but returned HTTP 200 rather than required 206; the response body was not opened and the attempt was not repaired by full-body fallback, alternate transport, source/version switching, or rerun',
              'biological_response_access': 'none',
              'range_requests': 1,
              'size_probe_http_status': 200,
              'archive_metadata_bytes_opened': 0,
              'local_header_bytes_opened': 0,
              'member_payload_bytes_opened': 0,
              'datapackage_payload_bytes_opened': 0,
              'deployments_payload_bytes_opened': 0,
              'observations_header_bytes_opened': 0,
              'observations_payload_bytes_opened': 0,
              'observations_rows_opened': 0,
              'observations_values_opened': False,
              'media_payload_bytes_opened': 0,
              'model_fits': 0,
              'heldout_scores': 0,
              'gate0_run_id': 34006584422,
              'gate0_job_id': 101414854670,
              'gate0_head_sha': '41e8563da577182da605728f5feb37505c43ec15',
              'gate0_artifact_id': 9981128987,
              'gate0_artifact_digest': 'sha256:30af4701ac2a54aefac33dea4221368995d17cc69d3b429cf2746376114982a4',
              'gate0_fingerprint': '8d5361707550d92ba4895622b41f0b6edcc36063a57920b50351ccab909e39c6',
              'counts_as_predictive_evidence': False,
          }
          lines[i] = lines[i] + ','
          lines.insert(i + 1, '    ' + json.dumps(row, ensure_ascii=False, separators=(',', ':')))
          old = '    "fresh_candidate_stops_listed": 29,'
          new = '    "fresh_candidate_stops_listed": 30,'
          assert lines.count(old) == 1
          lines[lines.index(old)] = new
          ledger_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          for filename in [
              'tests/test_paper_ready_candidate_flow_ledger.py',
              'tests/test_uwin_gate0_terminal_stop.py',
              'tests/test_algar_gate0_terminal_stop.py',
          ]:
              path = Path(filename)
              value = path.read_text(encoding='utf-8')
              old_assert = 'summary["fresh_candidate_stops_listed"] == len(stops) == 29'
              new_assert = 'summary["fresh_candidate_stops_listed"] == len(stops) == 30'
              assert value.count(old_assert) == 1, filename
              path.write_text(value.replace(old_assert, new_assert), encoding='utf-8')

          parsed = json.loads(ledger_path.read_text(encoding='utf-8'))
          assert len(parsed['fresh_candidate_stops']) == 30
          assert parsed['fresh_candidate_stops'][-1]['issue'] == 381
          assert parsed['current_denominator_summary']['fresh_candidate_stops_listed'] == 30
          PY
      - name: Commit bookkeeping patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/paper_ready_replication/candidate_flow_ledger.json \
                  tests/test_paper_ready_candidate_flow_ledger.py \
                  tests/test_uwin_gate0_terminal_stop.py \
                  tests/test_algar_gate0_terminal_stop.py
          git diff --cached --check
          git commit -m 'Record Forest First as 30th protocol STOP'
          git push origin HEAD:record/forest-first-gate0-stop
