name: Glanville EOG-WF Gate 1 patch schema

on:
  pull_request:
    paths:
      - ".github/workflows/glanville_gate1_patch_schema.yml"
      - "validation/glanville_eogwf/gate1_scale_adequacy_declaration.json"

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact source archive
        run: |
          curl -L --fail --retry 3 \
            'https://zenodo.org/records/4987060/files/ECOG-04799.zip?download=1' \
            -o /tmp/ECOG-04799.zip
          test "$(md5sum /tmp/ECOG-04799.zip | awk '{print $1}')" = "69122a1d82b1fb970fb6638b02da3db4"
      - name: Extract non-response patch schema only
        run: |
          mkdir -p build/glanville_gate1
          unzip -p /tmp/ECOG-04799.zip data/patch_network.tsv | head -n 3 > build/glanville_gate1/patch_network_head.tsv
          unzip -p /tmp/ECOG-04799.zip data/patch_area.tsv | head -n 3 > build/glanville_gate1/patch_area_head.tsv
          test -s build/glanville_gate1/patch_network_head.tsv
          test -s build/glanville_gate1/patch_area_head.tsv
          cat build/glanville_gate1/patch_network_head.tsv
          cat build/glanville_gate1/patch_area_head.tsv
      - name: Upload response-blind schema
        uses: actions/upload-artifact@v4
        with:
          name: glanville-eogwf-gate1-patch-schema
          path: build/glanville_gate1
