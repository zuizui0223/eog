name: Peneda roe deer replication 2 Gate1

on:
  push:
    branches:
      - agent/peneda-roedeer-replication-2
    paths:
      - validation/peneda_roedeer_replication_2/source_contract.json
      - validation/peneda_roedeer_replication_2/site_registry_certificate.json
      - validation/peneda_roedeer_replication_2/gate0_response_free.py
      - validation/peneda_roedeer_replication_2/gate1_deployment_profile.py
      - .github/workflows/peneda_roedeer_replication_2_gate1.yml

permissions:
  contents: read

jobs:
  gate1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile deployment-only Gate1
        run: |
          python -m py_compile validation/peneda_roedeer_replication_2/gate0_response_free.py
          python -m py_compile validation/peneda_roedeer_replication_2/gate1_deployment_profile.py
      - name: Run six-cycle availability and structural ladder
        id: gate
        continue-on-error: true
        run: python validation/peneda_roedeer_replication_2/gate1_deployment_profile.py
      - name: Assert observation response stayed closed
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/peneda_roedeer_replication_2/gate1_deployment_profile.json')
          assert p.exists(), 'Gate1 evidence missing'
          r=json.loads(p.read_text())
          a=r['response_firewall']
          assert a['observation_payload_requests']==0
          assert a['observation_payload_bytes_opened']==0
          assert a['observation_header_bytes_opened']==0
          assert a['observation_rows_opened'] is False
          assert a['observation_values_opened'] is False
          assert a['model_fits']==0
          assert a['heldout_scores']==0
          print(json.dumps({
              'status':r['status'],
              'fingerprint':r.get('fingerprint'),
              'site_registry':r.get('site_registry',{}),
              'cycles':r.get('cycles',{}),
              'structural_ladder':r.get('structural_ladder',{}),
              'response_firewall':a,
          },indent=2,sort_keys=True))
          PY
      - name: Upload Gate1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peneda-roedeer-replication-2-gate1
          path: build/peneda_roedeer_replication_2/gate1_deployment_profile.json
          if-no-files-found: error
      - name: Propagate engineering failure only
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/peneda_roedeer_replication_2/gate1_deployment_profile.json').read_text())
          if r['status'].startswith('engineering_failure'):
              raise SystemExit(r['reason'])
          print('Gate1 terminal status:',r['status'])
          PY
