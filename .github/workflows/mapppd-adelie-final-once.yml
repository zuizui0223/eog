name: MAPPPD Adelie consumed-endpoint guard

on:
  pull_request:
    paths:
      - 'validation/mapppd_adelie_selective_promotion/**'
      - '.github/workflows/mapppd-adelie-final-once.yml'

permissions:
  contents: read

jobs:
  consumed-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify consumed terminal certificate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('validation/mapppd_adelie_selective_promotion/final_terminal_stop_certificate.json').read_text())
          assert p['terminal_status'] == 'consumed_estimability_stop'
          assert p['response_consumed'] is True
          assert p['response_payload_requests'] == 1
          assert p['model_fits'] == 0
          assert p['selector_decision_made'] is False
          assert p['outer_scores'] == 0
          assert p['authoritative_run']['run_id'] == 34547620159
          assert p['authoritative_run']['artifact_id'] == 10179598049
          assert p['failed_gate'] == 'inner_train_negative_site_years >= 30'
          PY
