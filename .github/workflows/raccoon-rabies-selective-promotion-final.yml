name: Raccoon rabies selective-promotion once-only endpoint

on:
  push:
    branches:
      - fresh/raccoon-rabies-selective-promotion-v1
    paths:
      - 'validation/raccoon_rabies_selective_promotion/final_once_only_contract.json'
      - 'benchmarks/raccoon_rabies_selective_promotion_final.py'
      - '.github/workflows/raccoon-rabies-selective-promotion-final.yml'

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen runtime
        run: python -m pip install -e . numpy==2.1.3 scikit-learn==1.5.2
      - name: Proposal-safe preflight
        run: |
          python -m py_compile benchmarks/raccoon_rabies_selective_promotion_final.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('validation/raccoon_rabies_selective_promotion/final_once_only_contract.json').read_text())
          assert p['frozen_before_response_access'] is True
          assert p['response']['file'] == 'SurveillanceData.csv'
          assert p['partition']['outer_outcomes_used_for_selection'] is False
          assert p['selector']['decision_before_outer_scoring'] is True
          assert p['hard_rules']['one_response_access'] is True
          assert p['hard_rules']['rerun_after_consumption'] is False
          PY
      - name: Execute once-only response endpoint
        run: python benchmarks/raccoon_rabies_selective_promotion_final.py
      - name: Audit terminal boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('build/raccoon_rabies_selective_promotion/final_result.json').read_text())
          assert p['status'] in {'terminal_predictive_result','terminal_stop_after_or_before_response'}
          assert p['response_payload_requests'] <= 1
          assert p['closed_eog_wf_unchanged'] is True
          if p['status'] == 'terminal_predictive_result':
              assert p['counts_as_predictive_evidence'] is True
              assert p['terminal_class'] in {'favorable_predictive_improvement','protective_null','conservative_miss','adverse_selective_promotion','tie_or_unclassified'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raccoon-rabies-selective-promotion-final
          path: build/raccoon_rabies_selective_promotion/final_result.json
          if-no-files-found: error
