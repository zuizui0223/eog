name: Mediterranean sowing source integrity gate v1
on:
  pull_request:
    paths:
      - 'validation/mediterranean_sowing_constraint_witness_v1/**'
      - 'benchmarks/mediterranean_sowing_source_gate_v1.py'
      - 'tests/test_mediterranean_sowing_source_gate_v1.py'
      - 'docs/mediterranean_sowing_constraint_witness_v1.md'
      - '.github/workflows/mediterranean-sowing-source-gate-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Frozen offline source-contract tests
        run: python -m pytest -q tests/test_mediterranean_sowing_source_gate_v1.py
      - name: Try authoritative Dryad file bytes and verify manifest digest
        run: python benchmarks/mediterranean_sowing_source_gate_v1.py --output-dir /tmp/eog_med_sowing
      - name: Archive receipt only, never input outcome rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediterranean-sowing-source-only-gate-v1
          path: /tmp/eog_med_sowing/source_gate.json
          if-no-files-found: warn
