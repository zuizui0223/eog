name: Raccoon rabies selective-promotion Gate0 metadata
on:
  push:
    branches: [fresh/raccoon-rabies-selective-promotion-v1]
    paths:
      - 'validation/raccoon_rabies_selective_promotion/source_selection_contract.json'
      - 'validation/raccoon_rabies_selective_promotion/gate0_metadata.py'
      - '.github/workflows/raccoon-rabies-gate0-metadata.yml'
permissions:
  contents: read
jobs:
  gate0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify frozen response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('validation/raccoon_rabies_selective_promotion/source_selection_contract.json').read_text())
          assert p['response_firewall']['SurveillanceData.csv_payload_allowed'] is False
          assert p['response_firewall']['SurveillanceData.csv_header_allowed'] is False
          assert p['gate0']['file_payload_requests_allowed'] == 0
          PY
      - name: Execute metadata-only Gate0
        run: python validation/raccoon_rabies_selective_promotion/gate0_metadata.py
      - name: Audit zero-payload boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('build/raccoon_rabies_selective_promotion/gate0_metadata.json').read_text())
          assert p['status'] in {'gate0_metadata_ready_for_covariate_freeze','stop_pre_response_metadata_identity_or_transport'}
          assert p['file_payload_requests']==0 and p['file_payload_bytes_opened']==0
          assert p['csv_header_bytes_opened']==0 and p['csv_rows_opened']==0
          assert p['response_values_opened'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raccoon-rabies-gate0-metadata
          path: build/raccoon_rabies_selective_promotion/gate0_metadata.json
          if-no-files-found: error
