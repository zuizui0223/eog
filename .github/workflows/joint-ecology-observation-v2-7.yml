name: Joint ecology-observation worlds v2.7

on:
  pull_request:
    paths:
      - "src/eog/v2/joint_ecology_observation.py"
      - "validation/joint_ecology_observation_v2_7/**"
      - "benchmarks/run_joint_ecology_observation_v2_7.py"
      - "tests/test_joint_ecology_observation.py"
      - ".github/workflows/joint-ecology-observation-v2-7.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Run frozen joint-world benchmark
        run: |
          python benchmarks/run_joint_ecology_observation_v2_7.py \
            --output build/joint_ecology_observation_v2_7/result_v2_7.json
      - name: Verify focused tests
        run: python -m pytest tests/test_joint_ecology_observation.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: joint-ecology-observation-v2-7
          path: build/joint_ecology_observation_v2_7/result_v2_7.json
          if-no-files-found: error
