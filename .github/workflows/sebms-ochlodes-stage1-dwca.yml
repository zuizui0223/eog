name: SeBMS Ochlodes endpoint3 Stage1 DwC-A metadata

on:
  pull_request:
    paths:
      - 'validation/sebms_ochlodes_endpoint3/**'
      - 'tests/test_sebms_ochlodes_stage1_dwca_metadata.py'
      - '.github/workflows/sebms-ochlodes-stage1-dwca.yml'
  push:
    branches:
      - main
    paths:
      - 'validation/sebms_ochlodes_endpoint3/**'
      - '.github/workflows/sebms-ochlodes-stage1-dwca.yml'

permissions:
  contents: read

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest
      - name: Verify bounded DwC-A Stage1 without external data
        run: pytest -q tests/test_sebms_ochlodes_stage1_dwca_metadata.py
      - name: Compile Stage1 modules
        run: |
          python -m py_compile \
            validation/sebms_ochlodes_endpoint3/gate1_dwca_metadata.py \
            validation/sebms_ochlodes_endpoint3/gate1_live_runner.py
      - name: Verify Gate0 PASS and frozen Stage1 blobs
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path('validation/sebms_ochlodes_endpoint3')
          auth = json.loads((root / 'gate1_execution_authorization.json').read_text())
          gate0 = json.loads((root / 'gate0_pass_certificate.json').read_text())
          assert auth['attempt_id'] == 'sebms_ochlodes_endpoint3_v1'
          assert auth['issue'] == 358
          assert gate0['status'] == 'gate0_metadata_ready'
          assert gate0['authoritative_execution']['result_fingerprint'] == '9556b2f2690f22feb025461d4e6f1afc45e721f0f42089bce9f1d7db55473d94'
          assert auth['authorized_url'] == 'https://www.gbif.se/ipt/archive.do?r=lu_sebms&v=1.12'
          assert auth['maximum_head_requests'] == 1
          assert auth['maximum_range_requests'] == 2048
          assert auth['maximum_single_metadata_range_bytes'] == 5000000
          assert auth['maximum_total_metadata_range_bytes'] == 10000000
          assert auth['full_archive_get_allowed'] is False
          assert auth['event_member_payload_bytes_allowed'] == 0
          assert auth['emof_member_payload_bytes_allowed'] == 0
          assert auth['occurrence_member_header_bytes_allowed'] == 0
          assert auth['occurrence_member_payload_bytes_allowed'] == 0
          assert auth['response_values_allowed'] is False
          assert auth['model_fits_allowed'] == 0
          assert auth['heldout_scores_allowed'] == 0

          bindings = {
              'gate0_pass_git_blob_sha': root / 'gate0_pass_certificate.json',
              'gate1_contract_git_blob_sha': root / 'gate1_dwca_metadata_contract.json',
              'gate1_evaluator_git_blob_sha': root / 'gate1_dwca_metadata.py',
              'gate1_runner_git_blob_sha': root / 'gate1_live_runner.py',
              'reused_zip_inspector_git_blob_sha': Path('validation/mica_muskrat_endpoint3/gate0_archive_transport.py'),
          }
          for key, path in bindings.items():
              observed = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
              assert observed == auth[key], (key, observed, auth[key])
          PY

  live-stage1:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: synthetic-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute bounded DwC-A metadata Stage1 once
        run: python -m validation.sebms_ochlodes_endpoint3.gate1_live_runner
      - name: Audit member/response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('validation/sebms_ochlodes_endpoint3/gate1_live_dwca_metadata_certificate.json')
          r = json.loads(p.read_text())
          assert r['status'] in {
              'gate1_dwca_metadata_ready',
              'stop_pre_response_dwca_transport_container_or_metadata',
          }
          assert len(r['head_ledger']) <= 1
          assert r['archive_metadata_range_requests'] <= 2048
          assert r['archive_metadata_range_bytes_opened'] <= 10000000
          assert r['meta_xml_compressed_bytes_opened'] <= 1000000
          assert r['event_member_payload_bytes_opened'] == 0
          assert r['emof_member_payload_bytes_opened'] == 0
          assert r['occurrence_member_header_bytes_opened'] == 0
          assert r['occurrence_member_payload_bytes_opened'] == 0
          assert r['response_rows_opened'] == 0
          assert r['response_values_opened'] is False
          assert r['model_fits'] == 0
          assert r['heldout_scores'] == 0
          assert r['counts_as_predictive_evidence'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sebms-ochlodes-stage1-dwca-metadata
          path: validation/sebms_ochlodes_endpoint3/gate1_live_dwca_metadata_certificate.json
          if-no-files-found: error
