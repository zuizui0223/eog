name: BAM target quotient v1

on:
  pull_request:
    paths:
      - "src/eog/v2/bam_target_quotient.py"
      - "benchmarks/run_bam_target_quotient_v1.py"
      - "tests/test_bam_target_quotient.py"
      - "validation/bam_target_quotient_v1/**"
      - ".github/workflows/bam-target-quotient-v1.yml"
  workflow_dispatch:

concurrency:
  group: bam-target-quotient-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Verify partition engine
        run: python -m pytest tests/test_bam_target_quotient.py -q
      - name: Run frozen W1 quotient synthesis
        run: |
          python benchmarks/run_bam_target_quotient_v1.py \
            --output build/bam_target_quotient_v1/result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: bam-target-quotient-v1
          path: build/bam_target_quotient_v1/result_v1.json
          if-no-files-found: error
