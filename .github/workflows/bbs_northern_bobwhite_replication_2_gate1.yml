name: BBS Northern Bobwhite replication 2 Gate1

on:
  push:
    branches:
      - agent/bbs-northern-bobwhite-replication-2
    paths:
      - validation/bbs_northern_bobwhite_replication_2/gate0_metadata_certificate.json
      - validation/bbs_northern_bobwhite_replication_2/gate1_registry_effort_contract.json
      - validation/bbs_northern_bobwhite_replication_2/gate1_registry_effort.py
      - .github/workflows/bbs_northern_bobwhite_replication_2_gate1.yml

permissions:
  contents: read

jobs:
  gate1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Gate1
        run: python -m py_compile validation/bbs_northern_bobwhite_replication_2/gate1_registry_effort.py
      - name: Run response-independent registry / effort / species gate
        id: gate
        continue-on-error: true
        run: python validation/bbs_northern_bobwhite_replication_2/gate1_registry_effort.py
      - name: Assert bird response stayed closed
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/bbs_northern_bobwhite_replication_2/gate1_registry_effort.json')
          assert p.exists(), 'Gate1 evidence missing'
          r=json.loads(p.read_text())
          a=r['response_firewall']
          assert a['avian_payload_requests']==0
          assert a['avian_payload_bytes_opened']==0
          assert a['avian_header_bytes_opened']==0
          assert a['avian_rows_opened'] is False
          assert a['avian_values_opened'] is False
          assert a['model_fits']==0
          assert a['heldout_scores']==0
          print(json.dumps({'status':r['status'],'reason':r['reason'],'analysis_registry':r.get('analysis_registry'),'species_registry':r.get('species_registry'),'weather':r.get('weather'),'response_firewall':a,'fingerprint':r['fingerprint']},indent=2,sort_keys=True))
          PY
      - name: Upload Gate1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbs-northern-bobwhite-replication-2-gate1
          path: build/bbs_northern_bobwhite_replication_2/gate1_registry_effort.json
          if-no-files-found: error
      - name: Propagate engineering failure only
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/bbs_northern_bobwhite_replication_2/gate1_registry_effort.json').read_text())
          if r['status'].startswith('engineering_failure'):
              raise SystemExit(r['reason'])
          print('Gate1 terminal status:',r['status'])
          PY
