name: Thalassia pre-genetic response-free metadata

on:
  pull_request:
    paths:
      - ".github/workflows/thalassia-pre-genetic-metadata.yml"
      - "benchmarks/thalassia_pre_genetic_metadata_audit.py"
      - "docs/eog_v2_thalassia_pre_genetic_contract.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GPS-workbook dependency only
        run: python -m pip install "openpyxl==3.1.5"
      - name: Download GPS workbook and opaque microsatellite bytes
        run: |
          mkdir -p benchmark_results/thalassia_pre_genetic
          curl --fail --location --retry 4 --retry-delay 3 \
            --user-agent "Mozilla/5.0 EOG-v2.1-response-free-metadata/1.0" \
            "https://datadryad.org/downloads/file_stream/28987" \
            --output benchmark_results/thalassia_pre_genetic/gps.xlsx
          curl --fail --location --retry 4 --retry-delay 3 \
            --user-agent "Mozilla/5.0 EOG-v2.1-opaque-genetic-provenance/1.0" \
            "https://datadryad.org/downloads/file_stream/28986" \
            --output benchmark_results/thalassia_pre_genetic/genetic_opaque.xlsx
          test "$(stat -c%s benchmark_results/thalassia_pre_genetic/gps.xlsx)" -gt 5000
          test "$(stat -c%s benchmark_results/thalassia_pre_genetic/genetic_opaque.xlsx)" -gt 100000
          sha256sum benchmark_results/thalassia_pre_genetic/gps.xlsx > benchmark_results/thalassia_pre_genetic/gps_sha256.txt
          sha256sum benchmark_results/thalassia_pre_genetic/genetic_opaque.xlsx > benchmark_results/thalassia_pre_genetic/genetic_sha256.txt
      - name: Read GPS workbook only
        run: |
          GEN_SIZE="$(stat -c%s benchmark_results/thalassia_pre_genetic/genetic_opaque.xlsx)"
          GEN_SHA="$(sha256sum benchmark_results/thalassia_pre_genetic/genetic_opaque.xlsx | awk '{print $1}')"
          python benchmarks/thalassia_pre_genetic_metadata_audit.py \
            --gps benchmark_results/thalassia_pre_genetic/gps.xlsx \
            --genetic-size "$GEN_SIZE" \
            --genetic-sha256 "$GEN_SHA" \
            --output benchmark_results/thalassia_pre_genetic/metadata_audit.json \
            > benchmark_results/thalassia_pre_genetic/stdout.json
      - name: Enforce response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark_results/thalassia_pre_genetic/metadata_audit.json').read_text())
          assert r['status']=='thalassia-response-free-gps-schema-audit'
          assert r['genetic_workbook_contents_accessed'] is False
          assert r['genetic_workbook_container_inspected'] is False
          assert r['genetic_response_computed'] is False
          assert len(r['gps_sha256'])==64 and len(r['genetic_file_sha256'])==64
          assert r['gps_size_bytes'] > 5000
          assert r['genetic_file_size_bytes'] > 100000
          assert len(r['fingerprint'])==64
          PY
      - name: Remove raw GPS and genetic files before artifact upload
        if: always()
        run: rm -f benchmark_results/thalassia_pre_genetic/gps.xlsx benchmark_results/thalassia_pre_genetic/genetic_opaque.xlsx
      - name: Upload response-free audit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thalassia-pre-genetic-response-free-metadata
          path: |
            benchmark_results/thalassia_pre_genetic/metadata_audit.json
            benchmark_results/thalassia_pre_genetic/stdout.json
            benchmark_results/thalassia_pre_genetic/gps_sha256.txt
            benchmark_results/thalassia_pre_genetic/genetic_sha256.txt
          if-no-files-found: error
