name: Vermont American marten replication 2 Gate2

on:
  push:
    branches:
      - agent/vermont-american-marten-replication-2
    paths:
      - validation/vermont_american_marten_replication_2/gate0_metadata_certificate.json
      - validation/vermont_american_marten_replication_2/gate1_response_independent_profile.py
      - validation/vermont_american_marten_replication_2/gate1_response_independent_certificate.json
      - validation/vermont_american_marten_replication_2/gate2_effort_geometry_contract.json
      - validation/vermont_american_marten_replication_2/gate2_effort_geometry_profile.py
      - validation/vermont_american_marten_replication_2/gate2_effort_geometry_profile_run.py
      - src/eog/v2/world_scale_ladder.py
      - .github/workflows/vermont_american_marten_replication_2_gate2.yml

permissions:
  contents: read

jobs:
  gate2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact structural dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Compile Gate2
        run: |
          python -m py_compile validation/vermont_american_marten_replication_2/gate2_effort_geometry_profile.py
          python -m py_compile validation/vermont_american_marten_replication_2/gate2_effort_geometry_profile_run.py
      - name: Run response-independent effort / geometry gate
        continue-on-error: true
        run: python validation/vermont_american_marten_replication_2/gate2_effort_geometry_profile_run.py
      - name: Assert biological response firewall
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/vermont_american_marten_replication_2/gate2_effort_geometry_profile.json')
          assert p.exists(), 'Gate2 evidence missing'
          r=json.loads(p.read_text())
          a=r['biological_response_firewall']
          assert a['response_payload_requests']==0
          assert a['response_payload_bytes_opened']==0
          assert a['response_headers_opened'] is False
          assert a['response_rows_opened'] is False
          assert a['response_values_opened'] is False
          assert a['model_fits']==0
          assert a['heldout_scores']==0
          print(json.dumps({
            'status':r['status'],
            'fingerprint':r.get('fingerprint'),
            'site_registry':r.get('site_registry'),
            'structural_ladder':r.get('structural_ladder'),
            'media_effort':r.get('media_effort'),
            'temporal_profile':r.get('temporal_profile'),
            'biological_response_firewall':a
          },indent=2,sort_keys=True))
          PY
      - name: Upload Gate2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vermont-american-marten-replication-2-gate2
          path: build/vermont_american_marten_replication_2/gate2_effort_geometry_profile.json
          if-no-files-found: error
      - name: Propagate engineering failure only
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/vermont_american_marten_replication_2/gate2_effort_geometry_profile.json').read_text())
          if r['status'].startswith('engineering_failure'):
              raise SystemExit(r['reason'])
          print('Gate2 terminal status:',r['status'])
          PY
