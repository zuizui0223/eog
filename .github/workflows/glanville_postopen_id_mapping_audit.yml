name: Glanville post-open ID mapping audit

on:
  pull_request:
    paths:
      - ".github/workflows/glanville_postopen_id_mapping_audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch exact source archive
        run: |
          curl -L --fail --retry 3 \
            'https://zenodo.org/records/4987060/files/ECOG-04799.zip?download=1' \
            -o /tmp/ECOG-04799.zip
          test "$(md5sum /tmp/ECOG-04799.zip | awk '{print $1}')" = "69122a1d82b1fb970fb6638b02da3db4"
      - name: Extract ID-only views and non-response geometry
        run: |
          mkdir -p build/glanville_id_audit
          unzip -p /tmp/ECOG-04799.zip data/patch_network.tsv | cut -f1 > /tmp/network_ids.txt
          unzip -p /tmp/ECOG-04799.zip data/patch_area.tsv | cut -f1,2 > /tmp/area_ids_year.tsv
          unzip -p /tmp/ECOG-04799.zip data/survey_data.tsv | cut -f1,2 > /tmp/survey_year_patch.tsv
          python - <<'PY'
          import csv, json, pathlib
          from collections import Counter

          with open('/tmp/network_ids.txt', encoding='utf-8-sig') as f:
              lines = [line.strip() for line in f if line.strip()]
          assert lines[0] == 'patch'
          network = set(lines[1:])

          area_pairs = []
          with open('/tmp/area_ids_year.tsv', encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f, delimiter='\t')
              assert tuple(reader.fieldnames or ()) == ('patch', 'year')
              for row in reader:
                  area_pairs.append((row['patch'].strip(), int(row['year'])))
          area_ids = {patch for patch, _ in area_pairs}

          survey_pairs = []
          with open('/tmp/survey_year_patch.tsv', encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f, delimiter='\t')
              assert tuple(reader.fieldnames or ()) == ('year', 'patch')
              for row in reader:
                  survey_pairs.append((int(row['year']), row['patch'].strip()))

          unknown_pairs = [(year, patch) for year, patch in survey_pairs if patch not in network]
          unknown_ids = sorted({patch for _, patch in unknown_pairs})
          unknown_by_year = Counter(year for year, _ in unknown_pairs)
          in_network_by_year = Counter(year for year, patch in survey_pairs if patch in network)
          unknown_with_area = sorted(set(unknown_ids) & area_ids)

          payload = {
              'status': 'post_open_id_only_mapping_audit',
              'population_response_columns_read_by_this_audit': False,
              'network_node_count': len(network),
              'patch_area_unique_node_count': len(area_ids),
              'patch_area_nodes_outside_network': sorted(area_ids - network),
              'survey_row_count': len(survey_pairs),
              'survey_unique_patch_count': len({patch for _, patch in survey_pairs}),
              'survey_rows_outside_network': len(unknown_pairs),
              'survey_unique_ids_outside_network': len(unknown_ids),
              'unknown_survey_ids_with_patch_area': unknown_with_area,
              'unknown_rows_by_year': {str(k): unknown_by_year[k] for k in sorted(unknown_by_year)},
              'in_network_rows_by_year': {str(k): in_network_by_year[k] for k in sorted(in_network_by_year)},
              'mapping_decision_boundary': 'No node may be added to the frozen 4656-node world universe. Survey rows outside the network are usable only if the already-frozen patch-area rule would have admitted them; otherwise they are structurally ineligible independent of population value.'
          }
          out = pathlib.Path('build/glanville_id_audit/id_mapping_audit.json')
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'network_node_count': payload['network_node_count'],
              'patch_area_nodes_outside_network': len(payload['patch_area_nodes_outside_network']),
              'survey_rows_outside_network': payload['survey_rows_outside_network'],
              'survey_unique_ids_outside_network': payload['survey_unique_ids_outside_network'],
              'unknown_survey_ids_with_patch_area': len(payload['unknown_survey_ids_with_patch_area']),
          }, indent=2))
          PY
      - name: Upload ID-only audit
        uses: actions/upload-artifact@v4
        with:
          name: glanville-post-open-id-mapping-audit
          path: build/glanville_id_audit/id_mapping_audit.json
