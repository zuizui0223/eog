name: Norway Willow Warbler endpoint3 Gate0

on:
  pull_request:
    paths:
      - 'validation/norway_willow_warbler_endpoint3/**'
      - 'tests/test_norway_willow_warbler_gate0_*.py'
      - '.github/workflows/norway-willow-warbler-gate0.yml'
  push:
    branches: [main]
    paths:
      - 'validation/norway_willow_warbler_endpoint3/**'
      - '.github/workflows/norway-willow-warbler-gate0.yml'

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest
      - name: Verify frozen metadata and transport boundary
        run: python -m pytest -q tests/test_norway_willow_warbler_gate0_metadata.py tests/test_norway_willow_warbler_gate0_live.py
      - name: Compile Gate0 modules
        run: |
          python -m py_compile validation/norway_willow_warbler_endpoint3/gate0_zenodo_metadata.py
          python -m py_compile validation/norway_willow_warbler_endpoint3/gate0_live_metadata.py
      - name: Verify exact source-contract blob binding
        run: test "$(git hash-object validation/norway_willow_warbler_endpoint3/source_contract.json)" = "1d80ccc0ff2a1bbd2ba30afff640d339addcdd93"

  live-gate0:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: synthetic-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute one metadata-only Zenodo read
        run: python -m validation.norway_willow_warbler_endpoint3.gate0_live_metadata
      - name: Audit response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('validation/norway_willow_warbler_endpoint3/gate0_live_metadata_certificate.json')
          r = json.loads(p.read_text())
          assert r['status'] in {'gate0_metadata_ready', 'stop_pre_response_metadata_identity_or_transport'}
          assert r['archive_payload_requests'] == 0
          assert r['archive_payload_bytes_opened'] == 0
          assert r['member_payload_requests'] == 0
          assert r['member_payload_bytes_opened'] == 0
          assert r['response_header_bytes_opened'] == 0
          assert r['response_rows_opened'] == 0
          assert r['response_values_opened'] is False
          assert r['model_fits'] == 0
          assert r['heldout_scores'] == 0
          assert r['counts_as_predictive_evidence'] is False
          print(r['status'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: norway-willow-warbler-gate0-certificate
          path: validation/norway_willow_warbler_endpoint3/gate0_live_metadata_certificate.json
          if-no-files-found: error
