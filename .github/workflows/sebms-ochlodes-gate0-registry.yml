name: SeBMS Ochlodes endpoint3 Gate0 registry

on:
  pull_request:
    paths:
      - validation/sebms_ochlodes_endpoint3/**
      - tests/test_sebms_ochlodes_gate0_registry.py
      - .github/workflows/sebms-ochlodes-gate0-registry.yml
  push:
    branches:
      - main
    paths:
      - validation/sebms_ochlodes_endpoint3/**
      - .github/workflows/sebms-ochlodes-gate0-registry.yml

permissions:
  contents: read

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest
      - name: Verify frozen SeBMS registry Gate0 without external data
        run: pytest -q tests/test_sebms_ochlodes_gate0_registry.py
      - name: Compile frozen modules
        run: |
          python -m py_compile \
            validation/sebms_ochlodes_endpoint3/gate0_gbif_registry.py \
            validation/sebms_ochlodes_endpoint3/gate0_live_registry.py
      - name: Verify execution authorization and frozen Git blobs
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          auth = json.loads(Path('validation/sebms_ochlodes_endpoint3/gate0_execution_authorization.json').read_text())
          assert auth['attempt_id'] == 'sebms_ochlodes_endpoint3_v1'
          assert auth['issue'] == 358
          assert auth['authorized_url'] == 'https://api.gbif.org/v1/dataset/be77e203-486c-4651-91b9-8347968b728c'
          assert auth['allowed_final_host'] == 'api.gbif.org'
          assert auth['authorized_external_requests'] == 1
          assert auth['dwca_payload_requests'] == 0
          assert auth['event_rows'] == 0
          assert auth['emof_rows'] == 0
          assert auth['occurrence_header_bytes'] == 0
          assert auth['occurrence_rows'] == 0
          assert auth['response_values'] is False
          assert auth['model_fits'] == 0
          assert auth['heldout_scores'] == 0

          paths = {
              'source_contract_git_blob_sha': 'validation/sebms_ochlodes_endpoint3/source_contract.json',
              'registry_evaluator_git_blob_sha': 'validation/sebms_ochlodes_endpoint3/gate0_gbif_registry.py',
          }
          for key, path in paths.items():
              observed = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert observed == auth[key], (key, observed, auth[key])
          runner = subprocess.check_output(
              ['git', 'hash-object', 'validation/sebms_ochlodes_endpoint3/gate0_live_registry.py'],
              text=True,
          ).strip()
          assert runner == '23bb1e49d786f10b2d66eca0d1e043c996a0e351'
          PY

  live-registry-gate0:
    needs: synthetic-boundary
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute one GBIF Registry metadata GET
        run: python -m validation.sebms_ochlodes_endpoint3.gate0_live_registry
      - name: Audit DwC-A and response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('validation/sebms_ochlodes_endpoint3/gate0_live_registry_certificate.json')
          r = json.loads(p.read_text())
          assert r['status'] in {'gate0_metadata_ready', 'stop_pre_response_metadata_identity_or_transport'}
          assert r['live_registry_transport']['request_count'] == 1
          assert 0 <= r['live_registry_transport']['metadata_bytes_opened'] <= 2_000_000
          assert r['dwca_payload_requests'] == 0
          assert r['dwca_payload_bytes_opened'] == 0
          assert r['event_rows_opened'] == 0
          assert r['emof_rows_opened'] == 0
          assert r['occurrence_header_bytes_opened'] == 0
          assert r['occurrence_rows_opened'] == 0
          assert r['response_values_opened'] is False
          assert r['model_fits'] == 0
          assert r['heldout_scores'] == 0
          assert r['counts_as_predictive_evidence'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sebms-ochlodes-gate0-registry
          path: validation/sebms_ochlodes_endpoint3/gate0_live_registry_certificate.json
          if-no-files-found: error
