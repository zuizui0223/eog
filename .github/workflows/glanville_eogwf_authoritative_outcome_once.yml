name: Glanville EOG-WF authoritative outcome ONCE

on:
  pull_request:
    paths:
      - ".github/workflows/glanville_eogwf_authoritative_outcome_once.yml"
      - "benchmarks/run_glanville_eogwf_once.py"
      - "benchmarks/filter_glanville_survey_to_frozen_nodes.py"
      - "validation/glanville_eogwf/postopen_mapping_correction_v1.json"
      - "validation/glanville_eogwf/postopen_id_mapping_audit_result.json"
      - "validation/glanville_eogwf/runtime_lock.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/glanville_eogwf/runtime_lock.txt
          python - <<'PY'
          import numpy, pandas, sklearn
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          print('sklearn', sklearn.__version__)
          PY
      - name: Fetch exact frozen public archive
        run: |
          curl -L --fail --retry 3 \
            'https://zenodo.org/records/4987060/files/ECOG-04799.zip?download=1' \
            -o /tmp/ECOG-04799.zip
          test "$(md5sum /tmp/ECOG-04799.zip | awk '{print $1}')" = "69122a1d82b1fb970fb6638b02da3db4"
          sha256sum /tmp/ECOG-04799.zip
      - name: Extract frozen validation inputs
        run: |
          mkdir -p /tmp/glanville_raw/data /tmp/glanville_filtered/data build/glanville_outcome
          unzip -p /tmp/ECOG-04799.zip data/patch_network.tsv > /tmp/glanville_raw/data/patch_network.tsv
          unzip -p /tmp/ECOG-04799.zip data/patch_area.tsv > /tmp/glanville_raw/data/patch_area.tsv
          unzip -p /tmp/ECOG-04799.zip data/survey_data.tsv > /tmp/glanville_raw/data/survey_data.tsv
          cp /tmp/glanville_raw/data/patch_network.tsv /tmp/glanville_filtered/data/patch_network.tsv
          cp /tmp/glanville_raw/data/patch_area.tsv /tmp/glanville_filtered/data/patch_area.tsv
      - name: Apply frozen-node survey adapter without response branching
        run: |
          python benchmarks/filter_glanville_survey_to_frozen_nodes.py \
            --patch-network /tmp/glanville_raw/data/patch_network.tsv \
            --survey /tmp/glanville_raw/data/survey_data.tsv \
            --output /tmp/glanville_filtered/data/survey_data.tsv \
            --audit build/glanville_outcome/node_filter_audit.json
          python - <<'PY'
          import json
          p = json.load(open('build/glanville_outcome/node_filter_audit.json'))
          assert p['network_node_count'] == 4656
          assert p['excluded_survey_rows'] == 755
          assert p['excluded_unique_patch_ids'] == 417
          assert p['population_response_values_parsed_or_used_for_filter'] is False
          assert p['node_universe_expanded'] is False
          print('frozen-node adapter audit matches ID-only audit')
          PY
      - name: Execute unchanged frozen independent validation
        run: |
          python benchmarks/run_glanville_eogwf_once.py \
            --archive /tmp/ECOG-04799.zip \
            --extract-dir /tmp/glanville_filtered \
            --output build/glanville_outcome/glanville_eogwf_result.json
      - name: Upload immutable outcome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glanville-eogwf-authoritative-outcome
          path: build/glanville_outcome
          if-no-files-found: warn
