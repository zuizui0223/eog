name: Tanzania source audit

on:
  push:
    branches:
      - agent/tanzania-source-audit
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependency
        run: python -m pip install rasterio==1.4.3
      - name: Fetch frozen Dryad source
        run: |
          python benchmarks/fetch_tanzania_dryad.py \
            --output-dir results/tanzania_source
      - name: Audit tables, nodes and matrix rasters
        run: |
          python benchmarks/audit_tanzania_source.py \
            --source-dir results/tanzania_source \
            --output results/tanzania_source/source_audit.json
      - name: Print source audit
        run: cat results/tanzania_source/source_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: tanzania-preoutcome-source-audit
          path: |
            results/tanzania_source/source_manifest.json
            results/tanzania_source/source_audit.json
          if-no-files-found: error
