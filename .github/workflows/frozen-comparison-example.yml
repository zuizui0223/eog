name: Frozen comparison example

on:
  pull_request:
    paths:
      - ".github/workflows/frozen-comparison-example.yml"
      - "examples/frozen_comparison/**"
      - "src/eog/runner.py"
      - "src/eog/manifest.py"
      - "src/eog/reference_policy.py"
      - "src/eog/uncertainty.py"
      - "src/eog/comparative.py"
      - "src/eog/geometry.py"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: |
          python -m eog.runner \
            --manifest examples/frozen_comparison/manifest.json \
            --reference examples/frozen_comparison/reference.json \
            --input examples/frozen_comparison/comparison.csv \
            --output reproduced_result.json
          cmp reproduced_result.json examples/frozen_comparison/expected_result.json
