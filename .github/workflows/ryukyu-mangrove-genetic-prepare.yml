name: Ryukyu mangrove response-free genetic predictors

on:
  pull_request:
    paths:
      - ".github/workflows/ryukyu-mangrove-genetic-prepare.yml"
      - "benchmarks/ryukyu_mangrove_genetic_prepare.py"
      - "tests/test_ryukyu_mangrove_genetic_prepare.py"
      - "docs/eog_v2_ryukyu_mangrove_genetic_retrospective_contract.md"
      - "src/eog/dynamic_island_reachability.py"
      - "src/eog/eventual_genetic_connectivity.py"
      - "src/eog/genetic_validation_io.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run response-free predictor tests
        run: python -m pytest -q tests/test_ryukyu_mangrove_genetic_prepare.py
      - name: Freeze predictors without genetic response
        run: |
          mkdir -p benchmark_results/ryukyu_mangrove
          python benchmarks/ryukyu_mangrove_genetic_prepare.py \
            --populations benchmark_results/ryukyu_mangrove/populations.csv \
            --predictors benchmark_results/ryukyu_mangrove/predictors.csv \
            --manifest benchmark_results/ryukyu_mangrove/predictor_manifest.json \
            > benchmark_results/ryukyu_mangrove/prepare_stdout.json
      - name: Check response-free contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          root = Path("benchmark_results/ryukyu_mangrove")
          manifest = json.loads((root / "predictor_manifest.json").read_text())
          populations = list(csv.DictReader((root / "populations.csv").open()))
          predictors = list(csv.DictReader((root / "predictors.csv").open()))
          assert manifest["status"] == "retrospective-external-response-not-attached"
          assert manifest["genetic_response_attached"] is False
          assert manifest["n_populations"] == 16
          assert len(populations) == 16
          assert len(predictors) == 120
          assert all(float(row["environmental_distance"]) == 0.0 for row in predictors)
          assert all("genetic" not in key.lower() for row in predictors for key in row)
          assert len(manifest["predictor_manifest_fingerprint"]) == 64
          PY
      - name: Upload frozen response-free predictors
        uses: actions/upload-artifact@v4
        with:
          name: ryukyu-mangrove-response-free-genetic-predictors
          path: benchmark_results/ryukyu_mangrove
          if-no-files-found: error
