name: Camissoniopsis two-layer Gate 0 inventory

on:
  pull_request:
    paths:
      - ".github/workflows/camissoniopsis_gate0_inventory.yml"
      - "benchmarks/run_camissoniopsis_gate0_inventory.py"
      - "validation/camissoniopsis_two_layer/gate0_source_process_response_contract.json"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch and verify exact Zenodo archive
        run: |
          curl -L --fail --retry 3 \
            'https://zenodo.org/records/14860282/files/MetapopulationsCode.zip?download=1' \
            -o /tmp/MetapopulationsCode.zip
          test "$(md5sum /tmp/MetapopulationsCode.zip | awk '{print $1}')" = "77f8047ce9fc908683824643a7ea7c0b"
          sha256sum /tmp/MetapopulationsCode.zip
      - name: Run bounded response-firewalled archive inventory
        run: |
          python benchmarks/run_camissoniopsis_gate0_inventory.py \
            --archive /tmp/MetapopulationsCode.zip \
            --output-dir build/camissoniopsis_gate0
      - name: Assert response firewall and terminal inventory result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('build/camissoniopsis_gate0/gate0_inventory_result.json')
          assert path.is_file() and path.stat().st_size > 0
          result = json.loads(path.read_text())
          assert result['response_rows_opened'] is False
          assert result['response_values_parsed'] is False
          assert result['serialized_objects_deserialized'] is False
          assert result['spatial_attribute_tables_opened'] is False
          assert result['status'] in {
              'gate0_inventory_pass_pending_geometry_role_adjudication',
              'gate0_stop_no_plausible_response_free_geometry_route',
          }
          print(result['status'])
          print(result['fingerprint'])
          PY
      - name: Remove exact source bytes
        if: always()
        run: rm -f /tmp/MetapopulationsCode.zip
      - name: Upload immutable Gate 0 inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camissoniopsis-two-layer-gate0-inventory
          path: build/camissoniopsis_gate0
          if-no-files-found: error
