name: Original EOG source placement v18

on:
  pull_request:
    paths:
      - "validation/eog_original_idea_source_placement_v18/**"
      - "benchmarks/run_eog_original_idea_source_placement_v18.py"
      - "tests/test_eog_original_idea_source_placement_v18.py"
      - ".github/workflows/eog-original-idea-source-placement-v18.yml"
  workflow_dispatch:

concurrency:
  group: original-eog-source-placement-v18-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test source-placement invariants
        run: python -m pytest tests/test_eog_original_idea_source_placement_v18.py -q
      - name: Run frozen source-placement benchmark
        run: |
          python benchmarks/run_eog_original_idea_source_placement_v18.py \
            --output build/eog_original_idea_source_placement_v18/result_v18.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-original-idea-source-placement-v18
          path: build/eog_original_idea_source_placement_v18/result_v18.json
          if-no-files-found: error
