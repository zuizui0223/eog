name: Original EOG source turnover v20

on:
  pull_request:
    paths:
      - "validation/eog_original_idea_source_turnover_v20/**"
      - "benchmarks/run_eog_original_idea_source_turnover_v20.py"
      - "tests/test_eog_original_idea_source_turnover_v20.py"
      - ".github/workflows/eog-original-idea-source-turnover-v20.yml"
  workflow_dispatch:

concurrency:
  group: original-eog-source-turnover-v20-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test turnover invariants
        run: python -m pytest tests/test_eog_original_idea_source_turnover_v20.py -q
      - name: Run frozen source-turnover benchmark
        run: |
          python benchmarks/run_eog_original_idea_source_turnover_v20.py \
            --output build/eog_original_idea_source_turnover_v20/result_v20.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-original-idea-source-turnover-v20
          path: build/eog_original_idea_source_turnover_v20/result_v20.json
          if-no-files-found: error
