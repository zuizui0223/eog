name: EOG adaptive distribution development

on:
  pull_request:
    paths:
      - "src/eog/distribution.py"
      - "src/eog/distribution_adaptive.py"
      - "src/eog/distribution_stack.py"
      - "benchmarks/distribution_model_noisy_regimes.py"
      - "benchmarks/distribution_adaptive_development.py"
      - "tests/test_distribution_adaptive.py"
      - ".github/workflows/distribution-adaptive-development.yml"
  workflow_dispatch:

jobs:
  adaptive-development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Run adaptive unit contracts
        run: python -m pytest tests/test_distribution_adaptive.py -q
      - name: Run adaptive noisy development screen
        run: python benchmarks/distribution_adaptive_development.py > adaptive-development.json
      - name: Show adaptive summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("adaptive-development.json").read_text())
          print(json.dumps({
              "schema": result["schema"],
              "status": result["status"],
              "selection_rule": result["selection_rule"],
              "integrity": result["integrity_checks"],
              "summary": result["summary"],
          }, indent=2, sort_keys=True))
          PY
      - name: Verify development boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("adaptive-development.json").read_text())
          assert result["status"] == "development_screen_not_confirmation"
          assert result["all_integrity_checks_pass"] is True
          assert result["selection_rule"]["complexity_tie_break"] == [
              "environmental", "probability_gate", "stacked"
          ]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eog-adaptive-distribution-development
          path: adaptive-development.json
