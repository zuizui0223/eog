name: Helgeland pre2015 observed first site-code transition exploratory QC

on:
  pull_request:
    paths:
      - '.github/workflows/helgeland-pre2015-direct-code-switch-v1.yml'
      - 'scripts/audit_helgeland_pre2015_direct_site_code_switch_v1.py'
      - 'tests/test_helgeland_pre2015_direct_site_code_switch_v1.py'
      - 'validation/eog_virtual_world_ecology_synthesis_v1/helgeland_pre2015_direct_code_switch_protocol_v1.json'
      - 'docs/eog_helgeland_pre2015_direct_site_switch_feasibility_v1.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/helgeland-pre2015-direct-code-switch-v1.yml'
      - 'scripts/audit_helgeland_pre2015_direct_site_code_switch_v1.py'
      - 'tests/test_helgeland_pre2015_direct_site_code_switch_v1.py'
      - 'validation/eog_virtual_world_ecology_synthesis_v1/helgeland_pre2015_direct_code_switch_protocol_v1.json'
      - 'docs/eog_helgeland_pre2015_direct_site_switch_feasibility_v1.md'

permissions:
  contents: read

jobs:
  pre2015-direct-observations-only:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: torhanssonfrank/DensityRegulationHouseSparrows
          ref: a4e1c9ebc1148d7c7aca2bb5730b9d7104094fe5
          path: upstream_public
          persist-credentials: false
      - name: Verify pinned authors' source
        run: test "$(git -C upstream_public rev-parse HEAD)" = "a4e1c9ebc1148d7c7aca2bb5730b9d7104094fe5"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Synthetic controls for future-row poison, ambiguous code and inferred year
        run: python -m pytest -q tests/test_helgeland_pre2015_direct_site_code_switch_v1.py
      - name: Verify whole original Dryad-v6 SHA256, header; inspect only pre-2015 direct encounter site-code changes
        run: |
          python scripts/audit_helgeland_pre2015_direct_site_code_switch_v1.py \
            --upstream-checkout upstream_public \
            --output build/helgeland-pre2015-direct-island-code-switch-exploratory-v1.json
      - name: Check result arithmetic and keep all ecological inference on HOLD
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('build/helgeland-pre2015-direct-island-code-switch-exploratory-v1.json')
          x=json.loads(p.read_text())
          assert x['schema']=='eog.helgeland.pre2015.direct_site_code_switch.exploratory_result.v1'
          assert x['status']=='OBSERVED_PRE2015_FIRST_FOLLOWUP_SITE_CODE_QC__NO_ECOLOGICAL_INFERENCE'
          assert x['source_cutoff_date']=='2014-12-31'
          assert x['original_complete_source_sha256_and_header_verified'] is True
          c=x['counts']
          assert set(c)==set(json.loads(Path('validation/eog_virtual_world_ecology_synthesis_v1/helgeland_pre2015_direct_code_switch_protocol_v1.json').read_text())['allowed_aggregate_fields'])
          assert c['whole_file_rows_date_checked']==73593
          assert c['eligible_pre2015_rows']+c['post2014_rows_suppressed_by_date_only']+c['pre1994_rows_suppressed_by_date_only']==73593
          assert c['unique_nest_ids_with_first_later_direct_encounter']==c['first_followup_same_island_code']+c['first_followup_changed_island_code']+c['first_followup_ambiguous_island_code']
          assert all(v is False for v in x['scientific_boundaries'].values())
          assert x['individual_ids_or_site_values_exported'] is False
          assert x['post_exposure_exploratory'] is True
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HELGELAND-PRE2015-DIRECT-FIRST-SITE-CODE-AGGREGATES-NO-IDS-v1
          path: build/helgeland-pre2015-direct-island-code-switch-exploratory-v1.json
          if-no-files-found: warn
