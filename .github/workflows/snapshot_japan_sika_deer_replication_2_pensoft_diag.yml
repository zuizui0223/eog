name: Snapshot Japan Pensoft sequence identity diagnostic

on:
  push:
    branches:
      - agent/snapshot-japan-sika-deer-replication-2
    paths:
      - validation/snapshot_japan_sika_deer_replication_2/pensoft_sequence_identity_diag.py
      - .github/workflows/snapshot_japan_sika_deer_replication_2_pensoft_diag.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile diagnostic
        run: python -m py_compile validation/snapshot_japan_sika_deer_replication_2/pensoft_sequence_identity_diag.py
      - name: Inspect Pensoft supplement landing and HEAD only
        continue-on-error: true
        run: python validation/snapshot_japan_sika_deer_replication_2/pensoft_sequence_identity_diag.py
      - name: Assert sequence response body remains unopened
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/snapshot_japan_sika_deer_replication_2/pensoft_sequence_identity_diag.json')
          assert p.exists()
          r=json.loads(p.read_text())
          a=r['response_firewall']
          assert a['sequence_http_head_requests'] in {0,1}
          assert a['sequence_payload_get_requests']==0
          assert a['sequence_payload_bytes_opened']==0
          assert a['sequence_csv_header_bytes_opened']==0
          assert a['sequence_rows_opened'] is False
          assert a['sequence_values_opened'] is False
          assert a['model_fits']==0
          assert a['heldout_scores']==0
          print(json.dumps(r, indent=2, sort_keys=True))
          PY
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-japan-pensoft-sequence-identity-diagnostic
          path: build/snapshot_japan_sika_deer_replication_2/pensoft_sequence_identity_diag.json
          if-no-files-found: error
