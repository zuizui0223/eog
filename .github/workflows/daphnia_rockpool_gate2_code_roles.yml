name: Daphnia rock-pool Gate 2 code roles

on:
  push:
    branches:
      - agent/daphnia-rockpool-gate0-screen
    paths:
      - ".github/workflows/daphnia_rockpool_gate2_code_roles.yml"
  pull_request:
    paths:
      - ".github/workflows/daphnia_rockpool_gate2_code_roles.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract only the published R analysis code
        run: |
          set -euo pipefail
          mkdir -p build/daphnia_rockpool_gate2_code_roles
          python - <<'PY'
          from __future__ import annotations
          import binascii
          import hashlib
          import json
          from pathlib import Path
          import re
          import struct
          import urllib.request
          import zlib

          URL = "https://ndownloader.figshare.com/files/36330951"
          UA = "eog-response-blind-daphnia-code-role/1.0"
          SPEC = {
              "name": "code_SpatialCoex/Bayesian model fitting/metacommunity data analysis.R",
              "offset": 2371913,
              "compressed_size": 2187,
              "uncompressed_size": 9055,
              "crc32": "f0be9ec1",
          }
          OUT = Path("build/daphnia_rockpool_gate2_code_roles")

          def range_get(start, end):
              req = urllib.request.Request(
                  URL,
                  headers={"User-Agent": UA, "Range": f"bytes={start}-{end}", "Accept-Encoding": "identity"},
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  status = getattr(response, "status", None) or response.getcode()
                  if status != 206:
                      raise RuntimeError(f"range request returned HTTP {status}, expected 206")
                  body = response.read()
              if len(body) != end-start+1:
                  raise RuntimeError("range response length mismatch")
              return body

          offset = SPEC["offset"]
          fixed = range_get(offset, offset + 29)
          fields = struct.unpack("<4s5H3I2H", fixed)
          if fields[0] != b"PK\x03\x04":
              raise RuntimeError("invalid local ZIP header")
          method, name_len, extra_len = fields[3], fields[9], fields[10]
          raw_name = range_get(offset+30, offset+30+name_len-1)
          name = raw_name.decode("utf-8", errors="replace")
          if name != SPEC["name"]:
              raise RuntimeError(f"member name mismatch: {name!r}")
          data_start = offset + 30 + name_len + extra_len
          compressed = range_get(data_start, data_start + SPEC["compressed_size"] - 1)
          content = zlib.decompress(compressed, -15) if method == 8 else compressed
          if len(content) != SPEC["uncompressed_size"]:
              raise RuntimeError("uncompressed size mismatch")
          crc = f"{binascii.crc32(content) & 0xffffffff:08x}"
          if crc != SPEC["crc32"]:
              raise RuntimeError(f"CRC mismatch: {crc}")

          text = content.decode("utf-8-sig", errors="replace")
          lines = text.splitlines()
          patterns = re.compile(r"data_[LMP]|read\.csv|read\.table|is\.na|NA|na\.|tem\.csv|distance\.csv|A\.csv|1982|2017|occup|colon|extinct", re.I)
          relevant = [
              {"line": i+1, "text": line.rstrip()}
              for i, line in enumerate(lines)
              if patterns.search(line)
          ]
          result = {
              "status": "response_blind_code_role_inventory_pass",
              "member": SPEC["name"],
              "sha256": hashlib.sha256(content).hexdigest(),
              "bytes": len(content),
              "relevant_lines": relevant,
              "response_rows_opened": False,
              "response_member_bytes_downloaded": False,
              "scientific_boundary": "Only published analysis-code bytes were inspected; no data_L/M/P.csv response member bytes were downloaded.",
          }
          (OUT / "code_role_report.json").write_text(json.dumps(result, indent=2, sort_keys=True)+"\n", encoding="utf-8")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Assert response firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('build/daphnia_rockpool_gate2_code_roles/code_role_report.json'))
          assert p['response_rows_opened'] is False
          assert p['response_member_bytes_downloaded'] is False
          PY
      - name: Upload code-role evidence
        uses: actions/upload-artifact@v4
        with:
          name: daphnia-rockpool-gate2-code-roles
          path: build/daphnia_rockpool_gate2_code_roles/code_role_report.json
          if-no-files-found: error
