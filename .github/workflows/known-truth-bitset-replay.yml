name: Known-truth bitset replay

on:
  pull_request:
    paths:
      - "src/eog/v2/known_truth_biogeography_fast.py"
      - "benchmarks/run_known_truth_witness_factorial_fast_v1.py"
      - "tests/test_known_truth_biogeography_fast.py"
      - "validation/known_truth_biogeography_v1/fast_backend_equivalence_contract_v1.json"
      - ".github/workflows/known-truth-bitset-replay.yml"
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Run frozen bitset replay
        run: |
          python benchmarks/run_known_truth_witness_factorial_fast_v1.py \
            --output build/known_truth_fast/fast_backend_result_v1.json
      - name: Verify focused equivalence test
        run: python -m pytest tests/test_known_truth_biogeography_fast.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: known-truth-bitset-replay-v1
          path: build/known_truth_fast/fast_backend_result_v1.json
          if-no-files-found: error
