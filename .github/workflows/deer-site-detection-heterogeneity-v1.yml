name: Deer site detection heterogeneity v1
on:
  pull_request:
    paths:
      - "benchmarks/deer_site_detection_heterogeneity_v1.py"
      - "tests/test_deer_site_detection_heterogeneity_v1.py"
      - "validation/deer_site_detection_heterogeneity_v1/**"
      - ".github/workflows/deer-site-detection-heterogeneity-v1.yml"
permissions:
  contents: read
jobs:
  real-site-mixture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_deer_site_detection_heterogeneity_v1.py
      - name: Get pinned real camera-trap source
        run: |
          mkdir -p /tmp/deer_site
          curl --fail --location --retry 2 --max-time 50 --silent --show-error \
            https://raw.githubusercontent.com/BrentPease1/single-season-occupancy/f65b220d1c84240fa81cb457bf27522424fe1666/deer_detection_history.csv \
            -o /tmp/deer_site/deer_detection_history.csv
          echo "bcfeb04683e572d0ded79fd40917a546188b4e2df64c043d9e1ea8720d524e34  /tmp/deer_site/deer_detection_history.csv" | sha256sum -c -
      - name: Fit site heterogeneity and compare AICc
        run: |
          python benchmarks/deer_site_detection_heterogeneity_v1.py --source /tmp/deer_site/deer_detection_history.csv --output /tmp/deer_site/result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/deer_site/result.json').read_text())
          assert len(r['models'])==2 and r['observations']['sites']==87
          assert r['observations']['valid_site_days']==1699
          assert all(0<m['psi']<1 and 0<m['p_mean']<1 for m in r['models'])
          assert r['models'][1]['p_between_site_sd']>0
          print('DEER_SITE_HETEROGENEITY_VALIDATED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deer-site-detection-heterogeneity-v1
          path: /tmp/deer_site/result.json
