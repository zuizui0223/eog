name: BAM detection prior sensitivity v1
on:
  pull_request:
    paths:
      - "benchmarks/bam_detection_prior_calibration_v1.py"
      - "tests/test_bam_detection_prior_calibration_v1.py"
      - "validation/bam_detection_prior_calibration_v1/**"
      - ".github/workflows/bam-detection-prior-sensitivity-v1.yml"
permissions:
  contents: read
jobs:
  source-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Check original generator and prior tests
        run: |
          test "$(git hash-object src/eog/v2/known_truth_bam_generality.py)" = ab852b02bccdfb2f065717f89b482b7cf15778d3
          python -m pytest -q tests/test_bam_detection_prior_calibration_v1.py tests/test_bam_detection_effort_v1.py
      - name: Exact 12-landscape prior/p misspecification evaluation
        run: python benchmarks/bam_detection_prior_calibration_v1.py --output /tmp/bam_prior/result.json
      - name: Check complete scenario grid and risk conservation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/bam_prior/result.json').read_text())
          assert len(r['summary'])==12 and len(r['rows'])==144
          for x in r['summary']:
              assert x['n_landscapes']==12
              assert abs(x['mean_correct']+x['mean_wrong']+x['mean_abstain']-1)<1e-10
          print('PRIOR_SENSITIVITY_VALIDATED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bam-detection-prior-sensitivity-v1
          path: /tmp/bam_prior/result.json
