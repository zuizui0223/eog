name: NEON pre-response synthetic audit

on:
  push:
    branches:
      - fresh/neon-standardized-selective-promotion-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -e . pytest scikit-learn
      - name: Compile final runner without executing it
        run: python -m py_compile validation/neon_standardized_selective_promotion/final_endpoint.py
      - name: Run NEON synthetic endpoint tests only
        run: pytest -q tests/test_neon_standardized_selective_promotion_endpoint.py
      - name: Verify response remains gated from this workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/neon-standardized-pre-response-tests.yml').read_text()
          assert 'final_endpoint.py\n' not in text
          assert 'camera_trap_sequences.csv' not in text
          PY
