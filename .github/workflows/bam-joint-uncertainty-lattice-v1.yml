name: BAM joint uncertainty lattice v1

on:
  pull_request:
    paths:
      - "src/eog/v2/bam_joint_uncertainty_lattice.py"
      - "benchmarks/run_bam_joint_uncertainty_lattice_v1.py"
      - "tests/test_bam_joint_uncertainty_lattice.py"
      - "validation/bam_joint_uncertainty_lattice_v1/**"
      - ".github/workflows/bam-joint-uncertainty-lattice-v1.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Verify joint uncertainty engine
        run: python -m pytest tests/test_bam_joint_uncertainty_lattice.py -q
      - name: Run frozen joint-universe audit
        run: |
          python benchmarks/run_bam_joint_uncertainty_lattice_v1.py \
            --output build/bam_joint_uncertainty_lattice_v1/result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: bam-joint-uncertainty-lattice-v1
          path: build/bam_joint_uncertainty_lattice_v1/result_v1.json
          if-no-files-found: error
