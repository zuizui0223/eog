name: Snapshot Japan sika deer replication 2 Gate0

on:
  push:
    branches:
      - agent/snapshot-japan-sika-deer-replication-2
    paths:
      - validation/snapshot_japan_sika_deer_replication_2/**
      - .github/workflows/snapshot_japan_sika_deer_replication_2_gate0.yml

permissions:
  contents: read

jobs:
  gate0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile response-free Gate0
        run: |
          python -m py_compile validation/snapshot_japan_sika_deer_replication_2/gate0_response_free.py
          python -m py_compile validation/snapshot_japan_sika_deer_replication_2/gate0_response_free_run.py
      - name: Run response-free deployment / habitat gate
        id: gate
        continue-on-error: true
        run: python validation/snapshot_japan_sika_deer_replication_2/gate0_response_free_run.py
      - name: Assert sequence response firewall
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/snapshot_japan_sika_deer_replication_2/gate0_response_free.json')
          assert p.exists(), 'Gate0 evidence missing'
          r = json.loads(p.read_text())
          a = r['response_firewall']
          assert a['sequence_payload_requests'] == 0
          assert a['sequence_payload_bytes_opened'] == 0
          assert a['sequence_header_bytes_opened'] == 0
          assert a['sequence_rows_opened'] is False
          assert a['sequence_values_opened'] is False
          assert a['model_fits'] == 0
          assert a['heldout_scores'] == 0
          s = r.get('sequence_response_metadata_only', {})
          if s:
              assert s.get('payload_requests', 0) == 0
              assert s.get('payload_bytes_opened', 0) == 0
              assert s.get('header_bytes_opened', 0) == 0
              assert s.get('rows_opened', False) is False
              assert s.get('values_opened', False) is False
          print(json.dumps({
              'status': r['status'],
              'fingerprint': r.get('fingerprint'),
              'sequence_response_metadata_only': s,
              'response_firewall': a,
          }, indent=2, sort_keys=True))
          PY
      - name: Upload Gate0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-japan-sika-deer-replication-2-gate0
          path: build/snapshot_japan_sika_deer_replication_2/gate0_response_free.json
          if-no-files-found: error
      - name: Propagate engineering failure only
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('build/snapshot_japan_sika_deer_replication_2/gate0_response_free.json').read_text())
          if r['status'].startswith('engineering_failure'):
              raise SystemExit(r['reason'])
          print('Scientific Gate0 terminal status:', r['status'])
          PY
