name: Rabies two-layer EOG-WF Gate 1 structural adequacy

on:
  pull_request:
    paths:
      - ".github/workflows/rabies_gate1_structural.yml"
      - "benchmarks/run_rabies_gate1_structural.py"
      - "validation/rabies_two_layer/gate1_scale_adequacy_declaration.json"
      - "src/eog/v2/world_scale_ladder.py"
      - "src/eog/v2/world_adequacy.py"

permissions:
  contents: read

jobs:
  gate1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install EOG
        run: python -m pip install .
      - name: Fetch exact response-free covariate source
        run: |
          curl -L --fail --retry 3 \
            'https://zenodo.org/records/5009339/files/CovariateData.csv?download=1' \
            -o /tmp/CovariateData.csv
          test "$(md5sum /tmp/CovariateData.csv | awk '{print $1}')" = "386c0498ace1dd9929c69119354dd7ae"
      - name: Run frozen response-blind structural gate
        run: |
          mkdir -p build/rabies_gate1
          python benchmarks/run_rabies_gate1_structural.py \
            --covariates /tmp/CovariateData.csv \
            --output build/rabies_gate1/gate1_result.json
      - name: Upload Gate 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rabies-two-layer-gate1-structural
          path: build/rabies_gate1/gate1_result.json
          if-no-files-found: warn
