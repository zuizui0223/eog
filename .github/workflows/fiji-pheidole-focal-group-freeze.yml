name: Fiji Pheidole response-free focal group freeze

on:
  pull_request:
    paths:
      - ".github/workflows/fiji-pheidole-focal-group-freeze.yml"
      - "benchmarks/fiji_pheidole_focal_group_freeze.py"
      - "docs/eog_v2_fiji_pheidole_pre_genetic_contract.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install transport dependency
        run: python -m pip install "requests==2.32.5"
      - name: Download Stage-1 verified archive byte object
        run: |
          mkdir -p benchmark_results/fiji_pheidole_focal/raw
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import requests

          expected = '9a23543ad59d5f4de7e6f26cc91b75dc60f93c259744e640b8f6576fde89abc7'
          url = 'https://zenodo.org/api/records/4965569/files/dryad.zip/content'
          path = Path('benchmark_results/fiji_pheidole_focal/raw/dryad.zip')
          digest = hashlib.sha256()
          with requests.get(url, stream=True, timeout=180) as response:
              response.raise_for_status()
              with path.open('wb') as handle:
                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                      if chunk:
                          handle.write(chunk)
                          digest.update(chunk)
          actual = digest.hexdigest()
          if actual != expected:
              raise RuntimeError(f'Fiji archive SHA mismatch: {actual}')
          PY
      - name: Freeze focal group from response-free sample metadata only
        run: |
          python benchmarks/fiji_pheidole_focal_group_freeze.py \
            --archive benchmark_results/fiji_pheidole_focal/raw/dryad.zip \
            --output benchmark_results/fiji_pheidole_focal/focal_group_freeze.json \
            > benchmark_results/fiji_pheidole_focal/stdout.json
      - name: Verify response firewall and focal-selection contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('benchmark_results/fiji_pheidole_focal/focal_group_freeze.json').read_text())
          assert result['genetic_member_contents_accessed'] is False
          assert result['allowed_member_contents_accessed'] == ['dryad/VCFs/sequenceMetaData.csv']
          assert result['archive_sha256'] == '9a23543ad59d5f4de7e6f26cc91b75dc60f93c259744e640b8f6576fde89abc7'
          assert result['sequence_metadata_sha256'] == '5a41f967d81e005be3b3e91f31bb1a7eae26a9e7fe3f2a495aef7162932cdfbd'
          assert result['n_metadata_rows'] == 942
          assert result['n_egpa_groups'] == 21
          print(json.dumps({
              'status': result['status'],
              'selected_group': result['selected_group'],
              'n_selected_populations': len(result['selected_population_centroids']),
              'fingerprint': result['fingerprint'],
          }, indent=2, sort_keys=True))
          PY
      - name: Remove raw archive before artifact upload
        if: always()
        run: rm -rf benchmark_results/fiji_pheidole_focal/raw
      - name: Upload response-free focal-group freeze
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiji-pheidole-response-free-focal-group
          path: |
            benchmark_results/fiji_pheidole_focal/focal_group_freeze.json
            benchmark_results/fiji_pheidole_focal/stdout.json
          if-no-files-found: warn
