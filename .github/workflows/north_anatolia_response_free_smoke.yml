name: North Anatolia roe deer response-free paired smoke

on:
  push:
    branches:
      - agent/north-anatolia-preflight
    paths:
      - ".github/workflows/north_anatolia_response_free_smoke.yml"
      - "validation/north_anatolia_roe_deer_complementarity/**"
      - "src/eog/v2/world_predictive_summary.py"
      - "src/eog/v2/predictive_complementarity.py"
  pull_request:
    paths:
      - ".github/workflows/north_anatolia_response_free_smoke.yml"
      - "validation/north_anatolia_roe_deer_complementarity/**"
      - "src/eog/v2/world_predictive_summary.py"
      - "src/eog/v2/predictive_complementarity.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  response-free-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen runtime
        run: |
          python -m pip install .
          python -m pip install numpy==2.1.3 pandas==2.2.3 scikit-learn==1.5.2
      - name: Download only response-independent pinned sources
        run: |
          set -euo pipefail
          mkdir -p build/north_anatolia_smoke/input build/north_anatolia_smoke/output
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          root = Path("validation/north_anatolia_roe_deer_complementarity")
          source = json.loads((root / "source_freeze.json").read_text(encoding="utf-8"))
          assert source["response_content_opened"] is False
          assert source["response"]["content_opened"] is False
          repo = source["upstream_repository"]
          commit = source["upstream_commit"]

          targets = [
              (
                  "stations.csv",
                  source["geometry"]["stations_path"],
                  source["geometry"]["stations_size_bytes"],
                  source["geometry"]["stations_git_blob_sha1"],
              ),
              (
                  "variable_data.csv",
                  source["geometry"]["variables_path"],
                  source["geometry"]["variables_size_bytes"],
                  source["geometry"]["variables_git_blob_sha1"],
              ),
              (
                  "camtrap_effort_Ndays.csv",
                  "data/camtrap_effort_Ndays.csv",
                  source["response_independent_predictors"]["camtrap_effort_Ndays.csv"]["size_bytes"],
                  source["response_independent_predictors"]["camtrap_effort_Ndays.csv"]["git_blob_sha1"],
              ),
          ]
          opened = []
          for local_name, remote_path, expected_size, expected_blob in targets:
              url = f"https://raw.githubusercontent.com/{repo}/{commit}/{remote_path}"
              req = Request(url, headers={"User-Agent": "EOG-North-Anatolia-response-free-smoke/1.0"})
              with urlopen(req, timeout=30) as response:
                  payload = response.read()
                  final_url = response.geturl()
              blob = hashlib.sha1(
                  f"blob {len(payload)}\0".encode("ascii") + payload
              ).hexdigest()
              if len(payload) != int(expected_size) or blob != expected_blob:
                  raise RuntimeError(f"pinned response-independent source drift: {remote_path}")
              Path("build/north_anatolia_smoke/input", local_name).write_bytes(payload)
              opened.append(
                  {
                      "remote_path": remote_path,
                      "url": final_url,
                      "size": len(payload),
                      "git_blob_sha1": blob,
                      "sha256": hashlib.sha256(payload).hexdigest(),
                  }
              )
          audit = {
              "response_file_downloads": 0,
              "response_content_opened": False,
              "opened_response_independent_sources": opened,
          }
          Path("build/north_anatolia_smoke/output/source_audit.json").write_text(
              json.dumps(audit, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(audit, indent=2, sort_keys=True))
          PY
      - name: Run exact response-free paired runner path
        run: |
          set -euo pipefail
          python validation/north_anatolia_roe_deer_complementarity/paired_runner.py \
            --mode smoke \
            --stations build/north_anatolia_smoke/input/stations.csv \
            --variables build/north_anatolia_smoke/input/variable_data.csv \
            --effort build/north_anatolia_smoke/input/camtrap_effort_Ndays.csv \
            --output build/north_anatolia_smoke/output/smoke_result.json
      - name: Assert smoke contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("build/north_anatolia_smoke/output/smoke_result.json").read_text())
          assert result["mode"] == "smoke"
          assert result["response_opened"] is False
          assert result["count_gate"]["passed"] is True, result["count_gate"]
          assert result["model_fit_count"] == 2, result
          assert result["heldout_score_count"] == 10, result
          assert result["status"] in {
              "favorable_complementary_added_value",
              "adverse_complementary_added_value",
              "no_confirmed_complementary_added_value",
          }, result["status"]
          assert len(result["paired_scores"]) == 5
          assert len(result["layer_b_feature_names"]) == 10
          print(json.dumps({
              "status": result["status"],
              "count_gate": result["count_gate"]["totals"],
              "model_fit_count": result["model_fit_count"],
              "heldout_score_count": result["heldout_score_count"],
              "surviving_world_ids_final": result["surviving_world_ids_final"],
              "fingerprint": result["fingerprint"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload response-free smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: north-anatolia-response-free-smoke
          path: build/north_anatolia_smoke/output/
          if-no-files-found: error
