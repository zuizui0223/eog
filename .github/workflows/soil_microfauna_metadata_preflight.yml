name: Soil microfauna response-blind metadata preflight

on:
  push:
    branches:
      - agent/soil-microfauna-preflight
    paths:
      - ".github/workflows/soil_microfauna_metadata_preflight.yml"
      - "validation/soil_microfauna_paired_complementarity/source_contract.json"
  pull_request:
    paths:
      - ".github/workflows/soil_microfauna_metadata_preflight.yml"
      - "validation/soil_microfauna_paired_complementarity/source_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query Zenodo record metadata only
        run: |
          set -euo pipefail
          mkdir -p build/soil_microfauna_metadata
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path

          contract=json.loads(Path("validation/soil_microfauna_paired_complementarity/source_contract.json").read_text())
          record=int(contract["scientific_anchor"]["zenodo_record"])
          url=f"https://zenodo.org/api/records/{record}"
          req=urllib.request.Request(url,headers={"User-Agent":"EOG-soil-microfauna-metadata/1.0","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=60) as response:
              body=response.read(5_000_001)
              status=getattr(response,"status",None)
          if status != 200 or len(body) > 5_000_000:
              raise RuntimeError(f"Zenodo metadata failed bounded checks: {status}")
          payload=json.loads(body.decode("utf-8"))
          files=[]
          for f in payload.get("files",[]):
              links=f.get("links") or {}
              files.append({
                  "id":f.get("id"),
                  "name":f.get("key"),
                  "size":f.get("size"),
                  "checksum":f.get("checksum"),
                  "content_url":links.get("content") or links.get("self"),
                  "mimetype":f.get("mimetype"),
              })
          result={
              "attempt_id":contract["attempt_id"],
              "record_id":payload.get("id"),
              "doi":(payload.get("metadata") or {}).get("doi"),
              "version":(payload.get("metadata") or {}).get("version"),
              "title":(payload.get("metadata") or {}).get("title"),
              "license":((payload.get("metadata") or {}).get("license") or {}).get("id") if isinstance((payload.get("metadata") or {}).get("license"),dict) else (payload.get("metadata") or {}).get("license"),
              "files":sorted(files,key=lambda x:str(x["name"])),
              "file_count":len(files),
              "metadata_requests":1,
              "file_payload_requests":0,
              "file_payload_bytes_opened":0,
              "response_header_bytes_opened":0,
              "response_rows_opened":False,
              "response_values_opened":False,
              "model_fits":0,
              "heldout_scores":0,
              "status":"zenodo_metadata_inventory_pass",
          }
          Path("build/soil_microfauna_metadata/metadata_inventory.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True))
          if not files:
              raise SystemExit("Zenodo record exposes no files")
          PY
      - name: Assert metadata-only firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("build/soil_microfauna_metadata/metadata_inventory.json").read_text())
          assert r["file_payload_requests"] == 0
          assert r["file_payload_bytes_opened"] == 0
          assert r["response_header_bytes_opened"] == 0
          assert r["response_rows_opened"] is False
          assert r["response_values_opened"] is False
          assert r["model_fits"] == 0
          assert r["heldout_scores"] == 0
          print("Soil microfauna metadata-only response firewall PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soil-microfauna-metadata-only
          path: build/soil_microfauna_metadata/metadata_inventory.json
          if-no-files-found: error
