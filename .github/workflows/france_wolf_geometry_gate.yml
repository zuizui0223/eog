name: France wolf geometry gate

on:
  push:
    branches:
      - agent/france-wolf-preflight
    paths:
      - ".github/workflows/france_wolf_geometry_gate.yml"
      - "validation/france_wolf_complementarity/source_freeze.json"
      - "validation/france_wolf_complementarity/geometry_gate_contract.json"
      - "src/eog/v2/world_scale_ladder.py"
      - "src/eog/v2/world_adequacy.py"
  pull_request:
    paths:
      - ".github/workflows/france_wolf_geometry_gate.yml"
      - "validation/france_wolf_complementarity/source_freeze.json"
      - "validation/france_wolf_complementarity/geometry_gate_contract.json"
      - "src/eog/v2/world_scale_ladder.py"
      - "src/eog/v2/world_adequacy.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen package and RDS reader
        run: |
          python -m pip install .
          python -m pip install pyreadr==0.5.3
      - name: Open only pinned coordinate geometry and run frozen scale gate
        run: |
          set -euo pipefail
          mkdir -p build/france_wolf_geometry_gate
          python - <<'PY'
          from dataclasses import asdict
          import hashlib
          import json
          import math
          from pathlib import Path
          from urllib.request import Request, urlopen

          import numpy as np
          import pyreadr

          from eog.v2.world_adequacy import (
              StructuralAdequacyDeclaration,
              apply_structural_adequacy_gate,
              audit_world_universe_structure,
          )
          from eog.v2.world_scale_ladder import (
              StructuralScaleLadderDeclaration,
              build_structural_scale_ladder,
              structural_scale_adjacencies,
          )

          root = Path("validation/france_wolf_complementarity")
          contract_path = root / "geometry_gate_contract.json"
          source_path = root / "source_freeze.json"
          contract_bytes = contract_path.read_bytes()
          source_bytes = source_path.read_bytes()
          contract = json.loads(contract_bytes)
          source = json.loads(source_bytes)

          assert contract["response_content_opened"] is False
          assert source["response_content_opened"] is False
          assert source["response"]["content_opened"] is False
          frozen = source["geometry"]
          declared = contract["geometry_source"]
          assert frozen["path"] == declared["path"]
          assert frozen["git_blob_sha1"] == declared["git_blob_sha1"]
          assert frozen["size_bytes"] == declared["size_bytes"]

          repo = source["upstream_repository"]
          commit = source["upstream_commit"]
          path = frozen["path"]
          raw_url = f"https://raw.githubusercontent.com/{repo}/{commit}/{path}"
          req = Request(
              raw_url,
              headers={
                  "Accept": "application/octet-stream",
                  "User-Agent": "EOG-response-blind-france-wolf-geometry/1.0",
              },
          )
          with urlopen(req, timeout=30) as response:
              geometry_bytes = response.read()
              final_url = response.geturl()

          if len(geometry_bytes) != int(frozen["size_bytes"]):
              raise RuntimeError("pinned coordinate file byte size drifted")
          git_blob_sha1 = hashlib.sha1(
              f"blob {len(geometry_bytes)}\0".encode("ascii") + geometry_bytes
          ).hexdigest()
          if git_blob_sha1 != frozen["git_blob_sha1"]:
              raise RuntimeError("pinned coordinate file Git blob identity drifted")

          local = Path("build/france_wolf_geometry_gate/coordcells_wolf.rds")
          local.write_bytes(geometry_bytes)
          objects = pyreadr.read_r(str(local))
          if len(objects) != 1:
              raise RuntimeError(f"coordinate RDS must expose exactly one object, got {len(objects)}")
          geometry = next(iter(objects.values()))
          columns = [str(value) for value in geometry.columns]
          missing = [name for name in declared["required_columns"] if name not in columns]
          if missing:
              raise RuntimeError(f"coordinate RDS missing frozen required columns: {missing}")
          if not declared["allow_additional_columns"] and columns != declared["required_columns"]:
              raise RuntimeError("coordinate RDS contains undeclared additional/reordered columns")
          expected_nodes = int(declared["expected_node_count"])
          if len(geometry) != expected_nodes:
              raise RuntimeError(f"coordinate row count {len(geometry)} != frozen {expected_nodes}")

          node_ids = [str(value).strip() for value in geometry["id"].tolist()]
          if any(not value for value in node_ids) or len(set(node_ids)) != len(node_ids):
              raise RuntimeError("coordinate id values must be unique and non-empty")
          x = np.asarray(geometry["X"], dtype=float)
          y = np.asarray(geometry["Y"], dtype=float)
          if not np.isfinite(x).all() or not np.isfinite(y).all():
              raise RuntimeError("coordinate X/Y values must be finite")

          # Published tutorial identifies these as Lambert-93 coordinates in metres.
          dx = x[:, None] - x[None, :]
          dy = y[:, None] - y[None, :]
          distance = np.hypot(dx, dy) / 1000.0
          del dx, dy
          np.fill_diagonal(distance, 0.0)

          scale = contract["structural_scale_declaration"]
          declaration = StructuralScaleLadderDeclaration(
              axis_id=contract["distance_axis"]["axis_id"],
              target_largest_component_fractions=tuple(
                  scale["target_largest_component_fractions"]
              ),
          )
          ladder = build_structural_scale_ladder(node_ids, distance, declaration)
          adjacencies = structural_scale_adjacencies(ladder, distance)

          previous = np.zeros((len(node_ids), len(node_ids)), dtype=bool)
          for level_id in ladder.level_ids:
              current = adjacencies[level_id]
              if np.any(previous & ~current):
                  raise RuntimeError("structural edge sets are not nested")
              previous = current

          positive_thresholds = [value for value in ladder.thresholds if value > 0.0]
          distinct_positive = sorted({round(value, 12) for value in positive_thresholds})
          if len(distinct_positive) < 3:
              raise RuntimeError(
                  f"structural scale collapse: only {len(distinct_positive)} distinct positive thresholds: {distinct_positive}"
              )

          horizon = int(contract["structural_adequacy"]["forecast_horizon_steps"])
          universe_audit = audit_world_universe_structure(
              node_ids,
              adjacencies,
              horizon=horizon,
          )
          level90 = next(
              level
              for level in ladder.levels
              if abs(level.target_largest_component_fraction - 0.9) < 1e-12
          )
          audit90 = audit_world_universe_structure(
              node_ids,
              {level90.level_id: adjacencies[level90.level_id]},
              horizon=horizon,
          )
          adequacy = StructuralAdequacyDeclaration(
              min_largest_weak_component_fraction=0.9,
              max_isolated_node_fraction=0.05,
              require_at_least_one_world_pass=True,
          )
          gate90 = apply_structural_adequacy_gate(audit90, adequacy)
          if not gate90.passed:
              raise RuntimeError(
                  "frozen 0.90 structural adequacy gate failed: "
                  + json.dumps(asdict(gate90), sort_keys=True)
              )

          result = {
              "status": "response_blind_geometry_gate_pass",
              "candidate": contract["candidate"],
              "upstream_repository": repo,
              "upstream_commit": commit,
              "geometry_path": path,
              "geometry_transport": final_url,
              "geometry_size_bytes": len(geometry_bytes),
              "geometry_git_blob_sha1": git_blob_sha1,
              "geometry_sha256": hashlib.sha256(geometry_bytes).hexdigest(),
              "geometry_columns": columns,
              "node_count": len(node_ids),
              "x_range": [float(np.min(x)), float(np.max(x))],
              "y_range": [float(np.min(y)), float(np.max(y))],
              "contract_sha256": hashlib.sha256(contract_bytes).hexdigest(),
              "source_freeze_sha256": hashlib.sha256(source_bytes).hexdigest(),
              "scale_ladder": asdict(ladder),
              "distinct_positive_threshold_count": len(distinct_positive),
              "distinct_positive_thresholds_km": distinct_positive,
              "universe_structural_audit": asdict(universe_audit),
              "level90_gate": asdict(gate90),
              "response_file_content_downloads": 0,
              "response_content_opened": False,
              "next": contract["next_if_pass"],
          }
          out = Path("build/france_wolf_geometry_gate/geometry_gate_result.json")
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2, sort_keys=True))
          local.unlink()
          PY
      - name: Upload response-blind geometry evidence
        uses: actions/upload-artifact@v4
        with:
          name: france-wolf-geometry-gate
          path: build/france_wolf_geometry_gate/geometry_gate_result.json
          if-no-files-found: error
