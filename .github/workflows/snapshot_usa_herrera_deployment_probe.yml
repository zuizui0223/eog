name: Snapshot USA Herrera deployment probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/snapshot-usa-herrera-preflight
    paths:
      - .github/workflows/snapshot_usa_herrera_deployment_probe.yml
      - validation/snapshot_usa_herrera_paired_complementarity/probe_deployments.py

permissions:
  contents: read

jobs:
  response-blind-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe deployment metadata only
        run: |
          mkdir -p probe-output
          python validation/snapshot_usa_herrera_paired_complementarity/probe_deployments.py probe-output/deployment_probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-usa-herrera-deployment-probe
          path: probe-output/deployment_probe.json
          if-no-files-found: error
