name: Giant kelp spore process system metadata

on:
  push:
    branches:
      - agent/giant-kelp-preflight
    paths:
      - ".github/workflows/giant_kelp_process_sysmeta.yml"
      - "validation/giant_kelp_complementarity/process_object_contract.json"
      - "benchmarks/audit_giant_kelp_process_sysmeta.py"
  pull_request:
    paths:
      - ".github/workflows/giant_kelp_process_sysmeta.yml"
      - "validation/giant_kelp_complementarity/process_object_contract.json"
      - "benchmarks/audit_giant_kelp_process_sysmeta.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sysmeta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve process system metadata and EML domains only
        run: |
          set -euo pipefail
          python benchmarks/audit_giant_kelp_process_sysmeta.py
      - name: Assert response firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('build/giant_kelp_process_sysmeta/process_sysmeta_result.json'))
          assert p['response_package_bytes_opened'] is False
          assert p['response_rows_opened'] is False
          PY
      - name: Upload process system metadata
        uses: actions/upload-artifact@v4
        with:
          name: giant-kelp-process-sysmeta
          path: build/giant_kelp_process_sysmeta/process_sysmeta_result.json
          if-no-files-found: error
