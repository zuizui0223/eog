name: White Mountain camera replication 2 Gate0

on:
  push:
    branches:
      - agent/white-mountain-camera-replication-2
    paths:
      - validation/white_mountain_camera_replication_2/source_contract.json
      - validation/white_mountain_camera_replication_2/gate0_locations_visits.py
      - .github/workflows/white_mountain_camera_replication_2_gate0.yml

permissions:
  contents: read

jobs:
  gate0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile locations-visits Gate0
        run: python -m py_compile validation/white_mountain_camera_replication_2/gate0_locations_visits.py
      - name: Run locations-visits response-free profile
        id: gate
        continue-on-error: true
        run: python validation/white_mountain_camera_replication_2/gate0_locations_visits.py
      - name: Assert observational response firewall
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/white_mountain_camera_replication_2/gate0_locations_visits.json')
          assert p.exists(), 'Gate0 evidence missing'
          r=json.loads(p.read_text())
          a=r['response_firewall']
          for key,value in a.items():
              if key in {'model_fits','heldout_scores'} or key.endswith('_payload_requests') or key.endswith('_payload_bytes_opened'):
                  assert value==0, (key,value)
          print(json.dumps({'status':r['status'],'fingerprint':r.get('fingerprint'),'locations_header':r.get('locations',{}).get('header'),'visits_header':r.get('visits',{}).get('header'),'join_key_candidates':r.get('join_key_candidates',[]),'response_firewall':a},indent=2,sort_keys=True))
          PY
      - name: Upload Gate0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: white-mountain-camera-replication-2-gate0
          path: build/white_mountain_camera_replication_2/gate0_locations_visits.json
          if-no-files-found: error
      - name: Propagate engineering failure only
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/white_mountain_camera_replication_2/gate0_locations_visits.json').read_text())
          if r['status'].startswith('engineering_failure'):
              raise SystemExit(r['reason'])
          print('Gate0 terminal status:',r['status'])
          PY
