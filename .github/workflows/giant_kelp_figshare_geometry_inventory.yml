name: Giant kelp Figshare geometry mirror inventory

on:
  push:
    branches:
      - agent/giant-kelp-preflight
    paths:
      - ".github/workflows/giant_kelp_figshare_geometry_inventory.yml"
      - "validation/giant_kelp_complementarity/figshare_geometry_mirror_contract.json"
  pull_request:
    paths:
      - ".github/workflows/giant_kelp_figshare_geometry_inventory.yml"
      - "validation/giant_kelp_complementarity/figshare_geometry_mirror_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inventory Figshare collection and file metadata only
        run: |
          set -euo pipefail
          mkdir -p build/giant_kelp_figshare_inventory
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path
          import urllib.parse
          import urllib.request

          ROOT=Path('validation/giant_kelp_complementarity')
          OUT=Path('build/giant_kelp_figshare_inventory')
          contract=json.loads((ROOT/'figshare_geometry_mirror_contract.json').read_text(encoding='utf-8'))
          cid=int(contract['figshare_collection']['collection_id'])
          UA='eog-giant-kelp-figshare-metadata/1.0'
          fetched=[]

          def get_json(url: str):
              if not url.startswith('https://api.figshare.com/v2/'):
                  raise RuntimeError(f'non-Figshare API URL blocked in metadata gate: {url!r}')
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  body=r.read(); status=getattr(r,'status',None) or r.getcode()
                  ctype=str(r.headers.get('Content-Type','')); final=str(r.geturl())
              fetched.append({'requested':url,'final':final,'status':status,'bytes':len(body),'content_type':ctype,'sha256':hashlib.sha256(body).hexdigest()})
              if status != 200 or 'json' not in ctype.casefold():
                  raise RuntimeError(f'unexpected Figshare metadata response: status={status}, type={ctype!r}')
              return json.loads(body)

          collection=get_json(f'https://api.figshare.com/v2/collections/{cid}')
          articles=[]
          page=1
          while True:
              batch=get_json(f'https://api.figshare.com/v2/collections/{cid}/articles?page={page}&page_size=100')
              if not isinstance(batch,list):
                  raise RuntimeError('Figshare collection articles endpoint did not return a list')
              articles.extend(batch)
              if len(batch)<100:
                  break
              page+=1
              if page>20:
                  raise RuntimeError('unexpected Figshare collection pagination >20 pages')
          if not articles:
              raise RuntimeError('Figshare collection contains no articles')

          details=[]
          for stub in articles:
              aid=stub.get('id')
              if not isinstance(aid,int):
                  raise RuntimeError(f'Figshare article missing integer id: {stub!r}')
              detail=get_json(f'https://api.figshare.com/v2/articles/{aid}')
              files=[]
              for f in detail.get('files') or []:
                  files.append({
                      'id':f.get('id'),
                      'name':f.get('name'),
                      'size':f.get('size'),
                      'computed_md5':f.get('computed_md5'),
                      'supplied_md5':f.get('supplied_md5'),
                      'download_url':f.get('download_url'),
                  })
              details.append({
                  'article_id':aid,
                  'title':detail.get('title'),
                  'doi':detail.get('doi'),
                  'url_private_api':None,
                  'url_public_api':f'https://api.figshare.com/v2/articles/{aid}',
                  'published_date':detail.get('published_date'),
                  'modified_date':detail.get('modified_date'),
                  'description':detail.get('description'),
                  'files':files,
              })

          all_files=[
              {'article_id':a['article_id'],'article_title':a['title'],**f}
              for a in details for f in a['files']
          ]
          geometry_terms=tuple(term.casefold() for term in contract['geometry_name_terms'])
          response_terms=tuple(term.casefold() for term in contract['response_name_terms'])
          def filename(row): return str(row.get('name') or '').casefold()
          geometry_candidates=[row for row in all_files if any(term in filename(row) for term in geometry_terms)]
          response_candidates=[row for row in all_files if any(term in filename(row) for term in response_terms)]

          collection_doi=str(collection.get('doi') or collection.get('resource_doi') or '')
          expected=contract['figshare_collection']['doi'].casefold()
          doi_matches=(not collection_doi) or expected in collection_doi.casefold() or collection_doi.casefold() in expected
          payload={
              'status':'figshare_geometry_mirror_metadata_complete',
              'candidate':contract['candidate'],
              'geometry_edi_doi':contract['geometry_edi_doi'],
              'resolved_edi_package_id':contract['resolved_edi_package_id'],
              'patch_definition_article_doi':contract['patch_definition_article_doi'],
              'figshare_collection_id':cid,
              'figshare_collection_title':collection.get('title'),
              'figshare_collection_doi':collection_doi,
              'figshare_collection_doi_compatible':doi_matches,
              'article_count':len(details),
              'articles':details,
              'file_count':len(all_files),
              'geometry_name_candidates':geometry_candidates,
              'response_name_candidates':response_candidates,
              'file_bytes_opened':False,
              'response_rows_opened':False,
              'network_fetches':fetched,
              'next':contract['next_if_geometry_file_identified'] if geometry_candidates else contract['stop_if_not_identified'],
          }
          payload['fingerprint']=hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          (OUT/'figshare_inventory_result.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - name: Assert metadata-only firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('build/giant_kelp_figshare_inventory/figshare_inventory_result.json'))
          assert p['status']=='figshare_geometry_mirror_metadata_complete'
          assert p['file_bytes_opened'] is False
          assert p['response_rows_opened'] is False
          assert p['article_count'] >= 1
          PY
      - name: Upload Figshare inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: giant-kelp-figshare-geometry-inventory
          path: build/giant_kelp_figshare_inventory/figshare_inventory_result.json
          if-no-files-found: error
