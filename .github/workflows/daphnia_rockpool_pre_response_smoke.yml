name: Daphnia rock-pool pre-response smoke

on:
  push:
    branches:
      - agent/daphnia-rockpool-gate0-screen
    paths:
      - ".github/workflows/daphnia_rockpool_pre_response_smoke.yml"
      - "benchmarks/run_daphnia_eogwf_once.py"
      - "validation/daphnia_rockpool_two_layer/gate2_prediction_contract.json"
      - "validation/daphnia_rockpool_two_layer/prospective_estimability_contract.json"
  pull_request:
    paths:
      - ".github/workflows/daphnia_rockpool_pre_response_smoke.yml"
      - "benchmarks/run_daphnia_eogwf_once.py"
      - "validation/daphnia_rockpool_two_layer/gate2_prediction_contract.json"
      - "validation/daphnia_rockpool_two_layer/prospective_estimability_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen runner dependencies
        run: |
          python -m pip install .
          python -m pip install scikit-learn
      - name: Compile runner
        run: python -m py_compile benchmarks/run_daphnia_eogwf_once.py
      - name: Execute end-to-end smoke without response member access
        run: |
          python benchmarks/run_daphnia_eogwf_once.py \
            --mode smoke \
            --output build/daphnia_rockpool_smoke/pre_response_smoke_result.json
      - name: Assert response firewall and complete frozen path
        run: |
          python - <<'PY'
          import json
          p=json.load(open('build/daphnia_rockpool_smoke/pre_response_smoke_result.json'))
          assert p['execution_mode'] == 'smoke'
          assert p['status'] == 'smoke_pass'
          assert p['response_provenance']['response_member_bytes_downloaded'] is False
          assert p['response_provenance']['response_rows_opened'] is False
          assert p['exact_count_gate']['passed'] is True
          assert p['models_fit'] == 4
          assert p['heldout_scores'] == 44
          assert len(p['annual_metrics']) == 11
          PY
      - name: Upload pre-response smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: daphnia-rockpool-pre-response-smoke
          path: build/daphnia_rockpool_smoke/pre_response_smoke_result.json
          if-no-files-found: error
