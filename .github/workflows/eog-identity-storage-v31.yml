name: EOG identity storage v31

on:
  pull_request:
    paths:
      - "benchmarks/run_eog_identity_storage_rank_abundance_v31.py"
      - "docs/eog_identity_storage_rank_abundance_v31.md"
      - "validation/eog_identity_storage_rank_abundance_v31/**"
      - "tests/test_eog_identity_storage_rank_abundance_v31.py"
      - ".github/workflows/eog-identity-storage-v31.yml"
  workflow_dispatch:

concurrency:
  group: eog-identity-storage-v31-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test identity-stripping transform
        run: python -m pytest tests/test_eog_identity_storage_rank_abundance_v31.py -q
      - name: Run frozen v31 test
        run: |
          python benchmarks/run_eog_identity_storage_rank_abundance_v31.py \
            --output build/eog_identity_storage_rank_abundance_v31/result_v31.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-identity-storage-v31
          path: build/eog_identity_storage_rank_abundance_v31/result_v31.json
          if-no-files-found: error
