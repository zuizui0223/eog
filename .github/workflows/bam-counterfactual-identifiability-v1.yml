name: BAM counterfactual identifiability v1

on:
  pull_request:
    paths:
      - "src/eog/v2/bam_counterfactual_identifiability.py"
      - "benchmarks/run_bam_counterfactual_identifiability_v1.py"
      - "tests/test_bam_counterfactual_identifiability.py"
      - "validation/bam_counterfactual_identifiability_v1/**"
      - ".github/workflows/bam-counterfactual-identifiability-v1.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Verify exact finite counterfactual engine
        run: python -m pytest tests/test_bam_counterfactual_identifiability.py -q
      - name: Run frozen 12-system / 768-truth benchmark
        run: |
          python benchmarks/run_bam_counterfactual_identifiability_v1.py \
            --output build/bam_counterfactual_identifiability_v1/result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: bam-counterfactual-identifiability-v1
          path: build/bam_counterfactual_identifiability_v1/result_v1.json
          if-no-files-found: error
