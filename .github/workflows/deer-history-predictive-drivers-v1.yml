name: Deer history features behind heldout predictive gains v1
on:
  pull_request:
    paths:
      - "benchmarks/deer_history_predictive_drivers_v1.py"
      - "tests/test_deer_history_predictive_drivers_v1.py"
      - "validation/deer_history_predictive_drivers_v1/**"
      - ".github/workflows/deer-history-predictive-drivers-v1.yml"
permissions:
  contents: read
jobs:
  history-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_deer_history_predictive_drivers_v1.py
      - name: Fetch source-pinned real detection history
        run: |
          mkdir -p /tmp/deer_history
          curl --fail --location --retry 2 --max-time 50 --silent --show-error \
            https://raw.githubusercontent.com/BrentPease1/single-season-occupancy/f65b220d1c84240fa81cb457bf27522424fe1666/deer_detection_history.csv \
            -o /tmp/deer_history/deer_detection_history.csv
          echo "bcfeb04683e572d0ded79fd40917a546188b4e2df64c043d9e1ea8720d524e34  /tmp/deer_history/deer_detection_history.csv" | sha256sum -c -
      - name: Reproduce heldout scores and analyze history features
        run: |
          python benchmarks/deer_history_predictive_drivers_v1.py --source /tmp/deer_history/deer_detection_history.csv --output /tmp/deer_history/result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/deer_history/result.json').read_text())
          assert r['overall']['sites']==87 and len(r['per_site'])==87
          assert abs(r['overall']['total_delta']-95.57045328909554)<.05
          assert sum(x['sites'] for x in r['groups']['detected_days'])==87
          assert sum(x['sites'] for x in r['groups']['missing_days'])==87
          print('DEER_HISTORY_FEATURE_AUDIT_VALIDATED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deer-history-predictive-drivers-v1
          path: /tmp/deer_history/result.json
