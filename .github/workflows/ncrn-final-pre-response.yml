name: NCRN final pre-response synthetic gate

on:
  push:
    branches:
      - research/layer-b-v2-single-fresh-endpoint-lock
    paths:
      - 'validation/layer_b_mechanism_v2/ncrn_final_execution_contract_v1.json'
      - 'validation/layer_b_mechanism_v2/ncrn_final_once_v2.py'
      - 'validation/layer_b_mechanism_v2/ncrn_final_runner_v2_amendment_v1.json'
      - 'validation/layer_b_mechanism_v2/ncrn_terminal_semantics_amendment_v1.json'
      - 'validation/layer_b_mechanism_v2/ncrn_r1_response_route_contract_v1.json'
      - 'validation/layer_b_mechanism_v2/ncrn_geometry_worlds_frozen_v1.json'
      - 'validation/layer_b_mechanism_v2/ncrn_sequential_warmup_amendment_v1.json'
      - 'validation/layer_b_mechanism_v2/ncrn_pre_response_qualification_receipt_v1.json'
      - 'src/eog/v2/source_symmetric_predictive_summary.py'
      - '.github/workflows/ncrn-final-live-once.yml'
      - '.github/workflows/ncrn-final-pre-response.yml'
  pull_request:
    paths:
      - 'validation/layer_b_mechanism_v2/ncrn_final_execution_contract_v1.json'
      - 'validation/layer_b_mechanism_v2/ncrn_final_once_v2.py'
      - 'validation/layer_b_mechanism_v2/ncrn_final_runner_v2_amendment_v1.json'
      - 'validation/layer_b_mechanism_v2/ncrn_terminal_semantics_amendment_v1.json'
      - 'validation/layer_b_mechanism_v2/ncrn_r1_response_route_contract_v1.json'
      - 'validation/layer_b_mechanism_v2/ncrn_geometry_worlds_frozen_v1.json'
      - 'validation/layer_b_mechanism_v2/ncrn_sequential_warmup_amendment_v1.json'
      - 'validation/layer_b_mechanism_v2/ncrn_pre_response_qualification_receipt_v1.json'
      - 'src/eog/v2/source_symmetric_predictive_summary.py'
      - '.github/workflows/ncrn-final-live-once.yml'
      - '.github/workflows/ncrn-final-pre-response.yml'

permissions:
  contents: read

jobs:
  pre-response:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Audit response firewall and frozen design
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          contract=json.loads(Path('validation/layer_b_mechanism_v2/ncrn_final_execution_contract_v1.json').read_text())
          route=json.loads(Path('validation/layer_b_mechanism_v2/ncrn_r1_response_route_contract_v1.json').read_text())
          amendment=json.loads(Path('validation/layer_b_mechanism_v2/ncrn_final_runner_v2_amendment_v1.json').read_text())
          terminal=json.loads(Path('validation/layer_b_mechanism_v2/ncrn_terminal_semantics_amendment_v1.json').read_text())
          src=Path('validation/layer_b_mechanism_v2/ncrn_final_once_v2.py').read_text()
          live=Path('.github/workflows/ncrn-final-live-once.yml').read_text()
          assert contract['frozen_before_any_response_payload_access'] is True
          assert contract['response_payload_requests_before_freeze'] == 0
          assert contract['response_open_authorized_by_this_contract_alone'] is False
          assert amendment['response_firewall']['response_requests_before_amendment'] == 0
          assert amendment['authoritative_runner'].endswith('ncrn_final_once_v2.py')
          assert terminal['response_payload_requests_so_far'] == 0
          assert terminal['authoritative_non_estimability_terminal'] == 'terminal_non_estimable_under_frozen_rules'
          assert route['schema'].endswith('v2')
          assert len(route['exact_header_from_independent_eml']) == 60
          assert contract['partition']['warmup_state_only'] == [2007]
          assert contract['partition']['inner_train'] == [2008,2009,2010,2011]
          assert contract['partition']['inner_validation'] == [2012,2013,2014,2015]
          assert contract['partition']['outer_prequential'] == [2016,2017,2018,2019]
          assert len(contract['baseline_features_in_order']) == 7
          assert len(contract['layer_b']['feature_order']) == 10
          assert src.count('r1_raw = core.get_bytes(core.RESPONSE_URL') == 1
          assert '757399' not in src and '757400' not in src
          assert 'AUTH_PATH.exists()' in src
          assert '--synthetic' in src
          assert "paths:\n      - 'validation/layer_b_mechanism_v2/ncrn_response_open_authorization_v1.json'" in live
          assert 'fetch-depth: 0' in live
          assert 'RUN_ATTEMPT:' in live and 'github.run_attempt' in live
          assert "if os.environ['RUN_ATTEMPT'] != '1'" in live
          assert "git','rev-parse','HEAD^" in live
          assert "git','diff','--name-only','HEAD^','HEAD" in live
          assert 'authorization commit must change exactly one file' in live
          assert "git','log','--format=%H','HEAD^','--',auth_rel" in live
          assert 'authorization path already existed in pre-authorization history' in live
          assert "src.count('r1_raw = core.get_bytes(core.RESPONSE_URL') != 1" in live
          assert 'manual_rerun_allowed' in live
          PY
      - name: Run response-free synthetic prequential validation
        run: python validation/layer_b_mechanism_v2/ncrn_final_once_v2.py --synthetic
      - name: Audit synthetic receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('build/layer_b_mechanism_v2/ncrn_final/final_result.json').read_text())
          assert p['runner_version']=='ncrn_final_once_v2'
          assert p['mode']=='synthetic'
          assert p['status']=='synthetic_validation_pass'
          assert p['response_payload_requests']==0
          assert p['response_payload_bytes_opened']==0
          assert p['response_values_opened'] is False
          assert p['counts_as_predictive_evidence'] is False
          assert len(p['layer_a_trajectory']) == 12
          assert p['inner_validation']['selection_fingerprint_before_outer_scoring']
          assert set(p['inner_validation']) >= {'baseline_macro_log_loss','augmented_macro_log_loss','promote_layer_b'}
          assert set(p['outer']) >= {'baseline_macro_log_loss','always_augmented_macro_log_loss','selected_macro_log_loss','selected_minus_baseline'}
          for year in range(2008,2020):
              c=p['partition_counts'][str(year)]
              assert c['positive']>=30 and c['negative']>=30 and c['unique_sites']>=50
          PY
      - name: Freeze authorization hash manifest
        env:
          QUALIFIED_HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          paths=[
            'validation/layer_b_mechanism_v2/ncrn_final_execution_contract_v1.json',
            'validation/layer_b_mechanism_v2/ncrn_r1_response_route_contract_v1.json',
            'validation/layer_b_mechanism_v2/ncrn_geometry_worlds_frozen_v1.json',
            'validation/layer_b_mechanism_v2/ncrn_sequential_warmup_amendment_v1.json',
            'validation/layer_b_mechanism_v2/ncrn_final_runner_v2_amendment_v1.json',
            'validation/layer_b_mechanism_v2/ncrn_terminal_semantics_amendment_v1.json',
            'validation/layer_b_mechanism_v2/ncrn_final_once_v2.py',
            'src/eog/v2/source_symmetric_predictive_summary.py',
            '.github/workflows/ncrn-final-live-once.yml',
          ]
          manifest={
            'schema':'eog.layer_b_mechanism_v2.ncrn_authorization_hash_manifest.v1',
            'qualified_head_sha':os.environ['QUALIFIED_HEAD_SHA'],
            'response_payload_requests':0,
            'response_payload_bytes_opened':0,
            'frozen_file_sha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},
          }
          out=Path('build/layer_b_mechanism_v2/ncrn_final/pre_response_hash_manifest.json')
          out.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps(manifest,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ncrn-final-pre-response-synthetic-v2
          path: |
            build/layer_b_mechanism_v2/ncrn_final/final_result.json
            build/layer_b_mechanism_v2/ncrn_final/pre_response_hash_manifest.json
          if-no-files-found: error
