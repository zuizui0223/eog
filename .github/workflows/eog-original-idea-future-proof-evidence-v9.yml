name: Original EOG future-proof evidence v9

on:
  pull_request:
    paths:
      - "validation/eog_original_idea_future_proof_evidence_v9/**"
      - "benchmarks/run_eog_original_idea_future_proof_evidence_v9.py"
      - "tests/test_eog_original_idea_future_proof_evidence_v9.py"
      - ".github/workflows/eog-original-idea-future-proof-evidence-v9.yml"
  workflow_dispatch:

concurrency:
  group: original-eog-future-proof-evidence-v9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test future-proof evidence invariants
        run: python -m pytest tests/test_eog_original_idea_future_proof_evidence_v9.py -q
      - name: Run frozen future-proof evidence benchmark
        run: |
          python benchmarks/run_eog_original_idea_future_proof_evidence_v9.py \
            --output build/eog_original_idea_future_proof_evidence_v9/result_v9.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-original-idea-future-proof-evidence-v9
          path: build/eog_original_idea_future_proof_evidence_v9/result_v9.json
          if-no-files-found: error
