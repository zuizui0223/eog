name: BAM decision robustness margin v1

on:
  pull_request:
    paths:
      - "src/eog/v2/bam_decision_robustness_margin.py"
      - "benchmarks/run_bam_decision_robustness_margin_v1.py"
      - "tests/test_bam_decision_robustness_margin.py"
      - "validation/bam_decision_robustness_margin_v1/**"
      - ".github/workflows/bam-decision-robustness-margin-v1.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Exhaustively verify completion-margin theorems
        run: python -m pytest tests/test_bam_decision_robustness_margin.py -q
      - name: Run frozen 12-system / 768-truth margin audit
        run: |
          python benchmarks/run_bam_decision_robustness_margin_v1.py \
            --output build/bam_decision_robustness_margin_v1/result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: bam-decision-robustness-margin-v1
          path: build/bam_decision_robustness_margin_v1/result_v1.json
          if-no-files-found: error
