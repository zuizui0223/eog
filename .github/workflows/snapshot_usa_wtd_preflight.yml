name: Snapshot USA white-tailed deer response-blind preflight

on:
  push:
    branches:
      - agent/snapshot-usa-wtd-preflight
    paths:
      - ".github/workflows/snapshot_usa_wtd_preflight.yml"
      - "validation/snapshot_usa_wtd_complementarity/**"
      - "src/eog/v2/candidate_preflight.py"
  pull_request:
    paths:
      - ".github/workflows/snapshot_usa_wtd_preflight.yml"
      - "validation/snapshot_usa_wtd_complementarity/**"
      - "src/eog/v2/candidate_preflight.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install EOG
        run: python -m pip install .
      - name: Resolve Dryad identities and download deployment metadata only
        run: |
          set -euo pipefail
          mkdir -p build/snapshot_usa_wtd/input build/snapshot_usa_wtd/output
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import io
          import json
          import math
          from pathlib import Path
          import statistics
          import urllib.parse
          import urllib.request

          from eog.v2.candidate_preflight import (
              CandidatePreflightDeclaration,
              CandidatePreflightEvidence,
              evaluate_candidate_preflight,
          )

          ROOT = Path("validation/snapshot_usa_wtd_complementarity")
          INPUT = Path("build/snapshot_usa_wtd/input")
          OUTPUT = Path("build/snapshot_usa_wtd/output")
          contract = json.loads((ROOT / "source_contract.json").read_text(encoding="utf-8"))
          ua = "EOG-Snapshot-USA-WTD-response-blind-preflight/1.0"
          metadata_urls = []
          deployment_download_urls = []
          response_download_urls = []
          opened_response_bytes = 0

          def api_json(url: str) -> dict:
              metadata_urls.append(url)
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": ua, "Accept": "application/json", "X-API-Version": "2.1.0"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = response.read(8_000_001)
              if len(payload) > 8_000_000:
                  raise RuntimeError(f"Dryad metadata exceeded bounded cap: {url}")
              value = json.loads(payload.decode("utf-8"))
              if not isinstance(value, dict):
                  raise RuntimeError(f"Dryad metadata root must be object: {url}")
              return value

          def absolute(href: str) -> str:
              return urllib.parse.urljoin("https://datadryad.org", href)

          def latest_files(source: dict) -> tuple[dict, list[dict]]:
              encoded = urllib.parse.quote(f"doi:{source['doi']}", safe="")
              dataset = api_json(f"https://datadryad.org/api/v2/datasets/{encoded}")
              version_href = dataset.get("_links", {}).get("stash:version", {}).get("href")
              if not version_href:
                  raise RuntimeError(f"Dryad dataset has no latest-version link: {source['doi']}")
              version = api_json(absolute(version_href))
              files_href = version.get("_links", {}).get("stash:files", {}).get("href")
              if not files_href:
                  version_id = version.get("id")
                  if not version_id:
                      raise RuntimeError("Dryad version has neither files link nor id")
                  files_href = f"/api/v2/versions/{version_id}/files"
              listing = api_json(absolute(files_href))
              files = listing.get("_embedded", {}).get("stash:files", [])
              if not isinstance(files, list):
                  raise RuntimeError("Dryad files listing malformed")
              return version, [row for row in files if isinstance(row, dict)]

          def file_identity(row: dict) -> dict:
              self_href = row.get("_links", {}).get("self", {}).get("href")
              file_id = None
              if self_href:
                  try:
                      file_id = int(str(self_href).rstrip("/").split("/")[-1])
                  except Exception:
                      file_id = None
              return {
                  "file_id": file_id,
                  "path": row.get("path"),
                  "size": row.get("size"),
                  "mimeType": row.get("mimeType"),
                  "digest": row.get("digest"),
                  "digestType": row.get("digestType"),
                  "download_href": row.get("_links", {}).get("stash:download", {}).get("href"),
              }

          def download_deployment(row: dict, expected_name: str) -> bytes:
              href = row.get("_links", {}).get("stash:download", {}).get("href")
              if not href:
                  raise RuntimeError(f"deployment file lacks download link: {expected_name}")
              url = absolute(href)
              if "sequence" in url.casefold():
                  raise RuntimeError("response-like URL appeared in deployment download")
              deployment_download_urls.append(url)
              req = urllib.request.Request(url, headers={"User-Agent": ua, "Accept": "text/csv"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = response.read(5_000_001)
              if len(payload) > 5_000_000:
                  raise RuntimeError(f"deployment file exceeded 5 MB cap: {expected_name}")
              expected_size = int(row.get("size"))
              if len(payload) != expected_size:
                  raise RuntimeError(f"Dryad deployment byte-size drift for {expected_name}")
              if str(row.get("digestType") or "").casefold() == "sha-256":
                  observed = hashlib.sha256(payload).hexdigest()
                  if observed != row.get("digest"):
                      raise RuntimeError(f"Dryad SHA-256 drift for {expected_name}")
              return payload

          source_audit = []
          deployment_payloads: list[tuple[dict, bytes]] = []
          for source in contract["sources"]:
              version, files = latest_files(source)
              by_path = {str(row.get("path")): row for row in files}
              dep_name = source["deployment_file"]
              resp_name = source["response_file"]
              if dep_name not in by_path or resp_name not in by_path:
                  raise RuntimeError(
                      f"expected Dryad files not found for {source['label']}: "
                      f"deployment={dep_name in by_path}, response={resp_name in by_path}"
                  )
              dep_row = by_path[dep_name]
              resp_row = by_path[resp_name]
              payload = download_deployment(dep_row, dep_name)
              (INPUT / dep_name).write_bytes(payload)
              deployment_payloads.append((source, payload))
              source_audit.append({
                  "label": source["label"],
                  "doi": source["doi"],
                  "version": {
                      "id": version.get("id"),
                      "versionNumber": version.get("versionNumber"),
                      "publicationDate": version.get("publicationDate"),
                      "lastModificationDate": version.get("lastModificationDate"),
                  },
                  "deployment": file_identity(dep_row),
                  "response": file_identity(resp_row),
                  "deployment_opened": True,
                  "response_opened": False,
              })

          key_fields = contract["response_blind_node_rule"]["stable_node_key_fields"]
          all_records = []
          observed_headers = {}
          for source, payload in deployment_payloads:
              text = payload.decode("utf-8-sig")
              reader = csv.DictReader(io.StringIO(text))
              header = list(reader.fieldnames or [])
              observed_headers[source["label"]] = header
              required = set(key_fields) | {
                  "Survey_Nights", "Latitude", "Longitude", "Camera_Trap_Array", "Site_Name", "State"
              }
              if source["label"] == "snapshot_usa_2019_2023":
                  required.add("Year")
              missing = sorted(required.difference(header))
              if missing:
                  raise RuntimeError(f"deployment schema missing required fields for {source['label']}: {missing}")
              allowed_years = {int(value) for value in source["years"]}
              for row in reader:
                  if source["label"] == "snapshot_usa_2024" and "Year" not in header:
                      year = 2024
                  else:
                      year = int(float(str(row.get("Year", "")).strip()))
                  if year not in allowed_years:
                      raise RuntimeError(f"deployment row year outside frozen source years: {year}")
                  key = tuple(str(row.get(field, "")).strip() for field in key_fields)
                  if any(not value for value in key):
                      raise RuntimeError(f"empty stable-node key component: {key}")
                  nights = float(str(row.get("Survey_Nights", "")).strip())
                  lat = float(str(row.get("Latitude", "")).strip())
                  lon = float(str(row.get("Longitude", "")).strip())
                  if not all(math.isfinite(value) for value in (nights, lat, lon)):
                      raise RuntimeError("deployment nights/coordinates must be finite")
                  if nights < 0 or not (-90 <= lat <= 90) or not (-180 <= lon <= 180):
                      raise RuntimeError("invalid deployment nights or WGS84 coordinates")
                  all_records.append({"key": key, "year": year, "nights": nights, "lat": lat, "lon": lon})

          if not all_records:
              raise RuntimeError("no response-independent deployment rows")

          node_year_nights: dict[tuple[str, ...], dict[int, float]] = {}
          coords: dict[tuple[str, ...], list[tuple[float, float]]] = {}
          for row in all_records:
              key = row["key"]
              coords.setdefault(key, []).append((row["lat"], row["lon"]))
              node_year_nights.setdefault(key, {})[row["year"]] = (
                  node_year_nights.setdefault(key, {}).get(row["year"], 0.0) + row["nights"]
              )

          outer_units = tuple(int(value) for value in contract["outer_units"])
          if tuple(sorted({row["year"] for row in all_records})) != outer_units:
              raise RuntimeError("response-independent deployment files do not cover exactly the frozen six years")

          registry = []
          repeated_count = 0
          for key in sorted(node_year_nights):
              values = coords[key]
              lat = float(statistics.median(value[0] for value in values))
              lon = float(statistics.median(value[1] for value in values))
              available_years = [
                  year for year in outer_units
                  if node_year_nights[key].get(year, 0.0) > 0.0
              ]
              if len(available_years) >= 2:
                  repeated_count += 1
              registry.append({
                  "node_key": list(key),
                  "latitude": lat,
                  "longitude": lon,
                  "available_years": available_years,
                  "survey_nights_by_year": {
                      str(year): node_year_nights[key].get(year, 0.0) for year in outer_units
                  },
              })

          declaration = CandidatePreflightDeclaration(
              attempt_id=contract["attempt_id"],
              minimum_nodes=int(contract["generic_minima"]["minimum_nodes"]),
              minimum_outer_units=int(contract["generic_minima"]["minimum_outer_units"]),
              minimum_repeated_nodes=int(contract["generic_minima"]["minimum_repeated_nodes"]),
              require_separate_geometry_and_response=True,
              require_coordinate_geometry=True,
              require_closed_analysis_registry=True,
          )
          geometry_identity = json.dumps(
              [row["deployment"] for row in source_audit], sort_keys=True, separators=(",", ":")
          )
          response_identity = json.dumps(
              [row["response"] for row in source_audit], sort_keys=True, separators=(",", ":")
          )
          evidence = CandidatePreflightEvidence(
              source_identity="Snapshot USA Dryad latest published versions frozen in source_audit",
              geometry_source_identity=geometry_identity,
              response_source_identity=response_identity,
              geometry_response_separable=True,
              coordinate_geometry_present=True,
              node_count=len(registry),
              outer_unit_count=len(outer_units),
              repeated_node_count=repeated_count,
              layout_design="natural_irregular",
              analysis_registry_closed=True,
              response_rows_opened=False,
              response_bytes_opened=False,
              note="Stable nodes are State + Camera_Trap_Array + Site_Name; repeated means positive Survey_Nights in at least two frozen years.",
          )
          result = evaluate_candidate_preflight(declaration, evidence)

          audit = {
              "attempt_id": contract["attempt_id"],
              "source_audit": source_audit,
              "observed_deployment_headers": observed_headers,
              "response_download_urls": response_download_urls,
              "response_bytes_opened": opened_response_bytes,
              "response_rows_opened": False,
              "deployment_download_urls": deployment_download_urls,
              "deployment_row_count": len(all_records),
              "analysis_node_count": len(registry),
              "repeated_node_count": repeated_count,
              "outer_units": list(outer_units),
              "preflight": {
                  "status": result.status,
                  "ready": result.ready,
                  "missing_metadata": list(result.missing_metadata),
                  "warnings": list(result.warnings),
                  "reason": result.reason,
                  "fingerprint": result.fingerprint,
              },
          }
          (OUTPUT / "preflight.json").write_text(json.dumps(audit, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (OUTPUT / "closed_registry.json").write_text(json.dumps(registry, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({
              "deployment_row_count": len(all_records),
              "analysis_node_count": len(registry),
              "repeated_node_count": repeated_count,
              "outer_units": list(outer_units),
              "preflight_status": result.status,
              "preflight_ready": result.ready,
              "response_bytes_opened": opened_response_bytes,
              "response_rows_opened": False,
          }, indent=2, sort_keys=True))
          if not result.ready:
              raise SystemExit(3)
          PY
      - name: Assert response firewall
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("build/snapshot_usa_wtd/output/preflight.json")
          if not path.exists():
              raise SystemExit("preflight evidence missing")
          result = json.loads(path.read_text())
          assert result["response_download_urls"] == []
          assert result["response_bytes_opened"] == 0
          assert result["response_rows_opened"] is False
          print(json.dumps({
              "status": result["preflight"]["status"],
              "nodes": result["analysis_node_count"],
              "repeated_nodes": result["repeated_node_count"],
              "response_bytes_opened": 0,
          }, indent=2, sort_keys=True))
          PY
      - name: Upload response-blind preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-usa-wtd-response-blind-preflight
          path: build/snapshot_usa_wtd/output/
          if-no-files-found: error
