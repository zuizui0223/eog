name: Snapshot USA white-tailed deer response-blind preflight

on:
  push:
    branches:
      - agent/snapshot-usa-wtd-preflight
    paths:
      - ".github/workflows/snapshot_usa_wtd_preflight.yml"
      - "validation/snapshot_usa_wtd_complementarity/**"
      - "src/eog/v2/candidate_preflight.py"
  pull_request:
    paths:
      - ".github/workflows/snapshot_usa_wtd_preflight.yml"
      - "validation/snapshot_usa_wtd_complementarity/**"
      - "src/eog/v2/candidate_preflight.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install EOG
        run: python -m pip install .
      - name: Resolve Dryad identities and open deployment metadata only
        run: |
          set -euo pipefail
          python validation/snapshot_usa_wtd_complementarity/preflight_runner.py
      - name: Assert response firewall
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          output = Path("build/snapshot_usa_wtd/output")
          preflight = output / "preflight.json"
          failure = output / "failure.json"
          if preflight.exists():
              result = json.loads(preflight.read_text())
              assert result["response_download_urls"] == []
              assert result["response_bytes_opened"] == 0
              assert result["response_rows_opened"] is False
              print(json.dumps({
                  "status": result["preflight"]["status"],
                  "nodes": result["analysis_node_count"],
                  "repeated_nodes": result["repeated_node_count"],
                  "available_nodes_by_year": result["available_node_counts_by_year"],
                  "response_bytes_opened": 0,
              }, indent=2, sort_keys=True))
          elif failure.exists():
              result = json.loads(failure.read_text())
              assert result["response_download_urls"] == []
              assert result["response_bytes_opened"] == 0
              assert result["response_rows_opened"] is False
              print(json.dumps(result, indent=2, sort_keys=True))
          else:
              raise SystemExit("response-firewall evidence missing")
          PY
      - name: Upload response-blind preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-usa-wtd-response-blind-preflight
          path: build/snapshot_usa_wtd/output/
          if-no-files-found: error
