name: Assynt water vole response-blind metadata preflight

on:
  push:
    branches:
      - agent/assynt-water-vole-preflight
    paths:
      - ".github/workflows/assynt_water_vole_metadata_preflight.yml"
      - "validation/assynt_water_vole_paired_complementarity/source_contract.json"
  pull_request:
    paths:
      - ".github/workflows/assynt_water_vole_metadata_preflight.yml"
      - "validation/assynt_water_vole_paired_complementarity/source_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze Dryad file inventory without payload access
        run: |
          set -euo pipefail
          mkdir -p build/assynt_water_vole_metadata
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path
          contract=json.loads(Path("validation/assynt_water_vole_paired_complementarity/source_contract.json").read_text())
          doi=contract["scientific_anchor"]["dryad_doi"]
          root="https://datadryad.org"
          api=root+"/api/v2"
          requested=[]
          def absolute(url): return urllib.parse.urljoin(root+"/",url)
          def get_json(url,cap=5_000_000):
              url=absolute(url); requested.append(url)
              req=urllib.request.Request(url,headers={"User-Agent":"EOG-Assynt-water-vole-metadata/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=60) as response:
                  body=response.read(cap+1); status=getattr(response,"status",None)
              if status != 200 or len(body)>cap: raise RuntimeError(f"metadata request failed: {status} {url}")
              value=json.loads(body.decode("utf-8"))
              if not isinstance(value,dict): raise RuntimeError("Dryad metadata must be object")
              return value
          def link(obj,*names):
              links=obj.get("_links")
              if not isinstance(links,dict): return None
              for name in names:
                  v=links.get(name)
                  if isinstance(v,dict) and v.get("href"): return absolute(str(v["href"]))
              return None
          ds=get_json(f"{api}/datasets/{urllib.parse.quote('doi:'+doi,safe='')}")
          vu=link(ds,"stash:version","version")
          ver=get_json(vu) if vu else ds
          fu=link(ver,"stash:files","files") or link(ds,"stash:files","files")
          if not fu: raise RuntimeError("no files endpoint")
          rows=[]; seen=set(); nxt=fu
          while nxt and nxt not in seen:
              seen.add(nxt); page=get_json(nxt); emb=page.get("_embedded",{})
              vals=emb.get("stash:files") if isinstance(emb,dict) else None
              if vals is None and isinstance(emb,dict): vals=emb.get("files")
              if not isinstance(vals,list): raise RuntimeError("files page missing list")
              rows.extend(x for x in vals if isinstance(x,dict)); nxt=link(page,"next")
          files=[]
          for row in rows:
              name=Path(str(row.get("path") or row.get("fileName") or row.get("name") or "")).name
              if not name: raise RuntimeError("file record missing name")
              files.append({"name":name,"size":int(row.get("size") or 0),"digest":row.get("digest"),"digest_type":row.get("digestType"),"mime_type":row.get("mimeType"),"api_download":link(row,"stash:download","download")})
          result={"attempt_id":contract["attempt_id"],"dataset_api":f"{api}/datasets/{urllib.parse.quote('doi:'+doi,safe='')}","version_api":vu,"version_number":ver.get("versionNumber") or ver.get("version"),"publication_date":ver.get("publicationDate") or ds.get("publicationDate"),"title":ds.get("title") or ver.get("title"),"files":sorted(files,key=lambda x:x["name"]),"file_count":len(files),"metadata_requests":len(requested),"file_payload_requests":0,"file_payload_bytes_opened":0,"response_header_bytes_opened":0,"response_rows_opened":False,"response_values_opened":False,"model_fits":0,"heldout_scores":0,"status":"dryad_metadata_inventory_pass"}
          Path("build/assynt_water_vole_metadata/metadata_inventory.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True))
          if not files: raise SystemExit("Dryad release has no files")
          PY
      - name: Assert metadata-only firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("build/assynt_water_vole_metadata/metadata_inventory.json").read_text())
          assert r["file_payload_requests"] == 0
          assert r["file_payload_bytes_opened"] == 0
          assert r["response_header_bytes_opened"] == 0
          assert r["response_rows_opened"] is False
          assert r["response_values_opened"] is False
          assert r["model_fits"] == 0
          assert r["heldout_scores"] == 0
          print("Assynt metadata-only response firewall PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assynt-water-vole-metadata-only
          path: build/assynt_water_vole_metadata/metadata_inventory.json
          if-no-files-found: error
