name: Collared lizard two-layer EOG-WF Gate 0 source semantics

on:
  pull_request:
    paths:
      - ".github/workflows/collared_lizard_gate0_source_semantics.yml"
      - "validation/collared_lizard_two_layer/gate0_source_process_response_contract.json"

permissions:
  contents: read

jobs:
  gate0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install container readers only
        run: python -m pip install openpyxl xlrd

      - name: Freeze Figshare Ecological Archives collection metadata and bytes
        run: |
          mkdir -p /tmp/collared_figshare build/collared_gate0
          curl -L --fail --retry 3 \
            'https://api.figshare.com/v2/collections/3304128/articles?page_size=100' \
            -o /tmp/collection_articles.json
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess

          articles = json.loads(pathlib.Path('/tmp/collection_articles.json').read_text(encoding='utf-8'))
          if not isinstance(articles, list) or not articles:
              raise SystemExit('Figshare collection has no articles')

          root = pathlib.Path('/tmp/collared_figshare')
          manifest = []
          for item in articles:
              article_id = int(item['id'])
              meta_path = root / f'article_{article_id}.json'
              subprocess.run(
                  ['curl', '-L', '--fail', '--retry', '3', f'https://api.figshare.com/v2/articles/{article_id}', '-o', str(meta_path)],
                  check=True,
              )
              meta = json.loads(meta_path.read_text(encoding='utf-8'))
              files = meta.get('files') or []
              for file_info in files:
                  name = str(file_info['name'])
                  file_id = int(file_info['id'])
                  size = int(file_info.get('size') or 0)
                  download_url = str(file_info.get('download_url') or '')
                  if not download_url:
                      raise SystemExit(f'missing Figshare download URL for {name}')
                  target = root / f'{article_id}_{file_id}_{name}'
                  subprocess.run(
                      ['curl', '-L', '--fail', '--retry', '3', download_url, '-o', str(target)],
                      check=True,
                  )
                  if not target.is_file() or target.stat().st_size != size:
                      raise SystemExit(f'Figshare size mismatch for {name}')
                  digest = hashlib.sha256(target.read_bytes()).hexdigest()
                  manifest.append({
                      'article_id': article_id,
                      'article_title': meta.get('title'),
                      'article_doi': meta.get('doi'),
                      'file_id': file_id,
                      'name': name,
                      'size': size,
                      'supplied_md5': file_info.get('supplied_md5'),
                      'computed_md5': file_info.get('computed_md5'),
                      'sha256': digest,
                      'local_name': target.name,
                  })

          pathlib.Path('build/collared_gate0/figshare_manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'figshare_article_count': len(articles),
              'figshare_file_count': len(manifest),
              'file_names': [row['name'] for row in manifest],
              'demographic_rows_parsed': False,
          }, indent=2))
          PY

      - name: Freeze response-free Zenodo GPS bytes and parse decimal-degree geometry
        run: |
          curl -L --fail --retry 3 \
            'https://zenodo.org/records/15557864/files/Peck_Glade_GPS_Waypoints.txt?download=1' \
            -o /tmp/Peck_Glade_GPS_Waypoints.txt
          test "$(md5sum /tmp/Peck_Glade_GPS_Waypoints.txt | awk '{print $1}')" = "7baa4bb0dc11cdff774dfe95540ed785"
          python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import math
          import pathlib

          path = pathlib.Path('/tmp/Peck_Glade_GPS_Waypoints.txt')
          text = path.read_text(encoding='utf-8-sig', errors='strict')
          lines = text.splitlines()
          if len(lines) < 200:
              raise SystemExit(f'unexpected GPS waypoint length: {len(lines)} lines')

          # Garmin's exported header contains spacer columns around Date/Time, while
          # actual waypoint rows are the compact nine-field layout:
          # ID, Name, Comment, DateTime, Latitude, Longitude, Icon, Display, Altitude.
          raw_header = next(csv.reader(io.StringIO(lines[1]), delimiter='\t'))
          compact_header = [
              'ID', 'Name', 'Comment', 'DateTime', 'Latitude', 'Longitude',
              'Icon', 'Display Option', 'Altitude'
          ]
          coords = []
          for line in lines[2:]:
              if not line.strip():
                  continue
              row = next(csv.reader(io.StringIO(line), delimiter='\t'))
              if len(row) != len(compact_header):
                  raise SystemExit(f'unexpected compact GPS row length {len(row)}: {line!r}')
              name = row[1].strip()
              lat = float(row[4])
              lon = float(row[5])
              if not name or not math.isfinite(lat) or not math.isfinite(lon):
                  raise SystemExit('GPS name/coordinates must be non-empty and finite')
              if not (-90 <= lat <= 90 and -180 <= lon <= 180):
                  raise SystemExit('GPS coordinate outside valid range')
              coords.append((name, lat, lon))

          if len(coords) != 219:
              raise SystemExit(f'expected 219 documented waypoint rows, got {len(coords)}')

          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          payload = {
              'status': 'gps_bytes_and_geometry_frozen',
              'file': 'Peck_Glade_GPS_Waypoints.txt',
              'size': path.stat().st_size,
              'md5': '7baa4bb0dc11cdff774dfe95540ed785',
              'sha256': digest,
              'line_count': len(lines),
              'raw_export_header': raw_header,
              'parsed_compact_layout': compact_header,
              'parsed_coordinate_rows': len(coords),
              'unique_parsed_names': len({name for name, _, _ in coords}),
              'duplicate_names': len(coords) - len({name for name, _, _ in coords}),
              'duplicate_coordinates': len(coords) - len({(lat, lon) for _, lat, lon in coords}),
              'coordinate_bounds': {
                  'lat_min': min(row[1] for row in coords),
                  'lat_max': max(row[1] for row in coords),
                  'lon_min': min(row[2] for row in coords),
                  'lon_max': max(row[2] for row in coords),
              },
              'demographic_response_values_used': False,
          }
          pathlib.Path('build/collared_gate0/gps_result.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          pathlib.Path('build/collared_gate0/Peck_Glade_GPS_Waypoints.txt').write_bytes(path.read_bytes())
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Inspect Figshare demographic supplement header only
        run: |
          python - <<'PY'
          import json
          import pathlib

          root = pathlib.Path('/tmp/collared_figshare')
          manifest = json.loads(pathlib.Path('build/collared_gate0/figshare_manifest.json').read_text(encoding='utf-8'))
          target_row = next((row for row in manifest if row['name'] == 'Individual_Glade_Sizes.txt'), None)
          if target_row is None:
              raise SystemExit('Individual_Glade_Sizes.txt missing from Figshare collection')
          path = root / target_row['local_name']
          with path.open('rb') as handle:
              first = handle.readline().decode('utf-8-sig', errors='replace').rstrip('\r\n')
          payload = {
              'file': 'Individual_Glade_Sizes.txt',
              'size': path.stat().st_size,
              'sha256': target_row['sha256'],
              'header_line_only': first,
              'data_rows_read': False,
              'publisher_description': target_row['article_title'],
          }
          pathlib.Path('build/collared_gate0/figshare_demographic_header.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: One-shot Dryad main-workbook transport and header inspection
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import zipfile

          import openpyxl

          url = 'https://datadryad.org/downloads/file_stream/4096501'
          path = pathlib.Path('/tmp/Peck_Ranch_Collared_Lizard_Data.xlsx')
          curl = subprocess.run(
              ['curl', '-L', '-sS', '--max-time', '90', '-w', '%{http_code}', url, '-o', str(path)],
              text=True,
              capture_output=True,
          )
          http_code = curl.stdout.strip()[-3:] if curl.stdout.strip() else None
          result = {
              'file': 'Peck_Ranch_Collared_Lizard_Data.xlsx',
              'url': url,
              'curl_returncode': curl.returncode,
              'http_code': http_code,
              'transport_ok': False,
              'is_xlsx_zip': False,
              'size': path.stat().st_size if path.exists() else 0,
              'sha256': None,
              'workbook': None,
              'data_rows_read': False,
              'transport_stop_reason': None,
          }

          if path.exists() and path.stat().st_size:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              result['sha256'] = digest
              try:
                  result['is_xlsx_zip'] = zipfile.is_zipfile(path)
              except Exception:
                  result['is_xlsx_zip'] = False

          if curl.returncode == 0 and http_code == '200' and result['is_xlsx_zip']:
              try:
                  wb = openpyxl.load_workbook(path, read_only=True, data_only=False)
                  sheets = []
                  for ws in wb.worksheets:
                      first = next(ws.iter_rows(min_row=1, max_row=1, values_only=True), ())
                      sheets.append({
                          'title': ws.title,
                          'max_row_reported': ws.max_row,
                          'max_column_reported': ws.max_column,
                          'header_row_only': [None if value is None else str(value) for value in first],
                      })
                  result['workbook'] = sheets
                  result['transport_ok'] = True
              except Exception as exc:
                  result['transport_stop_reason'] = f'xlsx_container_open_failed:{type(exc).__name__}'
          else:
              prefix = b''
              if path.exists():
                  with path.open('rb') as handle:
                      prefix = handle.read(120)
              preview = prefix.decode('utf-8', errors='replace').replace('\n', ' ').replace('\r', ' ')
              result['transport_stop_reason'] = (
                  f'public_file_stream_not_reproducible:http={http_code};returncode={curl.returncode};'
                  f'zip={result["is_xlsx_zip"]};prefix={preview[:100]}'
              )

          pathlib.Path('build/collared_gate0/dryad_main_workbook_transport.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Record Gate 0 technical summary and enforce response firewall
        run: |
          python - <<'PY'
          import json
          import pathlib

          gps = json.loads(pathlib.Path('build/collared_gate0/gps_result.json').read_text(encoding='utf-8'))
          fig = json.loads(pathlib.Path('build/collared_gate0/figshare_demographic_header.json').read_text(encoding='utf-8'))
          dryad = json.loads(pathlib.Path('build/collared_gate0/dryad_main_workbook_transport.json').read_text(encoding='utf-8'))
          summary = {
              'status': 'gate0_technical_sources_complete' if dryad['transport_ok'] else 'gate0_stop_main_response_source_transport_blocked',
              'demographic_response_rows_opened': False,
              'gps_coordinate_rows': gps['parsed_coordinate_rows'],
              'gps_unique_names': gps['unique_parsed_names'],
              'figshare_demographic_header_only': fig['header_line_only'],
              'figshare_demographic_rows_read': False,
              'dryad_main_workbook_transport_ok': dryad['transport_ok'],
              'dryad_main_workbook_header_only': None if not dryad['transport_ok'] else dryad['workbook'],
              'scientific_response_semantics_not_yet_adjudicated': True,
          }
          pathlib.Path('build/collared_gate0/gate0_technical_summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          find build/collared_gate0 -maxdepth 1 -type f -print
          test -s build/collared_gate0/figshare_manifest.json
          test -s build/collared_gate0/gps_result.json
          test -s build/collared_gate0/figshare_demographic_header.json
          test -s build/collared_gate0/dryad_main_workbook_transport.json
          test -s build/collared_gate0/gate0_technical_summary.json
          rm -rf /tmp/collared_figshare /tmp/collection_articles.json /tmp/Peck_Ranch_Collared_Lizard_Data.xlsx

      - name: Upload Gate 0 metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collared-lizard-two-layer-gate0
          path: build/collared_gate0
          if-no-files-found: warn
