name: Giant kelp response system metadata

on:
  push:
    branches:
      - agent/giant-kelp-preflight
    paths:
      - ".github/workflows/giant_kelp_response_sysmeta.yml"
      - "validation/giant_kelp_complementarity/response_object_contract.json"
  pull_request:
    paths:
      - ".github/workflows/giant_kelp_response_sysmeta.yml"
      - "validation/giant_kelp_complementarity/response_object_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sysmeta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve response system metadata and EML domains only
        run: |
          set -euo pipefail
          mkdir -p build/giant_kelp_response_sysmeta
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path

          ROOT=Path('validation/giant_kelp_complementarity')
          OUT=Path('build/giant_kelp_response_sysmeta')
          contract=json.loads((ROOT/'response_object_contract.json').read_text(encoding='utf-8'))
          ent=contract['response_entity']; pid=ent['data_pid']; metadata_pid=contract['metadata_pid']
          UA='eog-giant-kelp-response-sysmeta/1.0'
          fetched=[]

          def get(url,accept):
              if not url.startswith('https://cn.dataone.org/cn/v2/'):
                  raise RuntimeError(f'non-DataONE-CN endpoint blocked: {url!r}')
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':accept})
              with urllib.request.urlopen(req,timeout=60) as r:
                  body=r.read(); status=getattr(r,'status',None) or r.getcode(); ctype=str(r.headers.get('Content-Type','')); final=str(r.geturl())
              fetched.append({'requested':url,'final':final,'status':status,'bytes':len(body),'content_type':ctype,'sha256':hashlib.sha256(body).hexdigest()})
              return body

          encoded=urllib.parse.quote(pid,safe='')
          meta_bytes=get(f'https://cn.dataone.org/cn/v2/meta/{encoded}','application/xml,text/xml,*/*')
          sysroot=ET.fromstring(meta_bytes)
          def lname(tag): return tag.rsplit('}',1)[-1]
          def first_text(root,name):
              for node in root.iter():
                  if lname(node.tag)==name:
                      return ' '.join(''.join(node.itertext()).split())
              return ''
          identifier=first_text(sysroot,'identifier'); format_id=first_text(sysroot,'formatId'); size_text=first_text(sysroot,'size')
          checksum_node=next((n for n in sysroot.iter() if lname(n.tag)=='checksum'),None)
          checksum=' '.join(''.join(checksum_node.itertext()).split()) if checksum_node is not None else ''
          checksum_algorithm=str(checksum_node.attrib.get('algorithm','')) if checksum_node is not None else ''
          if identifier!=pid: raise RuntimeError(f'response sysmeta identifier mismatch: {identifier!r}')
          if not size_text.isdigit() or int(size_text)<=0: raise RuntimeError(f'invalid response object size: {size_text!r}')
          if not checksum or not checksum_algorithm: raise RuntimeError('response sysmeta lacks checksum')
          chk_bytes=get(f'https://cn.dataone.org/cn/v2/checksum/{encoded}','application/xml,text/xml,*/*')
          chk_root=ET.fromstring(chk_bytes); chk=' '.join(''.join(chk_root.itertext()).split()); chk_alg=str(chk_root.attrib.get('algorithm',''))
          if chk!=checksum or chk_alg.casefold()!=checksum_algorithm.casefold(): raise RuntimeError('response checksum endpoint disagrees with sysmeta')

          metadata_encoded=urllib.parse.quote(metadata_pid,safe='')
          eml_bytes=get(f'https://cn.dataone.org/cn/v2/object/{metadata_encoded}','application/xml,text/xml,*/*')
          if hashlib.sha256(eml_bytes).hexdigest()!=contract['metadata_sha256']:
              raise RuntimeError('response EML metadata identity drift')
          eml=ET.fromstring(eml_bytes)
          def desc(node,target):
              for child in node.iter():
                  if lname(child.tag)==target:
                      return ' '.join(''.join(child.itertext()).split())
              return ''
          domains={}
          for attr in eml.iter():
              if lname(attr.tag)!='attribute': continue
              name=desc(attr,'attributeName')
              if name not in ent['required_columns']: continue
              missing=[]
              for mvc in attr.iter():
                  if lname(mvc.tag)=='code' and any(lname(a.tag)=='missingValueCode' for a in attr.iter() if a is not mvc):
                      pass
              for mvc in attr.iter():
                  if lname(mvc.tag)!='missingValueCode': continue
                  code=desc(mvc,'code') or ' '.join(''.join(mvc.itertext()).split())
                  if code: missing.append(code)
              enum=[]
              for code_def in attr.iter():
                  if lname(code_def.tag)!='codeDefinition': continue
                  code=desc(code_def,'code'); definition=desc(code_def,'definition')
                  if code: enum.append({'code':code,'definition':definition})
              bounds=[]
              for node in attr.iter():
                  if lname(node.tag) in {'minimum','maximum'}:
                      bounds.append({'kind':lname(node.tag),'value':' '.join(''.join(node.itertext()).split()),'exclusive':str(node.attrib.get('exclusive',''))})
              storage=desc(attr,'numberType') or desc(attr,'storageType')
              domains[name]={'missing_value_codes':sorted(set(missing)),'enumerated_codes':enum,'bounds':bounds,'numeric_type':storage,'definition':desc(attr,'attributeDefinition'),'unit':desc(attr,'standardUnit') or desc(attr,'customUnit')}
          if set(domains)!=set(ent['required_columns']):
              raise RuntimeError(f'EML domain coverage mismatch: {sorted(domains)}')

          payload={
              'status':'response_system_metadata_frozen',
              'candidate':contract['candidate'],
              'data_pid':pid,
              'object_name':ent['object_name'],
              'identifier':identifier,
              'format_id':format_id,
              'size_bytes':int(size_text),
              'checksum':checksum,
              'checksum_algorithm':checksum_algorithm,
              'system_metadata_sha256':hashlib.sha256(meta_bytes).hexdigest(),
              'metadata_sha256':hashlib.sha256(eml_bytes).hexdigest(),
              'field_domains':domains,
              'parser_semantics':contract['parser_semantics'],
              'period_order':contract['period_order'],
              'transition_split':contract['transition_split'],
              'endpoint':contract['endpoint'],
              'response_object_bytes_opened':False,
              'response_rows_opened':False,
              'network_fetches':fetched,
              'next':'bind explicit metadata missing codes into parser contract; then freeze process-source input, Layer A/B, paired learner and count gate before response rows',
          }
          payload['fingerprint']=hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          (OUT/'response_sysmeta_result.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - name: Assert row firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('build/giant_kelp_response_sysmeta/response_sysmeta_result.json'))
          assert p['status']=='response_system_metadata_frozen'
          assert p['response_object_bytes_opened'] is False
          assert p['response_rows_opened'] is False
          PY
      - name: Upload response system metadata
        uses: actions/upload-artifact@v4
        with:
          name: giant-kelp-response-sysmeta
          path: build/giant_kelp_response_sysmeta/response_sysmeta_result.json
          if-no-files-found: error
