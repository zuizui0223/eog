name: India tiger two-layer Gate 0 workbook inventory

on:
  pull_request:
    paths:
      - ".github/workflows/tiger_gate0_xlsx_inventory.yml"
      - "benchmarks/run_tiger_gate0_xlsx_inventory.py"
      - "benchmarks/run_tiger_gate0_inventory_entry.py"
      - "validation/tiger_two_layer/gate0_source_process_response_contract.json"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch and verify exact Zenodo workbook
        run: |
          curl -L --fail --retry 3 \
            'https://zenodo.org/records/13856111/files/data28sep24.xlsx?download=1' \
            -o /tmp/data28sep24.xlsx
          test "$(md5sum /tmp/data28sep24.xlsx | awk '{print $1}')" = "ac4fd29ab1f7ea1045ac279885c72a11"
          sha256sum /tmp/data28sep24.xlsx
      - name: Run bounded XLSX metadata and first-row inventory
        run: |
          python benchmarks/run_tiger_gate0_inventory_entry.py \
            --workbook /tmp/data28sep24.xlsx \
            --output-dir build/tiger_gate0
      - name: Assert response firewall and terminal inventory result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('build/tiger_gate0/gate0_inventory_result.json')
          assert path.is_file() and path.stat().st_size > 0
          result = json.loads(path.read_text())
          assert result['response_rows_opened'] is False
          assert result['response_values_parsed'] is False
          assert result['rows_after_first_logical_row_opened'] is False
          assert result['general_workbook_library_used'] is False
          assert result['status'] in {
              'gate0_inventory_pass_pending_sheet_role_adjudication',
              'gate0_stop_response_inseparable_geometry',
              'gate0_stop_unresolved_workbook_headers',
              'gate0_stop_no_plausible_response_free_grid_geometry',
          }
          print(result['status'])
          print(result['fingerprint'])
          PY
      - name: Remove exact source bytes
        if: always()
        run: rm -f /tmp/data28sep24.xlsx
      - name: Upload immutable Gate 0 inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiger-two-layer-gate0-inventory
          path: build/tiger_gate0
          if-no-files-found: error
