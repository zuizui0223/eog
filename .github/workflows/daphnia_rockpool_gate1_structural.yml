name: Daphnia rock-pool Gate 1 structural

on:
  push:
    branches:
      - agent/daphnia-rockpool-gate0-screen
    paths:
      - ".github/workflows/daphnia_rockpool_gate1_structural.yml"
      - "validation/daphnia_rockpool_two_layer/run_gate1_structural.py"
      - "validation/daphnia_rockpool_two_layer/gate1_scale_adequacy_declaration.json"
      - "validation/daphnia_rockpool_two_layer/gate0_geometry_contract.json"
  pull_request:
    paths:
      - ".github/workflows/daphnia_rockpool_gate1_structural.yml"
      - "validation/daphnia_rockpool_two_layer/run_gate1_structural.py"
      - "validation/daphnia_rockpool_two_layer/gate1_scale_adequacy_declaration.json"
      - "validation/daphnia_rockpool_two_layer/gate0_geometry_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install EOG package
        run: python -m pip install .
      - name: Build response-blind structural ladder from frozen distance member
        run: python validation/daphnia_rockpool_two_layer/run_gate1_structural.py
      - name: Assert response firewall
        if: success()
        run: |
          python - <<'PY'
          import json
          p=json.load(open('build/daphnia_rockpool_gate1/gate1_result.json'))
          assert p['response_rows_opened'] is False
          assert p['response_member_bytes_downloaded'] is False
          assert p['final_gate_pass'] is True
          PY
      - name: Upload Gate 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daphnia-rockpool-gate1-structural
          path: build/daphnia_rockpool_gate1/gate1_result.json
          if-no-files-found: error
