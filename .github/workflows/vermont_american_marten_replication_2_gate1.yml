name: Vermont American marten replication 2 Gate1

on:
  push:
    branches:
      - agent/vermont-american-marten-replication-2
    paths:
      - validation/vermont_american_marten_replication_2/gate0_metadata_certificate.json
      - validation/vermont_american_marten_replication_2/gate1_response_independent_profile.py
      - .github/workflows/vermont_american_marten_replication_2_gate1.yml

permissions:
  contents: read

jobs:
  gate1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Gate1
        run: python -m py_compile validation/vermont_american_marten_replication_2/gate1_response_independent_profile.py
      - name: Run label-free source profile
        id: gate
        continue-on-error: true
        run: python validation/vermont_american_marten_replication_2/gate1_response_independent_profile.py
      - name: Assert biological response firewall
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/vermont_american_marten_replication_2/gate1_response_independent_profile.json')
          assert p.exists(), 'Gate1 evidence missing'
          r=json.loads(p.read_text())
          a=r['biological_response_firewall']
          assert a['response_payload_requests']==0
          assert a['response_payload_bytes_opened']==0
          assert a['response_headers_opened'] is False
          assert a['response_rows_opened'] is False
          assert a['response_values_opened'] is False
          assert a['model_fits']==0 and a['heldout_scores']==0
          print(json.dumps({'status':r['status'],'fingerprint':r.get('fingerprint'),'file_rows':{k:v.get('row_count') for k,v in r.get('files',{}).items()},'marten_lookup_matches':r.get('marten_lookup_matches',{}),'response_firewall':a},indent=2,sort_keys=True))
          PY
      - name: Upload Gate1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vermont-american-marten-replication-2-gate1
          path: build/vermont_american_marten_replication_2/gate1_response_independent_profile.json
          if-no-files-found: error
      - name: Propagate engineering failure only
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/vermont_american_marten_replication_2/gate1_response_independent_profile.json').read_text())
          if r['status'].startswith('engineering_failure'):
              raise SystemExit(r['reason'])
          print('Gate1 status:',r['status'])
          PY
