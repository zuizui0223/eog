name: Cuban Treefrog acoustic replication 2 Gate0

on:
  push:
    branches:
      - agent/cuban-treefrog-acoustic-replication-2
    paths:
      - validation/cuban_treefrog_acoustic_replication_2/**
      - .github/workflows/cuban_treefrog_acoustic_replication_2_gate0.yml

permissions:
  contents: read

jobs:
  gate0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile response-free Gate0
        run: python -m py_compile validation/cuban_treefrog_acoustic_replication_2/gate0_response_free_profile.py
      - name: Run response-free profile
        id: gate
        continue-on-error: true
        run: python validation/cuban_treefrog_acoustic_replication_2/gate0_response_free_profile.py
      - name: Assert response firewall
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/cuban_treefrog_acoustic_replication_2/gate0_response_free_profile.json')
          assert p.exists(), 'Gate0 evidence missing'
          r=json.loads(p.read_text())
          a=r['response_firewall']
          assert a['media_payload_requests']==0
          assert a['media_payload_bytes_opened']==0
          assert a['annotations_payload_requests']==0
          assert a['annotations_payload_bytes_opened']==0
          assert a['modeloutputs_payload_requests']==0
          assert a['modeloutputs_payload_bytes_opened']==0
          assert a['other_response_payload_requests']==0
          assert a['other_response_payload_bytes_opened']==0
          assert a['response_headers_opened'] is False
          assert a['response_rows_opened'] is False
          assert a['response_values_opened'] is False
          assert a['model_fits']==0 and a['heldout_scores']==0
          print(json.dumps({'status':r['status'],'fingerprint':r.get('fingerprint'),'files':r.get('files',{}),'response_firewall':a},indent=2,sort_keys=True))
          PY
      - name: Upload Gate0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuban-treefrog-acoustic-replication-2-gate0
          path: build/cuban_treefrog_acoustic_replication_2/gate0_response_free_profile.json
          if-no-files-found: error
      - name: Propagate engineering failure only
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/cuban_treefrog_acoustic_replication_2/gate0_response_free_profile.json').read_text())
          if r['status'].startswith('engineering_failure'):
              raise SystemExit(r['reason'])
          print('Gate0 status:', r['status'])
          PY
