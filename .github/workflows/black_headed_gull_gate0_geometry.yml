name: Black-headed gull Gate 0 response-free pond universe

on:
  pull_request:
    paths:
      - ".github/workflows/black_headed_gull_gate0_geometry.yml"
      - "validation/black_headed_gull_two_layer/gate0_source_process_response_contract.json"

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch exact frozen Zenodo archive
        run: |
          mkdir -p build/gull_gate0_geometry
          curl -L --fail --retry 3 \
            'https://zenodo.org/records/18300536/files/gregory_et_al_2025-neighbouring_patches_ssp_dynamics.zip?download=1' \
            -o /tmp/gull.zip
          test "$(stat -c%s /tmp/gull.zip)" = "8924195"
          test "$(md5sum /tmp/gull.zip | awk '{print $1}')" = "4d7dfc93cb0129bd44a5be6250f56dcb"
          sha256sum /tmp/gull.zip > build/gull_gate0_geometry/archive_sha256.txt

      - name: Parse only declared response-free distance and water members
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import math
          import pathlib
          import zipfile
          from collections import Counter

          archive = pathlib.Path('/tmp/gull.zip')
          prefix = 'gregory_et_al_2025-neighbouring_patches_ssp_dynamics/'
          distance_member = prefix + 'data/data-distance_between_patches.csv'
          water_member = prefix + 'data/data-water.csv'
          metadata_members = [
              prefix + 'data/metadata-distance_between_patches.txt',
              prefix + 'data/metadata-water.txt',
              prefix + 'data/metadata-occupancy_numbers.txt',
              prefix + 'data/metadata-occupancy_success.txt',
          ]

          def normalized_text(data: bytes) -> str:
              return data.decode('utf-8-sig').replace('\r\n', '\n').replace('\r', '\n')

          with zipfile.ZipFile(archive) as zf:
              names = set(zf.namelist())
              for required in [distance_member, water_member, *metadata_members]:
                  if required not in names:
                      raise SystemExit(f'missing required member: {required}')

              distance_text = normalized_text(zf.read(distance_member))
              water_text = normalized_text(zf.read(water_member))
              for member in metadata_members:
                  target = pathlib.Path('build/gull_gate0_geometry') / pathlib.PurePosixPath(member).name
                  target.write_text(normalized_text(zf.read(member)), encoding='utf-8')

          # Pairwise geometry / coordinates are response-free by code contract.
          distance_reader = csv.DictReader(io.StringIO(distance_text, newline=''))
          expected_distance = ('patch.1','patch.2','long.1','lat.1','long.2','lat.2','distance.m')
          if tuple(distance_reader.fieldnames or ()) != expected_distance:
              raise SystemExit(f'distance schema mismatch: {distance_reader.fieldnames!r}')

          coords = {}
          unordered_pairs = set()
          directed_pairs = set()
          distance_rows = 0
          duplicate_directed_pairs = 0
          min_positive_distance = math.inf
          max_distance = 0.0

          def register(patch, x, y):
              value = (float(x), float(y))
              if patch in coords and coords[patch] != value:
                  raise SystemExit(f'inconsistent coordinates for patch {patch!r}')
              coords[patch] = value

          for row in distance_reader:
              p1 = str(row['patch.1']).strip()
              p2 = str(row['patch.2']).strip()
              if not p1 or not p2 or p1 == p2:
                  raise SystemExit('invalid pairwise patch IDs')
              register(p1, row['long.1'], row['lat.1'])
              register(p2, row['long.2'], row['lat.2'])
              distance = float(row['distance.m'])
              if not math.isfinite(distance) or distance <= 0:
                  raise SystemExit('pairwise distance must be finite and positive')
              distance_rows += 1
              directed = (p1, p2)
              if directed in directed_pairs:
                  duplicate_directed_pairs += 1
              directed_pairs.add(directed)
              unordered_pairs.add(tuple(sorted((p1, p2))))
              min_positive_distance = min(min_positive_distance, distance)
              max_distance = max(max_distance, distance)

          geometry_ids = set(coords)
          n_geometry = len(geometry_ids)
          complete_unordered = n_geometry * (n_geometry - 1) // 2
          pair_coverage = len(unordered_pairs) / complete_unordered if complete_unordered else 0.0

          # Annual water availability is response-free by model/code contract:
          # 0 = dry/unavailable, 1 = water/available for occupancy.
          water_reader = csv.reader(io.StringIO(water_text, newline=''))
          rows = list(water_reader)
          if len(rows) < 2:
              raise SystemExit('water table has no data rows')
          header = rows[0]
          years = header[1:]
          if years != [f'X{year}' for year in range(1976, 2020)]:
              raise SystemExit(f'unexpected water years: {years!r}')
          water_ids = []
          water_values = []
          for row in rows[1:]:
              if len(row) != len(header):
                  raise SystemExit('water row width mismatch')
              patch = row[0].strip()
              if not patch:
                  raise SystemExit('empty water-table patch ID')
              values = [int(value) for value in row[1:]]
              if any(value not in (0, 1) for value in values):
                  raise SystemExit('water availability must be binary 0/1')
              water_ids.append(patch)
              water_values.append(values)
          if len(set(water_ids)) != len(water_ids):
              raise SystemExit('duplicate water-table patch IDs')
          water_id_set = set(water_ids)

          geometry_only = sorted(geometry_ids - water_id_set)
          water_only = sorted(water_id_set - geometry_ids)
          available_counts = {
              str(year): sum(values[index] for values in water_values)
              for index, year in enumerate(range(1976, 2020))
          }
          dry_counts = {
              str(year): len(water_values) - available_counts[str(year)]
              for year in range(1976, 2020)
          }

          # Preserve canonical response-free geometry and availability only.
          with open('build/gull_gate0_geometry/pond_geometry.csv', 'w', encoding='utf-8', newline='') as handle:
              writer = csv.writer(handle)
              writer.writerow(['patch','x_epsg2154','y_epsg2154'])
              for patch in sorted(coords):
                  writer.writerow([patch, coords[patch][0], coords[patch][1]])
          with open('build/gull_gate0_geometry/pond_water_availability.csv', 'w', encoding='utf-8', newline='') as handle:
              writer = csv.writer(handle)
              writer.writerow(['patch', *[str(year) for year in range(1976, 2020)]])
              for patch, values in sorted(zip(water_ids, water_values), key=lambda row: row[0]):
                  writer.writerow([patch, *values])

          result = {
              'status': 'gate0_response_free_geometry_and_availability_parsed',
              'response_rows_opened': False,
              'geometry': {
                  'node_count': n_geometry,
                  'distance_rows': distance_rows,
                  'unique_directed_pairs': len(directed_pairs),
                  'duplicate_directed_pairs': duplicate_directed_pairs,
                  'unique_unordered_pairs': len(unordered_pairs),
                  'complete_unordered_pair_count': complete_unordered,
                  'unordered_pair_coverage': pair_coverage,
                  'min_positive_distance_m': min_positive_distance,
                  'max_distance_m': max_distance,
                  'x_min': min(x for x, _ in coords.values()),
                  'x_max': max(x for x, _ in coords.values()),
                  'y_min': min(y for _, y in coords.values()),
                  'y_max': max(y for _, y in coords.values()),
              },
              'water_availability': {
                  'node_count': len(water_ids),
                  'year_count': len(years),
                  'years': list(range(1976, 2020)),
                  'geometry_only_node_count': len(geometry_only),
                  'water_only_node_count': len(water_only),
                  'geometry_only_node_ids': geometry_only,
                  'water_only_node_ids': water_only,
                  'available_pond_count_by_year': available_counts,
                  'dry_pond_count_by_year': dry_counts,
              },
              'node_universe_diagnostic': {
                  'public_ever_occupied_count_known_before_gate0': 95,
                  'geometry_equals_known_ever_occupied_count': n_geometry == 95,
                  'water_table_equals_known_ever_occupied_count': len(water_ids) == 95,
                  'geometry_includes_more_than_ever_occupied': n_geometry > 95,
                  'water_table_includes_more_than_ever_occupied': len(water_ids) > 95,
              },
          }
          pathlib.Path('build/gull_gate0_geometry/gate0_geometry_result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Apply predeclared node-universe Gate 0 rule
        run: |
          python - <<'PY'
          import json
          import pathlib

          result = json.loads(pathlib.Path('build/gull_gate0_geometry/gate0_geometry_result.json').read_text(encoding='utf-8'))
          node = result['node_universe_diagnostic']
          geometry = result['geometry']
          water = result['water_availability']

          pass_node_universe = (
              node['geometry_includes_more_than_ever_occupied']
              and node['water_table_includes_more_than_ever_occupied']
              and geometry['unordered_pair_coverage'] >= 0.999999
              and water['water_only_node_count'] == 0
          )
          gate = {
              'status': 'gate0_node_universe_pass' if pass_node_universe else 'gate0_stop_response_conditioned_or_incomplete_node_universe',
              'response_rows_opened': False,
              'pass_node_universe': pass_node_universe,
              'geometry_node_count': geometry['node_count'],
              'water_node_count': water['node_count'],
              'known_ever_occupied_count': 95,
              'pairwise_geometry_complete': geometry['unordered_pair_coverage'] >= 0.999999,
              'interpretation': (
                  'Pond universe extends beyond the known ever-occupied set and has annual non-response water availability.'
                  if pass_node_universe else
                  'The archived node/availability universe does not independently extend beyond the known ever-occupied set or is incomplete; stop before colony-response access rather than condition the benchmark on future occupancy.'
              ),
          }
          pathlib.Path('build/gull_gate0_geometry/gate0_node_universe_gate.json').write_text(
              json.dumps(gate, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(gate, indent=2, sort_keys=True))
          if not pass_node_universe:
              raise SystemExit(2)
          PY

      - name: Upload response-free Gate 0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-headed-gull-gate0-geometry
          path: build/gull_gate0_geometry
          if-no-files-found: warn
