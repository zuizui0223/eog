name: BAM nonzero direction posthoc audit v1
on:
  pull_request:
    paths:
      - 'benchmarks/audit_bam_nonzero_direction_v1.py'
      - 'tests/test_bam_nonzero_direction_v1.py'
      - 'docs/bam_nonzero_direction_posthoc_v1.md'
      - '.github/workflows/bam-nonzero-direction-audit-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-pinned-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify original generator and unit tests
        run: |
          test "$(git hash-object src/eog/v2/known_truth_bam_generality.py)" = ab852b02bccdfb2f065717f89b482b7cf15778d3
          python -m pytest -q tests/test_bam_geometry_response_envelopes_v1.py tests/test_bam_nonzero_direction_v1.py
      - name: Regenerate parent canonical data without new scoring choices
        run: |
          python benchmarks/bam_geometry_response_envelopes_v1.py --output-dir /tmp/original_bam_response
      - name: Confirm immutable archive hashes and stratify nonzero responses
        run: |
          python benchmarks/audit_bam_nonzero_direction_v1.py \
            --source-dir /tmp/original_bam_response \
            --output /tmp/bam_nonzero_posthoc/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: bam-nonzero-span-posthoc-v1
          path: /tmp/bam_nonzero_posthoc/result.json
