name: Helgeland historic Dryad versions metadata only

on:
  pull_request:
    paths:
      - '.github/workflows/helgeland-historical-vintages-v1.yml'
      - 'scripts/audit_helgeland_historical_dryad_vintages_v1.py'
      - 'tests/test_helgeland_historical_dryad_vintages_v1.py'
      - 'docs/eog_helgeland_historical_public_vintages_v1.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/helgeland-historical-vintages-v1.yml'
      - 'scripts/audit_helgeland_historical_dryad_vintages_v1.py'
      - 'tests/test_helgeland_historical_dryad_vintages_v1.py'
      - 'docs/eog_helgeland_historical_public_vintages_v1.md'

permissions:
  contents: read

jobs:
  public-json-vintage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Prove no future publication can enter historical version selection
        run: python -m pytest -q tests/test_helgeland_historical_dryad_vintages_v1.py
      - name: Retrieve only official historic public versions and their registered file metadata
        run: |
          python scripts/audit_helgeland_historical_dryad_vintages_v1.py \
            --output build/helgeland-historical-dryad-vintages-v1.json
      - name: Assert complete 2014/2020 metadata without opening records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('build/helgeland-historical-dryad-vintages-v1.json').read_text())
          assert x['schema']=='eog.helgeland.historical_dryad_version_metadata.v1'
          assert x['status']=='BOTH_HISTORICAL_PUBLIC_METADATA_VINTAGES_IDENTIFIED'
          assert x['individual_bird_rows_read'] is False
          assert x['actual_biological_file_bytes_read'] is False
          assert x['historically_frozen_model_or_forecast_qualified'] is False
          assert x['ecological_scoring_authorized'] is False
          for label,maxyear in [('baalsrud_2014',2014),('niskanen_2020',2020)]:
              d=x['datasets'][label]
              assert d['selected']['published_date'][:4]<=str(maxyear)
              assert d['file_count']==len(d['files'])
              assert all(f['independently_hashed_bytes'] is False
                         and f['biological_rows_read'] is False for f in d['files'])
              assert d['island_code_and_calendar_crosswalk_verified'] is False
              assert d['surveyed_zero_observation_verified'] is False
              assert d['ecological_endpoint_authorized'] is False
          assert any(v['published_date'][:4]>'2020'
                     for v in x['datasets']['niskanen_2020']['versions_after_cutoff_not_eligible'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HELGELAND-2014-2020-HISTORICAL-DRYAD-JSON-NO-BIRD-ROWS-v1
          path: build/helgeland-historical-dryad-vintages-v1.json
          if-no-files-found: warn
