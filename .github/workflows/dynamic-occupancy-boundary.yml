name: Dynamic occupancy reference boundary

on:
  pull_request:
    paths:
      - "benchmarks/dynamic_occupancy_reference_boundary.py"
      - "docs/eog_v2_dynamic_occupancy_boundary.md"
      - "src/eog/dynamic_island_reachability.py"
      - ".github/workflows/dynamic-occupancy-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run dynamic occupancy boundary
        run: |
          mkdir -p benchmark_results/dynamic_occupancy_boundary
          python benchmarks/dynamic_occupancy_reference_boundary.py \
            > benchmark_results/dynamic_occupancy_boundary/result.json
      - name: Check boundary contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("benchmark_results/dynamic_occupancy_boundary/result.json").read_text()
          )
          assert result["status"] == "development-dynamic-occupancy-reference-boundary"
          assert result["seeds"] == [101, 211, 307, 401, 503, 601, 701, 809]
          assert result["decision"]["passed"] is True
          assert all(
              check["passed"] for check in result["decision"]["checks"].values()
          )
          assert (
              result["mean_models"]["dynamic_occupancy"]["mean_log_loss"]
              < result["mean_models"]["state_environment_eog"]["mean_log_loss"]
          )
          PY
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-occupancy-reference-boundary
          path: benchmark_results/dynamic_occupancy_boundary
          if-no-files-found: error
