name: Finalize source-to-result audit Figure 5

on:
  push:
    branches:
      - agent/structural-figure5-audit
    paths:
      - ".github/workflows/finalize-figure5-audit.yml"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  finalize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structural-figure5-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build Figure 5 audit trail
        run: |
          python -m py_compile figures/build_figure_5_audit.py
          python figures/build_figure_5_audit.py
      - name: Verify Figure 5 audit contracts
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_structural_figure_5.py
      - name: Mark Figure 5 gate complete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("manuscript/structural_submission_checklist.md")
          text = p.read_text(encoding="utf-8")
          old = "- [ ] Figure 5 or supplement: source-to-result audit trail and fingerprints."
          new = "- [x] Figure 5 or supplement: source-to-result audit trail and fingerprints."
          if text.count(old) != 1:
              raise SystemExit("Figure 5 checklist line not found exactly once")
          p.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Remove temporary finalizer and commit
        run: |
          git rm .github/workflows/finalize-figure5-audit.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build source-to-result audit Figure 5"
          git push origin HEAD:agent/structural-figure5-audit
