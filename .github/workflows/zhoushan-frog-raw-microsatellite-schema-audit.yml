name: Zhoushan frog raw microsatellite post-freeze schema audit

on:
  pull_request:
    paths:
      - ".github/workflows/zhoushan-frog-raw-microsatellite-schema-audit.yml"
      - "benchmarks/zhoushan_frog_raw_microsatellite_schema_audit.py"
      - "docs/eog_v2_zhoushan_frog_pre_genetic_contract.md"
      - "benchmarks/frozen/zhoushan_frog_response_free/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify immutable pre-response predictor artifact and fallback contract
        run: |
          echo "a540a3d2ec6dd9b74a2ed80bc040d649cb179ec89e0e60ad87f3e529e96cf6f5  benchmarks/frozen/zhoushan_frog_response_free/populations.csv" | sha256sum --check
          echo "dd14cacf10ce39442977b6b68ae7fc45ced7ae78e458e4feb8338fadd138d7d9  benchmarks/frozen/zhoushan_frog_response_free/predictors.csv" | sha256sum --check
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('benchmarks/frozen/zhoushan_frog_response_free/predictor_manifest.json').read_text())
          assert m['predictor_manifest_fingerprint']=='e0a18112d9adfd197958b3e0e1cd1043485055425371b073f2cb74ad917ead70'
          assert m['operator_fingerprint']=='242d251353d1180d9a39a8698969246264e65a3ba9b6ad3c0a5a3fc3259369df'
          assert m['connectivity_fingerprint']=='2822fbd07b22d4a6f77123077f49f660e99a9641da6cecbf44203b45b5ffefb9'
          text=Path('docs/eog_v2_zhoushan_frog_pre_genetic_contract.md').read_text()
          assert 'predeclared raw-genotype fallback' in text
          assert 'Weir & Cockerham (1984)' in text
          assert 'No response-model or graph setting changes' in text
          PY
      - name: Install xls reader
        run: python -m pip install "xlrd==2.0.2"
      - name: Download released raw microsatellite workbook after fallback freeze
        run: |
          mkdir -p benchmark_results/zhoushan_raw_microsatellite
          curl --fail --location --retry 4 --retry-delay 3 \
            --user-agent "Mozilla/5.0 EOG-v2-post-freeze-genotype-schema/1.0" \
            "https://zenodo.org/records/5012316/files/Microsatellite%20data.xls?download=1" \
            --output benchmark_results/zhoushan_raw_microsatellite/Microsatellite_data.xls
          test -s benchmark_results/zhoushan_raw_microsatellite/Microsatellite_data.xls
          echo "0f9d9b36bb0c481f41170ad2d6cc6344  benchmark_results/zhoushan_raw_microsatellite/Microsatellite_data.xls" | md5sum --check
          sha256sum benchmark_results/zhoushan_raw_microsatellite/Microsatellite_data.xls \
            > benchmark_results/zhoushan_raw_microsatellite/raw_sha256.txt
      - name: Audit schema only without FST
        run: |
          python benchmarks/zhoushan_frog_raw_microsatellite_schema_audit.py \
            --input benchmark_results/zhoushan_raw_microsatellite/Microsatellite_data.xls \
            --output benchmark_results/zhoushan_raw_microsatellite/schema_audit.json \
            > benchmark_results/zhoushan_raw_microsatellite/stdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmark_results/zhoushan_raw_microsatellite/schema_audit.json').read_text())
          assert r['status']=='zhoushan-frog-raw-microsatellite-post-freeze-schema-audit'
          assert r['raw_md5']=='0f9d9b36bb0c481f41170ad2d6cc6344'
          assert r['stage2_predictors_frozen_before_access'] is True
          assert r['pairwise_fst_computed'] is False
          assert r['allele_frequencies_computed'] is False
          assert r['clustering_computed'] is False
          assert r['migration_computed'] is False
          assert len(r['raw_sha256'])==64
          PY
      - name: Remove raw genotype workbook before artifact upload
        if: always()
        run: rm -f benchmark_results/zhoushan_raw_microsatellite/Microsatellite_data.xls
      - name: Upload provenance and schema audit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhoushan-frog-raw-microsatellite-post-freeze-schema-audit
          path: |
            benchmark_results/zhoushan_raw_microsatellite/schema_audit.json
            benchmark_results/zhoushan_raw_microsatellite/stdout.json
            benchmark_results/zhoushan_raw_microsatellite/raw_sha256.txt
          if-no-files-found: warn
