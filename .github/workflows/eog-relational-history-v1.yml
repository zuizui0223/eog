name: EOG relational distributional history v1

on:
  pull_request:
    paths:
      - "src/eog/v2/distributional_history.py"
      - "src/eog/v2/reachability.py"
      - "tests/test_distributional_history.py"
      - "tests/test_v2_package_layout.py"
      - "validation/izu_microdonta_relational_genetics_v1/**"
      - "tests/test_izu_microdonta_genetic_gate0.py"
      - "docs/eog_distributional_history_mainline_v1.md"
      - ".github/workflows/eog-relational-history-v1.yml"
  workflow_dispatch:

concurrency:
  group: eog-relational-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test occurrence relational history
        run: python -m pytest tests/test_distributional_history.py tests/test_v2_package_layout.py -q
      - name: Test prospective Izu registry gate
        run: python -m pytest tests/test_izu_microdonta_genetic_gate0.py -q
