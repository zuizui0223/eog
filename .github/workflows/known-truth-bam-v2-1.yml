name: Known-truth BAM v2.1

on:
  pull_request:
    paths:
      - "src/eog/v2/known_truth_bam_v2_1.py"
      - "validation/known_truth_bam_v2_1/**"
      - "benchmarks/run_known_truth_bam_v2_1.py"
      - "tests/test_known_truth_bam_v2_1.py"
      - ".github/workflows/known-truth-bam-v2-1.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Run activation-gated BAM v2.1
        run: |
          python benchmarks/run_known_truth_bam_v2_1.py \
            --output build/known_truth_bam_v2_1/result_v2_1.json
      - name: Verify focused tests
        run: python -m pytest tests/test_known_truth_bam_v2_1.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: known-truth-bam-v2-1
          path: build/known_truth_bam_v2_1/result_v2_1.json
          if-no-files-found: error
