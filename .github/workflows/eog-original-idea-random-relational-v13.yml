name: Original EOG random relational sufficiency v13

on:
  pull_request:
    paths:
      - "validation/eog_original_idea_random_relational_v13/**"
      - "benchmarks/run_eog_original_idea_random_relational_v13.py"
      - "tests/test_eog_original_idea_random_relational_v13.py"
      - ".github/workflows/eog-original-idea-random-relational-v13.yml"
  workflow_dispatch:

concurrency:
  group: original-eog-random-relational-v13-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test exact relational sufficiency solver
        run: python -m pytest tests/test_eog_original_idea_random_relational_v13.py -q
      - name: Run frozen random relational benchmark
        run: |
          python benchmarks/run_eog_original_idea_random_relational_v13.py \
            --output build/eog_original_idea_random_relational_v13/result_v13.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-original-idea-random-relational-v13
          path: build/eog_original_idea_random_relational_v13/result_v13.json
          if-no-files-found: error
