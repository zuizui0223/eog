name: Replication 2 ScienceBase long-term metadata refine
on:
  push:
    branches:
      - agent/replication-2-sciencebase-camera-screen
    paths:
      - validation/replication_2_source_screen/sciencebase_longterm_refine.py
      - .github/workflows/replication_2_sciencebase_longterm_refine.yml
permissions:
  contents: read
jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile validation/replication_2_source_screen/sciencebase_longterm_refine.py
      - run: python validation/replication_2_source_screen/sciencebase_longterm_refine.py
      - name: Assert metadata only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/replication_2_source_screen/sciencebase_longterm_refine.json').read_text())
          assert r['file_payload_requests']==0 and r['file_payload_bytes_opened']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: replication-2-sciencebase-longterm-refine
          path: build/replication_2_source_screen/sciencebase_longterm_refine.json
          if-no-files-found: error
