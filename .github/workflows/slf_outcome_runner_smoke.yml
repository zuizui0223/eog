name: Spotted lanternfly pre-response outcome-runner smoke

on:
  pull_request:
    paths:
      - ".github/workflows/slf_outcome_runner_smoke.yml"
      - "benchmarks/run_slf_eogwf_once.py"
      - "validation/slf_two_layer/gate2_prediction_contract.json"
      - "validation/slf_two_layer/runtime_lock.txt"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen runtime and EOG
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/slf_two_layer/runtime_lock.txt
          python -m pip install . --no-deps
      - name: Compile frozen runner
        run: python -m py_compile benchmarks/run_slf_eogwf_once.py
      - name: Synthetic end-to-end helper smoke without response bytes
        run: |
          mkdir -p build/slf_smoke
          python - <<'PY'
          import importlib.util
          import json
          import pathlib
          import sys
          import numpy as np

          spec = importlib.util.spec_from_file_location('slf_runner', 'benchmarks/run_slf_eogwf_once.py')
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          n = 30
          node_ids = tuple(f'{i:05d}' for i in range(n))
          coords = np.column_stack([np.linspace(39.0, 41.0, n), np.linspace(-78.0, -75.0, n)])
          distance = np.abs(np.arange(n)[:, None] - np.arange(n)[None, :]).astype(float) * 20.0
          sources = np.array([0, 1, 2], dtype=int)
          supports = module.compute_world_supports(distance, sources)
          assert supports.shape == (5, n)
          assert np.all(np.isfinite(supports))
          assert np.all(supports >= 0)
          surviving = np.ones(5, dtype=bool)
          summary = module.make_layer_b_summary(node_ids, supports, surviving, transition_id='synthetic')
          assert summary.feature_matrix.shape == (n, 10)
          assert tuple(summary.feature_names) == tuple(module.PREDICTIVE_FEATURE_NAMES)
          baseline = module.shared_baseline(coords, distance, sources, 2017)
          assert baseline.shape == (n, 10)

          # Rule contraction smoke: a distant synthetic target must eliminate at least
          # one hard local world while the heavy-tail world remains possible.
          after, eliminated = module.update_rules(supports, surviving, np.array([29], dtype=int))
          assert 'human_heavy_tail_full' not in eliminated
          assert after[-1]
          assert len(eliminated) >= 1

          rng = np.random.default_rng(module.SEED)
          x = rng.normal(size=(400, 20))
          y = np.array([0, 1] * 200, dtype=int)
          fit = module.fit_logistic(x, y)
          p = fit.predict(x[:20])
          assert p.shape == (20,)
          assert np.all((p > 0) & (p < 1))
          rf_x = rng.normal(size=(400, 10))
          layer = rng.normal(size=(400, 10))
          rep = module.layer_b_estimability(rf_x, layer)
          assert rep['estimable'] is True
          score = module.metrics(y[:20], p)
          assert score['logloss'] >= 0

          payload = {
              'status': 'pre_response_runner_smoke_pass',
              'response_bytes_opened': False,
              'world_support_shape': list(supports.shape),
              'layer_b_shape': list(summary.feature_matrix.shape),
              'baseline_shape': list(baseline.shape),
              'synthetic_eliminated_worlds': list(eliminated),
              'heavy_tail_survived': bool(after[-1]),
              'representation_estimable': bool(rep['estimable']),
          }
          pathlib.Path('build/slf_smoke/smoke_result.json').write_text(json.dumps(payload, indent=2, sort_keys=True)+'\n')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - name: Upload pre-response smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: slf-pre-response-runner-smoke
          path: build/slf_smoke/smoke_result.json
