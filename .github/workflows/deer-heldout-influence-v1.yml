name: Deer heldout site influence audit v1
on:
  pull_request:
    paths:
      - "benchmarks/deer_heldout_influence_v1.py"
      - "tests/test_deer_heldout_influence_v1.py"
      - "validation/deer_heldout_influence_v1/**"
      - ".github/workflows/deer-heldout-influence-v1.yml"
permissions:
  contents: read
jobs:
  influence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_deer_heldout_influence_v1.py
      - name: Fetch pinned real source
        run: |
          mkdir -p /tmp/deer_influence
          curl --fail --location --retry 2 --max-time 50 --silent --show-error \
            https://raw.githubusercontent.com/BrentPease1/single-season-occupancy/f65b220d1c84240fa81cb457bf27522424fe1666/deer_detection_history.csv \
            -o /tmp/deer_influence/deer_detection_history.csv
          echo "bcfeb04683e572d0ded79fd40917a546188b4e2df64c043d9e1ea8720d524e34  /tmp/deer_influence/deer_detection_history.csv" | sha256sum -c -
      - name: Reproduce original heldout predictions and audit influence
        run: |
          python benchmarks/deer_heldout_influence_v1.py --source /tmp/deer_influence/deer_detection_history.csv --output /tmp/deer_influence/result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/deer_influence/result.json').read_text())
          assert r['sites']==87 and len(r['top_k_removal'])==4
          assert r['beta_site_wins']+r['constant_site_wins']==87
          assert abs(r['total_gain']-95.57045328909554)<1e-5
          print('REAL_DEER_INFLUENCE_VALIDATED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deer-heldout-influence-v1
          path: /tmp/deer_influence/result.json
