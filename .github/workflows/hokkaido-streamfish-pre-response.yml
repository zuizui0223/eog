name: Hokkaido streamfish endpoint3 pre-response geometry

on:
  pull_request:
    paths:
      - 'validation/hokkaido_streamfish_endpoint3/**'
      - 'tests/test_hokkaido_streamfish_pre_response_geometry.py'
      - '.github/workflows/hokkaido-streamfish-pre-response.yml'
  push:
    branches:
      - main
    paths:
      - 'validation/hokkaido_streamfish_endpoint3/**'
      - '.github/workflows/hokkaido-streamfish-pre-response.yml'

permissions:
  contents: read

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest
      - name: Verify Hokkaido geometry without external source data
        run: pytest -q tests/test_hokkaido_streamfish_pre_response_geometry.py
      - name: Compile pre-response modules
        run: |
          python -m py_compile \
            validation/hokkaido_streamfish_endpoint3/pre_response_geometry.py \
            validation/hokkaido_streamfish_endpoint3/run_pre_response_geometry.py
      - name: Verify frozen source and execution blobs
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path('validation/hokkaido_streamfish_endpoint3')
          auth = json.loads((root / 'pre_response_execution_authorization.json').read_text())
          assert auth['attempt_id'] == 'hokkaido_streamfish_endpoint3_v1'
          assert auth['issue'] == 364
          assert auth['authorized_external_gets'] == 2
          assert auth['response_table_requests_allowed'] == 0
          assert auth['response_table_bytes_allowed'] == 0
          assert auth['response_rows_allowed'] == 0
          assert auth['response_values_allowed'] is False
          assert auth['model_fits_allowed'] == 0
          assert auth['heldout_scores_allowed'] == 0
          bindings = {
              'source_contract_git_blob_sha': root / 'source_contract.json',
              'geometry_evaluator_git_blob_sha': root / 'pre_response_geometry.py',
              'live_runner_git_blob_sha': root / 'run_pre_response_geometry.py',
          }
          for key, path in bindings.items():
              observed = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
              assert observed == auth[key], (key, observed, auth[key])
          PY

  live-pre-response:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: synthetic-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute two-file response-blind source read once
        run: python -m validation.hokkaido_streamfish_endpoint3.run_pre_response_geometry
      - name: Audit response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('validation/hokkaido_streamfish_endpoint3/pre_response_geometry_certificate.json')
          r = json.loads(p.read_text())
          assert r['status'] in {
              'pre_response_geometry_ready',
              'stop_pre_response_source_registry_or_geometry',
          }
          assert r['authorized_external_gets'] == 2
          assert r['completed_external_gets'] <= 2
          assert r['nonresponse_source_bytes_opened'] <= 10734
          assert r['response_table_requests'] == 0
          assert r['response_table_bytes_opened'] == 0
          assert r['response_rows_opened'] == 0
          assert r['response_values_opened'] is False
          assert r['model_fits'] == 0
          assert r['heldout_scores'] == 0
          assert r['counts_as_predictive_evidence'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hokkaido-streamfish-pre-response-geometry
          path: validation/hokkaido_streamfish_endpoint3/pre_response_geometry_certificate.json
          if-no-files-found: error
