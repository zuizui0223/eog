name: STOC EOG-WF once-only validation

on:
  pull_request:
    paths:
      - ".github/workflows/stoc_eogwf_once.yml"
      - "benchmarks/run_stoc_eogwf_validation.py"
      - "benchmarks/run_stoc_eogwf_validation_schema_adapter.py"
      - "validation/stoc_eogwf/runtime_lock.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/stoc_eogwf/runtime_lock.txt
          python -m pip install . --no-deps
          python - <<'PY'
          import numpy, pandas, sklearn
          print("numpy", numpy.__version__)
          print("pandas", pandas.__version__)
          print("sklearn", sklearn.__version__)
          PY
      - name: Fetch exact frozen DataSTOC source
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/biomodhub/biomod2/v4.3-4-6/inst/external/DATA_biomod2_STOC.csv \
            -o /tmp/DATA_biomod2_STOC.csv
          test "$(stat -c%s /tmp/DATA_biomod2_STOC.csv)" = "330891"
          test "$(git hash-object /tmp/DATA_biomod2_STOC.csv)" = "4bfa2cd39a7e90340ad6a319e5c611e8646462c8"
      - name: Execute frozen independent validation
        run: |
          python benchmarks/run_stoc_eogwf_validation_schema_adapter.py \
            --source /tmp/DATA_biomod2_STOC.csv \
            --output build/stoc_eogwf
      - name: Upload frozen result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stoc-eogwf-once-only-result
          path: build/stoc_eogwf
          if-no-files-found: warn
