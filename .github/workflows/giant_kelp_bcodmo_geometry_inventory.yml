name: Giant kelp BCO-DMO geometry metadata inventory

on:
  push:
    branches:
      - agent/giant-kelp-preflight
    paths:
      - ".github/workflows/giant_kelp_bcodmo_geometry_inventory.yml"
      - "validation/giant_kelp_complementarity/bcodmo_geometry_mirror_contract.json"
  pull_request:
    paths:
      - ".github/workflows/giant_kelp_bcodmo_geometry_inventory.yml"
      - "validation/giant_kelp_complementarity/bcodmo_geometry_mirror_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve BCO-DMO geometry dataset metadata only
        run: |
          set -euo pipefail
          mkdir -p build/giant_kelp_bcodmo_inventory
          python - <<'PY'
          from __future__ import annotations
          import hashlib, html, json, re, urllib.request
          from pathlib import Path

          ROOT=Path('validation/giant_kelp_complementarity')
          OUT=Path('build/giant_kelp_bcodmo_inventory')
          contract=json.loads((ROOT/'bcodmo_geometry_mirror_contract.json').read_text(encoding='utf-8'))
          project=int(contract['bco_dmo_project_id']); award=int(contract['bco_dmo_award_id'])
          UA='eog-giant-kelp-bcodmo-metadata/1.1'
          fetched=[]

          allowed=(
              'https://www.bco-dmo.org/project/',
              'https://www.bco-dmo.org/award/',
              'https://www.bco-dmo.org/api/project/',
              'https://www.bco-dmo.org/api/award/',
              'https://www.bco-dmo.org/api/dataset/',
          )
          def get(url: str, accept='text/html,application/json,*/*', *, optional=False):
              if not any(url.startswith(prefix) for prefix in allowed):
                  raise RuntimeError(f'non-metadata BCO-DMO endpoint blocked: {url!r}')
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':accept})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      body=r.read(); status=getattr(r,'status',None) or r.getcode(); ctype=str(r.headers.get('Content-Type','')); final=str(r.geturl())
                  fetched.append({'requested':url,'final':final,'status':status,'bytes':len(body),'content_type':ctype,'sha256':hashlib.sha256(body).hexdigest()})
                  return body
              except Exception as exc:
                  fetched.append({'requested':url,'error':f'{type(exc).__name__}: {exc}'})
                  if optional: return None
                  raise

          project_raw=get(f'https://www.bco-dmo.org/project/{project}')
          award_raw=get(f'https://www.bco-dmo.org/award/{award}')
          project_html=project_raw.decode('utf-8','replace'); award_html=award_raw.decode('utf-8','replace')
          api_project=get(f'https://www.bco-dmo.org/api/project/{project}',accept='application/json,*/*',optional=True)
          api_award=get(f'https://www.bco-dmo.org/api/award/{award}',accept='application/json,*/*',optional=True)

          expected_phrase='spatial definitions of giant kelp'
          def snippets(text):
              unfolded=html.unescape(text)
              low=unfolded.casefold(); out=[]; start=0
              while True:
                  pos=low.find(expected_phrase,start)
                  if pos<0: break
                  out.append(unfolded[max(0,pos-1200):min(len(unfolded),pos+2400)])
                  start=pos+1
              return out[:10]
          raw_snippets=snippets(project_html)+snippets(award_html)

          dataset_ids=set(int(x) for x in re.findall(r'(?:/dataset/|dataset(?:id|_id)["\'=:\s]+)(\d{4,9})',project_html+'\n'+award_html,re.IGNORECASE))
          api_objects=[]
          for label,raw in (('project',api_project),('award',api_award)):
              if not raw: continue
              try: obj=json.loads(raw)
              except Exception: continue
              api_objects.append({'label':label,'sha256':hashlib.sha256(raw).hexdigest(),'top_level_keys':sorted(obj.keys()) if isinstance(obj,dict) else []})
              def walk(v,path=''):
                  if isinstance(v,dict):
                      for k,x in v.items():
                          p=f'{path}.{k}' if path else str(k)
                          if 'dataset' in str(k).casefold():
                              if isinstance(x,int) and 1000<=x<=999999999: dataset_ids.add(x)
                              elif isinstance(x,str):
                                  dataset_ids.update(int(n) for n in re.findall(r'\b\d{4,9}\b',x))
                          walk(x,p)
                  elif isinstance(v,list):
                      for i,x in enumerate(v): walk(x,f'{path}[{i}]')
                  elif isinstance(v,str):
                      for n in re.findall(r'(?:/dataset/|dataset(?:id|_id)["\'=:\s]+)(\d{4,9})',v,re.IGNORECASE): dataset_ids.add(int(n))
              walk(obj)

          # Also inspect only target-title snippets for nearby opaque numeric node IDs.
          for snip in raw_snippets:
              for n in re.findall(r'\b(\d{5,9})\b',snip):
                  val=int(n)
                  if val not in (project,award): dataset_ids.add(val)

          expected=tuple(term.casefold() for term in contract['expected_geometry_title_terms'])
          datasets=[]
          for did in sorted(dataset_ids):
              raw=get(f'https://www.bco-dmo.org/api/dataset/{did}',accept='application/json,*/*',optional=True)
              if not raw:
                  datasets.append({'dataset_id':did,'metadata_error':'unavailable'}); continue
              try: obj=json.loads(raw)
              except Exception as exc:
                  datasets.append({'dataset_id':did,'metadata_error':f'JSON decode: {exc}'}); continue
              scalars=[]
              def scal(v,path=''):
                  if isinstance(v,dict):
                      for k,x in v.items(): scal(x,f'{path}.{k}' if path else str(k))
                  elif isinstance(v,list):
                      for i,x in enumerate(v): scal(x,f'{path}[{i}]')
                  elif v is None or isinstance(v,(str,int,float,bool)):
                      text=str(v); scalars.append({'path':path,'value':text[:2000]})
              scal(obj)
              searchable=' '.join(row['value'] for row in scalars).casefold()
              matches=sum(term in searchable for term in expected)
              titleish=[r for r in scalars if any(t in r['path'].casefold() for t in ('title','name','label','description','abstract'))]
              urlish=[r for r in scalars if r['value'].startswith(('http://','https://'))]
              datasets.append({'dataset_id':did,'expected_title_term_matches':matches,'matches_all_expected_title_terms':matches==len(expected),'titleish_metadata':titleish[:100],'url_metadata':urlish[:100],'top_level_keys':sorted(obj.keys()) if isinstance(obj,dict) else [],'metadata_sha256':hashlib.sha256(raw).hexdigest()})

          exact=[d for d in datasets if d.get('matches_all_expected_title_terms')]
          status='bcodmo_geometry_dataset_identified' if len(exact)==1 else ('bcodmo_geometry_dataset_ambiguous' if len(exact)>1 else 'bcodmo_geometry_dataset_not_identified')
          payload={
              'status':status,'candidate':contract['candidate'],'geometry_edi_doi':contract['geometry_edi_doi'],'resolved_edi_package_id':contract['resolved_edi_package_id'],
              'bco_dmo_project_id':project,'bco_dmo_award_id':award,'project_contains_expected_phrase':expected_phrase in html.unescape(project_html).casefold(),'award_contains_expected_phrase':expected_phrase in html.unescape(award_html).casefold(),
              'target_html_snippets':raw_snippets,'api_metadata_objects':api_objects,'dataset_ids':sorted(dataset_ids),'dataset_count':len(dataset_ids),'datasets':datasets,'exact_geometry_matches':exact,
              'data_download_endpoints_called':False,'data_file_bytes_opened':False,'response_rows_opened':False,'network_fetches':fetched,
              'next':contract['next_if_dataset_resolves'] if len(exact)==1 else contract['stop_if_unresolved'],
          }
          payload['fingerprint']=hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          (OUT/'bcodmo_inventory_result.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - name: Assert metadata-only firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('build/giant_kelp_bcodmo_inventory/bcodmo_inventory_result.json'))
          assert p['data_download_endpoints_called'] is False
          assert p['data_file_bytes_opened'] is False
          assert p['response_rows_opened'] is False
          PY
      - name: Upload BCO-DMO inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: giant-kelp-bcodmo-geometry-inventory
          path: build/giant_kelp_bcodmo_inventory/bcodmo_inventory_result.json
          if-no-files-found: error
