name: Azores yellow eel once-only outcome gate

on:
  push:
    branches:
      - agent/azores-yellow-eel-fresh-paired
    paths:
      - "validation/azores_yellow_eel_paired_complementarity/OUTCOME_AUTHORIZED_ONCE_V2"

concurrency:
  group: azores-yellow-eel-once-only-outcome-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  once-only-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact frozen runtime
        run: |
          python -m pip install numpy==2.3.5 scipy==1.18.1 joblib==1.5.3 threadpoolctl==3.6.0 scikit-learn==1.8.0
          python -m pip install --no-deps -e .
      - name: Verify v2 marker-bound code and certificates
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path("validation/azores_yellow_eel_paired_complementarity")
          marker = json.loads((root / "OUTCOME_AUTHORIZED_ONCE_V2").read_text())
          expected = {
              "outcome_runner.py": marker["outcome_runner_git_blob_sha"],
              "runner_core.py": marker["runner_core_git_blob_sha"],
              "outcome_access_authorization.json": marker["authorization_git_blob_sha"],
              "synthetic_smoke_certificate.json": marker["synthetic_smoke_certificate_git_blob_sha"],
              "stage1_certificate.json": marker["stage1_certificate_git_blob_sha"],
              "full_freeze_spec.json": marker["full_freeze_spec_git_blob_sha"],
              "once_only_v1_pre_response_failure_certificate.json": marker["v1_failure_certificate_git_blob_sha"],
          }
          for name, expected_sha in expected.items():
              observed = subprocess.check_output(["git", "hash-object", str(root / name)], text=True).strip()
              if observed != expected_sha:
                  raise SystemExit(f"marker-bound Git blob mismatch for {name}: {observed} != {expected_sha}")

          auth = json.loads((root / "outcome_access_authorization.json").read_text())
          smoke = json.loads((root / "synthetic_smoke_certificate.json").read_text())
          stage1 = json.loads((root / "stage1_certificate.json").read_text())
          freeze = json.loads((root / "full_freeze_spec.json").read_text())
          v1 = json.loads((root / "once_only_v1_pre_response_failure_certificate.json").read_text())

          if auth["status"] != "authorized_once_only_exact_count_gate_required":
              raise SystemExit("outcome authorization is not green")
          if smoke["status"] != "synthetic_pre_response_runner_pass":
              raise SystemExit("synthetic smoke certificate is not green")
          if v1["status"] != "terminal_pre_response_certificate_transcription_failure":
              raise SystemExit("v1 failure certificate status drift")
          if v1["response_firewall_at_terminal"]["response_payload_requests"] != 0:
              raise SystemExit("v1 failure certificate does not prove zero response requests")

          availability = stage1["temporal_availability"]["availability_fingerprint"]
          if len(availability) != 64:
              raise SystemExit("Stage1 availability fingerprint is not full SHA-256")
          if availability != freeze["node_geometry"]["availability_fingerprint"]:
              raise SystemExit("Stage1/full-freeze availability mismatch")
          if marker["authorization_fingerprint"] != auth["fingerprint"]:
              raise SystemExit("marker authorization fingerprint mismatch")
          if marker["full_freeze_spec_sha256"] != auth["full_freeze_spec_sha256"]:
              raise SystemExit("marker full-freeze fingerprint mismatch")
          observed_freeze_sha256 = hashlib.sha256((root / "full_freeze_spec.json").read_bytes()).hexdigest()
          if observed_freeze_sha256 != marker["full_freeze_spec_sha256"]:
              raise SystemExit("full-freeze file SHA-256 mismatch")
          print("v2 marker/code/certificate identity PASS")
          PY
      - name: Execute sole v2 response stream and terminal gate
        run: python validation/azores_yellow_eel_paired_complementarity/outcome_runner.py
      - name: Upload v2 terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azores-yellow-eel-once-only-v2-terminal
          path: build/azores_yellow_eel_outcome/terminal_result.json
          if-no-files-found: error
