name: Azores yellow eel once-only outcome gate

on:
  push:
    branches:
      - agent/azores-yellow-eel-fresh-paired
    paths:
      - "validation/azores_yellow_eel_paired_complementarity/OUTCOME_AUTHORIZED_ONCE_V3"

concurrency:
  group: azores-yellow-eel-once-only-outcome-v3
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  once-only-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact frozen runtime
        run: |
          python -m pip install numpy==2.3.5 scipy==1.18.1 joblib==1.5.3 threadpoolctl==3.6.0 scikit-learn==1.8.0
          python -m pip install --no-deps -e .
      - name: Verify v3 marker with audited verifier
        run: python validation/azores_yellow_eel_paired_complementarity/verify_once_only_marker.py OUTCOME_AUTHORIZED_ONCE_V3
      - name: Execute sole v3 response stream and terminal gate
        run: python validation/azores_yellow_eel_paired_complementarity/outcome_runner.py
      - name: Upload v3 terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azores-yellow-eel-once-only-v3-terminal
          path: build/azores_yellow_eel_outcome/terminal_result.json
          if-no-files-found: error
