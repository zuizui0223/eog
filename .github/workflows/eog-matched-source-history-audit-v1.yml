name: EOG matched source-history frozen-archive audit

on:
  pull_request:
    paths:
      - 'scripts/audit_matched_eog_source_history_v1.py'
      - 'scripts/audit_eog_history_readout_crossover_v1.py'
      - 'scripts/audit_eog_v23_readout_synergy_v1.py'
      - 'tests/test_matched_eog_source_history_v1.py'
      - 'tests/test_eog_history_readout_crossover_v1.py'
      - 'tests/test_eog_v23_readout_synergy_v1.py'
      - 'validation/eog_virtual_world_ecology_synthesis_v1/matched_source_history_exploratory_result_v1.json'
      - 'validation/eog_virtual_world_ecology_synthesis_v1/matched_readout_crossover_v1.json'
      - 'validation/eog_virtual_world_ecology_synthesis_v1/v23_readout_synergy_decomposition_v1.json'
      - 'docs/eog_matched_source_geometry_history_v1.md'
      - 'docs/eog_history_readout_crossover_v23.md'
      - '.github/workflows/eog-matched-source-history-audit-v1.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_matched_eog_source_history_v1.py'
      - 'scripts/audit_eog_history_readout_crossover_v1.py'
      - 'scripts/audit_eog_v23_readout_synergy_v1.py'
      - 'tests/test_matched_eog_source_history_v1.py'
      - 'tests/test_eog_history_readout_crossover_v1.py'
      - 'tests/test_eog_v23_readout_synergy_v1.py'
      - 'validation/eog_virtual_world_ecology_synthesis_v1/matched_source_history_exploratory_result_v1.json'
      - 'validation/eog_virtual_world_ecology_synthesis_v1/matched_readout_crossover_v1.json'
      - 'validation/eog_virtual_world_ecology_synthesis_v1/v23_readout_synergy_decomposition_v1.json'
      - 'docs/eog_matched_source_geometry_history_v1.md'
      - 'docs/eog_history_readout_crossover_v23.md'
      - '.github/workflows/eog-matched-source-history-audit-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  pinned-posthoc-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit test requirement
        run: python -m pip install pytest
      - name: Test pinned frozen results and strict matched identity
        run: python -m pytest -q tests/test_matched_eog_source_history_v1.py tests/test_eog_history_readout_crossover_v1.py tests/test_eog_v23_readout_synergy_v1.py
      - name: Download five immutable prior synthetic results only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/frozen-eog-artifacts
          for entry in \
            v18:11321111760 \
            v19:11321161763 \
            v21:11322163376 \
            v22:11324282807 \
            v23:11324893031
          do
            phase="$(echo "$entry" | cut -d: -f1)"
            artifact="$(echo "$entry" | cut -d: -f2)"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" \
              --output "build/frozen-eog-artifacts/$phase.zip"
            test -s "build/frozen-eog-artifacts/$phase.zip"
          done
      - name: Recompute EXACT frozen matched 384-landscape posthoc summary
        run: |
          python scripts/audit_matched_eog_source_history_v1.py \
            --v18 build/frozen-eog-artifacts/v18.zip \
            --v19 build/frozen-eog-artifacts/v19.zip \
            --v21 build/frozen-eog-artifacts/v21.zip \
            --v22 build/frozen-eog-artifacts/v22.zip \
            --assert-frozen validation/eog_virtual_world_ecology_synthesis_v1/matched_source_history_exploratory_result_v1.json \
            --output build/eog-matched-source-history-v1.json
      - name: Recompute readout crossover from exact v23 frozen source
        run: |
          python scripts/audit_eog_history_readout_crossover_v1.py \
            --v18 build/frozen-eog-artifacts/v18.zip \
            --v19 build/frozen-eog-artifacts/v19.zip \
            --v21 build/frozen-eog-artifacts/v21.zip \
            --v22 build/frozen-eog-artifacts/v22.zip \
            --v23 build/frozen-eog-artifacts/v23.zip \
            --assert-frozen validation/eog_virtual_world_ecology_synthesis_v1/matched_readout_crossover_v1.json \
            --output build/eog-history-readout-crossover-v23.json
      - name: Reconcile provenance-only rescue against true joint-library synergy
        run: |
          python scripts/audit_eog_v23_readout_synergy_v1.py \
            --v23 build/frozen-eog-artifacts/v23.zip \
            --parent validation/eog_virtual_world_ecology_synthesis_v1/matched_readout_crossover_v1.json \
            --assert-frozen validation/eog_virtual_world_ecology_synthesis_v1/v23_readout_synergy_decomposition_v1.json \
            --output build/eog-v23-readout-synergy-v1.json
      - name: Reject accidental confirmatory language or new results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('build/eog-matched-source-history-v1.json').read_text())
          assert report["status"] == "POST_RESULT_EXPLORATORY_NOT_PREREGISTERED"
          assert report["matched_landscapes"] == 384
          assert report["source_identity_mismatches"] == 0
          assert report["history_identifiability_contingency"] == {
            "neither":14, "dispersed_only":139, "clustered_only":22, "both":209
          }
          assert report["counts"]["joint_tradeoff_and_dispersed_only_identifiable"] == 130
          assert report["counts"]["clustered_more_provenance_but_dispersed_only_identifiable"] == 131
          crossover=json.loads(Path('build/eog-history-readout-crossover-v23.json').read_text())
          assert crossover["status"] == "POST_RESULT_EXPLORATORY_NOT_PREREGISTERED"
          assert crossover["matched_landscapes"] == 384
          assert crossover["readout_crossover"]["occupancy_d_only__provenance_c_only"] == 78
          assert crossover["readout_crossover"]["occupancy_c_only__provenance_d_only"] == 0
          assert crossover["readout_crossover"]["crossover_with_coverage_insurance_tradeoff"] == 75
          info=json.loads(Path('build/eog-v23-readout-synergy-v1.json').read_text())
          assert info["status"] == "POST_RESULT_DESCRIPTIVE_NOT_PREREGISTERED"
          assert info["true_mixed_library_synergy_designs"] == 18
          assert info["layouts"]["clustered"]["truth_table"]["011"] == 90
          assert info["layouts"]["clustered"]["truth_table"]["001"] == 17
          assert info["layouts"]["dispersed"]["truth_table"]["011"] == 0
          assert info["layouts"]["dispersed"]["truth_table"]["001"] == 1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EOG-v18-v23-MATCHED-POSTHOC-NOT-PREREGISTERED
          path: |
            build/eog-matched-source-history-v1.json
            build/eog-history-readout-crossover-v23.json
            build/eog-v23-readout-synergy-v1.json
          if-no-files-found: error
