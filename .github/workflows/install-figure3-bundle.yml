name: Install staged Figure 3 bundle

on:
  push:
    branches:
      - agent/tanzania-figure3
    paths:
      - ".github/workflows/install-figure3-bundle.yml"
      - "tools/figure3_bundle/**"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tanzania-figure3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decode and safely extract staged files
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path, PurePosixPath

          parts = sorted(Path("tools/figure3_bundle").glob("part*.b85"))
          if [path.name for path in parts] != [f"part{i:02d}.b85" for i in range(6)]:
              raise SystemExit(f"unexpected bundle parts: {[p.name for p in parts]}")
          encoded = "".join(path.read_text(encoding="utf-8") for path in parts)
          payload = base64.b85decode(encoded)
          expected = "2a27a0190d9b29ee12c84a6e72335a73afb48acf78fc48e1c482f29021c65f8f"
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f"bundle SHA mismatch: expected {expected}, got {actual}")

          expected_members = {
              "benchmarks/tanzania_heldout_species_expected.csv",
              "benchmarks/tanzania_heldout_species_expected_provenance.json",
              "figures/figure_manifest.json",
              "figures/build_figure_3_tanzania.py",
              "figures/output/figure_3_tanzania.svg",
              "figures/output/figure_3_metadata.json",
              "figures/output/tanzania_species_loso_effects.csv",
              "figures/output/tanzania_aggregate_contrasts.csv",
              "figures/output/tanzania_applicability.csv",
              "manuscript/figure_3_caption.md",
              "manuscript/figure_3_accessibility.md",
              "manuscript/figure_data/tanzania_species_loso_effects.csv",
              "manuscript/figure_data/tanzania_aggregate_contrasts.csv",
              "manuscript/figure_data/tanzania_applicability.csv",
              "tests/test_structural_figure_3.py",
          }
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != expected_members:
                  raise SystemExit(f"unexpected archive members: {sorted(names ^ expected_members)}")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f"unsafe archive member: {member.name}")
              archive.extractall(".", members=members, filter="data")
          PY
      - name: Verify dedicated Figure 3 tests
        run: python -m pytest -q tests/test_structural_figure_3.py
      - name: Commit only manuscript Figure 3 files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            benchmarks/tanzania_heldout_species_expected.csv \
            benchmarks/tanzania_heldout_species_expected_provenance.json \
            figures/figure_manifest.json \
            figures/build_figure_3_tanzania.py \
            figures/output/figure_3_tanzania.svg \
            figures/output/figure_3_metadata.json \
            figures/output/tanzania_species_loso_effects.csv \
            figures/output/tanzania_aggregate_contrasts.csv \
            figures/output/tanzania_applicability.csv \
            manuscript/figure_3_caption.md \
            manuscript/figure_3_accessibility.md \
            manuscript/figure_data/tanzania_species_loso_effects.csv \
            manuscript/figure_data/tanzania_aggregate_contrasts.csv \
            manuscript/figure_data/tanzania_applicability.csv \
            tests/test_structural_figure_3.py
          git diff --cached --check
          git commit -m "Add reproducible Tanzania Figure 3"
          git push origin HEAD:agent/tanzania-figure3
