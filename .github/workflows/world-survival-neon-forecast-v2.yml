name: World survival NEON forecast v2

on:
  push:
    branches:
      - agent/world-survival-neon-mammal-v2
    paths:
      - "validation/world_survival_regime_v2/neon_small_mammal_protocol_v2.json"
      - "validation/world_survival_regime_v2/neon_small_mammal_protocol_lock_v2.json"
      - "validation/world_survival_regime_v2/neon_small_mammal_roster_lock_v2.json"
      - "validation/world_survival_regime_v2/neon_small_mammal_execution_authorization_v2.json"
      - "validation/world_survival_regime_v2/capture_neon_small_mammal_forecast_v2.py"
      - "src/eog/v2/world_survival_regime_v2.py"
      - ".github/workflows/world-survival-neon-forecast-v2.yml"
  workflow_dispatch:

concurrency:
  group: world-survival-neon-forecast-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install EOG
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verify frozen authorization
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = Path("validation/world_survival_regime_v2")
          protocol_path = base / "neon_small_mammal_protocol_v2.json"
          runner_path = base / "capture_neon_small_mammal_forecast_v2.py"
          protocol_lock = json.loads(
              (base / "neon_small_mammal_protocol_lock_v2.json").read_text()
          )
          auth = json.loads(
              (base / "neon_small_mammal_execution_authorization_v2.json").read_text()
          )

          def blob_sha(path):
              raw = path.read_bytes()
              return hashlib.sha1(
                  f"blob {len(raw)}\0".encode("ascii") + raw
              ).hexdigest()

          assert blob_sha(protocol_path) == protocol_lock["protocol_git_blob_sha1"]
          assert blob_sha(protocol_path) == auth["protocol_blob_sha1"]
          assert blob_sha(runner_path) == auth["runner_blob_sha1"]
          assert protocol_lock["v2_forecasts_computed"] == 0
          assert protocol_lock["biological_response_payload_requests"] == 0
          assert auth["biological_response_payload_requests_authorized"] == 0
          assert auth["model_fits_authorized"] == 0
          PY
      - name: Compute response-blind v2 forecasts
        run: python validation/world_survival_regime_v2/capture_neon_small_mammal_forecast_v2.py
      - name: Verify forecast artifact remains response blind
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "validation/world_survival_regime_v2/"
              "neon_small_mammal_forecast_result_v2.json"
          )
          result = json.loads(path.read_text())
          assert result["response_endpoint_requests"] == 0
          assert result["biological_response_bytes_opened"] == 0
          assert result["model_fits"] == 0
          assert result["forecast_locked_system_count"] >= 1
          for row in result["systems"]:
              assert row["response_opened"] is False
              if row["status"] == "v2_forecast_locked_response_unopened":
                  assert row["biological_response_bytes_opened"] == 0
                  assert row["model_fits"] == 0
          PY
      - name: Upload frozen v2 forecasts
        uses: actions/upload-artifact@v4
        with:
          name: world-survival-neon-small-mammal-forecast-v2
          path: validation/world_survival_regime_v2/neon_small_mammal_forecast_result_v2.json
          if-no-files-found: error
