name: Finland institutional mirror response-free admission

on:
  pull_request:
    paths:
      - ".github/workflows/finland-colonization-institutional-mirror-admission.yml"
      - "docs/eog_v2_finland_institutional_mirror_transport_contract.md"
      - "benchmarks/finland_colonization_preoutcome_admission.py"
      - "benchmarks/finland_colonization_prepare.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen package code and transport dependency
        run: |
          python -m pip install -e .
          python -m pip install "requests==2.32.5"
      - name: Verify Dryad-Zenodo byte identity and download opaque raw file
        run: |
          mkdir -p benchmark_results/finland_colonization/raw
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          from urllib.parse import urljoin

          import requests

          ROOT = Path("benchmark_results/finland_colonization")
          RAW = ROOT / "raw" / "colonization_select.csv"
          EXPECTED_NAME = "colonization_select.csv"
          DRYAD_DOI = "10.5061/dryad.ffbg79cr6"
          INSTITUTIONAL_URL = "https://research.abo.fi/en/persons/mikael-von-numers/"
          ZENODO_RECORD_ID = 4942881
          DRYAD_DATASET_URL = "https://datadryad.org/api/v2/datasets/doi%3A10.5061%2Fdryad.ffbg79cr6"
          ZENODO_API = f"https://zenodo.org/api/records/{ZENODO_RECORD_ID}"

          session = requests.Session()
          session.headers.update({"User-Agent": "EOG-v2-finland-response-free-provenance/1.0"})

          def get_json(url: str) -> dict:
              response = session.get(url, timeout=90)
              response.raise_for_status()
              value = response.json()
              if not isinstance(value, dict):
                  raise RuntimeError(f"expected JSON object from {url}")
              return value

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)

          def filename_of(value: dict) -> str:
              for key in ("path", "fileName", "filename", "name", "key"):
                  raw = value.get(key)
                  if isinstance(raw, str) and raw.strip():
                      return raw.strip().split("/")[-1]
              return ""

          def normalize_algorithm(value: str) -> str:
              return value.lower().replace("_", "").replace("-", "").strip()

          institutional = session.get(INSTITUTIONAL_URL, timeout=90)
          institutional.raise_for_status()
          institutional_text = institutional.text
          if DRYAD_DOI not in institutional_text or "4942881" not in institutional_text:
              raise RuntimeError("Åbo Akademi page no longer links the expected Dryad DOI and Zenodo record")

          dryad_dataset = get_json(DRYAD_DATASET_URL)
          identifier = str(dryad_dataset.get("identifier") or dryad_dataset.get("id") or "")
          if "ffbg79cr6" not in identifier:
              raise RuntimeError(f"Dryad dataset identifier mismatch: {identifier!r}")
          version_link = ((dryad_dataset.get("_links") or {}).get("stash:version") or {}).get("href")
          if not version_link:
              raise RuntimeError("Dryad dataset API did not expose stash:version")
          dryad_version_url = urljoin("https://datadryad.org", str(version_link))
          dryad_version = get_json(dryad_version_url)

          version_links = dryad_version.get("_links") or {}
          files_link = None
          for key, value in version_links.items():
              if "file" not in str(key).lower():
                  continue
              if isinstance(value, dict) and value.get("href"):
                  files_link = value["href"]
                  break
          if files_link:
              dryad_files_url = urljoin("https://datadryad.org", str(files_link))
          else:
              dryad_files_url = dryad_version_url.rstrip("/") + "/files"
          dryad_files = get_json(dryad_files_url)

          dryad_candidates = []
          for item in walk(dryad_files):
              if filename_of(item) != EXPECTED_NAME:
                  continue
              digest = item.get("digest") or item.get("checksum")
              digest_type = item.get("digestType") or item.get("digest_type") or item.get("checksumType")
              size = item.get("size") or item.get("fileSize") or item.get("filesize")
              if digest is None or size is None:
                  continue
              dryad_candidates.append((item, str(digest), str(digest_type or ""), int(size)))
          unique = {}
          for item, digest, digest_type, size in dryad_candidates:
              unique[(digest, digest_type, size)] = item
          if len(unique) != 1:
              raise RuntimeError(
                  f"expected one cryptographically identified Dryad {EXPECTED_NAME}; found {len(unique)}"
              )
          (dryad_digest, dryad_digest_type, dryad_size), dryad_file = next(iter(unique.items()))

          if ":" in dryad_digest and not dryad_digest_type:
              prefix, value = dryad_digest.split(":", 1)
              dryad_digest_type, dryad_digest = prefix, value
          elif ":" in dryad_digest:
              prefix, value = dryad_digest.split(":", 1)
              if normalize_algorithm(prefix) in {"sha256", "md5"}:
                  dryad_digest = value
          algorithm = normalize_algorithm(dryad_digest_type)
          if not algorithm:
              algorithm = "sha256" if len(dryad_digest) == 64 else "md5" if len(dryad_digest) == 32 else ""
          if algorithm not in {"sha256", "md5"}:
              raise RuntimeError(f"unsupported/ambiguous Dryad digest algorithm: {dryad_digest_type!r}")
          dryad_digest = dryad_digest.lower()

          zenodo = get_json(ZENODO_API)
          title = str((zenodo.get("metadata") or {}).get("title") or "")
          if "Island properties dominate species traits" not in title:
              raise RuntimeError(f"Zenodo mirror title mismatch: {title!r}")
          raw_files = zenodo.get("files")
          if isinstance(raw_files, list):
              entries = raw_files
          elif isinstance(raw_files, dict) and isinstance(raw_files.get("entries"), dict):
              entries = list(raw_files["entries"].values())
          else:
              raise RuntimeError(f"unexpected Zenodo files schema: {type(raw_files).__name__}")
          zenodo_matches = [entry for entry in entries if filename_of(entry) == EXPECTED_NAME]
          if len(zenodo_matches) != 1:
              raise RuntimeError(f"Zenodo record does not contain exactly one {EXPECTED_NAME}")
          zenodo_file = zenodo_matches[0]
          zenodo_size = int(zenodo_file.get("size"))
          if zenodo_size != dryad_size:
              raise RuntimeError(f"Dryad/Zenodo byte-size mismatch: {dryad_size} != {zenodo_size}")
          zenodo_checksum = str(zenodo_file.get("checksum") or "")
          links = zenodo_file.get("links") or {}
          content_url = links.get("content") or links.get("download") or links.get("self")
          if not content_url:
              raise RuntimeError("Zenodo file has no content URL")

          md5 = hashlib.md5()
          sha256 = hashlib.sha256()
          computed_size = 0
          with session.get(content_url, stream=True, timeout=240) as response:
              response.raise_for_status()
              with RAW.open("wb") as handle:
                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                      if not chunk:
                          continue
                      handle.write(chunk)
                      md5.update(chunk)
                      sha256.update(chunk)
                      computed_size += len(chunk)
          if computed_size != dryad_size:
              raise RuntimeError(f"downloaded mirror size mismatch: {computed_size} != {dryad_size}")

          computed = {"md5": md5.hexdigest(), "sha256": sha256.hexdigest()}
          if computed[algorithm] != dryad_digest:
              raise RuntimeError(
                  f"Dryad/{algorithm} byte identity FAILED: {computed[algorithm]} != {dryad_digest}"
              )
          if zenodo_checksum:
              if ":" not in zenodo_checksum:
                  raise RuntimeError(f"ambiguous Zenodo checksum: {zenodo_checksum!r}")
              z_alg, z_digest = zenodo_checksum.split(":", 1)
              z_alg = normalize_algorithm(z_alg)
              if z_alg not in computed or computed[z_alg] != z_digest.lower():
                  raise RuntimeError("Zenodo declared checksum does not match downloaded bytes")

          provenance = {
              "status": "finland-institutional-mirror-byte-identical-to-dryad",
              "institutional_url": INSTITUTIONAL_URL,
              "dryad_doi": DRYAD_DOI,
              "dryad_dataset_api": DRYAD_DATASET_URL,
              "dryad_version_api": dryad_version_url,
              "dryad_files_api": dryad_files_url,
              "dryad_file_name": EXPECTED_NAME,
              "dryad_file_size": dryad_size,
              "dryad_digest_type": algorithm,
              "dryad_digest": dryad_digest,
              "zenodo_record": ZENODO_RECORD_ID,
              "zenodo_api": ZENODO_API,
              "zenodo_title": title,
              "zenodo_file_name": EXPECTED_NAME,
              "zenodo_file_size": zenodo_size,
              "zenodo_checksum": zenodo_checksum,
              "downloaded_size": computed_size,
              "downloaded_md5": computed["md5"],
              "downloaded_sha256": computed["sha256"],
              "csv_contents_parsed": False,
              "outcome_values_accessed": False,
          }
          (ROOT / "institutional_mirror_provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          (ROOT / "raw_path.txt").write_text(str(RAW) + "\n", encoding="utf-8")
          (ROOT / "raw_csv_sha256.txt").write_text(computed["sha256"] + "\n", encoding="utf-8")
          (ROOT / "raw_size_bytes.txt").write_text(str(computed_size) + "\n", encoding="utf-8")
          PY
      - name: Check header only before response-free projection
        run: |
          python - <<'PY'
          from pathlib import Path
          raw = Path(Path('benchmark_results/finland_colonization/raw_path.txt').read_text().strip())
          with raw.open('rb') as handle:
              header = handle.readline(65536).decode('utf-8-sig', errors='strict')
          required = {'outcome','spp.name','holmkod','Historical_total_log','Dist_to_historical_log'}
          columns = {value.strip() for value in header.rstrip('\r\n').split(',')}
          missing = required - columns
          if missing:
              raise RuntimeError(f'byte-identical mirror header lacks required columns: {sorted(missing)}')
          Path('benchmark_results/finland_colonization/transport_header.txt').write_text(header, encoding='utf-8')
          PY
      - name: Run response-free source reconstruction admission
        run: |
          RAW="$(cat benchmark_results/finland_colonization/raw_path.txt)"
          python benchmarks/finland_colonization_preoutcome_admission.py \
            --input "$RAW" \
            --output benchmark_results/finland_colonization/admission.json
      - name: Freeze response-free predictor bundle
        run: |
          RAW="$(cat benchmark_results/finland_colonization/raw_path.txt)"
          python benchmarks/finland_colonization_prepare.py \
            --input "$RAW" \
            --bundle benchmark_results/finland_colonization/features.npz \
            --manifest benchmark_results/finland_colonization/feature_manifest.json \
            > benchmark_results/finland_colonization/prepare_stdout.json
      - name: Verify response firewall and provenance agreement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('benchmark_results/finland_colonization')
          provenance = json.loads((root/'institutional_mirror_provenance.json').read_text())
          admission = json.loads((root/'admission.json').read_text())
          manifest = json.loads((root/'feature_manifest.json').read_text())
          expected_sha = (root/'raw_csv_sha256.txt').read_text().strip()

          assert provenance['status']=='finland-institutional-mirror-byte-identical-to-dryad'
          assert provenance['outcome_values_accessed'] is False
          assert admission['status']=='finland-colonization-response-free-admission'
          assert admission['outcome_values_accessed'] is False
          assert admission['admitted'] is True
          assert admission['n_islands']==471
          assert admission['n_sourceful_species']>=100
          assert all(check['passed'] for check in admission['checks'].values())
          assert manifest['schema']=='eog_v2_finland_colonization_response_free_bundle_v1'
          assert manifest['outcome_values_accessed'] is False
          assert manifest['raw_sha256']==admission['raw_sha256']==expected_sha==provenance['downloaded_sha256']
          assert manifest['n_species_analysis_response_free']>=100
          assert len(manifest['feature_bundle_fingerprint'])==64
          PY
      - name: Remove raw data before artifact upload
        if: always()
        run: rm -rf benchmark_results/finland_colonization/raw
      - name: Upload response-free admission artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finland-colonization-institutional-mirror-admission
          path: |
            benchmark_results/finland_colonization/institutional_mirror_provenance.json
            benchmark_results/finland_colonization/admission.json
            benchmark_results/finland_colonization/features.npz
            benchmark_results/finland_colonization/feature_manifest.json
            benchmark_results/finland_colonization/prepare_stdout.json
            benchmark_results/finland_colonization/raw_csv_sha256.txt
            benchmark_results/finland_colonization/raw_size_bytes.txt
            benchmark_results/finland_colonization/transport_header.txt
          if-no-files-found: warn
