name: EOG toad reported release-final sign encoding QC v4 (post-STOP)

# Only field encoding/quality: do not infer homing, source movement or EOG endpoint.
on:
  pull_request:
    paths:
      - 'validation/independent_toad_geocoordinate_diagnostic_v4/**'
      - 'benchmarks/independent_toad_release_distance_sign_qc_v4.py'
      - 'tests/test_independent_toad_release_distance_sign_qc_v4.py'
      - '.github/workflows/eog-toad-release-distance-sign-qc-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publisher-verified-signed-source-QC:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific test environment
        run: python -m pip install -e . pytest
      - name: Run source SHA and fully synthetic sign encoding checks
        run: |
          python -m pytest -q \
            tests/test_eog_independent_movement_source_gate_v2.py \
            tests/test_independent_toad_source_anchor_geography_v1.py \
            tests/test_independent_toad_release_distance_sign_qc_v4.py
      - name: One exact-source bounded signed-distance field audit only
        run: |
          python -m benchmarks.independent_toad_release_distance_sign_qc_v4 \
            --protocol validation/independent_toad_geocoordinate_diagnostic_v4/protocol_v4.json \
            --output results/independent_toad_geocoordinate_diagnostic_v4/source_sign_receipt.json
      - name: Assert original 77/163 and 163/163 H1 science STOP unchanged
        run: |
          python - <<'PY'
          import json
          p="results/independent_toad_geocoordinate_diagnostic_v4/source_sign_receipt.json"
          x=json.load(open(p))
          assert x["original_scientific_stop"]=="STOP_GEO_UNIT_CONCORDANCE"
          assert x["original_stop_overridden"] is False
          assert x["new_EOG_WF_endpoints"]==0
          assert x["original_homing_result_scored"] is False
          if x["status"]!="POST_EXPOSURE_SIGNED_SOURCE_COLUMN_QC_ONLY":
              print("SOURCE_ENCODING_SCIENTIFIC_STOP",x["status"])
              raise SystemExit("Do not rescue source H1 or alter original source.")
          assert x["original_publisher_checksum_verified"] is True
          assert x["published_rows"]==165 and x["source_unique_rows"]==163
          assert x["original_unsigned_release_final_matches"]==77
          assert x["original_capture_final_matches"]==163
          assert sum(v["source_rows"] for v in x["signed_nominal_class_details"])==163
          assert len(x["signed_metric_comparison"])==7
          print("SIGNED_SOURCE_ENCODING_QC_ONLY_PASS")
          print("ORIGINAL_STOP",x["original_scientific_stop"])
          print("SIGNED_FORMULA_QC",x["signed_metric_comparison"])
          print("NOMINAL_SIGNED_CLASSES",x["signed_nominal_class_details"])
          print("DIRECTION_METADATA",x["direction_moved_vs_coordinate_delta_east_sign_counts"])
          print("FROZEN_SOURCE_QC_SHA256",x["sha256_without_self"])
          PY
      - name: Retain aggregate-only post-STOP source QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eog-toad-release-distance-signed-qc-v4
          path: results/independent_toad_geocoordinate_diagnostic_v4/source_sign_receipt.json
          if-no-files-found: warn
          retention-days: 30
