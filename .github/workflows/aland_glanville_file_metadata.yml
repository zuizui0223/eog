name: Aland Glanville response-blind file metadata

on:
  push:
    branches:
      - agent/aland-glanville-preflight
    paths:
      - ".github/workflows/aland_glanville_file_metadata.yml"
      - "validation/aland_glanville_paired_complementarity/source_contract.json"
  pull_request:
    paths:
      - ".github/workflows/aland_glanville_file_metadata.yml"
      - "validation/aland_glanville_paired_complementarity/source_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve exact five-file manifest without file downloads
        run: |
          set -euo pipefail
          mkdir -p build/aland_glanville_file_metadata
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import urllib.request

          contract = json.loads(Path(
              "validation/aland_glanville_paired_complementarity/source_contract.json"
          ).read_text())
          record_id = contract["file_metadata_stage"]["selected_record"]
          expected_count = int(contract["file_metadata_stage"]["expected_total_files"])
          ua = "EOG-Aland-Glanville-file-metadata-only/1.0"
          metadata_urls = []

          def get_json(url: str, cap: int = 10_000_000):
              metadata_urls.append(url)
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": ua, "Accept": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = response.read(cap + 1)
                  status = getattr(response, "status", None)
              if status != 200:
                  raise RuntimeError(f"metadata endpoint returned {status}: {url}")
              if len(payload) > cap:
                  raise RuntimeError(f"metadata endpoint exceeded byte cap: {url}")
              value = json.loads(payload.decode("utf-8"))
              if not isinstance(value, (dict, list)):
                  raise RuntimeError(f"metadata endpoint root has unexpected type: {url}")
              return value

          dataset = get_json(f"https://metax.fairdata.fi/v3/datasets/{record_id}")
          files_response = get_json(
              f"https://metax.fairdata.fi/v3/datasets/{record_id}/files?pagination=false"
          )
          if isinstance(files_response, dict):
              if isinstance(files_response.get("results"), list):
                  files = files_response["results"]
              elif isinstance(files_response.get("files"), list):
                  files = files_response["files"]
              else:
                  # Some V3 list endpoints return a dict only when paginated. Do not
                  # infer a file list from unrelated metadata fields.
                  raise RuntimeError(
                      "dataset files endpoint returned dict without results/files list"
                  )
          else:
              files = files_response
          if not isinstance(files, list):
              raise RuntimeError("dataset files metadata must resolve to a list")
          if len(files) != expected_count:
              raise RuntimeError(
                  f"frozen file-count mismatch: observed {len(files)} != {expected_count}"
              )

          def compact_file(value):
              if not isinstance(value, dict):
                  raise RuntimeError("file metadata entry must be object")
              keep = {}
              for key in (
                  "id", "storage_service", "csc_project", "storage_identifier",
                  "pathname", "filename", "frozen", "removed", "modified", "size",
                  "checksum", "is_pas_compatible", "dataset_metadata", "characteristics"
              ):
                  if key in value:
                      keep[key] = value[key]
              return keep

          compact_files = [compact_file(item) for item in files]
          access = dataset.get("access_rights", {}) if isinstance(dataset, dict) else {}
          result = {
              "attempt_id": contract["attempt_id"],
              "selected_record": record_id,
              "persistent_identifier": dataset.get("persistent_identifier"),
              "dataset_state": dataset.get("state"),
              "dataset_version": dataset.get("version"),
              "access_rights": {
                  "access_type": access.get("access_type"),
                  "available": access.get("available"),
                  "show_file_metadata": access.get("show_file_metadata"),
                  "license": access.get("license"),
                  "restriction_grounds": access.get("restriction_grounds"),
              },
              "files": compact_files,
              "file_count": len(compact_files),
              "total_file_bytes_from_entries": sum(
                  int(item.get("size") or 0) for item in compact_files
              ),
              "metadata_urls": metadata_urls,
              "file_payload_requests": 0,
              "file_payload_bytes_opened": 0,
              "patch_registry_payload_opened": False,
              "locality_visit_payload_opened": False,
              "nest_payload_opened": False,
              "response_rows_opened": False,
              "response_values_opened": False,
              "model_fits": 0,
              "heldout_scores": 0,
          }
          if result["total_file_bytes_from_entries"] != int(
              contract["fairdata_record_resolution"]["total_file_bytes"]
          ):
              raise RuntimeError(
                  "file-entry byte total differs from frozen dataset summary"
              )
          Path(
              "build/aland_glanville_file_metadata/file_manifest.json"
          ).write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Assert payload firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path(
              "build/aland_glanville_file_metadata/file_manifest.json"
          ).read_text())
          assert result["file_count"] == 5
          assert result["file_payload_requests"] == 0
          assert result["file_payload_bytes_opened"] == 0
          assert result["patch_registry_payload_opened"] is False
          assert result["locality_visit_payload_opened"] is False
          assert result["nest_payload_opened"] is False
          assert result["response_rows_opened"] is False
          assert result["response_values_opened"] is False
          assert result["model_fits"] == 0
          assert result["heldout_scores"] == 0
          print("Aland Glanville five-file metadata firewall PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aland-glanville-file-metadata
          path: build/aland_glanville_file_metadata/file_manifest.json
          if-no-files-found: error
