name: EOG Glanville v2 source-locked encrypted host world bridge

on:
  pull_request:
    paths:
      - "validation/glanville_genetic_host_world_v2/protocol_v2.json"
      - "scripts/glanville_encrypt_survey_source_v2.py"
      - "tests/test_glanville_encrypt_survey_source_v2.py"
      - ".github/workflows/eog-glanville-host-world-bridge-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install synthetic crypto tests
        run: python -m pip install -q pytest cryptography
      - name: Verify immutable v2 source and encryption contract
        run: |
          python -m pytest -q tests/test_glanville_encrypt_survey_source_v2.py tests/test_glanville_encrypt_survey_source_v1.py
      - name: Exact pinned 2019 archive, ephemeral RSA+AES encryption
        run: |
          python scripts/glanville_encrypt_survey_source_v2.py \
            --protocol validation/glanville_genetic_host_world_v2/protocol_v2.json \
            --output results/glanville_genetic_host_world_v2/encrypted_survey.json
          python - <<'PY'
          import json
          r=json.load(open("results/glanville_genetic_host_world_v2/encrypted_survey.json"))
          assert r["status"]=="ENCRYPTED_SURVEY_SOURCE_ONLY_NO_PUBLIC_ROW_RECORDS"
          assert r["public_source_archive_sha256"]=="c70f43544f61e7273afebfa42ed1d488c3b945efe4d5c68e6557030087ee7fd9"
          assert r["rows_or_site_identifiers_logged"]==0
          assert "survey" not in r and "network" not in r
          print("CIPHERTEXT_ONLY="+r["status"])
          print("ENCRYPTED_SURVEY_ROWS="+str(r["survey_row_count"]))
          PY
      - name: Export ciphertext only (single run)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glanville-genetic-host-world-v2-encrypted-survey
          path: results/glanville_genetic_host_world_v2/encrypted_survey.json
          if-no-files-found: error
          retention-days: 1
