name: Frozen dynamic occupancy confirmation

on:
  pull_request:
    paths:
      - "benchmarks/dynamic_occupancy_confirmation.py"
      - "docs/eog_v2_dynamic_occupancy_confirmation_contract.md"
      - ".github/workflows/dynamic-occupancy-confirmation.yml"

permissions:
  contents: read

jobs:
  confirm:
    if: ${{ github.run_number == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen implementation blobs
        run: |
          test "$(git hash-object benchmarks/dynamic_occupancy_reference_boundary.py)" = "9f50a279cebacc58d7368bc47362739f1fe0bd59"
          test "$(git hash-object src/eog/dynamic_island_reachability.py)" = "d3d57a8bef431c34f5d2c13e5e061ade40bcb64f"
      - name: Install
        run: python -m pip install -e .
      - name: Run frozen dynamic occupancy confirmation
        run: |
          mkdir -p benchmark_results/dynamic_occupancy_confirmation
          python benchmarks/dynamic_occupancy_confirmation.py \
            > benchmark_results/dynamic_occupancy_confirmation/result.json
      - name: Check frozen decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("benchmark_results/dynamic_occupancy_confirmation/result.json").read_text()
          )
          assert result["status"] == "frozen-dynamic-occupancy-confirmation"
          assert result["contract_fingerprint"] == "ee967ddb36e670eb8946cce9e1c96ac51cd78b392a393cc6036958a010b31848"
          assert result["contract"]["confirmation_seeds"] == [3301, 3407, 3511, 3607, 3701, 3803, 3907, 4001]
          assert result["decision"]["passed"] is True
          assert all(check["passed"] for check in result["decision"]["checks"].values())
          PY
      - name: Upload frozen confirmation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-occupancy-confirmation
          path: benchmark_results/dynamic_occupancy_confirmation
          if-no-files-found: error
