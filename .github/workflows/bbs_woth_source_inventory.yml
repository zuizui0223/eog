name: BBS Wood Thrush response-blind source inventory

on:
  push:
    branches:
      - agent/bbs-woth-preflight
    paths:
      - ".github/workflows/bbs_woth_source_inventory.yml"
      - "validation/bbs_woth_complementarity/**"
  pull_request:
    paths:
      - ".github/workflows/bbs_woth_source_inventory.yml"
      - "validation/bbs_woth_complementarity/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inventory ScienceBase hierarchy and file names only
        run: |
          set -euo pipefail
          mkdir -p build/bbs_woth_source/output
          python - <<'PY'
          import json
          from pathlib import Path
          import urllib.parse
          import urllib.request

          root = Path("validation/bbs_woth_complementarity")
          contract = json.loads((root / "source_resolution_contract.json").read_text(encoding="utf-8"))
          sb_id = contract["upstream_release"]["sciencebase_item_id"]
          ua = "EOG-BBS-WOTH-ScienceBase-metadata-inventory/1.0"
          requested = []

          def get_json(url):
              requested.append(url)
              req = urllib.request.Request(url, headers={"User-Agent": ua})
              with urllib.request.urlopen(req, timeout=30) as r:
                  payload = r.read(8_000_001)
              if len(payload) > 8_000_000:
                  raise RuntimeError("ScienceBase metadata exceeded bounded cap")
              data = json.loads(payload.decode("utf-8"))
              if not isinstance(data, dict):
                  raise RuntimeError("ScienceBase metadata root must be object")
              return data

          def query(filter_value):
              url = "https://www.sciencebase.gov/catalog/items?" + urllib.parse.urlencode({
                  "q": "",
                  "filter": filter_value,
                  "format": "json",
                  "max": 1000,
              })
              return get_json(url).get("items", [])

          def name_of(record):
              return str(record.get("name") or record.get("title") or "").strip()

          def file_names(item):
              values = []
              for f in item.get("files", []) or []:
                  if isinstance(f, dict) and name_of(f):
                      values.append(name_of(f))
              for f in item.get("distributionLinks", []) or []:
                  if isinstance(f, dict) and name_of(f):
                      values.append(name_of(f))
              return sorted(set(values))

          def summarize(item):
              return {
                  "id": item.get("id"),
                  "parent_id": item.get("parentId"),
                  "title": item.get("title"),
                  "has_children": item.get("hasChildren"),
                  "files_or_distribution_names": file_names(item),
              }

          root_item = get_json(f"https://www.sciencebase.gov/catalog/item/{sb_id}?format=json")
          children = [x for x in query(f"parentId={sb_id}") if isinstance(x, dict)]
          descendants = [x for x in query(f"ancestors={sb_id}") if isinstance(x, dict)]

          # Fetch full JSON only for direct children. This stays metadata-only and bounded.
          full_children = []
          for child in children:
              cid = child.get("id")
              if cid:
                  try:
                      full_children.append(get_json(f"https://www.sciencebase.gov/catalog/item/{cid}?format=json"))
                  except Exception as exc:
                      full_children.append({"id": cid, "title": child.get("title"), "metadata_error": repr(exc)})

          result = {
              "root": summarize(root_item),
              "direct_child_count": len(children),
              "direct_children": [summarize(x) for x in full_children],
              "descendant_count": len(descendants),
              "descendant_titles": [
                  {"id": x.get("id"), "parent_id": x.get("parentId"), "title": x.get("title")}
                  for x in descendants
              ],
              "metadata_request_count": len(requested),
              "metadata_urls": requested,
              "response_file_downloads": 0,
              "response_content_opened": False,
          }
          out = Path("build/bbs_woth_source/output/source_inventory.json")
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({
              "root": result["root"],
              "direct_child_count": result["direct_child_count"],
              "direct_children": result["direct_children"],
              "descendant_count": result["descendant_count"],
              "descendant_titles": result["descendant_titles"],
              "response_file_downloads": 0,
              "response_content_opened": False,
          }, indent=2, sort_keys=True))
          PY
      - name: Assert response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path("build/bbs_woth_source/output/source_inventory.json").read_text())
          assert audit["response_file_downloads"] == 0
          assert audit["response_content_opened"] is False
          print("response-blind metadata inventory PASS")
          PY
      - name: Upload response-blind source evidence
        uses: actions/upload-artifact@v4
        with:
          name: bbs-woth-response-blind-source-inventory
          path: build/bbs_woth_source/output/source_inventory.json
          if-no-files-found: error
