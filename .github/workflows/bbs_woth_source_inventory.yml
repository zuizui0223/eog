name: BBS Wood Thrush response-blind source inventory

on:
  push:
    branches:
      - agent/bbs-woth-preflight
    paths:
      - ".github/workflows/bbs_woth_source_inventory.yml"
      - "validation/bbs_woth_complementarity/**"
  pull_request:
    paths:
      - ".github/workflows/bbs_woth_source_inventory.yml"
      - "validation/bbs_woth_complementarity/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve exact ending-2009 archive without response access
        run: |
          set -euo pipefail
          mkdir -p build/bbs_woth_source/input build/bbs_woth_source/output
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          from pathlib import Path
          import re
          import urllib.parse
          import urllib.request
          import zipfile

          root = Path("validation/bbs_woth_complementarity")
          contract = json.loads((root / "source_resolution_contract.json").read_text(encoding="utf-8"))
          sb_id = contract["upstream_release"]["sciencebase_item_id"]
          ending_year = int(contract["upstream_release"]["selected_archival_ending_year"])
          semantics = contract["response_independent_file_semantics"]
          forbidden = tuple(
              value.casefold()
              for value in contract["source_access_safety"]["forbidden_response_name_fragments_case_insensitive"]
          )
          ua = "EOG-BBS-WOTH-response-blind-archive-inventory/1.0"
          requested_metadata_urls: list[str] = []
          requested_file_urls: list[str] = []
          forbidden_response_file_requests = 0
          errors: list[str] = []

          def is_forbidden_name(value: str) -> bool:
              text = urllib.parse.unquote(str(value)).casefold()
              return any(fragment in text for fragment in forbidden)

          def get_bytes(url: str, *, metadata: bool, cap: int) -> tuple[bytes, str, dict[str, str]]:
              nonlocal forbidden_response_file_requests
              if not metadata and is_forbidden_name(url):
                  forbidden_response_file_requests += 1
                  raise RuntimeError(f"refused response-like file URL: {url}")
              (requested_metadata_urls if metadata else requested_file_urls).append(url)
              req = urllib.request.Request(url, headers={"User-Agent": ua})
              with urllib.request.urlopen(req, timeout=30) as response:
                  final_url = response.geturl()
                  headers = {key.lower(): value for key, value in response.headers.items()}
                  chunks = []
                  total = 0
                  while True:
                      chunk = response.read(min(1024 * 1024, cap + 1 - total))
                      if not chunk:
                          break
                      chunks.append(chunk)
                      total += len(chunk)
                      if total > cap:
                          raise RuntimeError(f"safe byte cap exceeded for {url}: {total}>{cap}")
              return b"".join(chunks), final_url, headers

          def get_json(url: str) -> dict:
              payload, final_url, headers = get_bytes(url, metadata=True, cap=8_000_000)
              try:
                  data = json.loads(payload.decode("utf-8"))
              except Exception as exc:
                  raise RuntimeError(f"ScienceBase metadata was not JSON: {url} -> {final_url}") from exc
              if not isinstance(data, dict):
                  raise RuntimeError(f"ScienceBase JSON root is not object: {url}")
              return data

          def item_id(item: dict) -> str | None:
              value = item.get("id") or item.get("_id")
              return str(value) if value else None

          def item_title(item: dict) -> str:
              return str(item.get("title") or item.get("name") or "").strip()

          def child_items(parent_id: str) -> list[dict]:
              url = (
                  "https://www.sciencebase.gov/catalog/items?"
                  + urllib.parse.urlencode({"parentId": parent_id, "format": "json", "max": 1000})
              )
              data = get_json(url)
              values = data.get("items", [])
              return [value for value in values if isinstance(value, dict)]

          root_url = f"https://www.sciencebase.gov/catalog/item/{sb_id}?format=json"
          root_item = get_json(root_url)
          first_level = child_items(sb_id)

          # The archive hub prospectively fixes ending year 2009.  Search only metadata
          # titles/identifiers; no avian response bytes are touched.
          year_pattern = re.compile(rf"(?<!\d){ending_year}(?!\d)")
          candidates = []
          for item in [root_item, *first_level]:
              title = item_title(item)
              if year_pattern.search(title):
                  candidates.append(item)

          # Some ScienceBase releases use one intermediate grouping level. Resolve at
          # most one extra metadata-only level, still bounded and response-blind.
          if not candidates:
              for parent in first_level:
                  pid = item_id(parent)
                  if not pid:
                      continue
                  for child in child_items(pid):
                      if year_pattern.search(item_title(child)):
                          candidates.append(child)

          unique_by_id = {}
          for item in candidates:
              pid = item_id(item)
              if pid:
                  unique_by_id[pid] = item
          candidates = list(unique_by_id.values())

          selected = None
          if len(candidates) == 1:
              selected = candidates[0]
          elif len(candidates) > 1:
              # Resolve only a uniquely self-identifying archival dataset title. Do not
              # choose among multiple 2009 items using response content or file sizes.
              preferred = [
                  item for item in candidates
                  if re.search(r"1966\s*[-–]\s*2009|ending\s+(?:with\s+)?(?:year\s+)?2009", item_title(item), re.I)
              ]
              if len(preferred) == 1:
                  selected = preferred[0]

          resolved: dict[str, dict] = {
              key: {"resolved": False, "attempts": []} for key in semantics
          }
          selected_meta = None
          seen_file_names: list[str] = []
          response_like_metadata_names: list[str] = []

          def collect_named_files(item: dict) -> list[dict]:
              records: list[dict] = []
              values = item.get("files", [])
              if isinstance(values, list):
                  records.extend(value for value in values if isinstance(value, dict))
              links = item.get("distributionLinks", [])
              if isinstance(links, list):
                  for value in links:
                      if not isinstance(value, dict):
                          continue
                      name = str(value.get("name") or value.get("title") or "").strip()
                      uri = value.get("uri") or value.get("url")
                      if name and uri:
                          records.append({"name": name, "downloadUri": uri, "source": "distributionLinks"})
              return records

          def canonical_file_url(record: dict) -> str | None:
              for key in ("downloadUri", "downloadUrl", "url", "uri"):
                  value = record.get(key)
                  if isinstance(value, str) and value.startswith(("https://", "http://")):
                      return value
              return None

          def normalized_member_names(archive: zipfile.ZipFile) -> list[str]:
              return [name for name in archive.namelist() if not name.endswith("/")]

          if selected is None:
              errors.append(
                  f"ending-{ending_year} archival item did not resolve uniquely from response-blind ScienceBase metadata; candidates="
                  + repr([(item_id(item), item_title(item)) for item in candidates])
              )
          else:
              sid = item_id(selected)
              if not sid:
                  errors.append("selected archival item has no ScienceBase id")
              else:
                  selected_full = get_json(f"https://www.sciencebase.gov/catalog/item/{sid}?format=json")
                  selected_meta = {"id": sid, "title": item_title(selected_full)}
                  scope_items = [selected_full]
                  for child in child_items(sid):
                      scope_items.append(child)
                      cid = item_id(child)
                      if cid:
                          try:
                              scope_items.append(get_json(f"https://www.sciencebase.gov/catalog/item/{cid}?format=json"))
                          except Exception as exc:
                              errors.append(f"child metadata fetch failed for {cid}: {exc!r}")

                  file_records: list[dict] = []
                  for item in scope_items:
                      file_records.extend(collect_named_files(item))
                  seen = set()
                  deduped = []
                  for record in file_records:
                      name = str(record.get("name") or record.get("title") or "").strip()
                      url = canonical_file_url(record)
                      key = (name.casefold(), url or "")
                      if name and key not in seen:
                          seen.add(key)
                          deduped.append(record)
                          seen_file_names.append(name)
                          if is_forbidden_name(name):
                              response_like_metadata_names.append(name)

                  for semantic, declaration in semantics.items():
                      expected = {name.casefold() for name in declaration["expected_names_case_insensitive"]}
                      matches = []
                      for record in deduped:
                          name = str(record.get("name") or record.get("title") or "").strip()
                          url = canonical_file_url(record)
                          if name.casefold() in expected and url and not is_forbidden_name(name) and not is_forbidden_name(url):
                              matches.append((name, url, record))
                      if len(matches) != 1:
                          resolved[semantic]["attempts"].append({
                              "status": "not_unique",
                              "matching_names": [name for name, _, _ in matches],
                          })
                          continue

                      name, url, record = matches[0]
                      cap = int(declaration["safe_uncompressed_byte_cap"])
                      try:
                          payload, final_url, headers = get_bytes(url, metadata=False, cap=cap)
                          output_name = name
                          archive_members = None
                          extracted_name = None
                          if payload.startswith(b"PK\x03\x04"):
                              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                                  archive_members = normalized_member_names(archive)
                                  if any(is_forbidden_name(member) for member in archive_members):
                                      raise RuntimeError(
                                          f"response-like member found inside supposed metadata archive {name}: {archive_members}"
                                      )
                                  target_suffix = ".csv" if semantic in {"routes", "weather"} else ".txt"
                                  plausible = [
                                      member for member in archive_members
                                      if Path(member).name.casefold().startswith(semantic.casefold())
                                      and Path(member).suffix.casefold() == target_suffix
                                  ]
                                  if semantic == "routes":
                                      plausible = [m for m in archive_members if Path(m).name.casefold() == "routes.csv"] or plausible
                                  elif semantic == "weather":
                                      plausible = [m for m in archive_members if Path(m).name.casefold() == "weather.csv"] or plausible
                                  if len(plausible) != 1:
                                      raise RuntimeError(
                                          f"could not uniquely resolve {semantic} payload inside {name}: {archive_members}"
                                      )
                                  payload = archive.read(plausible[0])
                                  extracted_name = Path(plausible[0]).name
                                  output_name = extracted_name
                                  if len(payload) > cap:
                                      raise RuntimeError(f"extracted {semantic} file exceeds byte cap")

                          out = Path("build/bbs_woth_source/input") / output_name
                          out.write_bytes(payload)
                          resolved[semantic] = {
                              "resolved": True,
                              "source_record_name": name,
                              "source_url": url,
                              "final_url": final_url,
                              "output_name": output_name,
                              "bytes": len(payload),
                              "sha256": hashlib.sha256(payload).hexdigest(),
                              "archive_members": archive_members,
                              "extracted_name": extracted_name,
                              "content_type": headers.get("content-type"),
                              "attempts": [{"status": "success"}],
                          }
                      except Exception as exc:
                          resolved[semantic]["attempts"].append({"status": "download_failed", "error": repr(exc)})

          audit = {
              "attempt_id": contract["attempt_id"],
              "transport": "USGS ScienceBase archival release",
              "selected_ending_year": ending_year,
              "selected_archival_item": selected_meta,
              "response_file_downloads": 0,
              "response_content_opened": False,
              "forbidden_response_file_requests": forbidden_response_file_requests,
              "response_like_names_seen_in_metadata_only": sorted(set(response_like_metadata_names)),
              "seen_file_names": sorted(set(seen_file_names)),
              "resolved": resolved,
              "errors": errors,
              "requested_metadata_urls": requested_metadata_urls,
              "requested_file_urls": requested_file_urls,
          }
          out = Path("build/bbs_woth_source/output/source_inventory.json")
          out.write_text(json.dumps(audit, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({
              "selected_archival_item": selected_meta,
              "response_file_downloads": 0,
              "response_content_opened": False,
              "forbidden_response_file_requests": forbidden_response_file_requests,
              "resolved": {key: value["resolved"] for key, value in resolved.items()},
              "errors": errors,
          }, indent=2, sort_keys=True))
          if selected is None or not all(value["resolved"] for value in resolved.values()):
              raise SystemExit(3)
          PY
      - name: Assert response firewall
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("build/bbs_woth_source/output/source_inventory.json")
          if not path.exists():
              raise SystemExit("source inventory was not written")
          audit = json.loads(path.read_text())
          assert audit["response_file_downloads"] == 0
          assert audit["response_content_opened"] is False
          assert audit["forbidden_response_file_requests"] == 0
          forbidden = ("50-stop", "fifty", "10-stop", "migrantnonbreeder", "surveywide", "states/")
          assert all(
              not any(fragment in url.casefold() for fragment in forbidden)
              for url in audit["requested_file_urls"]
          )
          print(json.dumps({
              "selected_archival_item": audit["selected_archival_item"],
              "response_file_downloads": audit["response_file_downloads"],
              "response_content_opened": audit["response_content_opened"],
              "resolved": {k: v["resolved"] for k, v in audit["resolved"].items()},
          }, indent=2, sort_keys=True))
          PY
      - name: Upload response-blind source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbs-woth-response-blind-source-inventory
          path: build/bbs_woth_source/output/
          if-no-files-found: error
