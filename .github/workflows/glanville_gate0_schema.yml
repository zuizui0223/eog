name: Glanville EOG-WF Gate 0 source schema

on:
  pull_request:
    paths:
      - ".github/workflows/glanville_gate0_schema.yml"
      - "validation/glanville_eogwf/gate0_source_process_contract.json"

permissions:
  contents: read

jobs:
  gate0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch exact public archive and verify identity
        run: |
          curl -L --fail --retry 3 \
            'https://zenodo.org/records/4987060/files/ECOG-04799.zip?download=1' \
            -o /tmp/ECOG-04799.zip
          test "$(md5sum /tmp/ECOG-04799.zip | awk '{print $1}')" = "69122a1d82b1fb970fb6638b02da3db4"
          sha256sum /tmp/ECOG-04799.zip | tee /tmp/archive_sha256.txt
      - name: Read archive manifest and README only
        run: |
          mkdir -p build/glanville_gate0/readme
          python - <<'PY'
          import json
          import pathlib
          import zipfile

          archive = pathlib.Path('/tmp/ECOG-04799.zip')
          out = pathlib.Path('build/glanville_gate0')
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              members = [
                  {
                      'name': info.filename,
                      'size': info.file_size,
                      'compressed_size': info.compress_size,
                      'crc32': f'{info.CRC:08x}',
                      'is_dir': info.is_dir(),
                  }
                  for info in zf.infolist()
              ]
              (out / 'archive_manifest.json').write_text(
                  json.dumps(members, indent=2, sort_keys=True) + '\n', encoding='utf-8'
              )
              readmes = []
              for info in zf.infolist():
                  base = pathlib.PurePosixPath(info.filename).name.lower()
                  if info.is_dir() or not (base.startswith('readme') or base in {'workflow.txt', 'metadata.txt'}):
                      continue
                  data = zf.read(info)
                  target = out / 'readme' / pathlib.PurePosixPath(info.filename).name
                  target.write_bytes(data)
                  readmes.append({'name': info.filename, 'size': info.file_size})
              (out / 'readme_manifest.json').write_text(
                  json.dumps(readmes, indent=2, sort_keys=True) + '\n', encoding='utf-8'
              )
          print(json.dumps({'archive_members': len(members), 'readmes_extracted': readmes}, indent=2))
          PY
          cp /tmp/archive_sha256.txt build/glanville_gate0/archive_sha256.txt
      - name: Prove response files were not extracted
        run: |
          find build/glanville_gate0 -maxdepth 2 -type f -print
          test -s build/glanville_gate0/archive_manifest.json
          test -s build/glanville_gate0/readme_manifest.json
      - name: Upload Gate 0 metadata only
        uses: actions/upload-artifact@v4
        with:
          name: glanville-eogwf-gate0-schema
          path: build/glanville_gate0
