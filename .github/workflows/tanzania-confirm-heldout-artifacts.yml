name: Confirm independent Tanzania held-out artifacts

on:
  push:
    branches:
      - agent/tanzania-heldout-benchmark
    paths:
      - .github/workflows/tanzania-confirm-heldout-artifacts.yml

permissions:
  actions: read
  contents: write

env:
  SOURCE_RUN_ID: '31429564379'
  NEW_CANDIDATE_FINGERPRINT: '3cabff50f138f7ccfe77cdbe87aefe14d5ec4dd40db15f16fb7b072cd3d01026'
  OLD_RESULT_FINGERPRINT: 'df4667532ea7c7e4cfe372488d6a6cf86186cdaf19b90b6638f8a17e82dc9621'

jobs:
  verify-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tanzania-heldout-benchmark
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen aggregation dependencies
        run: python -m pip install . numpy==2.2.6
      - uses: actions/download-artifact@v4
        with:
          pattern: tanzania-heldout-shard-*-31429564379
          path: results/downloaded_shards
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: tanzania-current-flow-candidate-library-31429564379
          path: results/candidate_artifact
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: tanzania-heldout-inputs-31429564379
          path: results/input_artifact
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Aggregate independently generated shards without relaxing result checks
        run: |
          set -euo pipefail
          mkdir -p results/shards_flat results/tanzania_heldout_confirmation
          find results/downloaded_shards -type f \( -name '*.json' -o -name '*.jsonl' \) -exec cp '{}' results/shards_flat/ \;
          DESIGN="$(find results/input_artifact -type f -name design_contract.json -print -quit)"
          FEATURE_MANIFEST="$(find results/input_artifact -type f -path '*/features/feature_manifest.json' -print -quit)"
          CANDIDATE_MANIFEST="$(find results/candidate_artifact -type f -name candidate_manifest.json -print -quit)"
          test -n "$DESIGN" && test -n "$FEATURE_MANIFEST" && test -n "$CANDIDATE_MANIFEST"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path('benchmarks/tanzania_heldout_expected.json')
          value = json.loads(source.read_text())
          assert value['results_frozen'] is True
          assert value['expected_projection']['result_fingerprint'] == os.environ['OLD_RESULT_FINGERPRINT']
          value['results_frozen'] = False
          value['required_inputs']['candidate_library_fingerprint'] = os.environ['NEW_CANDIDATE_FINGERPRINT']
          Path('results/unfrozen_confirmation_contract.json').write_text(
              json.dumps(value, indent=2) + '\n'
          )
          PY
          python benchmarks/aggregate_tanzania_heldout_benchmark.py \
            --input-dir results/shards_flat \
            --design-contract "$DESIGN" \
            --feature-manifest "$FEATURE_MANIFEST" \
            --candidate-manifest "$CANDIDATE_MANIFEST" \
            --selection-contract benchmarks/tanzania_current_flow_selection_contract.json \
            --expected results/unfrozen_confirmation_contract.json \
            --output-dir results/tanzania_heldout_confirmation
      - name: Require exact scientific reproduction and freeze the updated identity
        run: |
          python - <<'PY'
          from copy import deepcopy
          import difflib
          import json
          import os
          from pathlib import Path

          expected_path = Path('benchmarks/tanzania_heldout_expected.json')
          old = json.loads(expected_path.read_text())
          new = json.loads(
              Path('results/tanzania_heldout_confirmation/heldout_expected_suggestion.json').read_text()
          )
          new_fp = os.environ['NEW_CANDIDATE_FINGERPRINT']
          assert new['results_frozen'] is True
          assert new['required_inputs']['candidate_library_fingerprint'] == new_fp
          assert new['expected_projection']['input_fingerprints']['candidate_library_fingerprint'] == new_fp

          normalized_old = deepcopy(old)
          normalized_new = deepcopy(new)
          normalized_old['required_inputs']['candidate_library_fingerprint'] = new_fp
          normalized_old['expected_projection']['input_fingerprints']['candidate_library_fingerprint'] = new_fp
          old_result_fp = normalized_old['expected_projection'].pop('result_fingerprint')
          new_result_fp = normalized_new['expected_projection'].pop('result_fingerprint')
          assert old_result_fp == os.environ['OLD_RESULT_FINGERPRINT']
          if normalized_old != normalized_new:
              left = json.dumps(normalized_old, sort_keys=True, indent=2).splitlines()
              right = json.dumps(normalized_new, sort_keys=True, indent=2).splitlines()
              raise AssertionError(
                  '\n'.join(difflib.unified_diff(left, right, fromfile='first', tofile='independent'))
              )

          new['scientific_boundary'] = (
              'held-out result projection independently reproduced after all official '
              'source bytes, 1,024 current-flow candidates, 60 species, folds, selection, '
              'prediction, scoring, and inference were regenerated'
          )
          expected_path.write_text(json.dumps(new, indent=2) + '\n')
          Path('results/tanzania_heldout_confirmation/verification.json').write_text(
              json.dumps({
                  'source_run_id': int(os.environ['SOURCE_RUN_ID']),
                  'old_result_fingerprint': old_result_fp,
                  'verified_result_fingerprint': new_result_fp,
                  'candidate_library_fingerprint': new_fp,
                  'all_scientific_projection_fields_identical': True,
              }, indent=2) + '\n'
          )
          print(json.dumps({
              'old_result_fingerprint': old_result_fp,
              'verified_result_fingerprint': new_result_fp,
              'primary': new['expected_projection']['contrasts']['primary::primary_loso'],
          }, indent=2))
          PY
      - name: Finalize the result document
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = json.loads(Path('benchmarks/tanzania_heldout_expected.json').read_text())
          fingerprint = expected['expected_projection']['result_fingerprint']
          path = Path('docs/tanzania_heldout_result.md')
          text = path.read_text()
          start = text.index('## Verification status')
          end = text.index('\n## Strict primary contrast', start)
          replacement = '\n'.join([
              '## Verification status',
              '',
              'The complete benchmark was independently regenerated from the official Dryad',
              'version bytes through all 1,024 regional current-flow candidates, 60-species',
              'training-only resistance selection, held-out prediction, scoring, and',
              'species-cluster inference. The independent execution preserved every prediction,',
              'group, species, contrast, selected-candidate count, confidence interval, and',
              'p-value from the first run.',
              '',
              'The verified result fingerprint is:',
              '',
              f'`{fingerprint}`',
              '',
              'A separate audit found harmless sparse-LU differences below `3.96e-10` in the',
              'upstream West current-flow library. Because a few values straddled a seven-decimal',
              'rounding boundary, cross-run diagnostic hashes were corrected to six decimals;',
              'raw float64 model inputs were never rounded or altered. The correction, its',
              'post-result timing, and its inability to affect the biological contrast are',
              'recorded in `tanzania_current_flow_fingerprint_policy.md`.',
              '',
          ])
          text = text[:start] + replacement + text[end:]
          text = text.replace('### First execution', '### Independently reproduced result')
          text = text.replace(
              'Thus the first execution indicates that adding',
              'The independently reproduced result shows that adding',
          )
          text = text.replace(
              'If independently reproduced, this result would not invalidate',
              'This independently reproduced result does not invalidate',
          )
          text = text.replace(
              'It would show a narrower boundary:',
              'It establishes a narrower boundary:',
          )
          path.write_text(text)
          PY
          rm .github/workflows/tanzania-confirm-heldout-artifacts.yml
      - uses: actions/upload-artifact@v4
        with:
          name: tanzania-independent-heldout-confirmation-${{ github.run_id }}
          path: |
            results/tanzania_heldout_confirmation/
            benchmarks/tanzania_heldout_expected.json
            docs/tanzania_heldout_result.md
          if-no-files-found: error
      - name: Commit the independently verified result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            benchmarks/tanzania_heldout_expected.json \
            docs/tanzania_heldout_result.md \
            .github/workflows/tanzania-confirm-heldout-artifacts.yml
          git commit -m "Confirm Tanzania held-out result independently [skip ci]"
          git push origin HEAD:agent/tanzania-heldout-benchmark
