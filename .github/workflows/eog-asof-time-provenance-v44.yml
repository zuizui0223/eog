name: EOG v44 cutoff-only future state information

on:
  pull_request:
    paths:
      - 'validation/eog_original_idea_asof_time_source_v44/**'
      - 'benchmarks/run_eog_asof_time_provenance_v44.py'
      - 'tests/test_eog_asof_time_provenance_v44.py'
      - 'docs/eog_original_idea_asof_time_provenance_v44.md'
      - '.github/workflows/eog-asof-time-provenance-v44.yml'
  push:
    branches: [main]
    paths:
      - 'validation/eog_original_idea_asof_time_source_v44/**'
      - 'benchmarks/run_eog_asof_time_provenance_v44.py'
      - 'tests/test_eog_asof_time_provenance_v44.py'
      - '.github/workflows/eog-asof-time-provenance-v44.yml'

permissions:
  contents: read

jobs:
  cutoff-only-source-information:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original known-truth package and tests
        run: python -m pip install -e .[dev]
      - name: Test time cutoff, future-tag poison, age map and exact conditional Bayes
        run: python -m pytest -q tests/test_eog_asof_time_provenance_v44.py
      - name: Recompute original v41 source SHA256 and all four fixed strictly future panels
        run: |
          python benchmarks/run_eog_asof_time_provenance_v44.py \
            --output-dir build/v44
      - name: Enforce same 768 worlds, no future observation, 4x2x3 complete estimator and full receipt
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          d=Path('build/v44')
          z=json.loads((d/'result_v44.json').read_text(encoding='utf-8'))
          p=json.loads(Path('validation/eog_original_idea_asof_time_source_v44/protocol_v44.json').read_text())
          with (d/'per_world_asof_v44.csv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert z['schema']=='eog.original_idea.asof_time_source_tag_information.result.v44'
          assert z['status']=='CUTOFF_ONLY_SYNTHETIC_SOURCE_INFORMATION_FOR_FUTURE_STATE__NO_EMPIRICAL_SCORE'
          assert z['populations']['base_worlds']==768
          assert z['populations']['world_panel_target_policy_rows']==len(rows)==768*4*2*3
          assert len(z['summary_by_panel_target_policy'])==4*2*3*2
          assert z['parent_v41_full_canonical_sha256_reproduced']==p['parent']['v41_complete_result_sha256']
          assert z['parent_v43_retrospective_result_sha256_attested']==p['parent']['v43_complete_result_sha256']
          assert z['controls']['unoccupied_future_source_tag_leakage_violations']==0
          assert z['controls']['perfect_tag_data_processing_violations']==0
          assert z['controls']['future_occupancy_snapshot_in_observation_model'] is False
          assert z['controls']['post_cutoff_source_tag_used_as_observed'] is False
          assert z['controls']['original_v43_12_of_12_retrospective_rescue_rescored'] is False
          assert z['populations']['future_target_t6_exact_t4_occupancy_identity_worlds']==768
          assert set(z['predeclared_hypothesis_verdicts'])=={x['id'] for x in p['predeclared_hypotheses']}
          assert all(v in ('SUPPORTED','REFUTED') for v in z['predeclared_hypothesis_verdicts'].values())
          assert z['predeclared_hypothesis_verdicts']['A4_lag2_maturity_at_t6_is_already_known_from_full_t4_occupancy']=='SUPPORTED'
          assert z['scientific_boundaries']==p['scientific_boundaries']
          assert hashlib.sha256((d/'per_world_asof_v44.csv').read_bytes()).hexdigest()==z['full_csv_sha256']
          assert len({(r['design_key'],r['panel'],r['target'],r['policy']) for r in rows})==len(rows)
          for r in rows:
              assert int(r['future_target_time'])>int(r['cutoff_time'])
              assert float(r['perfect_cutoff_tag_information_bits'])+1e-8>=float(r['added_source_information_bits'])
              assert float(r['perfect_cutoff_tag_accuracy_gain'])+1e-8>=float(r['added_target_bayes_accuracy_gain'])
              assert float(r['added_source_information_bits'])>=-1e-8
              assert float(r['mean_cutoff_occupied_selected_sites'])<=float(r['mean_nominal_selected_sites'])+1e-8
              if r['panel']=='identity_control' and r['target']=='persistent_threshold_lag2':
                  assert abs(float(r['baseline_target_conditional_entropy_bits']))<1e-9
                  assert abs(float(r['added_source_information_bits']))<1e-9
          frozen=Path('validation/eog_original_idea_asof_time_source_v44/result_frozen_v44.json')
          result_canonical=json.dumps(z,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode('utf-8')
          print('V44_FULL_RESULT_CANONICAL_SHA256', hashlib.sha256(result_canonical).hexdigest())
          print('V44_SCENARIO_CSV_SHA256', z['full_csv_sha256'])
          print('V44_PRIMARY_MATURITY_RESULTS', json.dumps(z['primary_early_t2_to_t5_maturity'],sort_keys=True))
          print('V44_FIXED_VERDICTS', json.dumps(z['predeclared_hypothesis_verdicts'],sort_keys=True))
          if frozen.is_file():
              x=json.loads(frozen.read_text(encoding='utf-8'))
              assert x['schema']=='eog.original_idea.asof_time_source_tag_information.frozen_review_v44'
              canon=json.dumps(z,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode('utf-8')
              assert hashlib.sha256(canon).hexdigest()==x['authority']['full_canonical_result_sha256']
              assert x['authority']['full_csv_sha256']==z['full_csv_sha256']
              assert x['predeclared_hypothesis_verdicts']==z['predeclared_hypothesis_verdicts']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EOG-V44-CUTOFF-ONLY-FUTURE-STATE-AGGREGATES
          path: build/v44/
          if-no-files-found: warn
