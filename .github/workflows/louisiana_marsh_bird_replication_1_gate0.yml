name: Louisiana marsh-bird replication 1 Gate0

on:
  push:
    branches:
      - agent/louisiana-marsh-bird-heterogeneous-replication-1
    paths:
      - "validation/louisiana_marsh_bird_replication_1/**"
      - ".github/workflows/louisiana_marsh_bird_replication_1_gate0.yml"

permissions:
  contents: read

jobs:
  response-blind-gate0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run official Sites and Samples preflight
        run: python validation/louisiana_marsh_bird_replication_1/run_gate0_sites_samples.py
      - name: Assert biological response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/louisiana_marsh_bird_replication_1/gate0_sites_samples.json')
          r = json.loads(p.read_text())
          a = r['audit']
          assert r['status'] == 'response_blind_sites_and_sampling_payloads_pass'
          assert r['sites']['row_count'] == 33
          assert r['samples']['row_count'] == 20
          assert a['biological_response_payload_requests'] == 0
          assert a['biological_response_payload_bytes_opened'] == 0
          assert a['biological_response_header_bytes_opened'] == 0
          assert a['biological_response_rows_opened'] is False
          assert a['biological_response_values_opened'] is False
          assert a['model_fits'] == 0
          assert a['heldout_scores'] == 0
          print(json.dumps(r, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: louisiana-marsh-bird-replication-1-gate0
          path: build/louisiana_marsh_bird_replication_1/gate0_sites_samples.json
          if-no-files-found: error
