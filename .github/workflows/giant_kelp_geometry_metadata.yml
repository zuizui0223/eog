name: Giant kelp geometry metadata Gate

on:
  push:
    branches:
      - agent/giant-kelp-preflight
    paths:
      - ".github/workflows/giant_kelp_geometry_metadata.yml"
      - "validation/giant_kelp_complementarity/geometry_metadata_contract.json"
  pull_request:
    paths:
      - ".github/workflows/giant_kelp_geometry_metadata.yml"
      - "validation/giant_kelp_complementarity/geometry_metadata_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve frozen EDI geometry DOI and metadata transport only
        run: |
          set -euo pipefail
          mkdir -p build/giant_kelp_geometry_metadata
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, urllib.parse, urllib.request
          from pathlib import Path

          ROOT=Path('validation/giant_kelp_complementarity')
          OUT=Path('build/giant_kelp_geometry_metadata')
          contract=json.loads((ROOT/'geometry_metadata_contract.json').read_text(encoding='utf-8'))
          md5seg=contract['geometry_package']['doi_md5_segment']
          UA='eog-giant-kelp-geometry-metadata/1.2'
          forbidden_segments=[value.split('/')[-1] for value in contract['forbidden_packages']]
          fetched=[]

          def fetch(url: str, *, accept='text/html,application/xml,text/xml,text/plain,*/*'):
              if any(segment in url for segment in forbidden_segments):
                  raise RuntimeError('forbidden non-geometry package URL encountered')
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':accept})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      body=r.read(); status=getattr(r,'status',None) or r.getcode()
                      final=str(r.geturl()); ctype=str(r.headers.get('Content-Type',''))
                  fetched.append({'requested':url,'final':final,'status':status,'bytes':len(body),'content_type':ctype,'sha256':hashlib.sha256(body).hexdigest()})
                  return body,final,ctype,None
              except Exception as exc:
                  fetched.append({'requested':url,'error':f'{type(exc).__name__}: {exc}'})
                  return b'',url,'',f'{type(exc).__name__}: {exc}'

          doi_url=f'https://doi.org/10.6073/pasta/{md5seg}'
          landing,landing_final,landing_type,landing_error=fetch(doi_url)
          if landing_error:
              raise RuntimeError(f'geometry DOI resolution failed: {landing_error}')
          landing_text=landing.decode('utf-8','replace')
          patterns=(
              r'packageid=([A-Za-z0-9_-]+\.\d+\.\d+)',
              r'packageId["\'=:\s]+([A-Za-z0-9_-]+\.\d+\.\d+)',
              r'\b((?:knb-lter-[A-Za-z0-9_-]+|edi)\.\d+\.\d+)\b',
          )
          package_ids=[]
          for text in (landing_final,urllib.parse.unquote(landing_final),landing_text):
              for pattern in patterns:
                  package_ids.extend(re.findall(pattern,text,re.IGNORECASE))
          package_ids=sorted(set(package_ids))
          if len(package_ids)!=1:
              raise RuntimeError(f'expected one EDI package id from DOI landing; found {package_ids!r}, final={landing_final!r}')
          package_id=package_ids[0]
          scope,identifier,revision=package_id.rsplit('.',2)

          pasta_metadata=f'https://pasta.lternet.edu/package/metadata/eml/{scope}/{identifier}/{revision}'
          pasta_body,pasta_final,pasta_type,pasta_error=fetch(pasta_metadata,accept='application/xml,text/xml,*/*')

          portal_url=f'https://portal.edirepository.org/nis/metadataviewer?packageid={urllib.parse.quote(package_id)}'
          portal_body,portal_final,portal_type,portal_error=fetch(portal_url)
          portal_text=portal_body.decode('utf-8','replace') if portal_body else ''

          # Inventory only publicly rendered metadata/link text. Never follow data links here.
          url_candidates=sorted(set(re.findall(r'https?://[^"\'<>\s]+',portal_text)))
          geometry_like_links=[u for u in url_candidates if any(token in u.casefold() for token in ('package/data/','download','spatial','kelp','patch'))]
          entity_id_candidates=sorted(set(re.findall(r'/package/data/eml/[^/]+/[^/]+/[^/]+/([^"\'<>/?#\s]+)',portal_text)))
          object_name_candidates=sorted(set(re.findall(r'([A-Za-z0-9_.-]+\.(?:csv|txt|shp|dbf|shx|prj|kml|kmz|geojson|zip))',portal_text,re.IGNORECASE)))
          text_fold=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',portal_text)).casefold()

          payload={
              'status':'geometry_metadata_transport_inventory_complete',
              'candidate':contract['candidate'],
              'preflight_result_fingerprint':contract['preflight_result_fingerprint'],
              'geometry_doi':contract['geometry_package']['doi'],
              'package_id':package_id,
              'scope':scope,
              'identifier':identifier,
              'revision':revision,
              'doi_landing_final_url':landing_final,
              'doi_landing_content_type':landing_type,
              'pasta_metadata_url':pasta_metadata,
              'pasta_metadata_error':pasta_error,
              'pasta_metadata_sha256':hashlib.sha256(pasta_body).hexdigest() if pasta_body else None,
              'portal_metadata_url':portal_url,
              'portal_metadata_error':portal_error,
              'portal_metadata_sha256':hashlib.sha256(portal_body).hexdigest() if portal_body else None,
              'portal_contains_expected_title_terms':all(term.casefold() in text_fold for term in contract['geometry_package']['expected_title_terms']),
              'portal_entity_id_candidates':entity_id_candidates,
              'portal_object_name_candidates':object_name_candidates,
              'portal_geometry_like_links':geometry_like_links[:50],
              'response_package_bytes_opened':False,
              'response_rows_opened':False,
              'geometry_entity_data_bytes_opened':False,
              'network_fetches':fetched,
              'next':'freeze exact geometry entity from metadata if identifiable; otherwise preserve transport-blocked status without opening response',
          }
          payload['fingerprint']=hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          out=OUT/'geometry_metadata_result.json'
          out.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - name: Assert metadata-only firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('build/giant_kelp_geometry_metadata/geometry_metadata_result.json'))
          assert p['status']=='geometry_metadata_transport_inventory_complete'
          assert p['response_package_bytes_opened'] is False
          assert p['response_rows_opened'] is False
          assert p['geometry_entity_data_bytes_opened'] is False
          assert p['package_id']
          PY
      - name: Upload geometry metadata evidence
        uses: actions/upload-artifact@v4
        with:
          name: giant-kelp-geometry-metadata
          path: build/giant_kelp_geometry_metadata/geometry_metadata_result.json
          if-no-files-found: error
