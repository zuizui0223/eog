name: Giant kelp geometry metadata Gate

on:
  push:
    branches:
      - agent/giant-kelp-preflight
    paths:
      - ".github/workflows/giant_kelp_geometry_metadata.yml"
      - "validation/giant_kelp_complementarity/geometry_metadata_contract.json"
  pull_request:
    paths:
      - ".github/workflows/giant_kelp_geometry_metadata.yml"
      - "validation/giant_kelp_complementarity/geometry_metadata_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve frozen EDI geometry DOI and EML only
        run: |
          set -euo pipefail
          mkdir -p build/giant_kelp_geometry_metadata
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          ROOT=Path('validation/giant_kelp_complementarity')
          OUT=Path('build/giant_kelp_geometry_metadata')
          contract=json.loads((ROOT/'geometry_metadata_contract.json').read_text(encoding='utf-8'))
          md5seg=contract['geometry_package']['doi_md5_segment']
          UA='eog-giant-kelp-geometry-metadata/1.1'
          fetched=[]
          forbidden_segments=[value.split('/')[-1] for value in contract['forbidden_packages']]

          def get_bytes(url: str, *, accept: str='text/plain,application/xml,text/xml,text/html,*/*') -> tuple[bytes,str,str]:
              if any(segment in url for segment in forbidden_segments):
                  raise RuntimeError('forbidden non-geometry package URL encountered')
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':accept})
              with urllib.request.urlopen(req,timeout=60) as r:
                  body=r.read()
                  ctype=str(r.headers.get('Content-Type',''))
                  final=str(r.geturl())
              fetched.append({'requested':url,'final':final,'bytes':len(body),'content_type':ctype,'sha256':hashlib.sha256(body).hexdigest()})
              return body,final,ctype

          # The PASTA DOI REST endpoint currently returns HTTP 403 to hosted Actions.
          # Resolve only the frozen geometry DOI through doi.org, then extract the immutable
          # EDI package id from the landing redirect/body. This changes transport, not science.
          public_doi_url=f'https://doi.org/10.6073/pasta/{md5seg}'
          landing_bytes,landing_final,landing_type=get_bytes(public_doi_url)
          landing_text=landing_bytes.decode('utf-8','replace')
          package_patterns=(
              r'packageid=([A-Za-z0-9_-]+\.\d+\.\d+)',
              r'packageId["\'=:\s]+([A-Za-z0-9_-]+\.\d+\.\d+)',
              r'\b((?:knb-lter-[A-Za-z0-9_-]+|edi)\.\d+\.\d+)\b',
          )
          package_ids=[]
          for text in (landing_final,urllib.parse.unquote(landing_final),landing_text):
              for pattern in package_patterns:
                  package_ids.extend(re.findall(pattern,text,re.IGNORECASE))
          package_ids=sorted(set(package_ids))
          if len(package_ids)!=1:
              raise RuntimeError(f'could not resolve one EDI package id from DOI landing; found {package_ids!r}, final={landing_final!r}')
          package_id=package_ids[0]
          scope,identifier,revision=package_id.rsplit('.',2)

          metadata_url=f'https://pasta.lternet.edu/package/metadata/eml/{scope}/{identifier}/{revision}'
          eml_bytes,metadata_final,metadata_type=get_bytes(metadata_url,accept='application/xml,text/xml,*/*')
          eml_text=eml_bytes.decode('utf-8-sig')
          root=ET.fromstring(eml_bytes)

          def lname(tag: str) -> str:
              return tag.rsplit('}',1)[-1]
          def child_text(node, target: str) -> str:
              for child in node:
                  if lname(child.tag)==target:
                      return ' '.join(''.join(child.itertext()).split())
              return ''
          def descendant_text(node, target: str) -> str:
              for child in node.iter():
                  if lname(child.tag)==target:
                      return ' '.join(''.join(child.itertext()).split())
              return ''

          title=descendant_text(root,'title')
          title_fold=title.casefold()
          missing_terms=[term for term in contract['geometry_package']['expected_title_terms'] if term.casefold() not in title_fold]
          if missing_terms:
              raise RuntimeError(f'geometry title missing expected terms {missing_terms}: {title!r}')

          entity_nodes=[]
          for node in root.iter():
              kind=lname(node.tag)
              if kind not in {'dataTable','spatialRaster','spatialVector','storedProcedure','view'}:
                  continue
              entity_name=child_text(node,'entityName')
              entity_id=str(node.attrib.get('id','')).strip()
              object_name=''
              distribution_url=''
              checksum=''
              physical=next((c for c in node if lname(c.tag)=='physical'),None)
              if physical is not None:
                  object_name=descendant_text(physical,'objectName')
                  distribution_url=descendant_text(physical,'url')
                  checksum=descendant_text(physical,'checksum')
              attrs=[]
              for attr in node.iter():
                  if lname(attr.tag)!='attribute':
                      continue
                  attrs.append({
                      'name':descendant_text(attr,'attributeName'),
                      'label':descendant_text(attr,'attributeLabel'),
                      'definition':descendant_text(attr,'attributeDefinition'),
                      'unit':descendant_text(attr,'standardUnit') or descendant_text(attr,'customUnit'),
                  })
              entity_nodes.append({
                  'kind':kind,
                  'eml_entity_id':entity_id,
                  'entity_name':entity_name,
                  'object_name':object_name,
                  'distribution_url':distribution_url,
                  'eml_checksum':checksum,
                  'attributes':attrs,
              })
          if not entity_nodes:
              raise RuntimeError('geometry EML contains no data/spatial entities')

          # Entity-name/checksum service calls are metadata only. If the name endpoint is
          # blocked, EML entity/object identifiers remain durable evidence; do not open data.
          names=[]
          names_error=None
          names_url=f'https://pasta.lternet.edu/package/name/eml/{scope}/{identifier}/{revision}'
          try:
              names_bytes,_,_=get_bytes(names_url)
              for line in names_bytes.decode('utf-8-sig').splitlines():
                  line=line.strip()
                  if not line:
                      continue
                  parts=line.split(',',1)
                  names.append({'entity_id':parts[0].strip(),'name':parts[1].strip() if len(parts)>1 else ''})
          except Exception as exc:
              names_error=f'{type(exc).__name__}: {exc}'

          checksum_rows=[]
          checksum_errors=[]
          for row in names:
              eid=row['entity_id']
              checksum_url=f'https://pasta.lternet.edu/package/data/checksum/eml/{scope}/{identifier}/{revision}/{urllib.parse.quote(eid,safe="")}'
              try:
                  checksum_bytes,_,_=get_bytes(checksum_url)
                  checksum_rows.append({**row,'sha1':checksum_bytes.decode('utf-8-sig').strip()})
              except Exception as exc:
                  checksum_errors.append({'entity_id':eid,'error':f'{type(exc).__name__}: {exc}'})

          payload={
              'status':'geometry_metadata_manifest_complete',
              'candidate':contract['candidate'],
              'preflight_result_fingerprint':contract['preflight_result_fingerprint'],
              'geometry_doi':contract['geometry_package']['doi'],
              'doi_landing_final_url':landing_final,
              'doi_landing_content_type':landing_type,
              'package_id':package_id,
              'scope':scope,
              'identifier':identifier,
              'revision':revision,
              'metadata_url':metadata_url,
              'metadata_final_url':metadata_final,
              'metadata_content_type':metadata_type,
              'metadata_sha256':hashlib.sha256(eml_bytes).hexdigest(),
              'title':title,
              'entity_names_and_checksums':checksum_rows,
              'entity_name_endpoint_error':names_error,
              'entity_checksum_errors':checksum_errors,
              'eml_entities':entity_nodes,
              'response_package_bytes_opened':False,
              'response_rows_opened':False,
              'geometry_entity_data_bytes_opened':False,
              'network_fetches':fetched,
              'next':contract['next_if_manifest_resolves'],
          }
          payload['fingerprint']=hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          (OUT/'geometry_metadata_result.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - name: Assert metadata-only firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('build/giant_kelp_geometry_metadata/geometry_metadata_result.json'))
          assert p['status']=='geometry_metadata_manifest_complete'
          assert p['response_package_bytes_opened'] is False
          assert p['response_rows_opened'] is False
          assert p['geometry_entity_data_bytes_opened'] is False
          assert p['eml_entities']
          PY
      - name: Upload geometry metadata evidence
        uses: actions/upload-artifact@v4
        with:
          name: giant-kelp-geometry-metadata
          path: build/giant_kelp_geometry_metadata/geometry_metadata_result.json
          if-no-files-found: error
