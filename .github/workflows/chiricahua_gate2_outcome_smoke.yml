name: Chiricahua Gate 2 once-only outcome runner synthetic smoke

on:
  pull_request:
    paths:
      - ".github/workflows/chiricahua_gate2_outcome_smoke.yml"
      - "benchmarks/run_chiricahua_gate2_outcome.py"
      - "benchmarks/run_chiricahua_gate2_nonresponse.py"
      - "validation/chiricahua_two_layer/gate2_prediction_comparator_contract.json"
      - "validation/chiricahua_two_layer/gate2_amendment_v1_1.json"
      - "validation/chiricahua_two_layer/gate2_amendment_v1_2.json"
      - "validation/chiricahua_two_layer/gate2_nonresponse_result.json"
      - "src/eog/dynamic_island_reachability.py"
      - "src/eog/v2/world_forecast.py"
      - "src/eog/v2/world_predictive_summary.py"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen numerical runtime and EOG
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==2.3.2' \
            'scipy==1.16.1' \
            'scikit-learn==1.7.1' \
            .
          mkdir -p build/chiricahua_gate2_smoke
          python -m pip freeze > build/chiricahua_gate2_smoke/runtime_freeze.txt

      - name: Fetch exact response-free Figshare inputs only
        run: |
          curl -L --fail --retry 3 'https://ndownloader.figshare.com/files/10458202' -o /tmp/coords.dryad.csv
          curl -L --fail --retry 3 'https://ndownloader.figshare.com/files/10458193' -o /tmp/water.dryad.csv
          curl -L --fail --retry 3 'https://ndownloader.figshare.com/files/10458190' -o /tmp/temp.wide.dryad.csv
          curl -L --fail --retry 3 'https://ndownloader.figshare.com/files/10458196' -o /tmp/wind.wide.dryad.csv
          test "$(md5sum /tmp/coords.dryad.csv | awk '{print $1}')" = '3df38d6b4aa7d52f8dea01aa6d8ca164'
          test "$(md5sum /tmp/water.dryad.csv | awk '{print $1}')" = '63deb40bf290a794cd39dc760629f4ab'
          test "$(md5sum /tmp/temp.wide.dryad.csv | awk '{print $1}')" = 'c32a57c8053e34d71990f0fa6e0bb95b'
          test "$(md5sum /tmp/wind.wide.dryad.csv | awk '{print $1}')" = '6ff1e576989da12d728951517a81967d'

      - name: Run complete synthetic smoke before response access
        run: |
          test ! -e /tmp/y.wide.dryad.csv
          python benchmarks/run_chiricahua_gate2_outcome.py \
            --coords /tmp/coords.dryad.csv \
            --hydroperiod /tmp/water.dryad.csv \
            --temperature /tmp/temp.wide.dryad.csv \
            --wind /tmp/wind.wide.dryad.csv \
            --synthetic-smoke \
            --output build/chiricahua_gate2_smoke/result.json \
            --annual-output build/chiricahua_gate2_smoke/annual_metrics.csv \
            --prediction-output build/chiricahua_gate2_smoke/predictions.csv
          python - <<'PY'
          import json
          import pathlib
          result = json.loads(pathlib.Path('build/chiricahua_gate2_smoke/result.json').read_text())
          assert result['status'] == 'gate2_outcome_runner_synthetic_smoke_pass'
          assert result['response_file_read'] is False
          assert result['response_rows_opened'] is False
          assert result['model_fits']['dynamic_occupancy_hmm']['estimable'] is True
          assert result['heldout_scoring_complete'] is True
          print(json.dumps({
              'status': result['status'],
              'fingerprint': result['result_fingerprint'],
              'hmm_nll': result['model_fits']['dynamic_occupancy_hmm']['negative_log_likelihood'],
              'runtime': result['runtime'],
          }, indent=2, sort_keys=True))
          PY

      - name: Prove empirical response remained absent and remove source bytes
        if: always()
        run: |
          test ! -e /tmp/y.wide.dryad.csv
          rm -f /tmp/coords.dryad.csv /tmp/water.dryad.csv /tmp/temp.wide.dryad.csv /tmp/wind.wide.dryad.csv

      - name: Upload response-free synthetic smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chiricahua-gate2-outcome-runner-smoke
          path: build/chiricahua_gate2_smoke
