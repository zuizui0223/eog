name: BBS Northern Bobwhite replication 2 Gate4

on:
  push:
    branches:
      - agent/bbs-northern-bobwhite-replication-2
    paths:
      - validation/bbs_northern_bobwhite_replication_2/gate4_prospective_estimability_contract.json
      - validation/bbs_northern_bobwhite_replication_2/gate4_prospective_estimability.py
      - tests/test_bbs_northern_bobwhite_gate4_estimability.py
      - .github/workflows/bbs_northern_bobwhite_replication_2_gate4.yml

permissions:
  contents: read

jobs:
  gate4:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile prospective estimability gate
        run: python -m py_compile validation/bbs_northern_bobwhite_replication_2/gate4_prospective_estimability.py
      - name: Run response-blind prospective estimability gate
        run: python validation/bbs_northern_bobwhite_replication_2/gate4_prospective_estimability.py
      - name: Assert uncertainty and response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('build/bbs_northern_bobwhite_replication_2/gate4_prospective_estimability.json')
          result = json.loads(path.read_text())
          assert result['status'] == 'uncertain_pre_response'
          assert result['disposition'] == 'continue_response_blind_exact_gate_required'
          assert result['exact_count_gate_required'] is True
          assert result['outcome_access_authorized'] is False
          firewall = result['response_firewall']
          assert firewall['avian_payload_requests'] == 0
          assert firewall['avian_payload_bytes_opened'] == 0
          assert firewall['avian_header_bytes_opened'] == 0
          assert firewall['avian_rows_opened'] is False
          assert firewall['avian_values_opened'] is False
          assert firewall['model_fits'] == 0
          assert firewall['heldout_scores'] == 0
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Upload Gate4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbs-northern-bobwhite-replication-2-gate4
          path: build/bbs_northern_bobwhite_replication_2/gate4_prospective_estimability.json
          if-no-files-found: error
