name: BAM site-wide systematic measurement error (finite-world)

on:
  pull_request:
    paths:
      - "benchmarks/bam_systematic_site_error_v1.py"
      - "tests/test_bam_systematic_site_error_v1.py"
      - "validation/bam_systematic_site_error_v1/**"
      - "docs/bam_systematic_site_error_v1.md"
      - ".github/workflows/bam-systematic-site-error-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-corrupted-geographic-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original EOG
        run: python -m pip install -e ".[dev]"
      - name: Verify parent source identity and tests
        run: |
          test "$(git hash-object src/eog/v2/known_truth_bam_generality.py)" = "ab852b02bccdfb2f065717f89b482b7cf15778d3"
          python -m pytest -q tests/test_bam_systematic_site_error_v1.py tests/test_bam_one_bit_error_v1.py
      - name: Replay original 768 worlds and exact site-distinct MILP
        run: |
          python benchmarks/bam_systematic_site_error_v1.py --output-dir /tmp/bam_systematic_site_error
          test -s /tmp/bam_systematic_site_error/result.json
          test -s /tmp/bam_systematic_site_error/observed_D_site_panels.csv
      - name: Audit strict source denominators, impossibilities and monotonicity
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('/tmp/bam_systematic_site_error')
          r=json.loads((p/'result.json').read_text())
          assert r['source']=={'landscapes':12,'parameter_worlds':768,'true_G_classes':129,'observed_D_classes':2627,'perfect_G_M_sign_identified':121}
          rows=list(csv.DictReader((p/'observed_D_site_panels.csv').open()))
          assert len(rows)==2627
          assert sum(int(x['target_discordant_pairs'])==0 for x in rows)==2483
          assert sum(x['systematic_one_bad_site_status']=='OPTIMAL' for x in rows)+sum(x['systematic_one_bad_site_status']=='IMPOSSIBLE' for x in rows)==2627
          assert all(x['systematic_one_bad_site_min_distinct_sites']=='' for x in rows if x['systematic_one_bad_site_status']=='IMPOSSIBLE')
          assert all(int(x['systematic_one_bad_site_min_distinct_sites'])>=3 for x in rows if x['systematic_one_bad_site_status']=='OPTIMAL' and int(x['target_discordant_pairs'])>0)
          counts=[r['robust_true_G_by_site_budget'][str(b)] for b in r['site_budgets']]
          assert counts==sorted(counts)
          assert all(n<=129 for n in counts)
          print('SITE_SYSTEMATIC_ERROR_FINITE_WORLD_CONTRACTS_PASSED')
          PY
      - name: Preserve full observational and true-G audit
        uses: actions/upload-artifact@v4
        with:
          name: bam-systematic-site-error-v1
          path: /tmp/bam_systematic_site_error/*
