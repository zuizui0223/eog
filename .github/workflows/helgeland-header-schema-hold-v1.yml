name: Helgeland response-blind header schema HOLD

on:
  pull_request:
    paths:
      - '.github/workflows/helgeland-header-schema-hold-v1.yml'
      - 'scripts/qualify_helgeland_header_attestations_v1.py'
      - 'tests/test_helgeland_header_schema_gate_v1.py'
      - 'validation/eog_virtual_world_ecology_synthesis_v1/helgeland_header_schema_contract_v1.json'
      - 'docs/eog_helgeland_header_schema_gate_v1.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/helgeland-header-schema-hold-v1.yml'
      - 'scripts/qualify_helgeland_header_attestations_v1.py'
      - 'tests/test_helgeland_header_schema_gate_v1.py'
      - 'validation/eog_virtual_world_ecology_synthesis_v1/helgeland_header_schema_contract_v1.json'
      - 'docs/eog_helgeland_header_schema_gate_v1.md'

permissions:
  contents: read

jobs:
  frozen-pre-response:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test runner
        run: python -m pip install pytest
      - name: Test exact source IDs and reject fictitious join/phenotype access
        run: python -m pytest -q tests/test_helgeland_header_schema_gate_v1.py
      - name: No attested physical headers means unchanged HOLD
        run: |
          python scripts/qualify_helgeland_header_attestations_v1.py \
            --output build/helgeland-header-schema-hold-v1.json
      - name: Check negative controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('build/helgeland-header-schema-hold-v1.json').read_text())
          assert x['status']=='HOLD_PHYSICAL_HEADERS_NOT_ATTESTED'
          assert x['counts']['expected_physical_headers']==4
          assert x['counts']['attested_header_files']==0
          assert len(x['counts']['unresolved_header_files'])==4
          assert x['ecological_endpoint_authorized'] is False
          assert x['id_and_island_value_join_verified'] is False
          assert x['dryad_file_bytes_opened_by_this_script'] is False
          assert x['individual_values_or_genotypes_opened_by_this_script'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HELGELAND-HEADER-SCHEMA-HOLD-NO-BIOLOGICAL-DATA-v1
          path: build/helgeland-header-schema-hold-v1.json
          if-no-files-found: error
