name: Original EOG occurrence-information v4

on:
  pull_request:
    paths:
      - "validation/eog_original_idea_occurrence_information_v4/**"
      - "benchmarks/run_eog_original_idea_occurrence_information_v4.py"
      - "tests/test_eog_original_idea_occurrence_information_v4.py"
      - ".github/workflows/eog-original-idea-occurrence-information-v4.yml"
  workflow_dispatch:

concurrency:
  group: original-eog-occurrence-information-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test occurrence-information invariants
        run: python -m pytest tests/test_eog_original_idea_occurrence_information_v4.py -q
      - name: Run frozen occurrence-information benchmark
        run: |
          python benchmarks/run_eog_original_idea_occurrence_information_v4.py \
            --output build/eog_original_idea_occurrence_information_v4/result_v4.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-original-idea-occurrence-information-v4
          path: build/eog_original_idea_occurrence_information_v4/result_v4.json
          if-no-files-found: error
