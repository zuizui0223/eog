name: Original EOG world-growth survival v8

on:
  pull_request:
    paths:
      - "validation/eog_original_idea_world_growth_v8/**"
      - "benchmarks/run_eog_original_idea_world_growth_v8.py"
      - "tests/test_eog_original_idea_world_growth_v8.py"
      - ".github/workflows/eog-original-idea-world-growth-v8.yml"
  workflow_dispatch:

concurrency:
  group: original-eog-world-growth-v8-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test exact world-growth formulas
        run: python -m pytest tests/test_eog_original_idea_world_growth_v8.py -q
      - name: Run frozen world-growth benchmark
        run: |
          python benchmarks/run_eog_original_idea_world_growth_v8.py \
            --output build/eog_original_idea_world_growth_v8/result_v8.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-original-idea-world-growth-v8
          path: build/eog_original_idea_world_growth_v8/result_v8.json
          if-no-files-found: error
