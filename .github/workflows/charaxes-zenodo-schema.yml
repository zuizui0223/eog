name: Charaxes Zenodo checksum and schema-only gate

on:
  pull_request:
    paths:
      - "benchmarks/run_charaxes_zenodo_schema_gate_v1.py"
      - "tests/test_charaxes_zenodo_schema_v1.py"
      - "validation/charaxes_zenodo_schema_v1/**"
      - ".github/workflows/charaxes-zenodo-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checksum-and-header:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core
        run: python -m pip install -e ".[dev]"
      - name: Verify no biological-row parsing in fixture tests
        run: python -m pytest -q tests/test_charaxes_zenodo_schema_v1.py
      - name: Fetch exactly two frozen public files and verify hashes
        run: |
          python benchmarks/run_charaxes_zenodo_schema_gate_v1.py \
            --output /tmp/eog_charaxes_schema/receipt_v1.json
      - name: Archive sanitized receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charaxes-zenodo-schema-md5-v1
          path: /tmp/eog_charaxes_schema/receipt_v1.json
          if-no-files-found: warn
