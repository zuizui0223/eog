name: Generic finite evidence design v2.5

on:
  pull_request:
    paths:
      - "src/eog/v2/generic_evidence_design.py"
      - "validation/generic_finite_evidence_design_v2_5/**"
      - "benchmarks/run_generic_evidence_design_v2_5.py"
      - "tests/test_generic_evidence_design.py"
      - ".github/workflows/generic-evidence-design-v2-5.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Run frozen generic evidence-design validation
        run: |
          python benchmarks/run_generic_evidence_design_v2_5.py \
            --output build/generic_evidence_design_v2_5/result_v2_5.json
      - name: Verify focused tests
        run: python -m pytest tests/test_generic_evidence_design.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: generic-evidence-design-v2-5
          path: build/generic_evidence_design_v2_5/result_v2_5.json
          if-no-files-found: error
