name: Frozen dynamic source expansion confirmation

on:
  pull_request:
    paths:
      - "benchmarks/dynamic_source_expansion_confirmation.py"
      - "docs/eog_v2_source_expansion_confirmation_contract.md"
      - "benchmarks/dynamic_source_expansion_sensitivity.py"
      - "benchmarks/dynamic_occurrence_comparator_ladder.py"
      - "src/eog/dynamic_island_reachability.py"
      - ".github/workflows/dynamic-source-expansion-confirmation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen source-expansion implementation blobs
        run: |
          test "$(git hash-object benchmarks/dynamic_source_expansion_sensitivity.py)" = "0e5b44bef5c75277573bd8ea49a0a721d21b52a0"
          test "$(git hash-object benchmarks/dynamic_occurrence_comparator_ladder.py)" = "1ef22f88e8ce0c2fd083369d0872afce1594c780"
          test "$(git hash-object src/eog/dynamic_island_reachability.py)" = "d3d57a8bef431c34f5d2c13e5e061ade40bcb64f"
      - name: Install
        run: python -m pip install -e .
      - name: Run frozen source-expansion confirmation
        run: |
          mkdir -p benchmark_results/dynamic_source_expansion_confirmation
          python benchmarks/dynamic_source_expansion_confirmation.py \
            > benchmark_results/dynamic_source_expansion_confirmation/result.json
      - name: Check frozen decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("benchmark_results/dynamic_source_expansion_confirmation/result.json").read_text())
          assert result["status"] == "frozen-source-expansion-confirmation"
          assert result["contract_fingerprint"] == "387118b1de858514f0734c989b97d1559d020abcc9965098892dd8bb85fc2ac4"
          assert result["contract"]["confirmation_seeds"] == [1709, 1801, 1901, 2003, 2111, 2203, 2309, 2401]
          assert result["decision"]["passed"] is True
          assert all(check["passed"] for check in result["decision"]["checks"].values())
          PY
      - name: Upload frozen source-expansion output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-source-expansion-confirmation
          path: benchmark_results/dynamic_source_expansion_confirmation
          if-no-files-found: error
