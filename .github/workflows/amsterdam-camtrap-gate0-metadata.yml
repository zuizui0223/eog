name: Amsterdam Camtrap selective-promotion Gate0 metadata

on:
  push:
    branches:
      - fresh/amsterdam-camtrap-selective-promotion-v1
    paths:
      - validation/amsterdam_camtrap_selective_promotion/**
      - .github/workflows/amsterdam-camtrap-gate0-metadata.yml

permissions:
  contents: read

jobs:
  gate0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('validation/amsterdam_camtrap_selective_promotion/source_selection_contract.json').read_text())
          g=p['gate0_metadata_only']
          assert g['file_payload_requests_allowed'] == 0
          assert g['file_payload_bytes_allowed'] == 0
          assert g['csv_header_bytes_allowed'] == 0
          assert g['observation_values_allowed'] is False
          assert p['selection_boundary']['focal_taxon_scientific_name'] == 'Dama dama'
          PY
      - name: Execute metadata-only Gate0
        run: python validation/amsterdam_camtrap_selective_promotion/gate0_metadata.py
      - name: Audit zero-payload boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('build/amsterdam_camtrap_selective_promotion/gate0_metadata.json').read_text())
          assert p['status'] in {'gate0_metadata_ready_for_nonresponse_package_identification','stop_pre_response_metadata_identity_or_transport'}
          assert p['file_payload_requests'] == 0
          assert p['file_payload_bytes_opened'] == 0
          assert p['csv_header_bytes_opened'] == 0
          assert p['observation_values_opened'] is False
          assert p['model_fits'] == 0
          assert p['heldout_scores'] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: amsterdam-camtrap-gate0-metadata
          path: build/amsterdam_camtrap_selective_promotion/gate0_metadata.json
          if-no-files-found: error
