name: Helgeland 2025 source-only parent-recruit HOLD

on:
  pull_request:
    paths:
      - '.github/workflows/helgeland-2025-parent-recruit-sourceonly-v1.yml'
      - 'validation/eog_virtual_world_ecology_synthesis_v1/helgeland_parent_recruit_2025_sourceonly_v1.json'
      - 'scripts/audit_helgeland_2025_parent_recruit_contract_v1.py'
      - 'tests/test_helgeland_2025_parent_recruit_sourceonly_v1.py'
      - 'docs/eog_helgeland_2025_parent_recruit_route_v1.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/helgeland-2025-parent-recruit-sourceonly-v1.yml'
      - 'validation/eog_virtual_world_ecology_synthesis_v1/helgeland_parent_recruit_2025_sourceonly_v1.json'
      - 'scripts/audit_helgeland_2025_parent_recruit_contract_v1.py'
      - 'tests/test_helgeland_2025_parent_recruit_sourceonly_v1.py'
      - 'docs/eog_helgeland_2025_parent_recruit_route_v1.md'

permissions:
  contents: read

jobs:
  frozen-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Refuse proxy-to-colonization claim promotion
        run: python -m pytest -q tests/test_helgeland_2025_parent_recruit_sourceonly_v1.py
      - name: Emit metadata-only hold receipt
        run: |
          python scripts/audit_helgeland_2025_parent_recruit_contract_v1.py \
            --output build/helgeland-2025-parent-recruit-sourceonly.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('build/helgeland-2025-parent-recruit-sourceonly.json').read_text())
          assert d['status']=='HOLD_PARENT_RECRUIT_TIME_ORIENTATION_UNVERIFIED'
          assert d['public_readme_roles_only']
          assert d['candidate_join_links']==6
          assert d['physical_headers_read'] is False
          assert d['parent_recruit_id_values_joined'] is False
          assert d['prospective_predictors_verified'] is False
          assert d['first_island_colonization_or_source_loss_identified'] is False
          assert d['ecological_endpoint_authorized'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HELGELAND-2025-SOURCE-ONLY-PARENT-RECRUIT-HOLD-v1
          path: build/helgeland-2025-parent-recruit-sourceonly.json
          if-no-files-found: error
