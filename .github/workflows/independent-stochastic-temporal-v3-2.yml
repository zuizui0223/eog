name: Independent stochastic temporal v3.2

on:
  pull_request:
    paths:
      - "benchmarks/run_independent_stochastic_temporal_v3_2.py"
      - "validation/independent_stochastic_temporal_v3_2/**"
      - ".github/workflows/independent-stochastic-temporal-v3-2.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Run frozen temporal positive-witness validation
        run: |
          python benchmarks/run_independent_stochastic_temporal_v3_2.py \
            --output build/independent_stochastic_temporal_v3_2/result_v3_2.json
      - uses: actions/upload-artifact@v4
        with:
          name: independent-stochastic-temporal-v3-2
          path: build/independent_stochastic_temporal_v3_2/result_v3_2.json
          if-no-files-found: error
