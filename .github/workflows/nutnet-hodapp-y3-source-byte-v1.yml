name: NutNet Hodapp source byte integrity and header gate v1
on:
  pull_request:
    paths:
      - 'validation/nutnet_hodapp_y3_target_v1/**'
      - 'benchmarks/nutnet_hodapp_source_byte_gate_v1.py'
      - 'tests/test_nutnet_hodapp_source_byte_gate_v1.py'
      - 'docs/nutnet_hodapp_y3_preoutcome_design_v1.md'
      - '.github/workflows/nutnet-hodapp-y3-source-byte-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-and-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Strict offline checks
        run: python -m pytest -q tests/test_nutnet_hodapp_source_byte_gate_v1.py
      - name: Attempt original source bytes (bounded, fixed known files)
        run: python benchmarks/nutnet_hodapp_source_byte_gate_v1.py --output-dir /tmp/nutnet_hodapp_y3
      - name: Preserve verified CSV bytes or scientific access STOP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nutnet-hodapp-y3-source-byte-gate-v1
          path: /tmp/nutnet_hodapp_y3/
          if-no-files-found: warn
