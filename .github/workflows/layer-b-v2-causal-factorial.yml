name: Layer-B v2 causal factorial

on:
  pull_request:
    paths:
      - 'benchmarks/layer_b_v2_causal_factorial.py'
      - 'validation/layer_b_mechanism_v2/causal_factorial_contract_v1.json'
      - 'tests/test_layer_b_v2_causal_factorial_contract.py'
      - '.github/workflows/layer-b-v2-causal-factorial.yml'
  workflow_dispatch:

jobs:
  causal-factorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      - name: Contract regression tests
        run: pytest -q tests/test_layer_b_v2_causal_factorial_contract.py
      - name: Run frozen causal factorial
        run: python benchmarks/layer_b_v2_causal_factorial.py
      - name: Validate result boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('build/layer_b_v2_causal_factorial_result.json').read_text())
          assert p['counts_as_fresh_predictive_endpoint'] is False
          assert p['uses_biological_response'] is False
          assert p['changes_closed_eog_wf_synthesis'] is False
          assert all(p['checks'].values())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: layer-b-v2-causal-factorial
          path: build/layer_b_v2_causal_factorial_result.json
