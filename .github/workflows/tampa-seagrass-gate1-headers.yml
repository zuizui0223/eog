name: Tampa seagrass endpoint3 Gate1 response headers

on:
  pull_request:
    paths:
      - 'validation/tampa_seagrass_endpoint3/gate0_pass_certificate.json'
      - 'validation/tampa_seagrass_endpoint3/response_headers_contract.json'
      - 'validation/tampa_seagrass_endpoint3/response_headers_execution_authorization.json'
      - 'validation/tampa_seagrass_endpoint3/response_headers_gate.py'
      - 'tests/test_tampa_seagrass_response_headers_gate.py'
      - '.github/workflows/tampa-seagrass-gate1-headers.yml'
      - '.github/workflows/tampa-seagrass-gate0.yml'
  push:
    branches:
      - 'execute/tampa-seagrass-gate1-headers-v1'
    paths:
      - 'validation/tampa_seagrass_endpoint3/response_headers_execute_once.json'

permissions:
  contents: read

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install header-gate test runtime
        run: |
          python -m pip install -e . --no-deps
          python -m pip install pytest
      - name: Verify Tampa response-header firewall
        run: python -m pytest tests/test_tampa_seagrass_response_headers_gate.py -q
      - name: Compile Tampa response-header evaluator
        run: python -m py_compile validation/tampa_seagrass_endpoint3/response_headers_gate.py
      - name: Verify authorization blobs and row firewall
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('validation/tampa_seagrass_endpoint3')
          auth = json.loads((root / 'response_headers_execution_authorization.json').read_text())
          assert auth['attempt_id'] == 'tampa_seagrass_endpoint3_v1'
          assert auth['issue'] == 388
          assert auth['maximum_occurrence_one_byte_range_requests'] == 183
          assert auth['maximum_emof_one_byte_range_requests'] == 126
          assert auth['maximum_total_one_byte_range_requests'] == 309
          assert auth['maximum_total_response_header_bytes_opened'] == 309
          assert auth['response_data_row_bytes_opened'] == 0
          assert auth['response_rows_opened'] == 0
          assert auth['response_values_opened'] is False
          assert auth['model_fits'] == auth['heldout_scores'] == 0
          assert auth['source_occurrence_git_blob_sha1'] == 'd34aeb5aedb72459d1e04059629cb09450df929e'
          assert auth['source_emof_git_blob_sha1'] == 'e463046726080334637824555309fd89c7c447da'
          bindings = {
              'gate0_pass_certificate_git_blob_sha1': root / 'gate0_pass_certificate.json',
              'response_headers_contract_git_blob_sha1': root / 'response_headers_contract.json',
              'response_headers_evaluator_git_blob_sha1': root / 'response_headers_gate.py',
          }
          for field, path in bindings.items():
              actual = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
              assert actual == auth[field], (field, actual, auth[field])
          assert not Path('.github/workflows/tampa-seagrass-gate0.yml').exists()
          PY
      - name: Verify no live marker in proposal
        if: ${{ github.event_name == 'pull_request' }}
        run: test ! -e validation/tampa_seagrass_endpoint3/response_headers_execute_once.json

  live-headers-once:
    needs: synthetic-boundary
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/execute/tampa-seagrass-gate1-headers-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install EOG without dependency mutation
        run: python -m pip install -e . --no-deps
      - name: Verify once-only marker and authorization
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('validation/tampa_seagrass_endpoint3')
          marker = json.loads((root / 'response_headers_execute_once.json').read_text())
          assert marker == {
              'attempt_id': 'tampa_seagrass_endpoint3_v1',
              'issue': 388,
              'execute_once': True,
              'authorization': 'response_headers_execution_authorization.json'
          }
          auth = json.loads((root / 'response_headers_execution_authorization.json').read_text())
          bindings = {
              'gate0_pass_certificate_git_blob_sha1': root / 'gate0_pass_certificate.json',
              'response_headers_contract_git_blob_sha1': root / 'response_headers_contract.json',
              'response_headers_evaluator_git_blob_sha1': root / 'response_headers_gate.py',
          }
          for field, path in bindings.items():
              actual = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
              assert actual == auth[field], (field, actual, auth[field])
          PY
      - name: Execute Tampa response-header Gate1 once
        run: python -m validation.tampa_seagrass_endpoint3.response_headers_gate
      - name: Audit terminal header certificate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('validation/tampa_seagrass_endpoint3/response_headers_certificate.json')
          r = json.loads(p.read_text())
          assert r['attempt_id'] == 'tampa_seagrass_endpoint3_v1'
          assert r['issue'] == 388
          assert r['status'] in {'response_headers_ready','stop_pre_row_response_header_transport_or_schema'}
          assert r['gate0_result_fingerprint'] == '3f1936f04416fa369ff315d214db7690b6d0882d31a43d64dc496323a84f1159'
          assert r['response_data_row_bytes_opened'] == 0
          assert r['response_rows_opened'] == 0
          assert r['response_values_opened'] is False
          assert r['model_fits'] == r['heldout_scores'] == 0
          assert r['counts_as_predictive_evidence'] is False
          h = r['headers']
          assert set(h) == {'occurrence','emof'}
          assert 0 <= h['occurrence']['header_range_requests'] <= 183
          assert 0 <= h['occurrence']['header_bytes_opened'] <= 183
          assert 0 <= h['emof']['header_range_requests'] <= 126
          assert 0 <= h['emof']['header_bytes_opened'] <= 126
          for name in ('occurrence','emof'):
              assert h[name]['data_row_bytes_opened'] == 0
              assert h[name]['rows_opened'] == 0
              assert h[name]['values_opened'] is False
          if r['status'] == 'response_headers_ready':
              assert h['occurrence']['header_bytes_opened'] in {182,183}
              assert h['emof']['header_bytes_opened'] in {125,126}
              assert r['total_header_range_requests'] == r['total_header_bytes_opened']
              assert 307 <= r['total_header_bytes_opened'] <= 309
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tampa-seagrass-response-headers
          path: validation/tampa_seagrass_endpoint3/response_headers_certificate.json
          if-no-files-found: error
