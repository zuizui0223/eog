name: Original EOG target-relational sufficiency v11

on:
  pull_request:
    paths:
      - "validation/eog_original_idea_target_relational_v11/**"
      - "benchmarks/run_eog_original_idea_target_relational_v11.py"
      - "tests/test_eog_original_idea_target_relational_v11.py"
      - ".github/workflows/eog-original-idea-target-relational-v11.yml"
  workflow_dispatch:

concurrency:
  group: original-eog-target-relational-v11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test target-relational invariants
        run: python -m pytest tests/test_eog_original_idea_target_relational_v11.py -q
      - name: Run frozen target-relational synthesis
        run: |
          python benchmarks/run_eog_original_idea_target_relational_v11.py \
            --output build/eog_original_idea_target_relational_v11/result_v11.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-original-idea-target-relational-v11
          path: build/eog_original_idea_target_relational_v11/result_v11.json
          if-no-files-found: error
