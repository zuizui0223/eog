name: Assynt water vole response-blind source manifest

on:
  push:
    branches: [agent/assynt-water-vole-paired-complementarity]
    paths:
      - ".github/workflows/assynt_water_vole_source_manifest.yml"
      - "validation/assynt_water_vole_paired_complementarity/source_contract.json"
  pull_request:
    paths:
      - ".github/workflows/assynt_water_vole_source_manifest.yml"
      - "validation/assynt_water_vole_paired_complementarity/source_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze Dryad file inventory without payload access
        run: |
          set -euo pipefail
          mkdir -p build/assynt_water_vole_source
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          import urllib.parse
          import urllib.request

          contract=json.loads(Path("validation/assynt_water_vole_paired_complementarity/source_contract.json").read_text())
          doi=contract["scientific_anchor"]["dataset_doi"]
          root="https://datadryad.org"; api=root+"/api/v2"; requested=[]
          def absolute(url): return urllib.parse.urljoin(root+"/",url)
          def get_json(url,cap=5_000_000):
              url=absolute(url); requested.append(url)
              req=urllib.request.Request(url,headers={"User-Agent":"EOG-Assynt-source-manifest/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=60) as response:
                  body=response.read(cap+1); status=getattr(response,"status",None)
              if status!=200 or len(body)>cap: raise RuntimeError(f"bounded metadata request failed: {status} {url}")
              value=json.loads(body.decode("utf-8"))
              if not isinstance(value,dict): raise RuntimeError("Dryad metadata response is not object")
              return value
          def link(obj,*names):
              links=obj.get("_links")
              if not isinstance(links,dict): return None
              for name in names:
                  item=links.get(name)
                  if isinstance(item,dict) and item.get("href"): return absolute(str(item["href"]))
              return None
          encoded=urllib.parse.quote(f"doi:{doi}",safe="")
          dataset_url=f"{api}/datasets/{encoded}"
          dataset=get_json(dataset_url)
          version_url=link(dataset,"stash:version","version")
          version=get_json(version_url) if version_url else dataset
          files_url=link(version,"stash:files","files") or link(dataset,"stash:files","files")
          if not files_url: raise RuntimeError("no Dryad files endpoint")
          rows=[]; next_url=files_url; seen=set()
          while next_url and next_url not in seen:
              seen.add(next_url); page=get_json(next_url)
              emb=page.get("_embedded",{})
              page_rows=emb.get("stash:files") if isinstance(emb,dict) else None
              if page_rows is None and isinstance(emb,dict): page_rows=emb.get("files")
              if not isinstance(page_rows,list): raise RuntimeError("files page missing list")
              rows.extend(r for r in page_rows if isinstance(r,dict))
              next_url=link(page,"next")
          files=[]
          for row in rows:
              raw=row.get("path") or row.get("fileName") or row.get("name") or ""
              name=Path(str(raw)).name
              if not name: raise RuntimeError("file record without name")
              files.append({
                  "name":name,
                  "size":int(row.get("size") or 0),
                  "digest":row.get("digest"),
                  "digest_type":row.get("digestType"),
                  "mime_type":row.get("mimeType"),
                  "description":row.get("description"),
                  "api_self":link(row,"self"),
                  "api_download":link(row,"stash:download","download"),
              })
          if not files or any(f["size"]<=0 for f in files): raise RuntimeError("invalid/empty file inventory")
          result={
              "attempt_id":contract["attempt_id"],
              "doi":doi,
              "dataset_api":dataset_url,
              "version_api":version_url,
              "version_number":version.get("versionNumber") or version.get("version"),
              "publication_date":version.get("publicationDate") or dataset.get("publicationDate"),
              "files":sorted(files,key=lambda f:f["name"]),
              "metadata_requests":len(requested),
              "requested_metadata_urls":requested,
              "file_payload_requests":0,
              "file_payload_bytes_opened":0,
              "response_header_bytes_opened":0,
              "response_rows_opened":False,
              "response_values_opened":False,
              "model_fits":0,
              "heldout_scores":0,
          }
          Path("build/assynt_water_vole_source/manifest.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
      - name: Assert metadata-only response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("build/assynt_water_vole_source/manifest.json").read_text())
          assert r["file_payload_requests"]==0 and r["file_payload_bytes_opened"]==0
          assert r["response_header_bytes_opened"]==0
          assert r["response_rows_opened"] is False and r["response_values_opened"] is False
          assert r["model_fits"]==0 and r["heldout_scores"]==0
          print("Assynt metadata-only response firewall PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: assynt-water-vole-source-manifest
          path: build/assynt_water_vole_source/manifest.json
          if-no-files-found: error
