name: Finalize conceptual Figure 1

on:
  push:
    branches:
      - agent/structural-figure1-roles
    paths:
      - ".github/workflows/finalize-figure1.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structural-figure1-roles
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Make equal-distance schematic exactly symmetric
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("figures/build_figure_1_roles.py")
          text = p.read_text(encoding="utf-8")
          old = "targets = [(x + 280, y + 82), (x + 280, y + 152)]"
          new = "targets = [(x + 280, y + 82), (x + 280, y + 150)]"
          if text.count(old) != 1:
              raise SystemExit("expected Figure 1 source-distance target not found exactly once")
          p.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Build Figure 1
        run: |
          python -m py_compile figures/build_figure_1_roles.py
          python figures/build_figure_1_roles.py
      - name: Verify Figure 1 contract
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_structural_figure_1.py
      - name: Mark Figure 1 complete in submission checklist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("manuscript/structural_submission_checklist.md")
          text = p.read_text(encoding="utf-8")
          old = "- [ ] Figure 1: conceptual distinction among support, CV, distance, current flow, and EOG."
          new = "- [x] Figure 1: conceptual distinction among support, CV, distance, current flow, and EOG."
          if text.count(old) != 1:
              raise SystemExit("Figure 1 checklist line not found exactly once")
          p.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Remove temporary finalizer and commit generated assets
        run: |
          git rm .github/workflows/finalize-figure1.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build conceptual structural Figure 1"
          git push origin HEAD:agent/structural-figure1-roles
