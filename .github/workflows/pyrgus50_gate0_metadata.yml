name: Pyrgus 50-patch Gate 0 metadata

on:
  push:
    branches:
      - agent/pyrgus50-gate0-screen
    paths:
      - ".github/workflows/pyrgus50_gate0_metadata.yml"
      - "validation/pyrgus50_two_layer/gate0_contract.json"
  pull_request:
    paths:
      - ".github/workflows/pyrgus50_gate0_metadata.yml"
      - "validation/pyrgus50_two_layer/gate0_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inventory Dryad dataset metadata only
        run: |
          set -euo pipefail
          mkdir -p build/pyrgus50_gate0
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          import re
          from urllib.parse import quote, urljoin
          import urllib.request

          DOI = "doi:10.5061/dryad.b563d"
          ORIGIN = "https://datadryad.org"
          API = f"{ORIGIN}/api/v2"
          encoded = quote(DOI, safe="")

          def absolute(url: str | None) -> str | None:
              if not url:
                  return None
              return urljoin(ORIGIN, str(url))

          def get_json(url: str):
              req = urllib.request.Request(absolute(url), headers={"User-Agent": "eog-response-blind-gate0/1.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def embedded(payload, relation):
              value = (payload.get("_embedded") or {}).get(relation)
              if value is None:
                  return []
              return value if isinstance(value, list) else [value]

          def link_href(row, *keys):
              links = row.get("_links") or row.get("links") or {}
              for key in keys:
                  value = links.get(key)
                  if isinstance(value, dict):
                      value = value.get("href")
                  if value:
                      return absolute(str(value))
              return None

          dataset = get_json(f"{API}/datasets/{encoded}")
          versions_payload = get_json(f"{API}/datasets/{encoded}/versions")
          versions = embedded(versions_payload, "stash:versions")
          if not versions:
              versions = versions_payload.get("data", [])
          if not versions:
              raise RuntimeError("Dryad API returned no dataset versions")

          def sort_key(row):
              for key in ("versionNumber", "version_number", "version"):
                  value = row.get(key)
                  if value is not None:
                      try:
                          return (2, int(value))
                      except (TypeError, ValueError):
                          pass
              for key in ("publicationDate", "publication_date", "lastModificationDate", "last_modification_date"):
                  value = row.get(key)
                  if value:
                      return (1, str(value))
              return (0, json.dumps(row, sort_keys=True))

          latest = max(versions, key=sort_key)
          files_url = link_href(latest, "stash:files", "files")
          self_url = link_href(latest, "self")
          version_api_id = None
          if self_url:
              match = re.search(r"/versions/(\d+)(?:$|[/?#])", self_url)
              if match:
                  version_api_id = int(match.group(1))
          if files_url is None and version_api_id is not None:
              files_url = f"{API}/versions/{version_api_id}/files"
          if files_url is None:
              raise RuntimeError(
                  "Dryad version metadata exposes neither a files link nor a parseable version API ID; "
                  f"version keys={sorted(latest)} links={latest.get('_links')!r}"
              )

          files_payload = get_json(files_url)
          files = embedded(files_payload, "stash:files")
          if not files:
              files = files_payload.get("data", [])
          if not files:
              raise RuntimeError("Dryad API returned no files for selected version")

          def pick(row, *keys):
              for key in keys:
                  if key in row and row[key] is not None:
                      return row[key]
              return None

          inventory = []
          for row in files:
              inventory.append({
                  "id": pick(row, "id", "fileId", "file_id"),
                  "path": pick(row, "path", "filename", "name"),
                  "size": pick(row, "size", "fileSize", "file_size"),
                  "mime_type": pick(row, "mimeType", "mime_type"),
                  "digest": pick(row, "digest", "checksum"),
                  "download_url": link_href(row, "stash:download", "download"),
                  "self_url": link_href(row, "self"),
              })

          names = [str(row["path"]) for row in inventory]
          required = {"Site_data.csv", "Monitoring_data.csv"}
          if not required.issubset(set(names)):
              raise RuntimeError(f"required separate files not found; files={names!r}")

          result = {
              "status": "dryad_metadata_inventory_complete",
              "candidate": "Pyrgus armoricanus 50-patch system",
              "doi": DOI,
              "dataset": dataset,
              "versions_payload": versions_payload,
              "selected_version_metadata": latest,
              "selected_version_api_id": version_api_id,
              "selected_files_url": absolute(files_url),
              "files": inventory,
              "required_files_separate": True,
              "site_file_name": "Site_data.csv",
              "response_file_name": "Monitoring_data.csv",
              "response_rows_opened": False,
              "response_file_downloaded": False,
              "any_file_bytes_downloaded": False,
              "next": "download and inspect Site_data.csv only; Monitoring_data.csv remains prohibited",
          }
          Path("build/pyrgus50_gate0/dryad_metadata_inventory.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "status": result["status"],
              "selected_version_api_id": version_api_id,
              "files": names,
              "required_files_separate": True,
              "response_rows_opened": False,
              "response_file_downloaded": False,
          }, indent=2, sort_keys=True))
          PY
      - name: Assert response firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('build/pyrgus50_gate0/dryad_metadata_inventory.json'))
          assert p['required_files_separate'] is True
          assert p['response_rows_opened'] is False
          assert p['response_file_downloaded'] is False
          assert p['any_file_bytes_downloaded'] is False
          PY
      - name: Upload metadata-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: pyrgus50-gate0-metadata
          path: build/pyrgus50_gate0/dryad_metadata_inventory.json
          if-no-files-found: error
