name: Snapshot Japan selective-promotion Stage0 deployment

on:
  push:
    branches:
      - fresh/snapshot-japan-selective-promotion-v1
    paths:
      - validation/snapshot_japan_selective_promotion/source_selection_contract.json
      - validation/snapshot_japan_selective_promotion/stage0_deployment.py
      - .github/workflows/snapshot-japan-stage0-deployment.yml

permissions:
  contents: read

jobs:
  stage0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('validation/snapshot_japan_selective_promotion/source_selection_contract.json').read_text())
          assert p['selection_boundary']['focal_taxon_scientific_name'] == 'Sus scrofa'
          assert p['stage0_deployment_only']['response_payload_requests_allowed'] == 0
          assert p['stage0_deployment_only']['response_header_bytes_allowed'] == 0
          assert p['selective_promotion_rule']['outer_response_rerun_forbidden'] is True
          PY
      - name: Execute deployment-only qualification
        run: python validation/snapshot_japan_selective_promotion/stage0_deployment.py
      - name: Audit response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('build/snapshot_japan_selective_promotion/stage0_deployment.json').read_text())
          assert p['status'] in {'stage0_deployment_qualified','stop_pre_response_deployment_transport_schema_or_structure'}
          assert p['response_payload_requests'] == 0
          assert p['response_header_bytes_opened'] == 0
          assert p['response_values_opened'] is False
          assert p['model_fits'] == 0
          assert p['heldout_scores'] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-japan-stage0-deployment
          path: build/snapshot_japan_selective_promotion/stage0_deployment.json
          if-no-files-found: error
