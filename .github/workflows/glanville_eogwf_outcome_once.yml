name: Glanville EOG-WF independent outcome ONCE

on:
  pull_request:
    paths:
      - ".github/workflows/glanville_eogwf_outcome_once.yml"
      - "benchmarks/run_glanville_eogwf_once.py"
      - "validation/glanville_eogwf/runtime_lock.txt"
      - "validation/glanville_eogwf/gate2_temporal_prediction_contract.json"
      - "validation/glanville_eogwf/gate2_amendment_v1_1.json"
      - "validation/glanville_eogwf/gate2_temporal_metadata_result.json"
      - "validation/glanville_eogwf/pre_response_runner_smoke_result.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/glanville_eogwf/runtime_lock.txt
          python - <<'PY'
          import numpy, pandas, sklearn
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          print('sklearn', sklearn.__version__)
          PY
      - name: Fetch exact frozen public archive
        run: |
          curl -L --fail --retry 3 \
            'https://zenodo.org/records/4987060/files/ECOG-04799.zip?download=1' \
            -o /tmp/ECOG-04799.zip
          test "$(md5sum /tmp/ECOG-04799.zip | awk '{print $1}')" = "69122a1d82b1fb970fb6638b02da3db4"
          sha256sum /tmp/ECOG-04799.zip
      - name: Extract only frozen validation inputs
        run: |
          mkdir -p /tmp/glanville/data build/glanville_outcome
          unzip -p /tmp/ECOG-04799.zip data/patch_network.tsv > /tmp/glanville/data/patch_network.tsv
          unzip -p /tmp/ECOG-04799.zip data/patch_area.tsv > /tmp/glanville/data/patch_area.tsv
          unzip -p /tmp/ECOG-04799.zip data/survey_data.tsv > /tmp/glanville/data/survey_data.tsv
          test -s /tmp/glanville/data/patch_network.tsv
          test -s /tmp/glanville/data/patch_area.tsv
          test -s /tmp/glanville/data/survey_data.tsv
      - name: Execute frozen independent validation once
        run: |
          python benchmarks/run_glanville_eogwf_once.py \
            --archive /tmp/ECOG-04799.zip \
            --extract-dir /tmp/glanville \
            --output build/glanville_outcome/glanville_eogwf_result.json
      - name: Upload immutable outcome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glanville-eogwf-independent-outcome
          path: build/glanville_outcome
          if-no-files-found: warn
