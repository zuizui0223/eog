name: EOG Alternaria genotype generality v37

on:
  pull_request:
    paths:
      - "benchmarks/run_eog_alternaria_genotype_generality_v37.py"
      - "docs/eog_alternaria_genotype_generality_v37.md"
      - "validation/eog_alternaria_genotype_generality_v37/**"
      - "tests/test_eog_alternaria_genotype_generality_v37.py"
      - ".github/workflows/eog-alternaria-genotype-generality-v37.yml"
  workflow_dispatch:

concurrency:
  group: eog-alternaria-genotype-generality-v37-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  score:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test v37 helpers
        run: python -m pytest tests/test_eog_alternaria_genotype_generality_v37.py -q
      - name: Run frozen v37 test
        run: |
          python benchmarks/run_eog_alternaria_genotype_generality_v37.py \
            --output build/eog_alternaria_genotype_generality_v37/result_v37.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-alternaria-genotype-generality-v37
          path: build/eog_alternaria_genotype_generality_v37/result_v37.json
          if-no-files-found: error
