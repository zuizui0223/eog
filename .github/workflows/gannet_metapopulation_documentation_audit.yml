name: Northern gannet documentation-only audit

on:
  push:
    branches:
      - agent/gannet-metapopulation-preflight
    paths:
      - ".github/workflows/gannet_metapopulation_documentation_audit.yml"
      - "validation/gannet_metapopulation_paired_complementarity/documentation_stage.json"
  pull_request:
    paths:
      - ".github/workflows/gannet_metapopulation_documentation_audit.yml"
      - "validation/gannet_metapopulation_paired_complementarity/documentation_stage.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RTF text utility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unrtf
      - name: Open only frozen metadata documentation
        run: |
          set -euo pipefail
          mkdir -p build/gannet_documentation
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path

          stage=json.loads(Path("validation/gannet_metapopulation_paired_complementarity/documentation_stage.json").read_text())
          spec=stage["allowed_document"]
          result={
              "attempt_id":stage["attempt_id"],
              "stage_id":stage["stage_id"],
              "status":"not_evaluated",
              "documentation_requests":0,
              "documentation_bytes_opened":0,
              "geometry_payload_requests":0,
              "geometry_payload_bytes_opened":0,
              "response_header_bytes_opened":0,
              "response_payload_requests":0,
              "response_payload_bytes_opened":0,
              "response_rows_opened":False,
              "response_values_opened":False,
              "model_fits":0,
              "heldout_scores":0,
          }
          req=urllib.request.Request(spec["url"],headers={"User-Agent":"EOG-gannet-docs/1.0","Accept":"application/rtf,text/rtf,application/octet-stream","Accept-Encoding":"identity"})
          result["documentation_requests"]=1
          with urllib.request.urlopen(req,timeout=60) as response:
              body=response.read(int(spec["frozen_bytes"])+1)
              status=getattr(response,"status",None)
              result["content_type"]=response.headers.get("Content-Type")
              result["final_url"]=response.geturl()
          if status != 200:
              result.update(status="stop_documentation_transport",http_status=status)
          elif len(body) != int(spec["frozen_bytes"]):
              result.update(status="stop_documentation_identity",reason="byte_size_mismatch",observed_bytes=len(body))
          elif hashlib.md5(body).hexdigest() != spec["frozen_md5"]:
              result.update(status="stop_documentation_identity",reason="md5_mismatch",observed_md5=hashlib.md5(body).hexdigest())
          else:
              result["documentation_bytes_opened"]=len(body)
              result["documentation_md5"]=hashlib.md5(body).hexdigest()
              Path("build/gannet_documentation/metadata_description.rtf").write_bytes(body)
              result["status"]="documentation_identity_pass"
          Path("build/gannet_documentation/pre_text.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          if result["status"] != "documentation_identity_pass":
              print(json.dumps(result,indent=2,sort_keys=True))
              raise SystemExit(3)
          PY
          unrtf --text build/gannet_documentation/metadata_description.rtf > build/gannet_documentation/metadata_description.txt
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          result=json.loads(Path("build/gannet_documentation/pre_text.json").read_text())
          text=Path("build/gannet_documentation/metadata_description.txt").read_text(encoding="utf-8",errors="replace")
          lines=[line.rstrip() for line in text.splitlines()]
          nonempty=[line for line in lines if line.strip()]
          key=re.compile(r"(?i)(coloni|latitude|longitude|coord|census|count|zero|missing|unknown|survey|year|breed|establish|found|site|source|matrix|distance)")
          relevant=[{"line_number":i+1,"text":line[:1000]} for i,line in enumerate(lines) if line.strip() and key.search(line)]
          result.update(
              status="documentation_semantics_audit_complete",
              plain_text_bytes=len(text.encode("utf-8")),
              plain_text_sha256=hashlib.sha256(text.encode("utf-8")).hexdigest(),
              nonempty_line_count=len(nonempty),
              relevant_lines=relevant,
              geometry_payload_requests=0,
              geometry_payload_bytes_opened=0,
              response_header_bytes_opened=0,
              response_payload_requests=0,
              response_payload_bytes_opened=0,
              response_rows_opened=False,
              response_values_opened=False,
              model_fits=0,
              heldout_scores=0,
          )
          Path("build/gannet_documentation/documentation_audit.json").write_text(json.dumps(result,indent=2,sort_keys=True,ensure_ascii=False)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True,ensure_ascii=False))
          print("--- DOCUMENTATION TEXT ---")
          print(text)
          PY
      - name: Assert documentation-only firewall
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/gannet_documentation/documentation_audit.json")
          if not p.exists():
              raise SystemExit("documentation audit missing")
          r=json.loads(p.read_text())
          assert r["geometry_payload_requests"] == 0
          assert r["geometry_payload_bytes_opened"] == 0
          assert r["response_header_bytes_opened"] == 0
          assert r["response_payload_requests"] == 0
          assert r["response_payload_bytes_opened"] == 0
          assert r["response_rows_opened"] is False
          assert r["response_values_opened"] is False
          assert r["model_fits"] == 0 and r["heldout_scores"] == 0
          print(f"Northern gannet documentation firewall PASS: {r['status']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gannet-documentation-only
          path: |
            build/gannet_documentation/documentation_audit.json
            build/gannet_documentation/metadata_description.txt
          if-no-files-found: error
