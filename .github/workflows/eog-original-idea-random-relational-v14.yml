name: Original EOG random relational adaptive v14

on:
  pull_request:
    paths:
      - "validation/eog_original_idea_random_relational_v14/**"
      - "benchmarks/run_eog_original_idea_random_relational_v14.py"
      - "tests/test_eog_original_idea_random_relational_v14.py"
      - ".github/workflows/eog-original-idea-random-relational-v14.yml"
  workflow_dispatch:

concurrency:
  group: original-eog-random-relational-v14-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test adaptive relational invariants
        run: python -m pytest tests/test_eog_original_idea_random_relational_v14.py -q
      - name: Run frozen adaptive relational benchmark
        run: |
          python benchmarks/run_eog_original_idea_random_relational_v14.py \
            --output build/eog_original_idea_random_relational_v14/result_v14.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-original-idea-random-relational-v14
          path: build/eog_original_idea_random_relational_v14/result_v14.json
          if-no-files-found: error
