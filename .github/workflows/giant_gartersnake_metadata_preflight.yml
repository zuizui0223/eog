name: Giant gartersnake ScienceBase metadata-only preflight

on:
  push:
    branches:
      - agent/giant-gartersnake-fresh-metadata
    paths:
      - ".github/workflows/giant_gartersnake_metadata_preflight.yml"
      - "validation/giant_gartersnake_paired_complementarity/source_contract.json"
  pull_request:
    paths:
      - ".github/workflows/giant_gartersnake_metadata_preflight.yml"
      - "validation/giant_gartersnake_paired_complementarity/source_contract.json"
  workflow_dispatch:

concurrency:
  group: giant-gartersnake-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata-only:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query exact ScienceBase item metadata only
        run: |
          set -euo pipefail
          mkdir -p build/giant_gartersnake_metadata
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path

          c=json.loads(Path("validation/giant_gartersnake_paired_complementarity/source_contract.json").read_text())
          item=c["scientific_anchor"]["sciencebase_item"]
          url=f"https://www.sciencebase.gov/catalog/item/{item}?format=json"
          req=urllib.request.Request(url,headers={"User-Agent":"EOG-GGS-metadata/1.0","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=60) as r:
              body=r.read(10_000_001)
              status=getattr(r,"status",None)
          if status != 200 or len(body)>10_000_000:
              raise RuntimeError(f"ScienceBase item metadata failed bounded checks: status={status}, bytes={len(body)}")
          payload=json.loads(body.decode("utf-8"))
          if payload.get("id") != item:
              raise RuntimeError(f"ScienceBase item identity mismatch: {payload.get('id')} != {item}")
          files=[]
          for f in payload.get("files") or []:
              files.append({
                  "name":f.get("name"),
                  "title":f.get("title"),
                  "size":f.get("size"),
                  "checksum":f.get("checksum"),
                  "checksumType":f.get("checksumType"),
                  "contentType":f.get("contentType"),
                  "url":f.get("url"),
              })
          identifiers=[]
          for x in payload.get("identifiers") or []:
              if isinstance(x,dict): identifiers.append({"type":x.get("type"),"key":x.get("key")})
          result={
              "attempt_id":c["attempt_id"],
              "status":"sciencebase_metadata_inventory_pass",
              "item_id":payload.get("id"),
              "title":payload.get("title"),
              "identifiers":identifiers,
              "file_count":len(files),
              "files":files,
              "hasChildren":payload.get("hasChildren"),
              "metadata_requests":1,
              "file_payload_requests":0,
              "file_payload_bytes_opened":0,
              "response_header_bytes_opened":0,
              "response_rows_opened":False,
              "response_values_opened":False,
              "model_fits":0,
              "heldout_scores":0,
          }
          Path("build/giant_gartersnake_metadata/inventory.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
      - name: Assert metadata-only firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("build/giant_gartersnake_metadata/inventory.json").read_text())
          assert r["file_payload_requests"] == 0
          assert r["file_payload_bytes_opened"] == 0
          assert r["response_header_bytes_opened"] == 0
          assert r["response_rows_opened"] is False
          assert r["response_values_opened"] is False
          assert r["model_fits"] == 0 and r["heldout_scores"] == 0
          print("Giant gartersnake ScienceBase metadata firewall PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: giant-gartersnake-sciencebase-metadata
          path: build/giant_gartersnake_metadata/inventory.json
          if-no-files-found: error
