name: Original EOG directed-temporal flow v5

on:
  pull_request:
    paths:
      - "validation/eog_original_idea_directed_temporal_flow_v5/**"
      - "benchmarks/run_eog_original_idea_directed_temporal_flow_v5.py"
      - "tests/test_eog_original_idea_directed_temporal_flow_v5.py"
      - ".github/workflows/eog-original-idea-directed-temporal-flow-v5.yml"
  workflow_dispatch:

concurrency:
  group: original-eog-directed-temporal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test directed-temporal invariants
        run: python -m pytest tests/test_eog_original_idea_directed_temporal_flow_v5.py -q
      - name: Run frozen directed-temporal benchmark
        run: |
          python benchmarks/run_eog_original_idea_directed_temporal_flow_v5.py \
            --output build/eog_original_idea_directed_temporal_flow_v5/result_v5.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-original-idea-directed-temporal-flow-v5
          path: build/eog_original_idea_directed_temporal_flow_v5/result_v5.json
          if-no-files-found: error
