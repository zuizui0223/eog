name: BAM stochastic assay risk v1

on:
  pull_request:
    paths:
      - "src/eog/v2/bam_stochastic_assay_risk.py"
      - "benchmarks/run_bam_stochastic_assay_risk_v1.py"
      - "tests/test_bam_stochastic_assay_risk.py"
      - "validation/bam_stochastic_assay_risk_v1/**"
      - ".github/workflows/bam-stochastic-assay-risk-v1.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Verify stochastic assay-risk engine
        run: python -m pytest tests/test_bam_stochastic_assay_risk.py -q
      - name: Run frozen stochastic assay-risk audit
        run: |
          python benchmarks/run_bam_stochastic_assay_risk_v1.py \
            --output build/bam_stochastic_assay_risk_v1/result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: bam-stochastic-assay-risk-v1
          path: build/bam_stochastic_assay_risk_v1/result_v1.json
          if-no-files-found: error
