name: Deer heldout whole-site prediction v1
on:
  pull_request:
    paths:
      - "benchmarks/deer_site_heldout_prediction_v1.py"
      - "tests/test_deer_site_heldout_prediction_v1.py"
      - "validation/deer_site_heldout_prediction_v1/**"
      - ".github/workflows/deer-site-heldout-prediction-v1.yml"
permissions:
  contents: read
jobs:
  heldout-real-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_deer_site_heldout_prediction_v1.py
      - name: Exact public source
        run: |
          mkdir -p /tmp/deer_holdout
          curl --fail --location --retry 2 --max-time 50 --silent --show-error \
            https://raw.githubusercontent.com/BrentPease1/single-season-occupancy/f65b220d1c84240fa81cb457bf27522424fe1666/deer_detection_history.csv \
            -o /tmp/deer_holdout/deer_detection_history.csv
          echo "bcfeb04683e572d0ded79fd40917a546188b4e2df64c043d9e1ea8720d524e34  /tmp/deer_holdout/deer_detection_history.csv" | sha256sum -c -
      - name: Score five disjoint heldout site folds
        run: |
          python benchmarks/deer_site_heldout_prediction_v1.py --source /tmp/deer_holdout/deer_detection_history.csv --output /tmp/deer_holdout/result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/deer_holdout/result.json').read_text())
          assert r['sites']==87 and len(r['folds'])==5
          assert sum(x['n_test'] for x in r['folds'])==87
          assert len(r['per_site'])==87
          assert len({x['site_id'] for x in r['per_site']})==87
          print('HELDOUT_SITE_PREDICTION_VALIDATED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deer-heldout-site-prediction-v1
          path: /tmp/deer_holdout/result.json
