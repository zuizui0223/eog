name: HJA bird candidate preflight

on:
  push:
    branches:
      - agent/hja-bird-preflight
    paths:
      - ".github/workflows/hja_bird_candidate_preflight.yml"
      - "validation/hja_bird_complementarity/preflight_contract.json"
      - "src/eog/v2/candidate_preflight.py"
  pull_request:
    paths:
      - ".github/workflows/hja_bird_candidate_preflight.yml"
      - "validation/hja_bird_complementarity/preflight_contract.json"
      - "src/eog/v2/candidate_preflight.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen package
        run: python -m pip install .
      - name: Evaluate response-blind candidate preflight
        run: |
          set -euo pipefail
          mkdir -p build/hja_bird_candidate_preflight
          python - <<'PY'
          from dataclasses import asdict
          import json
          from pathlib import Path

          from eog.v2.candidate_preflight import (
              CandidatePreflightDeclaration,
              CandidatePreflightEvidence,
              evaluate_candidate_preflight,
          )

          root = Path("validation/hja_bird_complementarity")
          contract = json.loads((root / "preflight_contract.json").read_text(encoding="utf-8"))
          d = contract["declaration"]
          e = contract["response_blind_evidence"]

          declaration = CandidatePreflightDeclaration(
              attempt_id=d["attempt_id"],
              minimum_nodes=d["minimum_nodes"],
              minimum_outer_units=d["minimum_outer_units"],
              minimum_repeated_nodes=d["minimum_repeated_nodes"],
              require_separate_geometry_and_response=d["require_separate_geometry_and_response"],
              require_coordinate_geometry=d["require_coordinate_geometry"],
          )
          evidence = CandidatePreflightEvidence(
              source_identity=e["source_identity"],
              geometry_source_identity=e["geometry_source_identity"],
              response_source_identity=e["response_source_identity"],
              geometry_response_separable=e["geometry_response_separable"],
              coordinate_geometry_present=e["coordinate_geometry_present"],
              node_count=e["node_count"],
              outer_unit_count=e["outer_unit_count"],
              repeated_node_count=e["repeated_node_count"],
              layout_design=e["layout_design"],
              response_rows_opened=e["response_rows_opened"],
              response_bytes_opened=e["response_bytes_opened"],
              note=e["note"],
          )
          result = evaluate_candidate_preflight(declaration, evidence)
          payload = {
              "candidate": contract["candidate"],
              "selection_state": contract["selection_state"],
              "source": contract["source"],
              "result": asdict(result),
              "response_rows_opened": e["response_rows_opened"],
              "response_bytes_opened": e["response_bytes_opened"],
              "next": contract["next_if_ready"] if result.ready else contract["stop_if_not_ready"],
          }
          out = Path("build/hja_bird_candidate_preflight/preflight_result.json")
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2, sort_keys=True))

          assert result.status == "ready_for_geometry_gate", result
          assert result.ready is True
          assert e["response_rows_opened"] is False
          assert e["response_bytes_opened"] is False
          assert d["minimum_nodes"] == 100
          assert d["minimum_outer_units"] == 6
          assert d["minimum_repeated_nodes"] == 75
          PY
      - name: Upload response-blind preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: hja-bird-candidate-preflight
          path: build/hja_bird_candidate_preflight/preflight_result.json
          if-no-files-found: error
