name: Cakile CSIRO file metadata only

on:
  push:
    branches: [agent/cakile-csiro-metadata-probe]
    paths: [".github/workflows/cakile_csiro_support_metadata.yml"]
  pull_request:
    paths: [".github/workflows/cakile_csiro_support_metadata.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read primary file-list metadata only
        run: |
          set -euo pipefail
          mkdir -p build/cakile_csiro_file_metadata
          python - <<'PY'
          import json
          from pathlib import Path
          import urllib.request
          url="https://data.csiro.au/dap/ws/v2/collections/46047/data"
          req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"EOG-Cakile-file-metadata/1.0"})
          with urllib.request.urlopen(req,timeout=40) as response:
              body=response.read(2_000_001)
              status=getattr(response,"status",None)
              ctype=response.headers.get("Content-Type")
          if status!=200 or len(body)>2_000_000:
              raise SystemExit(f"bounded metadata request failed: {status} {len(body)}")
          data=json.loads(body.decode("utf-8"))
          files=[]
          rows=data.get("file",[]) if isinstance(data,dict) else []
          for r in rows:
              if not isinstance(r,dict):
                  continue
              files.append({
                  "fileId": r.get("fileId"),
                  "filename": r.get("filename"),
                  "size": r.get("size") if "size" in r else r.get("fileSize"),
                  "mediaType": r.get("mediaType"),
                  "description": r.get("description"),
                  "link": (r.get("link") or {}).get("href") if isinstance(r.get("link"),dict) else None,
              })
          result={
              "status":"primary_file_metadata_resolved",
              "endpoint":url,
              "http_status":status,
              "content_type":ctype,
              "file_count":len(files),
              "files":files,
              "file_payload_requests":0,
              "file_payload_bytes_opened":0,
              "response_rows_opened":False,
              "model_fits":0,
              "heldout_scores":0,
          }
          Path("build/cakile_csiro_file_metadata/files.json").write_text(json.dumps(result,indent=2,sort_keys=True,ensure_ascii=False)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True,ensure_ascii=False))
          PY
      - name: Assert metadata-only firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("build/cakile_csiro_file_metadata/files.json").read_text())
          assert r["file_payload_requests"]==0
          assert r["file_payload_bytes_opened"]==0
          assert r["response_rows_opened"] is False
          assert r["model_fits"]==0
          assert r["heldout_scores"]==0
          print("Cakile primary-file metadata firewall PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cakile-csiro-file-metadata-only
          path: build/cakile_csiro_file_metadata/files.json
          if-no-files-found: error
