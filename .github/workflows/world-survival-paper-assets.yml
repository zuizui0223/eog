name: World-survival paper assets

on:
  push:
    branches:
      - paper/world-survival-identifiability-v1
    paths:
      - "manuscript/world_survival_identifiability/**"
      - "validation/world_survival_regime_v2/neon_small_mammal_response_lock_v2_3.json"
      - ".github/workflows/world-survival-paper-assets.yml"
  pull_request:
    paths:
      - "manuscript/world_survival_identifiability/**"
      - "validation/world_survival_regime_v2/neon_small_mammal_response_lock_v2_3.json"
      - ".github/workflows/world-survival-paper-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-paper-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deterministic paper assets
        run: python manuscript/world_survival_identifiability/build_paper_assets.py
      - name: Verify generated assets
        run: |
          test -s manuscript/world_survival_identifiability/generated/figure_1_adequacy_vs_survival.svg
          test -s manuscript/world_survival_identifiability/generated/figure_2_neon_validation.svg
          test -s manuscript/world_survival_identifiability/generated/figure_3_identifiability_witness.svg
          test -s manuscript/world_survival_identifiability/generated/table_s1_scored_sites.csv
          test -s manuscript/world_survival_identifiability/generated/table_s2_response_consumed_stops.csv
          test -s manuscript/world_survival_identifiability/generated/asset_manifest_v1.json
      - name: Upload submission assets
        uses: actions/upload-artifact@v4
        with:
          name: world-survival-identifiability-paper-assets-v1
          path: manuscript/world_survival_identifiability/generated/
          if-no-files-found: error
