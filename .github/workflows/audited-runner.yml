name: Audited comparative runner

on:
  pull_request:
    paths:
      - ".github/workflows/audited-runner.yml"
      - "tests/test_runner.py"
      - "src/eog/runner.py"
      - "src/eog/manifest.py"
      - "src/eog/reference_policy.py"
      - "src/eog/uncertainty.py"
      - "src/eog/comparative.py"
      - "src/eog/geometry.py"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . pytest
      - run: pytest -q tests/test_runner.py
