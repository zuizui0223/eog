name: Hokkaido streamfish endpoint3 response header

on:
  pull_request:
    paths:
      - 'validation/hokkaido_streamfish_endpoint3/response_header_contract.json'
      - 'validation/hokkaido_streamfish_endpoint3/response_header_gate.py'
      - 'validation/hokkaido_streamfish_endpoint3/run_response_header_gate.py'
      - 'validation/hokkaido_streamfish_endpoint3/response_header_execution_authorization.json'
      - 'tests/test_hokkaido_streamfish_response_header.py'
      - '.github/workflows/hokkaido-streamfish-response-header.yml'
  push:
    branches:
      - 'execute/hokkaido-streamfish-response-header-v1'
    paths:
      - 'validation/hokkaido_streamfish_endpoint3/response_header_execute_once.json'

permissions:
  contents: read

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest
      - name: Verify header-only parser and transport firewall
        run: pytest -q tests/test_hokkaido_streamfish_response_header.py
      - name: Compile response-header modules
        run: |
          python -m py_compile \
            validation/hokkaido_streamfish_endpoint3/response_header_gate.py \
            validation/hokkaido_streamfish_endpoint3/run_response_header_gate.py
      - name: Verify frozen response-header blobs
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path('validation/hokkaido_streamfish_endpoint3')
          auth = json.loads((root / 'response_header_execution_authorization.json').read_text())
          assert auth['attempt_id'] == 'hokkaido_streamfish_endpoint3_v1'
          assert auth['issue'] == 364
          assert auth['authorized_range_requests'] == 1
          assert auth['authorized_range'] == 'bytes=0-255'
          assert auth['required_http_status'] == 206
          assert auth['response_data_row_bytes_allowed'] == 0
          assert auth['response_rows_allowed'] == 0
          assert auth['response_values_allowed'] is False
          assert auth['model_fits_allowed'] == 0
          assert auth['heldout_scores_allowed'] == 0
          assert auth['live_execute_branch'] == 'execute/hokkaido-streamfish-response-header-v1'
          bindings = {
              'pre_response_pass_git_blob_sha': root / 'pre_response_pass_certificate.json',
              'response_header_contract_git_blob_sha': root / 'response_header_contract.json',
              'response_header_evaluator_git_blob_sha': root / 'response_header_gate.py',
              'response_header_runner_git_blob_sha': root / 'run_response_header_gate.py',
          }
          for key, path in bindings.items():
              observed = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
              assert observed == auth[key], (key, observed, auth[key])
          PY

  live-header-once:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/execute/hokkaido-streamfish-response-header-v1' }}
    needs: synthetic-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify one-shot execute marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('validation/hokkaido_streamfish_endpoint3/response_header_execute_once.json')
          marker = json.loads(p.read_text())
          assert marker == {
              'attempt_id': 'hokkaido_streamfish_endpoint3_v1',
              'gate': 'response_header_only',
              'execute_once': True,
          }
          PY
      - name: Execute one response header Range request
        run: python -m validation.hokkaido_streamfish_endpoint3.run_response_header_gate
      - name: Audit response row/value firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('validation/hokkaido_streamfish_endpoint3/response_header_certificate.json')
          r = json.loads(p.read_text())
          assert r['status'] in {
              'response_header_ready',
              'stop_pre_row_response_header_transport_or_schema',
          }
          assert r['authorized_range_requests'] == 1
          assert r['response_data_row_bytes_opened'] == 0
          assert r['response_rows_opened'] == 0
          assert r['response_values_opened'] is False
          assert r['model_fits'] == 0
          assert r['heldout_scores'] == 0
          assert r['counts_as_predictive_evidence'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hokkaido-streamfish-response-header
          path: validation/hokkaido_streamfish_endpoint3/response_header_certificate.json
          if-no-files-found: error
