name: Fukushima wild boar response-free transport diagnostic

on:
  push:
    branches:
      - agent/fukushima-wild-boar-replication-2
    paths:
      - validation/fukushima_wild_boar_replication_2/transport_diag.py
      - .github/workflows/fukushima_wild_boar_replication_2_transport_diag.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile validation/fukushima_wild_boar_replication_2/transport_diag.py
      - run: python validation/fukushima_wild_boar_replication_2/transport_diag.py
      - name: Assert detection stayed closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/fukushima_wild_boar_replication_2/transport_diag.json').read_text())
          a=r['response_firewall']
          assert a['detection_payload_requests']==0
          assert a['detection_payload_bytes_opened']==0
          assert a['detection_header_opened'] is False
          assert a['detection_rows_opened'] is False
          assert a['detection_values_opened'] is False
          print(json.dumps(r, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fukushima-wild-boar-transport-diag
          path: build/fukushima_wild_boar_replication_2/transport_diag.json
          if-no-files-found: error
