name: Peck Ranch collared lizard response-source metadata audit

on:
  push:
    branches:
      - agent/peck-ranch-lizard-preflight
    paths:
      - ".github/workflows/peck_ranch_lizard_response_source_metadata.yml"
      - "validation/peck_ranch_lizard_paired_complementarity/source_contract.json"
  pull_request:
    paths:
      - ".github/workflows/peck_ranch_lizard_response_source_metadata.yml"
      - "validation/peck_ranch_lizard_paired_complementarity/source_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query Figshare collection and article metadata only
        run: |
          set -euo pipefail
          mkdir -p build/peck_ranch_response_source
          python - <<'PY'
          import json
          from pathlib import Path
          import urllib.parse, urllib.request

          contract=json.loads(Path("validation/peck_ranch_lizard_paired_complementarity/source_contract.json").read_text())
          collection=int(contract["candidate_response_source"]["figshare_collection_id"])
          requested=[]
          def get_json(url,cap=5_000_000):
              requested.append(url)
              req=urllib.request.Request(url,headers={"User-Agent":"EOG-Peck-Ranch-response-source-metadata/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=60) as response:
                  body=response.read(cap+1)
                  status=getattr(response,"status",None)
              if status != 200 or len(body)>cap:
                  raise RuntimeError(f"metadata request failed bounded checks: {status} {url}")
              return json.loads(body.decode("utf-8"))

          coll_url=f"https://api.figshare.com/v2/collections/{collection}"
          coll=get_json(coll_url)
          list_url=f"https://api.figshare.com/v2/collections/{collection}/articles?page_size=100"
          rows=get_json(list_url)
          if not isinstance(rows,list):
              raise RuntimeError("collection articles endpoint did not return a list")
          articles=[]
          for row in rows:
              aid=row.get("id")
              if not isinstance(aid,int):
                  raise RuntimeError("collection article missing integer id")
              meta=get_json(f"https://api.figshare.com/v2/articles/{aid}")
              files=[]
              for f in meta.get("files",[]):
                  files.append({
                      "id":f.get("id"),
                      "name":f.get("name"),
                      "size":f.get("size"),
                      "supplied_md5":f.get("supplied_md5"),
                      "computed_md5":f.get("computed_md5"),
                      "download_url":f.get("download_url"),
                      "mimetype":f.get("mimetype"),
                      "is_link_only":f.get("is_link_only"),
                  })
              articles.append({
                  "id":aid,
                  "title":meta.get("title"),
                  "doi":meta.get("doi"),
                  "description":meta.get("description"),
                  "files":files,
              })
          result={
              "attempt_id":contract["attempt_id"],
              "collection_id":collection,
              "collection_title":coll.get("title") if isinstance(coll,dict) else None,
              "collection_doi":coll.get("doi") if isinstance(coll,dict) else None,
              "article_count":len(articles),
              "articles":articles,
              "metadata_requests":len(requested),
              "requested_urls":requested,
              "file_payload_requests":0,
              "file_payload_bytes_opened":0,
              "gps_payload_requests":0,
              "capture_workbook_requests":0,
              "response_header_bytes_opened":0,
              "response_rows_opened":False,
              "response_values_opened":False,
              "model_fits":0,
              "heldout_scores":0,
              "status":"response_source_metadata_inventory_pass"
          }
          Path("build/peck_ranch_response_source/response_source_metadata.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True))
          if not articles:
              raise SystemExit("Figshare collection contains no articles")
          PY
      - name: Assert strict metadata-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("build/peck_ranch_response_source/response_source_metadata.json").read_text())
          assert r["file_payload_requests"] == 0
          assert r["file_payload_bytes_opened"] == 0
          assert r["gps_payload_requests"] == 0
          assert r["capture_workbook_requests"] == 0
          assert r["response_header_bytes_opened"] == 0
          assert r["response_rows_opened"] is False
          assert r["response_values_opened"] is False
          assert r["model_fits"] == 0
          assert r["heldout_scores"] == 0
          print("Peck Ranch response-source metadata-only firewall PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peck-ranch-response-source-metadata
          path: build/peck_ranch_response_source/response_source_metadata.json
          if-no-files-found: error
