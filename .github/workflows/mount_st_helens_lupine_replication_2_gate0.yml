name: Mount St Helens lupine replication 2 Gate0

on:
  push:
    branches:
      - agent/mount-st-helens-lupine-replication-2
    paths:
      - validation/mount_st_helens_lupine_replication_2/**
      - .github/workflows/mount_st_helens_lupine_replication_2_gate0.yml

permissions:
  contents: read

jobs:
  gate0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile descriptor-only Gate0
        run: python -m py_compile validation/mount_st_helens_lupine_replication_2/gate0_descriptor_only.py
      - name: Run descriptor-only availability and geometry gate
        id: gate
        continue-on-error: true
        run: python validation/mount_st_helens_lupine_replication_2/gate0_descriptor_only.py
      - name: Assert biological plot-year files stayed closed
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/mount_st_helens_lupine_replication_2/gate0_descriptor_only.json')
          assert p.exists(), 'Gate0 evidence missing'
          r=json.loads(p.read_text())
          a=r['response_firewall']
          assert a['structure_payload_requests']==0
          assert a['structure_payload_bytes_opened']==0
          assert a['structure_header_bytes_opened']==0
          assert a['structure_rows_opened'] is False
          assert a['structure_values_opened'] is False
          assert a['target_response_payload_requests']==0
          assert a['target_response_payload_bytes_opened']==0
          assert a['target_response_header_bytes_opened']==0
          assert a['target_response_rows_opened'] is False
          assert a['target_response_values_opened'] is False
          assert a['model_fits']==0
          assert a['heldout_scores']==0
          print(json.dumps({'status':r['status'],'fingerprint':r.get('fingerprint'),'availability':r.get('availability'),'focal_species':r.get('focal_species'),'geometry':r.get('geometry'),'response_firewall':a},indent=2,sort_keys=True))
          PY
      - name: Upload Gate0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mount-st-helens-lupine-replication-2-gate0
          path: build/mount_st_helens_lupine_replication_2/gate0_descriptor_only.json
          if-no-files-found: error
      - name: Propagate engineering failure only
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/mount_st_helens_lupine_replication_2/gate0_descriptor_only.json').read_text())
          if r['status'].startswith('engineering_failure'):
              raise SystemExit(r['reason'])
          print('Gate0 terminal status:', r['status'])
          PY
