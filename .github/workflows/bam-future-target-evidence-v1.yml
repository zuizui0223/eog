name: BAM future-target evidence v1

on:
  pull_request:
    paths:
      - "src/eog/v2/bam_future_target_evidence.py"
      - "benchmarks/run_bam_future_target_evidence_v1.py"
      - "tests/test_bam_future_target_evidence.py"
      - "validation/bam_future_target_evidence_v1/**"
      - ".github/workflows/bam-future-target-evidence-v1.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Verify target-aware evidence engine
        run: python -m pytest tests/test_bam_future_target_evidence.py -q
      - name: Run frozen W1 future-target evidence audit
        run: |
          python benchmarks/run_bam_future_target_evidence_v1.py \
            --output build/bam_future_target_evidence_v1/result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: bam-future-target-evidence-v1
          path: build/bam_future_target_evidence_v1/result_v1.json
          if-no-files-found: error
