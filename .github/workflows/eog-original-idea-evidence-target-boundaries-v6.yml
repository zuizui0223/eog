name: Original EOG evidence-target boundaries v6

on:
  pull_request:
    paths:
      - "validation/eog_original_idea_evidence_target_boundaries_v6/**"
      - "benchmarks/run_eog_original_idea_evidence_target_boundaries_v6.py"
      - "tests/test_eog_original_idea_evidence_target_boundaries_v6.py"
      - ".github/workflows/eog-original-idea-evidence-target-boundaries-v6.yml"
  workflow_dispatch:

concurrency:
  group: original-eog-evidence-target-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test evidence-target invariants
        run: python -m pytest tests/test_eog_original_idea_evidence_target_boundaries_v6.py -q
      - name: Run frozen evidence-target benchmark
        run: |
          python benchmarks/run_eog_original_idea_evidence_target_boundaries_v6.py \
            --output build/eog_original_idea_evidence_target_boundaries_v6/result_v6.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-original-idea-evidence-target-boundaries-v6
          path: build/eog_original_idea_evidence_target_boundaries_v6/result_v6.json
          if-no-files-found: error
