name: EOG Alternaria binary components v36

on:
  pull_request:
    paths:
      - "benchmarks/run_eog_alternaria_binary_components_v36.py"
      - "docs/eog_alternaria_binary_components_v36.md"
      - "validation/eog_alternaria_binary_components_v36/**"
      - "tests/test_eog_alternaria_binary_components_v36.py"
      - ".github/workflows/eog-alternaria-binary-components-v36.yml"
  workflow_dispatch:

concurrency:
  group: eog-alternaria-binary-components-v36-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test v36 helpers
        run: python -m pytest tests/test_eog_alternaria_binary_components_v36.py -q
      - name: Run frozen v36 test
        run: |
          python benchmarks/run_eog_alternaria_binary_components_v36.py \
            --output build/eog_alternaria_binary_components_v36/result_v36.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-alternaria-binary-components-v36
          path: build/eog_alternaria_binary_components_v36/result_v36.json
          if-no-files-found: error

  score-macos-fallback:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test v36 helpers
        run: python -m pytest tests/test_eog_alternaria_binary_components_v36.py -q
      - name: Run frozen v36 test
        run: |
          python benchmarks/run_eog_alternaria_binary_components_v36.py \
            --output build/eog_alternaria_binary_components_v36/result_v36_macos.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-alternaria-binary-components-v36-macos
          path: build/eog_alternaria_binary_components_v36/result_v36_macos.json
          if-no-files-found: error
