name: Tampa seagrass endpoint3 Gate0

on:
  pull_request:
    paths:
      - 'validation/tampa_seagrass_endpoint3/**'
      - 'tests/test_tampa_seagrass_gate0_pre_response.py'
      - '.github/workflows/tampa-seagrass-gate0.yml'
  push:
    branches:
      - 'execute/tampa-seagrass-gate0-v1'
    paths:
      - 'validation/tampa_seagrass_endpoint3/gate0_execute_once.json'

permissions:
  contents: read

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen Gate0 test runtime
        run: |
          python -m pip install -e . --no-deps
          python -m pip install pytest
      - name: Verify Tampa event-only normalized Gate0
        run: python -m pytest tests/test_tampa_seagrass_gate0_pre_response.py tests/test_v2_problem_contract.py -q
      - name: Compile Tampa Gate0 adapter
        run: python -m py_compile validation/tampa_seagrass_endpoint3/gate0_pre_response.py
      - name: Verify authorization blobs and response firewall
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('validation/tampa_seagrass_endpoint3')
          auth = json.loads((root / 'gate0_execution_authorization.json').read_text())
          assert auth['attempt_id'] == 'tampa_seagrass_endpoint3_v1'
          assert auth['issue'] == 388
          assert auth['authorized_safe_file_gets'] == 1
          assert auth['maximum_safe_file_bytes_total'] == 24654717
          assert auth['occurrence_requests_allowed'] == 0
          assert auth['occurrence_bytes_allowed'] == 0
          assert auth['occurrence_rows_allowed'] == 0
          assert auth['occurrence_values_allowed'] is False
          assert auth['emof_requests_allowed'] == 0
          assert auth['emof_bytes_allowed'] == 0
          assert auth['emof_rows_allowed'] == 0
          assert auth['emof_values_allowed'] is False
          assert auth['model_fits_allowed'] == auth['heldout_scores_allowed'] == 0
          assert auth['source_event_git_blob_sha1'] == '583b4d4e328290ab065346579eb4f29f03ea0f99'
          assert auth['source_event_size_bytes'] == 24654717
          bindings = {
              'source_contract_git_blob_sha1': root / 'source_contract.json',
              'gate0_evaluator_git_blob_sha1': root / 'gate0_pre_response.py',
              'generic_problem_contract_git_blob_sha1': Path('src/eog/v2/problem_contract.py'),
          }
          for field, path in bindings.items():
              actual = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
              assert actual == auth[field], (field, actual, auth[field])
          PY
      - name: Verify no live marker in proposal
        if: ${{ github.event_name == 'pull_request' }}
        run: test ! -e validation/tampa_seagrass_endpoint3/gate0_execute_once.json

  live-gate0-once:
    needs: synthetic-boundary
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/execute/tampa-seagrass-gate0-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install EOG without dependency mutation
        run: python -m pip install -e . --no-deps
      - name: Verify once-only marker and authorization
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('validation/tampa_seagrass_endpoint3')
          marker = json.loads((root / 'gate0_execute_once.json').read_text())
          assert marker == {
              'attempt_id': 'tampa_seagrass_endpoint3_v1',
              'issue': 388,
              'execute_once': True,
              'authorization': 'gate0_execution_authorization.json'
          }
          auth = json.loads((root / 'gate0_execution_authorization.json').read_text())
          bindings = {
              'source_contract_git_blob_sha1': root / 'source_contract.json',
              'gate0_evaluator_git_blob_sha1': root / 'gate0_pre_response.py',
              'generic_problem_contract_git_blob_sha1': Path('src/eog/v2/problem_contract.py'),
          }
          for field, path in bindings.items():
              actual = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
              assert actual == auth[field], (field, actual, auth[field])
          PY
      - name: Execute Tampa Event-core Gate0 once
        run: python -m validation.tampa_seagrass_endpoint3.gate0_pre_response
      - name: Audit terminal certificate and response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('validation/tampa_seagrass_endpoint3/gate0_pre_response_certificate.json')
          r = json.loads(p.read_text())
          assert r['attempt_id'] == 'tampa_seagrass_endpoint3_v1'
          assert r['issue'] == 388
          assert r['status'] in {
              'gate0_pre_response_ready',
              'stop_pre_response_event_registry_geometry_or_schema',
          }
          assert 0 <= r['safe_file_requests'] <= 1
          assert 0 <= r['safe_file_bytes_opened'] <= 24654717
          assert r['occurrence_requests'] == 0
          assert r['occurrence_bytes_opened'] == 0
          assert r['occurrence_rows_opened'] == 0
          assert r['occurrence_values_opened'] is False
          assert r['emof_requests'] == 0
          assert r['emof_bytes_opened'] == 0
          assert r['emof_rows_opened'] == 0
          assert r['emof_values_opened'] is False
          assert r['model_fits'] == r['heldout_scores'] == 0
          assert r['counts_as_predictive_evidence'] is False
          if r['status'] == 'gate0_pre_response_ready':
              assert r['safe_file_requests'] == 1
              assert r['safe_file_bytes_opened'] == 24654717
              assert r['event_git_blob_sha1'] == '583b4d4e328290ab065346579eb4f29f03ea0f99'
              assert r['candidate_node_count'] >= 30
              assert r['candidate_unit_count'] >= 300
              assert r['context_count'] >= 10
              assert sorted(int(k) for k in r['fold_node_counts']) == [1, 2, 3, 4, 5]
              assert all(r['fold_node_counts'][str(k)] > 0 for k in range(1, 6))
              assert len(r['world_family']['local_thresholds_km']) >= 3
              assert r['world_family']['external_open'] is True
              assert r['normalized_problem']['schema'] == 'eog.normalized_pre_response_problem.v1'
              assert r['normalized_problem']['response_locked'] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tampa-seagrass-gate0-pre-response
          path: validation/tampa_seagrass_endpoint3/gate0_pre_response_certificate.json
          if-no-files-found: error
