name: Adaptive evidence tree v2.9

on:
  pull_request:
    paths:
      - "src/eog/v2/adaptive_evidence_tree.py"
      - "validation/adaptive_evidence_tree_v2_9/**"
      - "benchmarks/run_adaptive_evidence_tree_v2_9.py"
      - "tests/test_adaptive_evidence_tree.py"
      - ".github/workflows/adaptive-evidence-tree-v2-9.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Run frozen adaptive evidence-tree benchmark
        run: |
          python benchmarks/run_adaptive_evidence_tree_v2_9.py \
            --output build/adaptive_evidence_tree_v2_9/result_v2_9.json
      - name: Verify focused tests
        run: python -m pytest tests/test_adaptive_evidence_tree.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-evidence-tree-v2-9
          path: build/adaptive_evidence_tree_v2_9/result_v2_9.json
          if-no-files-found: error
