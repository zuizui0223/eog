name: Original EOG cost-uncertain policy v16

on:
  pull_request:
    paths:
      - "validation/eog_original_idea_cost_uncertain_policy_v16/**"
      - "benchmarks/run_eog_original_idea_cost_uncertain_policy_v16.py"
      - "tests/test_eog_original_idea_cost_uncertain_policy_v16.py"
      - ".github/workflows/eog-original-idea-cost-uncertain-v16.yml"
  workflow_dispatch:

concurrency:
  group: original-eog-cost-uncertain-v16-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test cost-uncertain policy invariants
        run: python -m pytest tests/test_eog_original_idea_cost_uncertain_policy_v16.py -q
      - name: Run frozen cost-uncertain benchmark
        run: |
          python benchmarks/run_eog_original_idea_cost_uncertain_policy_v16.py \
            --output build/eog_original_idea_cost_uncertain_policy_v16/result_v16.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-original-idea-cost-uncertain-policy-v16
          path: build/eog_original_idea_cost_uncertain_policy_v16/result_v16.json
          if-no-files-found: error
