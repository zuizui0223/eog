name: Charaxes same-source transport recovery v2
on:
  pull_request:
    types: [opened]
    paths:
      - 'benchmarks/charaxes_source_recovery_v2.py'
      - '.github/workflows/charaxes-same-source-recovery-v2.yml'
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_charaxes_source_recovery_v2.py
      - name: Same official URLs and frozen MD5 with wildcard Accept
        run: python benchmarks/charaxes_source_recovery_v2.py --output-dir /tmp/charaxes_verified_source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: charaxes-verified-source-v2
          path: /tmp/charaxes_verified_source/*
          if-no-files-found: error
