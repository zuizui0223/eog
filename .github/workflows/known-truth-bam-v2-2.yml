name: Known-truth BAM v2.2 source-compatible

on:
  pull_request:
    paths:
      - "src/eog/v2/known_truth_bam_v2_2.py"
      - "validation/known_truth_bam_v2_2/**"
      - "benchmarks/run_known_truth_bam_v2_2.py"
      - "tests/test_known_truth_bam_v2_2.py"
      - ".github/workflows/known-truth-bam-v2-2.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Verify activation and focused tests
        run: python -m pytest tests/test_known_truth_bam_v2_2.py -q
      - name: Run frozen BAM v2.2 protocol
        run: |
          python benchmarks/run_known_truth_bam_v2_2.py \
            --output build/known_truth_bam_v2_2/result_v2_2.json
      - uses: actions/upload-artifact@v4
        with:
          name: known-truth-bam-v2-2
          path: build/known_truth_bam_v2_2/result_v2_2.json
          if-no-files-found: error
