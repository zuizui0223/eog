name: Columbia shrubsteppe endpoint3 Gate1 ZIP inventory

on:
  pull_request:
    paths:
      - 'validation/columbia_shrubsteppe_endpoint3/gate1_*'
      - 'validation/columbia_shrubsteppe_endpoint3/gate0_metadata_pass_certificate.json'
      - 'tests/test_columbia_shrubsteppe_gate1_zip_inventory.py'
      - '.github/workflows/columbia-shrubsteppe-gate1.yml'
  push:
    branches:
      - 'execute/columbia-shrubsteppe-gate1-v1'
    paths:
      - 'validation/columbia_shrubsteppe_endpoint3/gate1_execute_once.json'

permissions:
  contents: read

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify bounded ZIP inventory and focal-selection boundary
        run: pytest -q tests/test_columbia_shrubsteppe_gate1_zip_inventory.py
      - name: Compile Gate1 module
        run: python -m py_compile validation/columbia_shrubsteppe_endpoint3/gate1_zip_inventory.py
      - name: Verify authorization blobs
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('validation/columbia_shrubsteppe_endpoint3')
          auth=json.loads((root/'gate1_execution_authorization.json').read_text())
          assert auth['attempt_id']=='columbia_shrubsteppe_endpoint3_v1'
          assert auth['issue']==370
          assert auth['maximum_dryad_presign_requests']==2
          assert auth['maximum_s3_range_requests']==4
          assert auth['archive_member_payload_bytes_allowed']==0
          assert auth['live_execute_branch']=='execute/columbia-shrubsteppe-gate1-v1'
          bindings={
            'gate0_pass_git_blob_sha': root/'gate0_metadata_pass_certificate.json',
            'gate1_contract_git_blob_sha': root/'gate1_zip_inventory_contract.json',
            'gate1_evaluator_git_blob_sha': root/'gate1_zip_inventory.py',
          }
          for key,path in bindings.items():
              observed=subprocess.check_output(['git','hash-object',str(path)],text=True).strip()
              assert observed==auth[key], (key, observed, auth[key])
          PY
      - name: Verify no live marker in proposal
        if: ${{ github.event_name == 'pull_request' }}
        run: test ! -e validation/columbia_shrubsteppe_endpoint3/gate1_execute_once.json

  live-gate1-once:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/execute/columbia-shrubsteppe-gate1-v1' }}
    needs: synthetic-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install EOG without dependency mutation
        run: python -m pip install -e . --no-deps
      - name: Verify one-shot execute marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('validation/columbia_shrubsteppe_endpoint3/gate1_execute_once.json')
          r=json.loads(p.read_text())
          assert r == {
            'attempt_id':'columbia_shrubsteppe_endpoint3_v1',
            'issue':370,
            'execute_once':True,
            'authorization':'gate1_execution_authorization.json'
          }
          PY
      - name: Execute bounded ZIP inventory once
        run: python -m validation.columbia_shrubsteppe_endpoint3.gate1_zip_inventory
      - name: Audit terminal certificate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('validation/columbia_shrubsteppe_endpoint3/gate1_zip_inventory_certificate.json')
          r=json.loads(p.read_text())
          assert r['attempt_id']=='columbia_shrubsteppe_endpoint3_v1'
          assert r['issue']==370
          assert r['status'] in {'gate1_zip_inventory_ready','stop_pre_response_zip_transport_or_inventory'}
          assert 0 <= r['presign_requests'] <= 2
          assert 0 <= r['s3_range_requests'] <= 4
          assert r['local_header_bytes_opened']==0
          assert r['archive_member_payload_bytes_opened']==0
          assert r['detection_history_payload_bytes_opened']==0
          assert r['camera_record_payload_bytes_opened']==0
          assert r['response_values_opened'] is False
          assert r['model_fits']==0 and r['heldout_scores']==0
          if r['status']=='gate1_zip_inventory_ready':
              assert set(r['inventories'])=={'csvs','raw_data'}
              assert r['focal_selection']['selected_member']['basename'].endswith('_dh.csv')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: columbia-shrubsteppe-gate1-zip-inventory
          path: validation/columbia_shrubsteppe_endpoint3/gate1_zip_inventory_certificate.json
          if-no-files-found: error
