name: Original EOG virtual-world validation v1

on:
  pull_request:
    paths:
      - "validation/eog_original_idea_virtual_worlds_v1/**"
      - "benchmarks/run_eog_original_idea_virtual_worlds_v1.py"
      - "tests/test_eog_original_idea_virtual_worlds.py"
      - ".github/workflows/eog-original-idea-virtual-worlds-v1.yml"
  workflow_dispatch:

concurrency:
  group: original-eog-virtual-worlds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test benchmark invariants
        run: python -m pytest tests/test_eog_original_idea_virtual_worlds.py -q
      - name: Run frozen virtual-world benchmark
        run: |
          python benchmarks/run_eog_original_idea_virtual_worlds_v1.py \
            --output build/eog_original_idea_virtual_worlds_v1/result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-original-idea-virtual-worlds-v1
          path: build/eog_original_idea_virtual_worlds_v1/result_v1.json
          if-no-files-found: error
