name: EOG arrival-role symmetry v32

on:
  pull_request:
    paths:
      - "benchmarks/run_eog_arrival_role_symmetry_v32.py"
      - "docs/eog_arrival_role_symmetry_v32.md"
      - "validation/eog_arrival_role_symmetry_v32/**"
      - "tests/test_eog_arrival_role_symmetry_v32.py"
      - ".github/workflows/eog-arrival-role-symmetry-v32.yml"
  workflow_dispatch:

concurrency:
  group: eog-arrival-role-symmetry-v32-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test role alignment
        run: python -m pytest tests/test_eog_arrival_role_symmetry_v32.py -q
      - name: Run frozen v32 test
        run: |
          python benchmarks/run_eog_arrival_role_symmetry_v32.py \
            --output build/eog_arrival_role_symmetry_v32/result_v32.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-arrival-role-symmetry-v32
          path: build/eog_arrival_role_symmetry_v32/result_v32.json
          if-no-files-found: error
