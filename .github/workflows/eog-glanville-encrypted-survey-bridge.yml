name: EOG Glanville encrypted public-survey bridge for uploaded genetic assignments

# Source authenticated and encrypted at run 44547980619; do not automatically redownload on PR updates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-ephemeral-ciphertext:
    name: Validate public source SHA and output authenticated ciphertext only
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install crypto + tests
        run: python -m pip install cryptography pytest
      - name: Check pinned original archive and ephemeral public key
        run: |
          python - <<'PY'
          import json,hashlib
          p=json.load(open("validation/glanville_uploaded_origin_crosswalk_v1/protocol_v1.json"))
          assert p["status"]=="frozen_after_user_file_inspection_before_crosswalk"
          assert p["source_published_dataset"]["source_sha256"]=="140e5361f9bced20a434bfee01bae6ce7c925e028718cdb9c6fd8aa635cc912a"
          assert p["prior_source_repository"]["archive_sha256"]=="c70f43544f61e7273afebfa42ed1d488c3b945efe4d5c68e6557030087ee7fd9"
          assert hashlib.sha256(p["ephemeral_encryption_public_key_pem"].encode()).hexdigest()==p["public_key_sha256"]
          PY
      - name: Synthetic integrity/privacy contract tests
        run: python -m pytest -q tests/test_glanville_encrypt_survey_source_v1.py
      - name: One-shot SHA-pinned published survey source; no plaintext artifact
        run: |
          python scripts/glanville_encrypt_survey_source_v1.py \
            --protocol validation/glanville_uploaded_origin_crosswalk_v1/protocol_v1.json \
            --output results/glanville_uploaded_origin_crosswalk_v1/encrypted_survey.json
          python - <<'PY'
          import json
          r=json.load(open("results/glanville_uploaded_origin_crosswalk_v1/encrypted_survey.json"))
          assert r["status"]=="ENCRYPTED_SURVEY_SOURCE_ONLY_NO_PUBLIC_ROW_RECORDS"
          assert r["rows_or_site_identifiers_logged"]==0
          assert "survey" not in r and "network" not in r
          print("CIPHERTEXT_ONLY_STATUS="+r["status"])
          print("PUBLIC_SOURCE_ROWS_ENCRYPTED="+str(r["survey_row_count"]))
          PY
      - name: Upload only encrypted bytes, no individual patch/year identifiers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glanville-one-shot-encrypted-survey-v1
          path: results/glanville_uploaded_origin_crosswalk_v1/encrypted_survey.json
          if-no-files-found: error
          retention-days: 1
