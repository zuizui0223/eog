name: Finland institutional mirror response-free admission v2

on:
  pull_request:
    paths:
      - ".github/workflows/finland-colonization-institutional-mirror-admission-v2.yml"
      - "benchmarks/finland_institutional_mirror_transport.py"
      - "benchmarks/finland_csv_format_adapter.py"
      - "benchmarks/finland_historical_count_diagnostic.py"
      - "benchmarks/finland_historical_count_grid.py"
      - "benchmarks/finland_source_identity_identifiability.py"
      - "benchmarks/finland_source_identity_identifiability_v2.py"
      - "tests/test_finland_csv_format_adapter.py"
      - "tests/test_finland_source_identity_identifiability.py"
      - "tests/test_finland_historical_count_grid.py"
      - "docs/eog_v2_finland_institutional_mirror_transport_contract.md"
      - "docs/eog_v2_finland_response_free_schema_normalization.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen package and transport dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "requests==2.32.5"
      - name: Test response-free adapters and source identifiability
        run: |
          pytest -q \
            tests/test_finland_csv_format_adapter.py \
            tests/test_finland_source_identity_identifiability.py \
            tests/test_finland_historical_count_grid.py
      - name: Acquire byte-identical Dryad object through institutional Zenodo mirror
        run: |
          mkdir -p benchmark_results/finland_colonization/raw
          python benchmarks/finland_institutional_mirror_transport.py \
            --output benchmark_results/finland_colonization/raw/colonization_select.csv \
            --provenance benchmark_results/finland_colonization/institutional_mirror_provenance.json \
            > benchmark_results/finland_colonization/transport_stdout.json
      - name: Run frozen response-free admission and predictor preparation through dialect adapter
        id: response_free_admission
        run: |
          python benchmarks/finland_csv_format_adapter.py \
            --input benchmark_results/finland_colonization/raw/colonization_select.csv \
            --admission benchmark_results/finland_colonization/admission.json \
            --bundle benchmark_results/finland_colonization/features.npz \
            --manifest benchmark_results/finland_colonization/feature_manifest.json \
            --format-manifest benchmark_results/finland_colonization/csv_format_manifest.json \
            > benchmark_results/finland_colonization/adapter_stdout.json
      - name: Diagnose historical-count mismatch without outcome access
        if: failure() && steps.response_free_admission.outcome == 'failure'
        run: |
          python benchmarks/finland_historical_count_diagnostic.py \
            --input benchmark_results/finland_colonization/raw/colonization_select.csv \
            --output benchmark_results/finland_colonization/historical_count_diagnostic.json \
            > benchmark_results/finland_colonization/historical_count_diagnostic_stdout.json
      - name: Audit source identity identifiability without outcome access
        if: failure() && steps.response_free_admission.outcome == 'failure'
        run: |
          python benchmarks/finland_source_identity_identifiability_v2.py \
            --input benchmark_results/finland_colonization/raw/colonization_select.csv \
            --output benchmark_results/finland_colonization/source_identity_identifiability.json \
            > benchmark_results/finland_colonization/source_identity_identifiability_stdout.json
      - name: Verify response firewall, provenance and scientific admission
        if: success()
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root=Path('benchmark_results/finland_colonization')
          raw=root/'raw'/'colonization_select.csv'
          provenance=json.loads((root/'institutional_mirror_provenance.json').read_text())
          fmt=json.loads((root/'csv_format_manifest.json').read_text())
          admission=json.loads((root/'admission.json').read_text())
          manifest=json.loads((root/'feature_manifest.json').read_text())
          sha=hashlib.sha256(raw.read_bytes()).hexdigest()
          assert provenance['status']=='finland-institutional-mirror-byte-identical-to-dryad'
          assert provenance['outcome_values_accessed'] is False
          assert provenance['csv_contents_parsed'] is False
          assert provenance['downloaded_sha256']==provenance['dryad_digest']==sha
          assert provenance['downloaded_size']==provenance['dryad_file_size']==129157803
          assert fmt['schema']=='eog_v2_finland_csv_format_v1'
          assert fmt['outcome_values_accessed'] is False
          assert fmt['raw_sha256']==sha
          assert fmt['scientific_code_changed_by_adapter'] is False
          assert admission['status']=='finland-colonization-response-free-admission'
          assert admission['outcome_values_accessed'] is False
          assert admission['admitted'] is True
          assert admission['n_islands']==471
          assert admission['n_sourceful_species']>=100
          assert all(check['passed'] for check in admission['checks'].values())
          assert manifest['schema']=='eog_v2_finland_colonization_response_free_bundle_v1'
          assert manifest['outcome_values_accessed'] is False
          assert manifest['raw_sha256']==admission['raw_sha256']==sha
          assert manifest['n_species_analysis_response_free']>=100
          assert len(manifest['feature_bundle_fingerprint'])==64
          assert fmt['feature_bundle_fingerprint']==manifest['feature_bundle_fingerprint']
          PY
      - name: Record immutable raw identity before removal
        if: always()
        run: |
          if test -f benchmark_results/finland_colonization/raw/colonization_select.csv; then
            sha256sum benchmark_results/finland_colonization/raw/colonization_select.csv \
              > benchmark_results/finland_colonization/raw_csv_sha256.txt
            stat --printf='%s\n' benchmark_results/finland_colonization/raw/colonization_select.csv \
              > benchmark_results/finland_colonization/raw_size_bytes.txt
          fi
      - name: Remove raw data before artifact upload
        if: always()
        run: rm -rf benchmark_results/finland_colonization/raw
      - name: Upload response-free admission artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finland-colonization-institutional-mirror-admission-v2
          path: |
            benchmark_results/finland_colonization/institutional_mirror_provenance.json
            benchmark_results/finland_colonization/transport_stdout.json
            benchmark_results/finland_colonization/csv_format_manifest.json
            benchmark_results/finland_colonization/adapter_stdout.json
            benchmark_results/finland_colonization/admission.json
            benchmark_results/finland_colonization/historical_count_diagnostic.json
            benchmark_results/finland_colonization/historical_count_diagnostic_stdout.json
            benchmark_results/finland_colonization/source_identity_identifiability.json
            benchmark_results/finland_colonization/source_identity_identifiability_stdout.json
            benchmark_results/finland_colonization/features.npz
            benchmark_results/finland_colonization/feature_manifest.json
            benchmark_results/finland_colonization/raw_csv_sha256.txt
            benchmark_results/finland_colonization/raw_size_bytes.txt
          if-no-files-found: warn
