name: Exact eventual genetic reachability validation

on:
  pull_request:
    paths:
      - "src/eog/eventual_reachability_genetics.py"
      - "tests/test_eventual_reachability_genetics.py"
      - "benchmarks/eventual_genetic_distance_development.py"
      - ".github/workflows/eventual-genetic-reachability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run exact-eventual tests
        run: python -m pytest -q tests/test_eventual_reachability_genetics.py
      - name: Run exact-eventual development screen
        run: |
          mkdir -p benchmark_results/eventual_genetic_reachability
          python benchmarks/eventual_genetic_distance_development.py \
            > benchmark_results/eventual_genetic_reachability/development.json
      - name: Check output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("benchmark_results/eventual_genetic_reachability/development.json")
          result = json.loads(path.read_text())
          assert result["status"] == "development-exact-eventual-genetic-distance-before-empirical-genetics"
          assert result["n_candidates"] == 9
          assert result["symmetrisations"] == ["mean_log", "max_log", "mean_support"]
          for candidate in result["candidates"]:
              assert set(candidate["regimes"]) == {
                  "geography_null",
                  "ibe_reference_complete",
                  "intermediate_structure",
                  "directional_structure",
              }
          PY
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventual-genetic-reachability-development
          path: benchmark_results/eventual_genetic_reachability
          if-no-files-found: error
