name: Support topology grouped held-out validation

on:
  pull_request:
    paths:
      - 'src/eog/support_topology_validation.py'
      - 'tests/test_support_topology_grouped_validation.py'
      - '.github/workflows/support-topology-grouped-holdout.yml'
  push:
    branches: [main]
    paths:
      - 'src/eog/support_topology_validation.py'
      - 'tests/test_support_topology_grouped_validation.py'
      - '.github/workflows/support-topology-grouped-holdout.yml'

jobs:
  grouped-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run grouped held-out tests
        run: pytest tests/test_support_topology_grouped_validation.py tests/test_support_topology_validation.py -q
