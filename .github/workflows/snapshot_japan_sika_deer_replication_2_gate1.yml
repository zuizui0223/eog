name: Snapshot Japan sika deer replication 2 Gate1

on:
  push:
    branches:
      - agent/snapshot-japan-sika-deer-replication-2
    paths:
      - validation/snapshot_japan_sika_deer_replication_2/gate1_time_geometry.py
      - validation/snapshot_japan_sika_deer_replication_2/gate1_time_geometry_contract.json
      - validation/snapshot_japan_sika_deer_replication_2/gate0_response_free_certificate.json
      - validation/snapshot_japan_sika_deer_replication_2/pensoft_xml_sequence_identity_certificate.json
      - validation/snapshot_japan_sika_deer_replication_2/gate0_response_free.py
      - validation/snapshot_japan_sika_deer_replication_2/gate0_response_free_run.py
      - .github/workflows/snapshot_japan_sika_deer_replication_2_gate1.yml

permissions:
  contents: read

jobs:
  gate1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile response-free Gate1
        run: python -m py_compile validation/snapshot_japan_sika_deer_replication_2/gate1_time_geometry.py
      - name: Run response-free time / geometry gate
        id: gate
        continue-on-error: true
        run: python validation/snapshot_japan_sika_deer_replication_2/gate1_time_geometry.py
      - name: Assert sequence response firewall
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/snapshot_japan_sika_deer_replication_2/gate1_time_geometry.json')
          assert p.exists(), 'Gate1 evidence missing'
          r=json.loads(p.read_text())
          a=r['response_firewall']
          assert a['sequence_payload_requests']==0
          assert a['sequence_payload_bytes_opened']==0
          assert a['sequence_header_bytes_opened']==0
          assert a['sequence_rows_opened'] is False
          assert a['sequence_values_opened'] is False
          assert a['model_fits']==0
          assert a['heldout_scores']==0
          print(json.dumps({'status':r['status'],'fingerprint':r.get('fingerprint'),'availability':r.get('availability',{}),'structural_ladder':r.get('structural_ladder',{}),'response_firewall':a},indent=2,sort_keys=True))
          PY
      - name: Upload Gate1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-japan-sika-deer-replication-2-gate1
          path: build/snapshot_japan_sika_deer_replication_2/gate1_time_geometry.json
          if-no-files-found: error
      - name: Propagate engineering failure only
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/snapshot_japan_sika_deer_replication_2/gate1_time_geometry.json').read_text())
          if r['status'].startswith('engineering_failure'):
              raise SystemExit(r['reason'])
          print('Scientific Gate1 terminal status:',r['status'])
          PY
