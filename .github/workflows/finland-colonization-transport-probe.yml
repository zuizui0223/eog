name: Finland Dryad public transport probe

on:
  pull_request:
    paths:
      - ".github/workflows/finland-colonization-transport-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser driver
        run: python -m pip install "playwright==1.55.0"
      - name: Probe WAF-aware same-browser file stream without consuming data
        run: |
          mkdir -p benchmark_results/finland_transport_probe
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from playwright.sync_api import sync_playwright

          root = Path('benchmark_results/finland_transport_probe')
          landing = 'https://datadryad.org/dataset/doi%3A10.5061/dryad.ffbg79cr6'
          with sync_playwright() as p:
              browser = p.chromium.launch(channel='chrome', headless=True)
              context = browser.new_context()
              page = context.new_page()
              requests = []
              responses = []
              context.on('request', lambda request: requests.append({
                  'url': request.url,
                  'method': request.method,
                  'resource_type': request.resource_type,
              }))
              context.on('response', lambda response: responses.append({
                  'url': response.url,
                  'status': response.status,
                  'content_type': response.headers.get('content-type'),
                  'content_length': response.headers.get('content-length'),
                  'content_range': response.headers.get('content-range'),
                  'content_disposition': response.headers.get('content-disposition'),
                  'location': response.headers.get('location'),
              }))
              page.goto(landing, wait_until='domcontentloaded', timeout=120_000)
              page.wait_for_function(
                  "typeof window.AwsWafIntegration !== 'undefined'",
                  timeout=60_000,
              )
              token_summary = page.evaluate(
                  """async () => {
                    const token = await window.AwsWafIntegration.getToken();
                    return {present: !!token, length: token ? token.length : 0};
                  }"""
              )
              root.joinpath('waf_token_summary.json').write_text(
                  json.dumps(token_summary, indent=2, sort_keys=True), encoding='utf-8'
              )
              link = page.locator("a[href*='/downloads/file_stream/']").first
              href = link.get_attribute('href')
              if not href:
                  raise RuntimeError('no Dryad file stream href')
              stream = urljoin(landing, href)
              root.joinpath('stream_url.txt').write_text(stream + '\n')

              # Use the AWS WAF browser integration in the same browser context. A byte-range
              # request asks only for headers/minimal data while still exercising the real
              # protected route and any signed-object redirect.
              fetch_summary = page.evaluate(
                  """async (url) => {
                    const response = await window.AwsWafIntegration.fetch(url, {
                      method: 'GET',
                      redirect: 'follow',
                      headers: {'Range': 'bytes=0-0'}
                    });
                    return {
                      status: response.status,
                      ok: response.ok,
                      url: response.url,
                      redirected: response.redirected,
                      type: response.type,
                      contentType: response.headers.get('content-type'),
                      contentLength: response.headers.get('content-length'),
                      contentRange: response.headers.get('content-range'),
                      contentDisposition: response.headers.get('content-disposition'),
                      location: response.headers.get('location')
                    };
                  }""",
                  stream,
              )
              root.joinpath('waf_fetch_summary.json').write_text(
                  json.dumps(fetch_summary, indent=2, sort_keys=True), encoding='utf-8'
              )
              page.wait_for_timeout(1500)
              root.joinpath('requests.json').write_text(
                  json.dumps(requests, indent=2, sort_keys=True), encoding='utf-8'
              )
              root.joinpath('responses.json').write_text(
                  json.dumps(responses, indent=2, sort_keys=True), encoding='utf-8'
              )
              object_store = []
              for request in requests:
                  url = request['url']
                  host = urlparse(url).netloc.lower()
                  if any(token in host for token in ('amazonaws', 'cloudfront', 's3', 'storage.googleapis')):
                      object_store.append(url)
              root.joinpath('object_store_requests.txt').write_text(
                  '\n'.join(dict.fromkeys(object_store)) + '\n', encoding='utf-8'
              )
              browser.close()
          PY
      - name: Print safe transport summary
        run: |
          cat benchmark_results/finland_transport_probe/waf_token_summary.json
          cat benchmark_results/finland_transport_probe/waf_fetch_summary.json
          sed -n '1,20p' benchmark_results/finland_transport_probe/object_store_requests.txt || true
      - name: Upload transport probe
        uses: actions/upload-artifact@v4
        with:
          name: finland-dryad-transport-probe
          path: benchmark_results/finland_transport_probe
          if-no-files-found: error
