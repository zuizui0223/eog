name: A-Islands authoritative benchmark

on:
  push:
    branches:
      - agent/optimize-and-run-aislands-benchmark
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install EOG and frozen data dependencies
        run: |
          python -m pip install -e .
          python -m pip install pyshp==2.3.1 rasterio==1.4.3

      - name: Reproduce A-Islands v1.0 source
        run: |
          python benchmarks/fetch_aislands_zenodo.py \
            --record-id 10775809 \
            --expected-version 1.0 \
            --output-dir results/aislands_authoritative/source

      - name: Reproduce frozen 886-taxon cohort
        run: |
          python benchmarks/aislands_species_screen.py \
            --island-data results/aislands_authoritative/source/island_data.csv \
            --species-data results/aislands_authoritative/source/species_data.csv \
            --output results/aislands_authoritative/species_screen.csv \
            --min-present-islands 10 \
            --min-absent-islands 10 \
            --min-prevalence 0 \
            --max-prevalence 1
          python benchmarks/audit_aislands_taxon_status.py \
            --species-data results/aislands_authoritative/source/species_data.csv \
            --species-screen results/aislands_authoritative/species_screen.csv \
            --output-csv results/aislands_authoritative/taxon_status_audit.csv \
            --output-summary results/aislands_authoritative/taxon_status_summary.json
          python benchmarks/freeze_aislands_native_cohort.py \
            --status-audit results/aislands_authoritative/taxon_status_audit.csv \
            --output-cohort results/aislands_authoritative/frozen_taxon_cohort.csv \
            --output-summary results/aislands_authoritative/frozen_taxon_cohort_summary.json

      - name: Reproduce frozen island units and spatial folds
        run: |
          python benchmarks/audit_aislands_model_islands.py \
            --island-data results/aislands_authoritative/source/island_data.csv \
            --species-data results/aislands_authoritative/source/species_data.csv \
            --shapefile results/aislands_authoritative/source/raw/A-Island_shape.shp \
            --projection results/aislands_authoritative/source/raw/A-Island_shape.prj \
            --output-csv results/aislands_authoritative/island_model_audit.csv \
            --output-summary results/aislands_authoritative/island_model_audit_summary.json
          python benchmarks/freeze_aislands_spatial_folds.py \
            --audit-csv results/aislands_authoritative/island_model_audit.csv \
            --output-folds results/aislands_authoritative/spatial_folds.csv \
            --output-summary results/aislands_authoritative/spatial_folds_summary.json \
            --block-size-degrees 5 \
            --n-folds 5

      - name: Reproduce frozen CHELSA climate artifact
        run: |
          python benchmarks/extract_aislands_chelsa_climate.py \
            --island-audit results/aislands_authoritative/island_model_audit.csv \
            --output-csv results/aislands_authoritative/island_climate.csv \
            --output-manifest results/aislands_authoritative/climate_manifest.json

      - name: Verify frozen pre-outcome hashes before outcomes
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'frozen_taxon_cohort.csv': 'cf645d55b8bcc46be8a8dc5399db736bbcc20bb7114a72c79a5dee61ec918e12',
              'spatial_folds.csv': '221a925e289347069c89354d26acfab83fa3d4bc130b56f0178b8db30ab427fa',
              'island_climate.csv': '6ae7f4a78eea28f074ef3c3399368a4886b09d2d0714e723e957d0a99b524285',
          }
          root = Path('results/aislands_authoritative')
          for name, accepted in expected.items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              print(name, actual)
              assert actual == accepted, (name, actual, accepted)
          PY

      - name: Execute first authoritative 886-taxon outcome benchmark
        run: |
          python benchmarks/run_aislands_authoritative_benchmark_fast.py \
            --island-data results/aislands_authoritative/source/island_data.csv \
            --species-data results/aislands_authoritative/source/species_data.csv \
            --cohort results/aislands_authoritative/frozen_taxon_cohort.csv \
            --folds results/aislands_authoritative/spatial_folds.csv \
            --climate results/aislands_authoritative/island_climate.csv \
            --fold-output results/aislands_authoritative/fold_results.csv \
            --species-output results/aislands_authoritative/species_results.csv \
            --summary-output results/aislands_authoritative/summary.json

      - name: Print primary result and applicability
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter
          from pathlib import Path
          root = Path('results/aislands_authoritative')
          summary = json.loads((root / 'summary.json').read_text())
          folds = list(csv.DictReader((root / 'fold_results.csv').open()))
          failures = Counter(row['failure'] for row in folds if row['failure'])
          print(json.dumps(summary, indent=2, sort_keys=True))
          print('fold failures:', json.dumps(failures.most_common(20), indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: aislands-authoritative-benchmark
          path: |
            results/aislands_authoritative/source/source_manifest.json
            results/aislands_authoritative/frozen_taxon_cohort.csv
            results/aislands_authoritative/frozen_taxon_cohort_summary.json
            results/aislands_authoritative/island_model_audit_summary.json
            results/aislands_authoritative/spatial_folds.csv
            results/aislands_authoritative/spatial_folds_summary.json
            results/aislands_authoritative/island_climate.csv
            results/aislands_authoritative/climate_manifest.json
            results/aislands_authoritative/fold_results.csv
            results/aislands_authoritative/species_results.csv
            results/aislands_authoritative/summary.json
          if-no-files-found: error
