name: NEON metacommunity response v1 once

on:
  workflow_dispatch:
  push:
    branches:
      - agent/neon-metacommunity-connectivity-v1
    paths:
      - "validation/neon_metacommunity_connectivity_v1/response_arm_v1.json"

concurrency:
  group: neon-metacommunity-connectivity-response-v1-once
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  response:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install EOG
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verify frozen arm and authorization
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = Path("validation/neon_metacommunity_connectivity_v1")
          arm = json.loads((base / "response_arm_v1.json").read_text())
          auth = json.loads((base / "response_authorization_v1.json").read_text())
          lock = json.loads((base / "response_protocol_lock_v1.json").read_text())
          protocol = base / "response_protocol_v1.json"
          runner = base / "run_response_once.py"
          analysis_module = Path("src/eog/v2/metacommunity_connectivity.py")
          analysis_contract = base / "analysis_implementation_v1.json"

          def blob_sha(path):
              raw = path.read_bytes()
              return hashlib.sha1(
                  f"blob {len(raw)}\0".encode("ascii") + raw
              ).hexdigest()

          assert arm["armed"] is True
          assert auth["authorization_state"] == "authorized_once_only_biological_response_execution"
          assert auth["authorization_consumed"] is False
          assert blob_sha(protocol) == lock["protocol_git_blob_sha1"]
          assert blob_sha(protocol) == auth["response_protocol_blob_sha1"]
          assert blob_sha(runner) == auth["response_runner_blob_sha1"]
          assert blob_sha(analysis_module) == auth["analysis_module_blob_sha1"]
          assert blob_sha(analysis_contract) == auth["analysis_contract_blob_sha1"]
          assert arm["response_protocol_blob_sha1"] == auth["response_protocol_blob_sha1"]
          assert arm["response_runner_blob_sha1"] == auth["response_runner_blob_sha1"]
          assert arm["analysis_module_blob_sha1"] == auth["analysis_module_blob_sha1"]
          assert arm["analysis_contract_blob_sha1"] == auth["analysis_contract_blob_sha1"]
          assert arm["roster_result_fingerprint"] == auth["roster_result_fingerprint"]
          assert auth["maximum_authenticated_query_requests"] == 1
          assert auth["rerun_after_authenticated_query_starts"] is False
          PY
      - name: Reject any second response execution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          name = "neon-metacommunity-connectivity-response-v1"
          url = (
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts?"
              + urllib.parse.urlencode({"name": name, "per_page": 100})
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))
          existing = [
              row for row in payload.get("artifacts", [])
              if not bool(row.get("expired", False))
          ]
          if existing:
              raise SystemExit("response artifact already exists; once-only authorization consumed")
          PY
      - name: Require NEON token
        env:
          NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
        run: |
          if [ -z "$NEON_API_TOKEN" ]; then
            echo "::error::NEON_API_TOKEN is not configured."
            exit 3
          fi
      - name: Execute once-only fresh metacommunity response
        id: execute
        env:
          NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
        run: |
          set +e
          python validation/neon_metacommunity_connectivity_v1/run_response_once.py
          code=$?
          echo "runner_exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Require terminal result
        if: always() && steps.execute.outcome == 'success'
        run: test -s validation/neon_metacommunity_connectivity_v1/response_result_v1.json
      - name: Upload immutable terminal result
        if: always() && steps.execute.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: neon-metacommunity-connectivity-response-v1
          path: validation/neon_metacommunity_connectivity_v1/response_result_v1.json
          if-no-files-found: error
          retention-days: 90
      - name: Propagate runner status after artifact capture
        if: always() && steps.execute.outcome == 'success'
        run: |
          code="${{ steps.execute.outputs.runner_exit_code }}"
          if [ "$code" != "0" ]; then
            exit "$code"
          fi
