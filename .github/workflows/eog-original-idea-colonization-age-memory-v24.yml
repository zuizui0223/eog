name: Original EOG colonization-age memory v24

on:
  pull_request:
    paths:
      - "validation/eog_original_idea_colonization_age_memory_v24/**"
      - "benchmarks/run_eog_original_idea_colonization_age_memory_v24.py"
      - "tests/test_eog_original_idea_colonization_age_memory_v24.py"
      - ".github/workflows/eog-original-idea-colonization-age-memory-v24.yml"
  workflow_dispatch:

concurrency:
  group: original-eog-colonization-age-memory-v24-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test colonization-age invariants
        run: python -m pytest tests/test_eog_original_idea_colonization_age_memory_v24.py -q
      - name: Run frozen colonization-age benchmark
        run: |
          python benchmarks/run_eog_original_idea_colonization_age_memory_v24.py \
            --output build/eog_original_idea_colonization_age_memory_v24/result_v24.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-original-idea-colonization-age-memory-v24
          path: build/eog_original_idea_colonization_age_memory_v24/result_v24.json
          if-no-files-found: error
