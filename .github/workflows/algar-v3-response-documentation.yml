name: Algar v3 README documentation gate

on:
  push:
    branches:
      - agent/algar-v3-response-documentation
    paths:
      - validation/algar_restoration_v3_response_documentation/execute_once.json

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e . --no-deps

      - name: Verify documentation-only authorization
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path("validation/algar_restoration_v3_response_documentation")
          marker=json.loads((root/"execute_once.json").read_text())
          auth=json.loads((root/marker["authorization"]).read_text())
          for field,path in {
              "documentation_contract_git_blob_sha1":root/"documentation_contract.json",
              "documentation_gate_git_blob_sha1":root/"documentation_gate.py",
              "focal_taxon_selection_git_blob_sha1":Path("validation/algar_restoration_v3_response_roster/focal_taxon_selection.json"),
          }.items():
              actual=subprocess.check_output(["git","hash-object",str(path)],text=True).strip()
              assert actual==auth[field],(field,actual,auth[field])
          assert auth["documentation_payload_requests_allowed"]==1
          assert auth["response_csv_payload_requests_allowed"]==0
          assert auth["response_csv_payload_bytes_allowed"]==0
          assert auth["focal_species_locked"] is True
          PY

      - name: Open verified README documentation only
        run: python -m validation.algar_restoration_v3_response_documentation.documentation_gate

      - name: Verify response CSV remained unopened
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(
              Path("validation/algar_restoration_v3_response_documentation/documentation_result.json").read_text()
          )
          assert result["response_file_payload_requests"]==0
          assert result["response_file_payload_bytes_opened"]==0
          assert result["biological_response_values_opened"] is False
          assert result["model_fits"]==result["heldout_scores"]==0
          print(json.dumps({
              "status":result["status"],
              "response_filename_documented":result.get("response_filename_documented"),
              "documentation_sha256":(
                  None if "documentation_file" not in result
                  else result["documentation_file"]["sha256"]
              ),
              "fingerprint":result["fingerprint"],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: algar-v3-response-documentation
          path: validation/algar_restoration_v3_response_documentation/documentation_result.json
          if-no-files-found: error
