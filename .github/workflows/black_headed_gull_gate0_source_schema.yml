name: Black-headed gull two-layer EOG-WF Gate 0 source schema

on:
  pull_request:
    paths:
      - ".github/workflows/black_headed_gull_gate0_source_schema.yml"
      - "validation/black_headed_gull_two_layer/gate0_source_process_response_contract.json"
      - "src/eog/v2/response_firewall.py"

permissions:
  contents: read

jobs:
  gate0:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install EOG response firewall
        run: python -m pip install .

      - name: Freeze Zenodo record metadata
        run: |
          mkdir -p /tmp/gull_zenodo /tmp/gull_members build/gull_gate0/code
          curl -L --fail --retry 3 \
            'https://zenodo.org/api/records/18300536' \
            -o /tmp/gull_record.json
          test -s /tmp/gull_record.json
          python - <<'PY'
          import json
          import pathlib

          record = json.loads(pathlib.Path('/tmp/gull_record.json').read_text(encoding='utf-8'))
          files = record.get('files') or []
          if not files:
              raise SystemExit('Zenodo record has no files')
          manifest = []
          for info in files:
              key = str(info.get('key') or '').strip()
              if not key:
                  raise SystemExit(f'Zenodo file without key: {info!r}')
              manifest.append({
                  'id': info.get('id'),
                  'key': key,
                  'size': int(info.get('size') or 0),
                  'checksum': info.get('checksum'),
                  'links': info.get('links') or {},
              })
          summary = {
              'record_id': record.get('id'),
              'doi': (record.get('pids') or {}).get('doi', {}).get('identifier') or record.get('doi'),
              'title': (record.get('metadata') or {}).get('title'),
              'publication_date': (record.get('metadata') or {}).get('publication_date'),
              'file_count': len(manifest),
              'total_file_bytes': sum(row['size'] for row in manifest),
              'files': manifest,
              'response_rows_opened': False,
          }
          pathlib.Path('build/gull_gate0/zenodo_manifest.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'record_id': summary['record_id'],
              'doi': summary['doi'],
              'file_count': summary['file_count'],
              'total_file_bytes': summary['total_file_bytes'],
              'file_keys': [row['key'] for row in manifest],
              'response_rows_opened': False,
          }, indent=2, sort_keys=True))
          PY

      - name: Download all published bytes and verify Zenodo checksums
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import urllib.parse

          manifest = json.loads(pathlib.Path('build/gull_gate0/zenodo_manifest.json').read_text(encoding='utf-8'))['files']
          root = pathlib.Path('/tmp/gull_zenodo')
          verified = []
          for row in manifest:
              key = row['key']
              encoded = urllib.parse.quote(key, safe='')
              url = f'https://zenodo.org/records/18300536/files/{encoded}?download=1'
              target = root / key
              target.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['curl', '-L', '--fail', '--retry', '3', url, '-o', str(target)], check=True)
              actual_size = target.stat().st_size
              if actual_size != row['size']:
                  raise SystemExit(f'size mismatch for {key}: {actual_size} != {row["size"]}')

              checksum = str(row.get('checksum') or '')
              if ':' in checksum:
                  algorithm, expected = checksum.split(':', 1)
              else:
                  algorithm, expected = 'md5', checksum
              algorithm = algorithm.lower().strip()
              expected = expected.lower().strip()
              if algorithm not in {'md5', 'sha256'}:
                  raise SystemExit(f'unsupported Zenodo checksum algorithm {algorithm!r} for {key}')
              digest = hashlib.new(algorithm)
              sha256 = hashlib.sha256()
              with target.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
                      sha256.update(chunk)
              actual = digest.hexdigest().lower()
              if expected and actual != expected:
                  raise SystemExit(f'checksum mismatch for {key}: {actual} != {expected}')
              verified.append({
                  'key': key,
                  'size': actual_size,
                  'zenodo_checksum': checksum,
                  'sha256': sha256.hexdigest(),
              })
          pathlib.Path('build/gull_gate0/verified_files.json').write_text(
              json.dumps(verified, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({'verified_file_count': len(verified), 'response_rows_parsed': False}, indent=2))
          PY

      - name: Inventory archive members and inspect only code docs and bounded data headers
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import zipfile

          from eog.v2.validation import read_bounded_first_record_text

          source_root = pathlib.Path('/tmp/gull_zenodo')
          member_root = pathlib.Path('/tmp/gull_members')
          code_out = pathlib.Path('build/gull_gate0/code')
          code_out.mkdir(parents=True, exist_ok=True)
          verified = json.loads(pathlib.Path('build/gull_gate0/verified_files.json').read_text(encoding='utf-8'))

          text_data_suffixes = {'.csv', '.tsv', '.txt', '.dat'}
          code_suffixes = {'.r', '.rmd', '.qmd', '.py', '.stan', '.md'}
          document_tokens = {'readme', 'license', 'licence', 'metadata', 'description'}
          archive_manifest = []
          headers = []
          code_inventory = []
          binary_inventory = []

          def inspect_path(logical_key: str, path: pathlib.Path, *, source: str) -> None:
              suffix = path.suffix.lower()
              lower_name = path.name.lower()
              is_document = any(token in lower_name for token in document_tokens)

              if is_document or suffix in code_suffixes:
                  text = path.read_text(encoding='utf-8', errors='replace')
                  safe_name = re.sub(r'[^A-Za-z0-9_.-]+', '_', logical_key)
                  destination = code_out / safe_name
                  destination.write_text(text, encoding='utf-8')
                  referenced_data = sorted(set(re.findall(
                      r'[A-Za-z0-9_./ -]+\.(?:csv|tsv|txt|dat|rds|rda|RData|xlsx|xls|shp|gpkg|geojson)',
                      text,
                      flags=re.IGNORECASE,
                  )))
                  terms = sorted({
                      term for term in (
                          'pond', 'etang', 'coord', 'longitude', 'latitude', 'distance', 'drain',
                          'vidang', 'occup', 'colon', 'persist', 'success', 'breeding', 'geometry',
                          'spatial', 'available', 'absence', 'unoccupied', 'presence'
                      )
                      if term in text.lower()
                  })
                  code_inventory.append({
                      'key': logical_key,
                      'source': source,
                      'size': path.stat().st_size,
                      'referenced_data_files': referenced_data,
                      'matched_role_terms': terms,
                  })
                  return

              if suffix in text_data_suffixes:
                  text, physical = read_bounded_first_record_text(path, max_record_bytes=16_384)
                  headers.append({
                      'key': logical_key,
                      'source': source,
                      'suffix': suffix,
                      'first_physical_record_only': text,
                      'terminator': physical.terminator,
                      'bytes_consumed': physical.bytes_consumed,
                      'file_size': path.stat().st_size,
                      'data_rows_read': False,
                  })
                  return

              binary_inventory.append({
                  'key': logical_key,
                  'source': source,
                  'suffix': suffix,
                  'size': path.stat().st_size,
                  'deserialized': False,
              })

          for outer in verified:
              outer_key = outer['key']
              outer_path = source_root / outer_key
              if outer_path.suffix.lower() != '.zip':
                  inspect_path(outer_key, outer_path, source='zenodo_root')
                  continue

              with zipfile.ZipFile(outer_path) as zf:
                  for index, info in enumerate(zf.infolist()):
                      logical = f'{outer_key}::{info.filename}'
                      archive_manifest.append({
                          'archive': outer_key,
                          'member': info.filename,
                          'size': info.file_size,
                          'compressed_size': info.compress_size,
                          'crc32': f'{info.CRC:08x}',
                          'is_dir': info.is_dir(),
                      })
                      if info.is_dir():
                          continue
                      # Materialize a member only into ephemeral /tmp. The response firewall
                      # still controls what bytes are actually parsed/logged from data-like text.
                      data = zf.read(info)
                      digest = hashlib.sha256(data).hexdigest()
                      safe_member = member_root / f'member_{index:04d}{pathlib.PurePosixPath(info.filename).suffix}'
                      safe_member.write_bytes(data)
                      archive_manifest[-1]['sha256'] = digest
                      inspect_path(logical, safe_member, source='zenodo_zip_member')

          pathlib.Path('build/gull_gate0/archive_members.json').write_text(
              json.dumps(archive_manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          pathlib.Path('build/gull_gate0/text_headers.json').write_text(
              json.dumps(headers, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          pathlib.Path('build/gull_gate0/code_inventory.json').write_text(
              json.dumps(code_inventory, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          pathlib.Path('build/gull_gate0/binary_inventory.json').write_text(
              json.dumps(binary_inventory, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'archive_member_count': len(archive_manifest),
              'archive_members': [row['member'] for row in archive_manifest],
              'text_like_members_header_only': [row['key'] for row in headers],
              'code_or_docs_read': [row['key'] for row in code_inventory],
              'binary_members_not_deserialized': [row['key'] for row in binary_inventory],
              'response_data_rows_read': False,
          }, indent=2, sort_keys=True))
          PY

      - name: Produce Gate 0 schema diagnostic without outcome access
        run: |
          python - <<'PY'
          import json
          import pathlib

          headers = json.loads(pathlib.Path('build/gull_gate0/text_headers.json').read_text(encoding='utf-8'))
          code = json.loads(pathlib.Path('build/gull_gate0/code_inventory.json').read_text(encoding='utf-8'))
          binaries = json.loads(pathlib.Path('build/gull_gate0/binary_inventory.json').read_text(encoding='utf-8'))
          archive = json.loads(pathlib.Path('build/gull_gate0/archive_members.json').read_text(encoding='utf-8'))
          combined_text = '\n'.join(row['first_physical_record_only'] for row in headers).lower()
          combined_code = '\n'.join(
              path.read_text(encoding='utf-8', errors='replace').lower()
              for path in pathlib.Path('build/gull_gate0/code').glob('*')
              if path.is_file()
          )
          names = '\n'.join(row['member'].lower() for row in archive)
          searchable = combined_text + '\n' + combined_code + '\n' + names
          geometry_tokens = [token for token in ('longitude', 'latitude', 'coord', 'distance', 'spatial', 'pond', 'etang') if token in searchable]
          state_tokens = [token for token in ('drain', 'vidang', 'occupied', 'unoccupied', 'presence', 'absence', 'colon') if token in searchable]
          diagnostic = {
              'status': 'gate0_sources_frozen_inner_schema_available',
              'response_rows_opened': False,
              'archive_member_count': len(archive),
              'text_header_file_count': len(headers),
              'code_document_file_count': len(code),
              'binary_file_count': len(binaries),
              'geometry_role_tokens_seen': geometry_tokens,
              'state_or_availability_tokens_seen': state_tokens,
              'critical_questions': [
                  'Does archived geometry define all surveyed/available ponds rather than only ever-occupied ponds?',
                  'Can occupied, available-unoccupied and drained-unavailable pond-years be distinguished without inventing absence?',
                  'Are pond coordinates or distances available independently of response?',
              ],
          }
          pathlib.Path('build/gull_gate0/gate0_schema_diagnostic.json').write_text(
              json.dumps(diagnostic, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(diagnostic, indent=2, sort_keys=True))
          PY

      - name: Remove all downloaded source bytes before artifact upload
        run: |
          rm -rf /tmp/gull_zenodo /tmp/gull_members /tmp/gull_record.json
          find build/gull_gate0 -maxdepth 2 -type f -print
          test -s build/gull_gate0/zenodo_manifest.json
          test -s build/gull_gate0/verified_files.json
          test -s build/gull_gate0/archive_members.json
          test -s build/gull_gate0/text_headers.json
          test -s build/gull_gate0/code_inventory.json
          test -s build/gull_gate0/binary_inventory.json
          test -s build/gull_gate0/gate0_schema_diagnostic.json

      - name: Upload response-free Gate 0 evidence
        uses: actions/upload-artifact@v4
        with:
          name: black-headed-gull-two-layer-gate0
          path: build/gull_gate0
