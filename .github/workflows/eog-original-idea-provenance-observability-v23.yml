name: Original EOG provenance observability v23

on:
  pull_request:
    paths:
      - "validation/eog_original_idea_provenance_observability_v23/**"
      - "benchmarks/run_eog_original_idea_provenance_observability_v23.py"
      - "tests/test_eog_original_idea_provenance_observability_v23.py"
      - ".github/workflows/eog-original-idea-provenance-observability-v23.yml"
  workflow_dispatch:

concurrency:
  group: original-eog-provenance-observability-v23-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test provenance-observability invariants
        run: python -m pytest tests/test_eog_original_idea_provenance_observability_v23.py -q
      - name: Run frozen provenance-observability benchmark
        run: |
          python benchmarks/run_eog_original_idea_provenance_observability_v23.py \
            --output build/eog_original_idea_provenance_observability_v23/result_v23.json
      - uses: actions/upload-artifact@v4
        with:
          name: eog-original-idea-provenance-observability-v23
          path: build/eog_original_idea_provenance_observability_v23/result_v23.json
          if-no-files-found: error
