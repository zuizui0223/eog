name: EOG external DOF/BirdLife historical Arctic tern source evidence gate (counts only)

# Original bird-banding data and DOF/GBIF observation rows NEVER downloaded here.
# Only exact species/dataset and five official aggregated coordinate-bearing counts.
on:
  pull_request:
    paths:
      - 'validation/tern_independent_dofbasen_breeding_gate_v1/**'
      - 'scripts/eog_tern_independent_dofbasen_source_count_gate_v1.py'
      - 'tests/test_eog_tern_independent_dofbasen_source_count_gate_v1.py'
      - '.github/workflows/eog-tern-external-dofbasen-source-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-dof-only-source-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline science STOP/source provenance tests
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_eog_tern_independent_dofbasen_source_count_gate_v1.py
      - name: Official GBIF/DOF source aggregate ONLY, no records
        run: |
          python -m scripts.eog_tern_independent_dofbasen_source_count_gate_v1 \
            --protocol validation/tern_independent_dofbasen_breeding_gate_v1/protocol_v1.json \
            --output results/tern_independent_dofbasen_breeding_gate_v1/receipt.json
      - name: No breeding claims until explicit source behavior and uncertainty gate
        run: |
          python - <<'PY'
          import json
          p='results/tern_independent_dofbasen_breeding_gate_v1/receipt.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['new_eog_wf_scored_endpoints']==0
          assert x['biological_records_read']==0
          assert x['tern_original_event_rows_revisited']==0
          assert x['colonies_with_verified_breeding']==0
          assert x['source_site_years_verified']==0
          assert x['actual_source_occupancy_crosswalk_completed'] is False
          assert x['asof_availability_verified'] is False
          print('GBIF_DOF_BREEDING_SOURCE_GATE=',x['status'])
          if x['status']=='GBIF_DOF_SOURCE_COUNT_VERIFIED_NO_BREEDING_VALIDATION':
              assert x['count_requests_completed']==7
              assert len(x['count_window_results'])==5
              assert all(isinstance(c['coordinate_bearing_occurrence_count'],int)
                         for c in x['count_window_results'])
              print('WINDOW_COUNTS=',[(a['window_id'],a['coordinate_bearing_occurrence_count'])
                                      for a in x['count_window_results']])
              print('COUNTS_ARE_NOT_BREEDING_OR_ASOF_SOURCE_EVIDENCE')
          else:
              print('SOURCE_ONLY_SCIENTIFIC_STOP_DO_NOT_CROSSWALK_ERN_OR_PROMOTE')
          print('RECEIPT_SHA256=',x['sha256_without_self'])
          PY
      - name: Store count-only publisher audit receipt, never individual records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eog-dofbasen-historical-tern-source-counts-v1
          path: results/tern_independent_dofbasen_breeding_gate_v1/receipt.json
          if-no-files-found: warn
          retention-days: 30
