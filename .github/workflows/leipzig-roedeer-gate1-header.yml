name: Leipzig roe deer endpoint3 Gate1 header

on:
  pull_request:
    paths:
      - 'validation/leipzig_roedeer_endpoint3/gate0_pass_certificate.json'
      - 'validation/leipzig_roedeer_endpoint3/response_header_contract.json'
      - 'validation/leipzig_roedeer_endpoint3/response_header_execution_authorization.json'
      - 'validation/leipzig_roedeer_endpoint3/response_header_gate.py'
      - 'tests/test_leipzig_roedeer_response_header_gate.py'
      - '.github/workflows/leipzig-roedeer-gate1-header.yml'
  push:
    branches:
      - 'execute/leipzig-roedeer-gate1-header-v1'
    paths:
      - 'validation/leipzig_roedeer_endpoint3/response_header_execute_once.json'

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -e . --no-deps
          python -m pip install pytest
      - name: Verify bytewise header firewall
        run: python -m pytest tests/test_leipzig_roedeer_response_header_gate.py -q
      - name: Compile header gate
        run: python -m py_compile validation/leipzig_roedeer_endpoint3/response_header_gate.py
      - name: Verify authorization blobs
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('validation/leipzig_roedeer_endpoint3')
          auth = json.loads((root / 'response_header_execution_authorization.json').read_text())
          expected = {
              'gate0_pass_certificate_git_blob_sha1': root / 'gate0_pass_certificate.json',
              'response_header_contract_git_blob_sha1': root / 'response_header_contract.json',
              'response_header_evaluator_git_blob_sha1': root / 'response_header_gate.py',
          }
          for field, path in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
              assert actual == auth[field], (field, actual, auth[field])
          assert auth['source_response_git_blob_sha1'] == 'b4263a634d4bafdfe77ef4bef1fab24d45034cda'
          assert auth['maximum_one_byte_range_requests'] == 388
          assert auth['response_data_row_bytes_opened'] == 0
          assert auth['response_rows_opened'] == 0
          assert auth['response_values_opened'] is False
          PY
      - name: Verify no live marker in proposal
        if: github.event_name == 'pull_request'
        run: test ! -e validation/leipzig_roedeer_endpoint3/response_header_execute_once.json

  live-header-once:
    needs: synthetic-boundary
    if: github.event_name == 'push' && github.ref == 'refs/heads/execute/leipzig-roedeer-gate1-header-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install EOG without dependency mutation
        run: python -m pip install -e . --no-deps
      - name: Verify one-shot execute marker and authorization
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('validation/leipzig_roedeer_endpoint3')
          marker = json.loads((root / 'response_header_execute_once.json').read_text())
          assert marker == {
              'attempt_id': 'leipzig_roedeer_endpoint3_v1',
              'issue': 384,
              'execute_once': True,
              'authorization': 'response_header_execution_authorization.json'
          }
          auth = json.loads((root / 'response_header_execution_authorization.json').read_text())
          for field, name in [
              ('gate0_pass_certificate_git_blob_sha1', 'gate0_pass_certificate.json'),
              ('response_header_contract_git_blob_sha1', 'response_header_contract.json'),
              ('response_header_evaluator_git_blob_sha1', 'response_header_gate.py'),
          ]:
              actual = subprocess.check_output(['git', 'hash-object', str(root / name)], text=True).strip()
              assert actual == auth[field]
          PY
      - name: Execute Leipzig physical header gate once
        run: python -m validation.leipzig_roedeer_endpoint3.response_header_gate
      - name: Audit terminal certificate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('validation/leipzig_roedeer_endpoint3/response_header_certificate.json')
          r = json.loads(p.read_text())
          assert r['attempt_id'] == 'leipzig_roedeer_endpoint3_v1'
          assert r['issue'] == 384
          assert r['status'] in {'response_header_ready', 'stop_pre_row_response_header_transport_or_schema'}
          assert 1 <= r['response_header_range_requests'] <= 388
          assert r['response_header_bytes_opened'] == r['response_header_range_requests']
          assert r['response_data_row_bytes_opened'] == 0
          assert r['response_rows_opened'] == 0
          assert r['response_values_opened'] is False
          assert r['model_fits'] == 0
          assert r['heldout_scores'] == 0
          assert r['counts_as_predictive_evidence'] is False
          if r['status'] == 'response_header_ready':
              c = json.loads(Path('validation/leipzig_roedeer_endpoint3/response_header_contract.json').read_text())
              assert r['header_ascii'] == c['reference_header']['expected_header_ascii']
              assert r['response_header_range_requests'] in {387, 388}
              assert r['header_line_terminator'] in {'LF', 'CRLF'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: leipzig-roedeer-response-header
          path: validation/leipzig_roedeer_endpoint3/response_header_certificate.json
          if-no-files-found: error
