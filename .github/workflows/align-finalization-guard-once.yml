name: Align finalization guard once

on:
  push:
    branches:
      - agent/strong-reference-submission-finalization

permissions:
  contents: write

jobs:
  align:
    if: github.event.head_commit.message == 'ALIGN strong-reference finalization guard once'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strong-reference-submission-finalization
          fetch-depth: 0
      - name: Align only the completed checklist-state guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_structural_novelty_strategy_contract.py')
          text = path.read_text()
          old = r'assert re.search(r"- \[ \] \*\*Island extension result incorporated into manuscript prose, figures, tables and cover letter without weakening R3", text)'
          new = r'assert re.search(r"- \[x\] \*\*Island extension result incorporated into manuscript prose, figures, tables and cover letter without weakening R3", text)'
          if old not in text:
              if new in text:
                  pass
              else:
                  raise SystemExit('expected island-incorporation checklist assertion not found')
          else:
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Remove helper and commit
        run: |
          rm .github/workflows/align-finalization-guard-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_structural_novelty_strategy_contract.py .github/workflows/align-finalization-guard-once.yml
          git diff --cached --check
          git commit -m 'Align completed strong-reference finalization guard'
          git push origin HEAD:agent/strong-reference-submission-finalization
