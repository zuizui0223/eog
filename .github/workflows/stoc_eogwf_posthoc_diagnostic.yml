name: STOC EOG-WF posthoc failure diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/stoc_eogwf_posthoc_diagnostic.yml"
      - "benchmarks/diagnose_stoc_world_failure.py"
      - "validation/stoc_eogwf/stoc_eogwf_result.json"
      - "validation/stoc_eogwf/runtime_lock.txt"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/stoc_eogwf/runtime_lock.txt
      - name: Fetch exact frozen DataSTOC source
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/biomodhub/biomod2/v4.3-4-6/inst/external/DATA_biomod2_STOC.csv \
            -o /tmp/DATA_biomod2_STOC.csv
          test "$(stat -c%s /tmp/DATA_biomod2_STOC.csv)" = "330891"
          test "$(git hash-object /tmp/DATA_biomod2_STOC.csv)" = "4bfa2cd39a7e90340ad6a319e5c611e8646462c8"
      - name: Diagnose frozen world failure
        run: |
          python benchmarks/diagnose_stoc_world_failure.py \
            --source /tmp/DATA_biomod2_STOC.csv \
            --output build/stoc_posthoc_failure_diagnostic.json
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: stoc-eogwf-posthoc-failure-diagnostic
          path: build/stoc_posthoc_failure_diagnostic.json
