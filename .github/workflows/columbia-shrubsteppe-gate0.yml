name: Columbia shrubsteppe endpoint3 Gate0

on:
  pull_request:
    paths:
      - 'validation/columbia_shrubsteppe_endpoint3/**'
      - 'tests/test_columbia_shrubsteppe_gate0_metadata.py'
      - '.github/workflows/columbia-shrubsteppe-gate0.yml'
  push:
    branches:
      - 'execute/columbia-shrubsteppe-gate0-v1'
    paths:
      - 'validation/columbia_shrubsteppe_endpoint3/gate0_execute_once.json'

permissions:
  contents: read

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify Gate0 metadata boundary
        run: pytest -q tests/test_columbia_shrubsteppe_gate0_metadata.py
      - name: Compile Gate0 module
        run: python -m py_compile validation/columbia_shrubsteppe_endpoint3/gate0_metadata.py
      - name: Verify authorization blobs
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('validation/columbia_shrubsteppe_endpoint3')
          auth=json.loads((root/'gate0_execution_authorization.json').read_text())
          assert auth['attempt_id']=='columbia_shrubsteppe_endpoint3_v1'
          assert auth['issue']==370
          assert auth['authorized_external_gets']==3
          assert auth['file_payload_requests_allowed']==0
          assert auth['live_execute_branch']=='execute/columbia-shrubsteppe-gate0-v1'
          bindings={
            'source_contract_git_blob_sha': root/'source_contract.json',
            'gate0_evaluator_git_blob_sha': root/'gate0_metadata.py',
          }
          for key,path in bindings.items():
              observed=subprocess.check_output(['git','hash-object',str(path)],text=True).strip()
              assert observed==auth[key], (key, observed, auth[key])
          PY
      - name: Verify no live marker in proposal
        if: ${{ github.event_name == 'pull_request' }}
        run: test ! -e validation/columbia_shrubsteppe_endpoint3/gate0_execute_once.json

  live-gate0-once:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/execute/columbia-shrubsteppe-gate0-v1' }}
    needs: synthetic-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install EOG without dependency mutation
        run: python -m pip install -e . --no-deps
      - name: Verify one-shot execute marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('validation/columbia_shrubsteppe_endpoint3/gate0_execute_once.json')
          r=json.loads(p.read_text())
          assert r == {
            'attempt_id':'columbia_shrubsteppe_endpoint3_v1',
            'issue':370,
            'execute_once':True,
            'authorization':'gate0_execution_authorization.json'
          }
          PY
      - name: Execute metadata Gate0 once
        run: python -m validation.columbia_shrubsteppe_endpoint3.gate0_metadata
      - name: Audit terminal certificate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('validation/columbia_shrubsteppe_endpoint3/gate0_metadata_certificate.json')
          r=json.loads(p.read_text())
          assert r['attempt_id']=='columbia_shrubsteppe_endpoint3_v1'
          assert r['issue']==370
          assert r['status'] in {'gate0_metadata_ready','stop_pre_response_metadata_identity_or_transport'}
          assert 1 <= r['metadata_requests'] <= 3
          assert r['file_payload_requests']==0
          assert r['file_payload_bytes_opened']==0
          assert r['archive_member_bytes_opened']==0
          assert r['detection_history_bytes_opened']==0
          assert r['camera_record_bytes_opened']==0
          assert r['response_values_opened'] is False
          assert r['model_fits']==0 and r['heldout_scores']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: columbia-shrubsteppe-gate0-metadata
          path: validation/columbia_shrubsteppe_endpoint3/gate0_metadata_certificate.json
          if-no-files-found: error
