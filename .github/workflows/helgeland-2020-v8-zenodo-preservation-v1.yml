name: Helgeland 2020 v8 original bytes from Zenodo Dryad preservation

on:
  pull_request:
    paths:
      - '.github/workflows/helgeland-2020-v8-zenodo-preservation-v1.yml'
      - 'scripts/audit_helgeland_2020_v8_zenodo_preservation_v1.py'
      - 'tests/test_helgeland_2020_v8_zenodo_preservation_v1.py'
      - 'docs/eog_helgeland_2020_v8_zenodo_preservation_gate_v1.md'

permissions:
  contents: read

jobs:
  exact-historical-bytes-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Synthetic wrong-source and future-only-file rejection tests
        run: python -m pytest -q tests/test_helgeland_2020_v8_zenodo_preservation_v1.py
      - name: Search only public Zenodo record API and independently hash at most three tiny original-v8 files
        run: |
          python scripts/audit_helgeland_2020_v8_zenodo_preservation_v1.py \
            --output build/helgeland-niskanen-2020-v8-zenodo-parity-v1.json
      - name: Check ALL original v8 source SHA256 identities independently, never read outcomes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path('build/helgeland-niskanen-2020-v8-zenodo-parity-v1.json').read_text())
          assert x['status']=='THREE_ZENODO_PRESERVATION_FILES_FULL_HASH_MATCH_ORIGINAL_2020_V8', x['status']
          assert x['original_version_id']==78498
          assert len(x['files'])==3
          assert all(f['source_original_v8_sha256_matches_actual_zenodo_bytes'] for f in x['files'])
          assert x['historical_source_byte_identity_qualified'] is True
          assert x['zenodo_only_newer_files_authorized_for_2020'] is False
          assert x['rows_decoded_or_scored'] is False
          assert x['ecological_forecast_authorized'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HELGELAND-ZENODO-ORIGINAL-2020-V8-SHA256-NO-ROWS-v1
          path: build/helgeland-niskanen-2020-v8-zenodo-parity-v1.json
          if-no-files-found: warn
