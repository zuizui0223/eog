name: Fletcher 2026 Figshare response-blind metadata preflight

on:
  push:
    branches:
      - agent/fletcher-2026-figshare-preflight
    paths:
      - ".github/workflows/fletcher_2026_figshare_metadata_preflight.yml"
      - "validation/fletcher_2026_figshare_paired_complementarity/source_contract.json"
  pull_request:
    paths:
      - ".github/workflows/fletcher_2026_figshare_metadata_preflight.yml"
      - "validation/fletcher_2026_figshare_paired_complementarity/source_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query Figshare metadata only
        run: |
          set -euo pipefail
          mkdir -p build/fletcher_2026_figshare
          python - <<'PY'
          import json
          from pathlib import Path
          import urllib.request

          contract = json.loads(Path("validation/fletcher_2026_figshare_paired_complementarity/source_contract.json").read_text())
          article_id = int(contract["scientific_anchor"]["figshare_article_id"])
          url = f"https://api.figshare.com/v2/articles/{article_id}"
          req = urllib.request.Request(url, headers={"User-Agent":"EOG-Fletcher-2026-Figshare-metadata/1.0","Accept":"application/json"})
          with urllib.request.urlopen(req, timeout=60) as response:
              body = response.read(5_000_001)
              status = getattr(response, "status", None)
          if status != 200 or len(body) > 5_000_000:
              raise RuntimeError(f"Figshare metadata request failed bounded checks: {status}")
          payload = json.loads(body.decode("utf-8"))
          files = []
          for row in payload.get("files", []):
              files.append({
                  "id": row.get("id"),
                  "name": row.get("name"),
                  "size": row.get("size"),
                  "is_link_only": row.get("is_link_only"),
                  "download_url": row.get("download_url"),
                  "supplied_md5": row.get("supplied_md5"),
                  "computed_md5": row.get("computed_md5"),
                  "mimetype": row.get("mimetype"),
              })
          result = {
              "attempt_id": contract["attempt_id"],
              "article_id": payload.get("id"),
              "title": payload.get("title"),
              "doi": payload.get("doi"),
              "version": payload.get("version"),
              "published_date": payload.get("published_date"),
              "modified_date": payload.get("modified_date"),
              "license": payload.get("license"),
              "file_count": len(files),
              "files": files,
              "metadata_requests": 1,
              "file_payload_requests": 0,
              "file_payload_bytes_opened": 0,
              "response_header_bytes_opened": 0,
              "response_rows_opened": False,
              "response_values_opened": False,
              "model_fits": 0,
              "heldout_scores": 0,
          }
          Path("build/fletcher_2026_figshare/metadata_inventory.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          if not files:
              raise SystemExit("Figshare record exposes no files")
          PY
      - name: Assert strict metadata-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("build/fletcher_2026_figshare/metadata_inventory.json").read_text())
          assert r["file_payload_requests"] == 0
          assert r["file_payload_bytes_opened"] == 0
          assert r["response_header_bytes_opened"] == 0
          assert r["response_rows_opened"] is False
          assert r["response_values_opened"] is False
          assert r["model_fits"] == 0
          assert r["heldout_scores"] == 0
          print("Fletcher 2026 Figshare metadata-only firewall PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fletcher-2026-figshare-metadata-only
          path: build/fletcher_2026_figshare/metadata_inventory.json
          if-no-files-found: error
