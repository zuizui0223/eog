name: MAPPPD Adelie consumed proposal-surface guard

on:
  pull_request:
    paths:
      - 'validation/mapppd_adelie_selective_promotion/**'
      - 'benchmarks/mapppd_adelie_selective_promotion_final.py'
      - '.github/workflows/mapppd-adelie-final-*.yml'

permissions:
  contents: read

jobs:
  consumed-surface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen historical contract and terminal receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('validation/mapppd_adelie_selective_promotion/final_once_only_contract.json').read_text())
          p=json.loads(Path('validation/mapppd_adelie_selective_promotion/final_terminal_stop_certificate.json').read_text())
          assert c['frozen_before_response_access'] is True
          assert c['authoritative_response']['git_blob_sha'] == '852cbf729bf03a5ab01bc0b008f0f18e05867cb6'
          assert c['hard_rules']['rerun_after_consumption'] is False
          assert p['terminal_status'] == 'consumed_estimability_stop'
          assert p['response_consumed'] is True
          assert p['authoritative_run']['run_id'] == 34547620159
          PY
      - name: Compile historical runner without executing it
        run: python -m py_compile benchmarks/mapppd_adelie_selective_promotion_final.py
