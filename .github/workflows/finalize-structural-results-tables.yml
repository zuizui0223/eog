name: Finalize structural results tables

on:
  push:
    branches:
      - agent/structural-results-tables
    paths:
      - ".github/workflows/finalize-structural-results-tables.yml"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  finalize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structural-results-tables
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build frozen results tables
        run: |
          python -m py_compile manuscript/build_structural_results_tables.py
          python manuscript/build_structural_results_tables.py
      - name: Verify table contracts
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_structural_results_tables.py
      - name: Mark frozen-results table gate complete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("manuscript/structural_submission_checklist.md")
          text = p.read_text(encoding="utf-8")
          old = "- [ ] Results tables are generated directly from frozen artifacts."
          new = "- [x] Results tables are generated directly from frozen artifacts."
          if text.count(old) != 1:
              raise SystemExit("results-table checklist line not found exactly once")
          p.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Remove temporary finalizer and commit
        run: |
          git rm .github/workflows/finalize-structural-results-tables.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate frozen structural results tables"
          git push origin HEAD:agent/structural-results-tables
