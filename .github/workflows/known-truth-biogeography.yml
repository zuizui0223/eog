name: Known-truth virtual biogeography

on:
  pull_request:
    paths:
      - "src/eog/v2/known_truth_biogeography.py"
      - "validation/known_truth_biogeography_v1/**"
      - "benchmarks/run_known_truth_biogeography_v1.py"
      - "tests/test_known_truth_biogeography.py"
      - ".github/workflows/known-truth-biogeography.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Run frozen canonical benchmark
        run: |
          python benchmarks/run_known_truth_biogeography_v1.py \
            --output build/known_truth_biogeography/canonical_result_v1.json
      - name: Run frozen witness-complexity factorial
        run: |
          python benchmarks/run_known_truth_witness_factorial_v1.py \
            --output build/known_truth_biogeography/witness_factorial_result_v1.json
      - name: Verify focused tests
        run: python -m pytest tests/test_known_truth_biogeography.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: known-truth-biogeography-v1
          path: |
            build/known_truth_biogeography/canonical_result_v1.json
            build/known_truth_biogeography/witness_factorial_result_v1.json
          if-no-files-found: error
