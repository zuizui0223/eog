name: BAM Penobscot external bridge Gate0

on:
  pull_request:
    paths:
      - "validation/bam_penobscot_external_bridge_v1/**"
      - "tests/test_bam_penobscot_external_bridge_gate0.py"
      - ".github/workflows/bam-penobscot-bridge-gate0.yml"
  workflow_dispatch:

jobs:
  gate0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test archive-directory parser
        run: python -m pytest tests/test_bam_penobscot_external_bridge_gate0.py -q
      - name: Verify live PRRP directory architecture only
        run: python -m validation.bam_penobscot_external_bridge_v1.gate0_archive_architecture
      - uses: actions/upload-artifact@v4
        with:
          name: bam-penobscot-bridge-gate0
          path: validation/bam_penobscot_external_bridge_v1/gate0_archive_architecture_certificate.json
          if-no-files-found: error
