name: Hokkaido streamfish endpoint3 final endpoint

on:
  pull_request:
    paths:
      - 'validation/hokkaido_streamfish_endpoint3/**'
      - 'tests/test_hokkaido_streamfish_final_endpoint.py'
      - 'pyproject.toml'
      - '.github/workflows/hokkaido-streamfish-final-endpoint.yml'
  push:
    branches:
      - 'execute/hokkaido-streamfish-final-endpoint-v1'
    paths:
      - 'validation/hokkaido_streamfish_endpoint3/final_endpoint_execute_once.json'

permissions:
  contents: read

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen validation dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
      - name: Verify final parser, cross-fit and first-passage parity
        run: pytest -q tests/test_hokkaido_streamfish_final_endpoint.py
      - name: Compile final endpoint modules
        run: |
          python -m py_compile \
            validation/hokkaido_streamfish_endpoint3/final_endpoint.py \
            validation/hokkaido_streamfish_endpoint3/run_final_endpoint.py
      - name: Verify final authorization blobs and no live marker in proposal
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('validation/hokkaido_streamfish_endpoint3')
          auth = json.loads((root/'final_endpoint_execution_authorization.json').read_text())
          assert auth['attempt_id'] == 'hokkaido_streamfish_endpoint3_v1'
          assert auth['issue'] == 364
          assert auth['authorized_external_gets'] == 2
          assert auth['coordinate_requests_allowed'] == 1
          assert auth['response_requests_allowed'] == 1
          assert auth['full_response_bytes_allowed'] == 6508582
          assert auth['live_execute_branch'] == 'execute/hokkaido-streamfish-final-endpoint-v1'
          assert auth['live_trigger_marker'] == 'validation/hokkaido_streamfish_endpoint3/final_endpoint_execute_once.json'
          bindings = {
              'source_contract_git_blob_sha': root/'source_contract.json',
              'pre_response_pass_git_blob_sha': root/'pre_response_pass_certificate.json',
              'response_header_pass_git_blob_sha': root/'response_header_pass_certificate.json',
              'final_endpoint_contract_git_blob_sha': root/'final_endpoint_contract.json',
              'final_endpoint_declaration_git_blob_sha': root/'final_endpoint_declaration.json',
              'final_endpoint_evaluator_git_blob_sha': root/'final_endpoint.py',
              'final_endpoint_runner_git_blob_sha': root/'run_final_endpoint.py',
              'runtime_lock_git_blob_sha': root/'runtime_lock.txt',
              'pre_response_geometry_git_blob_sha': root/'pre_response_geometry.py',
              'dynamic_island_reachability_git_blob_sha': Path('src/eog/dynamic_island_reachability.py'),
              'world_reconstruction_git_blob_sha': Path('src/eog/v2/world_reconstruction.py'),
              'world_forecast_git_blob_sha': Path('src/eog/v2/world_forecast.py'),
              'world_predictive_summary_git_blob_sha': Path('src/eog/v2/world_predictive_summary.py'),
              'predictive_complementarity_git_blob_sha': Path('src/eog/v2/predictive_complementarity.py'),
          }
          for key, path in bindings.items():
              observed = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
              assert observed == auth[key], (key, observed, auth[key])
          PY

  live-final-once:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/execute/hokkaido-streamfish-final-endpoint-v1' }}
    needs: synthetic-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact frozen runtime
        run: python -m pip install -r validation/hokkaido_streamfish_endpoint3/runtime_lock.txt
      - name: Install EOG without dependency mutation
        run: python -m pip install -e . --no-deps
      - name: Verify one-shot execute marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('validation/hokkaido_streamfish_endpoint3/final_endpoint_execute_once.json')
          r=json.loads(p.read_text())
          assert r == {
            'attempt_id':'hokkaido_streamfish_endpoint3_v1',
            'issue':364,
            'execute_once':True,
            'authorization':'final_endpoint_execution_authorization.json'
          }
          PY
      - name: Execute final response and paired endpoint once
        run: python -m validation.hokkaido_streamfish_endpoint3.run_final_endpoint
      - name: Audit terminal result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('validation/hokkaido_streamfish_endpoint3/final_endpoint_result.json')
          r=json.loads(p.read_text())
          allowed={
            'favorable_complementary_added_value',
            'adverse_complementary_added_value',
            'no_confirmed_complementary_added_value',
            'stop_full_response_transport_or_integrity',
            'stop_full_response_schema_or_coverage',
            'non_estimable_response_balance',
            'non_estimable_layer_a_crossfit',
            'universe_falsified_stop',
          }
          assert r['status'] in allowed
          assert r['attempt_id']=='hokkaido_streamfish_endpoint3_v1'
          assert r['issue']==364
          assert r['response_requests']==1
          assert r['model_fits'] in {0,10}
          assert r['heldout_scores'] in {0,5}
          if r['status'] in {
            'favorable_complementary_added_value',
            'adverse_complementary_added_value',
            'no_confirmed_complementary_added_value',
          }:
              assert r['model_fits']==10
              assert r['heldout_scores']==5
              assert r['counts_as_predictive_evidence'] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hokkaido-streamfish-final-endpoint
          path: validation/hokkaido_streamfish_endpoint3/final_endpoint_result.json
          if-no-files-found: error
