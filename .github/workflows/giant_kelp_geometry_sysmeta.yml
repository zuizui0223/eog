name: Giant kelp southern geometry system metadata

on:
  push:
    branches:
      - agent/giant-kelp-preflight
    paths:
      - ".github/workflows/giant_kelp_geometry_sysmeta.yml"
      - "validation/giant_kelp_complementarity/southern_geometry_object_contract.json"
  pull_request:
    paths:
      - ".github/workflows/giant_kelp_geometry_sysmeta.yml"
      - "validation/giant_kelp_complementarity/southern_geometry_object_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sysmeta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve DataONE system metadata only
        run: |
          set -euo pipefail
          mkdir -p build/giant_kelp_geometry_sysmeta
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path

          ROOT=Path('validation/giant_kelp_complementarity')
          OUT=Path('build/giant_kelp_geometry_sysmeta')
          contract=json.loads((ROOT/'southern_geometry_object_contract.json').read_text(encoding='utf-8'))
          pid=contract['southern_geometry_entity']['data_pid']
          UA='eog-giant-kelp-geometry-sysmeta/1.0'
          encoded=urllib.parse.quote(pid,safe='')
          fetched=[]

          def get(url,accept):
              if not url.startswith('https://cn.dataone.org/cn/v2/'):
                  raise RuntimeError(f'non-DataONE-CN endpoint blocked: {url!r}')
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':accept})
              with urllib.request.urlopen(req,timeout=60) as r:
                  body=r.read(); status=getattr(r,'status',None) or r.getcode(); ctype=str(r.headers.get('Content-Type','')); final=str(r.geturl())
              fetched.append({'requested':url,'final':final,'status':status,'bytes':len(body),'content_type':ctype,'sha256':hashlib.sha256(body).hexdigest()})
              return body

          meta_bytes=get(f'https://cn.dataone.org/cn/v2/meta/{encoded}','application/xml,text/xml,*/*')
          root=ET.fromstring(meta_bytes)
          def lname(tag): return tag.rsplit('}',1)[-1]
          def first_text(name):
              for node in root.iter():
                  if lname(node.tag)==name:
                      return ' '.join(''.join(node.itertext()).split())
              return ''
          identifier=first_text('identifier')
          format_id=first_text('formatId')
          size_text=first_text('size')
          checksum_node=next((n for n in root.iter() if lname(n.tag)=='checksum'),None)
          checksum=' '.join(''.join(checksum_node.itertext()).split()) if checksum_node is not None else ''
          checksum_algorithm=str(checksum_node.attrib.get('algorithm','')) if checksum_node is not None else ''
          if identifier != pid:
              raise RuntimeError(f'DataONE sysmeta identifier mismatch: {identifier!r}')
          if not size_text.isdigit() or int(size_text)<=0:
              raise RuntimeError(f'invalid DataONE sysmeta size: {size_text!r}')
          if not checksum or not checksum_algorithm:
              raise RuntimeError('DataONE sysmeta lacks checksum identity')

          checksum_bytes=get(f'https://cn.dataone.org/cn/v2/checksum/{encoded}','application/xml,text/xml,*/*')
          checksum_root=ET.fromstring(checksum_bytes)
          checksum_api=' '.join(''.join(checksum_root.itertext()).split())
          checksum_api_algorithm=str(checksum_root.attrib.get('algorithm',''))
          if checksum_api != checksum or checksum_api_algorithm.casefold()!=checksum_algorithm.casefold():
              raise RuntimeError('DataONE checksum endpoint disagrees with system metadata')

          payload={
              'status':'southern_geometry_system_metadata_frozen',
              'candidate':contract['candidate'],
              'data_pid':pid,
              'object_name':contract['southern_geometry_entity']['object_name'],
              'identifier':identifier,
              'format_id':format_id,
              'size_bytes':int(size_text),
              'checksum':checksum,
              'checksum_algorithm':checksum_algorithm,
              'system_metadata_sha256':hashlib.sha256(meta_bytes).hexdigest(),
              'coordinate_rule':contract['patch_coordinate_rule'],
              'node_identity_rule':contract['node_identity_rule'],
              'expected_unique_patch_count':contract['expected_unique_patch_count'],
              'structural_gate':contract['structural_gate'],
              'geometry_object_bytes_opened':False,
              'response_package_bytes_opened':False,
              'response_rows_opened':False,
              'network_fetches':fetched,
              'next':'retrieve exactly this public geometry object, verify checksum/columns/469 patch IDs, derive frozen centroids, and run the unchanged structural gate',
          }
          payload['fingerprint']=hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          (OUT/'geometry_sysmeta_result.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - name: Assert geometry-data firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('build/giant_kelp_geometry_sysmeta/geometry_sysmeta_result.json'))
          assert p['status']=='southern_geometry_system_metadata_frozen'
          assert p['geometry_object_bytes_opened'] is False
          assert p['response_package_bytes_opened'] is False
          assert p['response_rows_opened'] is False
          PY
      - name: Upload frozen system metadata
        uses: actions/upload-artifact@v4
        with:
          name: giant-kelp-southern-geometry-sysmeta
          path: build/giant_kelp_geometry_sysmeta/geometry_sysmeta_result.json
          if-no-files-found: error
