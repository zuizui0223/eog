name: BAM geometry response envelopes v1
on:
  pull_request:
    paths:
      - 'benchmarks/bam_geometry_response_envelopes_v1.py'
      - 'tests/test_bam_geometry_response_envelopes_v1.py'
      - 'validation/bam_geometry_response_envelopes_v1/**'
      - '.github/workflows/bam-geometry-response-envelopes-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_bam_geometry_response_envelopes_v1.py
      - name: Verify original generator and canonical release operator
        run: |
          test "$(git hash-object src/eog/v2/known_truth_bam_generality.py)" = ab852b02bccdfb2f065717f89b482b7cf15778d3
          python benchmarks/bam_geometry_response_envelopes_v1.py --output-dir /tmp/bam_geometry_responses
      - name: Check already-scored descriptive counts, not a new confirmatory test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/bam_geometry_responses/result.json').read_text())
          assert r['audit']['worlds']==768 and r['audit']['current_G_fibres']==129
          assert r['audit']['mask_ambiguous_fibres']==69
          span={x['release_axis']:x for x in r['axis_targets'] if x['metric']=='span'}
          assert [span[a]['map_identified_fibres'] for a in 'ABM']==[110,96,95]
          assert [span[a]['direction_identified_fibres'] for a in 'ABM']==[119,124,121]
          assert span['M']['opposite_sign_fibres']==5
          assert next(x for x in r['joint_targets'] if x['metric']=='span')['fibres_all_three_directions_identified']==115
          print('CANONICAL_GENERATOR_EOG_OPERATOR_AND_DESCRIPTIVE_COUNTS_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bam-geometric-response-envelopes-v1
          path: /tmp/bam_geometry_responses/*
