name: BAM Sweden river-barrier bridge Gate0

on:
  pull_request:
    paths:
      - "validation/bam_sweden_riverbarrier_external_bridge_v1/**"
      - "tests/test_bam_sweden_riverbarrier_gate0.py"
      - ".github/workflows/bam-sweden-riverbarrier-gate0.yml"
  workflow_dispatch:

concurrency:
  group: bam-sweden-riverbarrier-gate0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test fail-closed metadata Gate0
        run: python -m pytest tests/test_bam_sweden_riverbarrier_gate0.py -q
      - name: Execute metadata-only Gate0
        run: python -m validation.bam_sweden_riverbarrier_external_bridge_v1.gate0_dryad_identity
      - uses: actions/upload-artifact@v4
        with:
          name: bam-sweden-riverbarrier-gate0
          path: validation/bam_sweden_riverbarrier_external_bridge_v1/gate0_dryad_identity_certificate.json
          if-no-files-found: error
