name: BAM structured counterfactuals v1

on:
  pull_request:
    paths:
      - "src/eog/v2/bam_structured_counterfactuals.py"
      - "benchmarks/run_bam_structured_counterfactuals_v1.py"
      - "tests/test_bam_structured_counterfactuals.py"
      - "validation/bam_structured_counterfactuals_v1/**"
      - ".github/workflows/bam-structured-counterfactuals-v1.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Verify structured counterfactual operators
        run: python -m pytest tests/test_bam_structured_counterfactuals.py -q
      - name: Run frozen W0/W1 structured-counterfactual audit
        run: |
          python benchmarks/run_bam_structured_counterfactuals_v1.py \
            --output build/bam_structured_counterfactuals_v1/result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: bam-structured-counterfactuals-v1
          path: build/bam_structured_counterfactuals_v1/result_v1.json
          if-no-files-found: error
