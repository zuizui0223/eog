name: NCRN final live once

on:
  push:
    branches:
      - research/layer-b-v2-single-fresh-endpoint-lock
    paths:
      - 'validation/layer_b_mechanism_v2/ncrn_response_open_authorization_v1.json'

permissions:
  contents: read

jobs:
  live-once:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Enforce immutable one-shot authorization
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          if os.environ['RUN_ATTEMPT'] != '1':
              raise SystemExit('manual or automatic workflow rerun is forbidden before any response request')

          auth_rel='validation/layer_b_mechanism_v2/ncrn_response_open_authorization_v1.json'
          auth_path=Path(auth_rel)
          if not auth_path.exists():
              raise SystemExit('authorization receipt missing')
          auth=json.loads(auth_path.read_text())
          contract=json.loads(Path('validation/layer_b_mechanism_v2/ncrn_final_execution_contract_v1.json').read_text())
          receipt=json.loads(Path('validation/layer_b_mechanism_v2/ncrn_pre_response_qualification_receipt_v1.json').read_text())
          route=json.loads(Path('validation/layer_b_mechanism_v2/ncrn_r1_response_route_contract_v1.json').read_text())

          assert auth['response_open_authorized'] is True
          assert auth['attempt_id'] == contract['attempt_id'] == receipt['attempt_id']
          assert auth['candidate'] == contract['candidate'] == receipt['candidate']
          assert auth['one_shot'] is True
          assert auth['response_download_file_id'] == 757402
          assert auth['maximum_full_payload_requests'] == 1
          assert auth['pre_authorization_response_payload_requests'] == 0
          assert auth['pre_authorization_response_payload_bytes_opened'] == 0
          assert auth['manual_rerun_allowed'] is False
          assert auth['post_outer_rescue_allowed'] is False
          assert auth['replacement_candidate_after_scored_outer_allowed'] is False
          assert receipt['qualification_decision'] == 'fully_qualified_response_blind_pending_explicit_one_shot_authorization'
          assert route['authoritative_response']['download_file_id'] == 757402

          parent=subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip()
          if parent != auth['qualified_parent_sha']:
              raise SystemExit(f'authorization parent mismatch: HEAD^={parent}, auth={auth["qualified_parent_sha"]}')

          changed=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'], text=True).splitlines()
          if changed != [auth_rel]:
              raise SystemExit(f'authorization commit must change exactly one file ({auth_rel}); got {changed}')

          prior_auth_history=subprocess.check_output(
              ['git','log','--format=%H','HEAD^','--',auth_rel], text=True
          ).strip()
          if prior_auth_history:
              raise SystemExit('authorization path already existed in pre-authorization history; a second response-opening run is forbidden')

          required_hashes=auth['frozen_file_sha256']
          for path, expected in required_hashes.items():
              observed=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if observed != expected:
                  raise SystemExit(f'frozen file hash mismatch for {path}: {observed} != {expected}')

          src=Path('validation/layer_b_mechanism_v2/ncrn_final_once_v2.py').read_text()
          if src.count('r1_raw = core.get_bytes(core.RESPONSE_URL') != 1:
              raise SystemExit('authoritative runner must contain exactly one response GET')
          if 'base["response_payload_requests"] = 1' not in src:
              raise SystemExit('response request accounting guard missing')
          print('one-shot authorization verified; response remains unopened until runner step')
          PY
      - name: Execute single authorized real endpoint
        run: python validation/layer_b_mechanism_v2/ncrn_final_once_v2.py
      - name: Audit terminal receipt
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('build/layer_b_mechanism_v2/ncrn_final/final_result.json')
          if not path.exists():
              raise SystemExit('final terminal receipt missing')
          p=json.loads(path.read_text())
          assert p['mode']=='live'
          assert p['runner_version']=='ncrn_final_once_v2'
          status=p['status']
          allowed={
              'terminal_predictive_result',
              'terminal_non_estimable_under_frozen_rules',
              'terminal_schema_or_transport_stop_after_response',
          }
          assert status in allowed
          assert p['response_payload_requests']==1
          if status=='terminal_predictive_result':
              assert p['response_values_opened'] is True
              assert p['response_payload_bytes_opened'] > 0
              assert p['response_header_column_count']==60
              assert p['counts_as_predictive_evidence'] is True
              assert set(p['outer']) >= {
                  'baseline_macro_log_loss','always_augmented_macro_log_loss',
                  'selected_macro_log_loss','selected_minus_baseline',
                  'baseline_macro_brier','always_augmented_macro_brier','selected_macro_brier'
              }
              assert p['inner_validation']['selection_fingerprint_before_outer_scoring']
          else:
              assert p['counts_as_predictive_evidence'] is False
          print(json.dumps({'status':status,'counts_as_predictive_evidence':p['counts_as_predictive_evidence']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncrn-final-live-once-terminal-receipt
          path: build/layer_b_mechanism_v2/ncrn_final/final_result.json
          if-no-files-found: error
