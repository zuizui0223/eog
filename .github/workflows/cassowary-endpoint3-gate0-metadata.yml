name: Cassowary endpoint3 Gate0 metadata

on:
  push:
    branches:
      - execute/cassowary-gate0-metadata-v1

permissions:
  contents: read

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest
      - name: Verify frozen metadata Gate0 without external data
        run: pytest -q tests/test_cassowary_gate0_metadata.py
      - name: Compile frozen runner
        run: python -m py_compile validation/cassowary_endpoint3/gate0_figshare_metadata.py validation/cassowary_endpoint3/run_gate0_figshare_metadata.py
      - name: Verify one-shot execution authorization and frozen blobs
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          p = Path('validation/cassowary_endpoint3/gate0_execution_authorization.json')
          a = json.loads(p.read_text())
          assert a['attempt_id'] == 'cassowary_endpoint3_v1'
          assert a['issue'] == 348
          assert a['source_boundary_merge'] == 'e783a89b0dcdf8c68161ec8dc45073d22b816d80'
          assert a['authorized_branch'] == 'execute/cassowary-gate0-metadata-v1'
          assert a['authorized_workflow_run_number'] == 1
          assert a['authorized_workflow_run_attempt'] == 1
          assert a['allowed_live_request_count'] == 1
          assert a['file_payload_requests_allowed'] == 0
          assert a['file_payload_bytes_allowed'] == 0
          assert a['response_header_bytes_allowed'] == 0
          assert a['response_rows_allowed'] == 0
          assert a['response_values_allowed'] is False
          assert a['model_fits_allowed'] == 0
          assert a['heldout_scores_allowed'] == 0

          paths = {
              'source_contract_git_blob_sha1': 'validation/cassowary_endpoint3/source_contract.json',
              'metadata_evaluator_git_blob_sha1': 'validation/cassowary_endpoint3/gate0_figshare_metadata.py',
              'runner_git_blob_sha1': 'validation/cassowary_endpoint3/run_gate0_figshare_metadata.py',
          }
          for key, path in paths.items():
              observed = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert observed == a[key], (key, observed, a[key])
          PY

  live-metadata-gate0:
    needs: synthetic-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute metadata-only Gate0 once
        run: python validation/cassowary_endpoint3/run_gate0_figshare_metadata.py
      - name: Audit file/response firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/cassowary_endpoint3/gate0_metadata.json')
          r = json.loads(p.read_text())
          assert r['status'] in {'gate0_metadata_ready','stop_pre_response_metadata_identity_or_transport'}
          assert r['metadata_request_count'] == 1
          assert 0 <= r['metadata_bytes_opened'] <= 2_000_000
          assert r['file_payload_requests'] == 0
          assert r['file_payload_bytes_opened'] == 0
          assert r['response_header_bytes_opened'] == 0
          assert r['response_rows_opened'] == 0
          assert r['response_values_opened'] is False
          assert r['model_fits'] == 0
          assert r['heldout_scores'] == 0
          assert r['counts_as_predictive_evidence'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cassowary-gate0-metadata
          path: build/cassowary_endpoint3/gate0_metadata.json
          if-no-files-found: error
