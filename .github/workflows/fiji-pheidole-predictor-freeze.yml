name: Fiji Pheidole response-free predictor freeze

on:
  pull_request:
    paths:
      - ".github/workflows/fiji-pheidole-predictor-freeze.yml"
      - "benchmarks/fiji_pheidole_predictor_freeze.py"
      - "docs/eog_v2_fiji_pheidole_predictor_freeze_contract.md"
      - "src/eog/dynamic_island_reachability.py"
      - "src/eog/eventual_genetic_connectivity.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and transport dependency
        run: |
          python -m pip install -e .
          python -m pip install "requests==2.32.5"
      - name: Download Stage-1 verified archive byte object
        run: |
          mkdir -p benchmark_results/fiji_pheidole_predictor/raw
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import requests

          expected = '9a23543ad59d5f4de7e6f26cc91b75dc60f93c259744e640b8f6576fde89abc7'
          path = Path('benchmark_results/fiji_pheidole_predictor/raw/dryad.zip')
          digest = hashlib.sha256()
          with requests.get('https://zenodo.org/api/records/4965569/files/dryad.zip/content', stream=True, timeout=180) as response:
              response.raise_for_status()
              with path.open('wb') as handle:
                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                      if chunk:
                          handle.write(chunk)
                          digest.update(chunk)
          actual = digest.hexdigest()
          if actual != expected:
              raise RuntimeError(f'Fiji archive SHA mismatch: {actual}')
          PY
      - name: Freeze response-free nodes, conventional candidate family and EOG predictors
        run: |
          python benchmarks/fiji_pheidole_predictor_freeze.py \
            --archive benchmark_results/fiji_pheidole_predictor/raw/dryad.zip \
            --nodes benchmark_results/fiji_pheidole_predictor/nodes.csv \
            --predictors benchmark_results/fiji_pheidole_predictor/predictors.csv \
            --manifest benchmark_results/fiji_pheidole_predictor/manifest.json \
            > benchmark_results/fiji_pheidole_predictor/stdout.json
      - name: Check frozen predictor contract and dateline sanity
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path('benchmark_results/fiji_pheidole_predictor')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['schema'] == 'eog_v2_1_fiji_pheidole_response_free_predictors_v1'
          assert manifest['genetic_member_contents_accessed'] is False
          assert manifest['allowed_archive_member_contents_accessed'] == ['dryad/VCFs/sequenceMetaData.csv']
          assert manifest['focal_egpa'] == 'EGPA0079'
          assert manifest['focal_species_label'] == 'ululevu'
          assert manifest['n_nodes'] == 11
          assert manifest['node_ids'] == ['BQ','EVN','GA','KR','KV','LA','LK','ML','TA','VL3','VL4']
          assert manifest['conventional_candidate_ids'] == ['gabriel_current_flow','gabriel_shortest_path','geographic']
          assert manifest['response_transform'] == 'linearized_fst'
          assert manifest['ridge_penalty'] == 1.0
          assert manifest['bootstrap_resamples'] == 10000
          assert manifest['bootstrap_seed'] == 20260813
          assert len(manifest['operator_fingerprint']) == 64
          assert len(manifest['eventual_connectivity_fingerprint']) == 64
          assert len(manifest['candidate_family_fingerprint']) == 64
          assert len(manifest['predictor_manifest_fingerprint']) == 64

          # Geography sanity: nodes straddling +/-180 degrees must remain near each other,
          # not separated by a spurious ~40,000 km dateline artifact.
          rows = list(csv.DictReader((root / 'predictors.csv').open()))
          by_pair = {tuple(sorted((row['population_a'], row['population_b']))): row for row in rows}
          lk_ta = float(by_pair[tuple(sorted(('LK','TA')))]['geographic'])
          assert lk_ta < 1000.0, lk_ta
          assert all(float(row['geographic']) >= 0 for row in rows)
          assert all(float(row['gabriel_shortest_path']) >= 0 for row in rows)
          assert all(float(row['gabriel_current_flow']) >= 0 for row in rows)
          assert len(rows) == 55
          PY
      - name: Remove raw archive before artifact upload
        if: always()
        run: rm -rf benchmark_results/fiji_pheidole_predictor/raw
      - name: Upload frozen response-free predictor artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiji-pheidole-response-free-predictors
          path: |
            benchmark_results/fiji_pheidole_predictor/nodes.csv
            benchmark_results/fiji_pheidole_predictor/predictors.csv
            benchmark_results/fiji_pheidole_predictor/manifest.json
            benchmark_results/fiji_pheidole_predictor/stdout.json
          if-no-files-found: error
