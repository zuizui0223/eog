name: Peneda roe-deer paired preflight

on:
  push:
    branches:
      - agent/peneda-roedeer-paired-preflight
    paths:
      - "validation/peneda_roedeer_paired_complementarity/**"
      - ".github/workflows/peneda_roedeer_paired_preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  response-blind-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert preflight script does not reference response payload
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'response_url|s005\.csv|observations_Peneda' validation/peneda_roedeer_paired_complementarity/run_preflight.py; then
            echo "Preflight code contains a forbidden response-payload reference." >&2
            exit 1
          fi

      - name: Run response-blind geometry and effort gates
        run: python validation/peneda_roedeer_paired_complementarity/run_preflight.py

      - name: Upload preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peneda-roedeer-response-blind-preflight
          path: validation/peneda_roedeer_paired_complementarity/preflight_result.json
          if-no-files-found: error
