name: Bodie pika replication 2 Gate0

on:
  push:
    branches:
      - agent/bodie-pika-terrestrial-replication-2
    paths:
      - validation/bodie_pika_replication_2/**
      - .github/workflows/bodie_pika_replication_2_gate0.yml

permissions:
  contents: read

jobs:
  gate0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile author-geometry Gate0
        run: python -m py_compile validation/bodie_pika_replication_2/gate0_author_geometry.py
      - name: Audit author-released response-independent geometry
        run: python validation/bodie_pika_replication_2/gate0_author_geometry.py
      - name: Assert census response firewall and frozen universe rule
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/bodie_pika_replication_2/author_geometry_gate.json')
          assert p.exists()
          r = json.loads(p.read_text())
          a = r['response_firewall']
          assert r['frozen_expected_patch_count'] == 82
          assert a['census_payload_requests'] == 0
          assert a['census_payload_bytes_opened'] == 0
          assert a['census_header_bytes_opened'] == 0
          assert a['census_sheet_names_opened'] is False
          assert a['census_rows_opened'] is False
          assert a['census_values_opened'] is False
          assert a['scientific_model_fits'] == 0
          assert a['heldout_scores'] == 0
          assert r['status'] in {
              'gate0_pass_author_geometry_matches_frozen_universe',
              'stop_response_independent_complete_geometry_not_found',
          }
          print(json.dumps({
              'status': r['status'],
              'fingerprint': r['fingerprint'],
              'geometry': r['geometry'],
              'response_firewall': a,
          }, indent=2, sort_keys=True))
          PY
      - name: Upload authoritative terminal Gate0 evidence
        uses: actions/upload-artifact@v4
        with:
          name: bodie-pika-replication-2-author-geometry-gate0
          path: build/bodie_pika_replication_2/author_geometry_gate.json
          if-no-files-found: error
