name: Thalassia response-free genetic predictor freeze

on:
  pull_request:
    paths:
      - ".github/workflows/thalassia-response-free-predictors.yml"
      - "benchmarks/thalassia_predictor_freeze.py"
      - "benchmarks/frozen/thalassia_response_free/**"
      - "docs/eog_v2_thalassia_stage2_predictor_contract.md"
      - "docs/eog_v2_nested_genetic_reference_contract.md"
      - "src/eog/dynamic_island_reachability.py"
      - "src/eog/eventual_genetic_connectivity.py"
      - "src/eog/eventual_reachability_genetics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen package and projection dependency
        run: python -m pip install -e . "pyproj==3.7.2"
      - name: Build response-free predictor bundle
        run: |
          mkdir -p benchmark_results/thalassia_predictors
          python benchmarks/thalassia_predictor_freeze.py \
            --predictors benchmark_results/thalassia_predictors/predictors.csv \
            --manifest benchmark_results/thalassia_predictors/manifest.json \
            > benchmark_results/thalassia_predictors/stdout.json
      - name: Enforce Stage-2 contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('benchmark_results/thalassia_predictors')
          m=json.loads((root/'manifest.json').read_text())
          assert m['status']=='response-free-genetic-predictor-freeze'
          assert m['source_stage1_fingerprint']=='12a34c597dbf4130ad1dcda8a9822504291a0ac7d4f34fa31c43d8d373d49764'
          assert m['source_coordinate_fingerprint']=='334948e6af43c50d5fb7bfec3396065a1c39d64e0bab7eb5f4a767a42249245d'
          assert m['opaque_genetic_file_sha256']=='aaaab9e302c9be8cf4e108d2aee5867c0b64ed70b6d3b81bad4d60168ee7f2f3'
          assert m['genetic_workbook_contents_accessed'] is False
          assert m['genetic_response_attached'] is False
          assert m['n_populations']==17
          assert m['n_pairs']==136
          assert m['candidate_ids']==['gabriel_current_flow','gabriel_shortest_path','geographic']
          assert m['response_transform']=='linearized_fst'
          assert m['ridge_penalty']==1.0
          assert m['bootstrap_resamples']==10000
          assert m['bootstrap_seed']==20260813
          assert m['loss_support']==0.5
          assert m['gabriel_edge_count'] >= 16
          assert len(m['candidate_family_fingerprint'])==64
          assert len(m['graph_fingerprint'])==64
          assert len(m['operator_fingerprint'])==64
          assert len(m['connectivity_fingerprint'])==64
          assert len(m['fingerprint'])==64
          with (root/'predictors.csv').open(newline='',encoding='utf-8') as h:
              rows=list(csv.DictReader(h))
          assert len(rows)==136
          assert set(rows[0])=={
              'population_a','population_b','geographic','gabriel_shortest_path',
              'gabriel_current_flow','eog_continuous_distance','eog_disconnected'
          }
          PY
      - name: Upload immutable response-free predictor candidate
        uses: actions/upload-artifact@v4
        with:
          name: thalassia-response-free-genetic-predictors
          path: |
            benchmark_results/thalassia_predictors/predictors.csv
            benchmark_results/thalassia_predictors/manifest.json
            benchmark_results/thalassia_predictors/stdout.json
          if-no-files-found: error
