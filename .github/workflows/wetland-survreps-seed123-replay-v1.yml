name: Wetland original R seed-123 sampling-stage replay v1
on:
  pull_request:
    paths:
      - "benchmarks/wetland_survreps_seed123_replay_v1.R"
      - "benchmarks/wetland_survreps_seed123_evaluate_v1.py"
      - "tests/test_wetland_survreps_seed123_evaluate_v1.py"
      - "validation/wetland_survreps_seed123_replay_v1/**"
      - ".github/workflows/wetland-survreps-seed123-replay-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test runner
        run: python -m pip install pytest
      - name: Verify Python replay evaluator fail-closed tests
        run: python -m pytest -q tests/test_wetland_survreps_seed123_evaluate_v1.py
      - name: Authenticate pinned native CSVs and published source sampler
        run: |
          mkdir -p /tmp/eog_wetland_rreplay
          curl --fail --location --retry 2 --max-time 35 --silent --show-error \
            https://raw.githubusercontent.com/zuizui0223/frogcs/5e2f0a87c639df373fa2700b29403d2ab417a1cc/research/external/zenodo_15044115/wetland_amp_site_data.csv \
            -o /tmp/eog_wetland_rreplay/sites.csv
          curl --fail --location --retry 2 --max-time 35 --silent --show-error \
            https://raw.githubusercontent.com/zuizui0223/frogcs/5e2f0a87c639df373fa2700b29403d2ab417a1cc/research/external/zenodo_15044115/wetland_amp_surv_data.csv \
            -o /tmp/eog_wetland_rreplay/surveys.csv
          curl --fail --location --retry 2 --max-time 35 --silent --show-error \
            https://raw.githubusercontent.com/edvardmizsei/hunviphab/25d4c64da289ffcc14679619bb3b18bd494de872/R/survreps.R \
            -o /tmp/eog_wetland_rreplay/survreps.R
          echo "93064521563b04d8c264639463abf9806eea7aa34f502d7d45bedd42ebec0319  /tmp/eog_wetland_rreplay/sites.csv" | sha256sum -c -
          echo "45146ee7a97c8086a53d13c3f19a060b51fe2ca1a42cb1aa9c42bbac67877ddd  /tmp/eog_wetland_rreplay/surveys.csv" | sha256sum -c -
          test "$(git hash-object /tmp/eog_wetland_rreplay/survreps.R)" = "ae7de0753faa1660b9e1ce1bc81b8cdb39a9c670"
          echo "PINNED_SOURCE_R_FUNCTION_VERIFIED"
      - name: Replay seed 123 in authentic R function without fitting occupancy
        run: |
          Rscript --version
          Rscript --vanilla benchmarks/wetland_survreps_seed123_replay_v1.R \
            /tmp/eog_wetland_rreplay/surveys.csv \
            /tmp/eog_wetland_rreplay/sites.csv \
            /tmp/eog_wetland_rreplay/survreps.R \
            /tmp/eog_wetland_rreplay
      - name: Compare R source-row selections with native recorded positives
        run: |
          python benchmarks/wetland_survreps_seed123_evaluate_v1.py \
            --surveys /tmp/eog_wetland_rreplay/surveys.csv \
            --sites /tmp/eog_wetland_rreplay/sites.csv \
            --replay-dir /tmp/eog_wetland_rreplay \
            --output /tmp/eog_wetland_rreplay/seed123_replay_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/eog_wetland_rreplay/seed123_replay_result.json').read_text())
          assert r['status']=='PINNED_PUBLIC_R_STAGE_REPLAY_NOT_HISTORICAL_PAPER_FIT'
          assert not r['historical_publication_runtime_verified']
          assert not r['ecological_occupancy_fitting_permitted']
          for cohort,(sites,raw,positive) in {
            'published_q1': (27,351,144),'published_q2': (13,188,77)
          }.items():
              s=r['cohorts'][cohort]['sampling']
              assert (s['sites'],s['native_rows'],s['native_positive_species_site_pairs'])==(sites,raw,positive)
              assert s['sampled_positions']==sites*20
              assert s['seed123_positive_species_site_pairs']+s['seed123_lost_positive_species_site_pairs']==positive
          print('PINNED_R_REPLAY_POSITIVE_EVIDENCE_CHECKS_PASSED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wetland-r-seed123-native-row-replay-v1
          path: |
            /tmp/eog_wetland_rreplay/seed123_replay_result.json
            /tmp/eog_wetland_rreplay/published_q1_source_row_mapping.csv
            /tmp/eog_wetland_rreplay/published_q2_source_row_mapping.csv
            /tmp/eog_wetland_rreplay/published_q1_runtime.txt
            /tmp/eog_wetland_rreplay/published_q2_runtime.txt
