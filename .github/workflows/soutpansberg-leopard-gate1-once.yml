name: Soutpansberg leopard Gate1 once

on:
  push:
    branches:
      - execute/soutpansberg-leopard-gate1-v1

permissions:
  contents: read

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Verify one-shot execution boundary
        shell: bash
        run: |
          test "${{ github.run_number }}" = "1"
          test "${{ github.run_attempt }}" = "1"
          test "$(git rev-parse HEAD^)" = "a29ed015f3b1af17e2a5a153c257c2e0d28f63a2"
          git merge-base --is-ancestor ff7e67713f53065549fb691ff440b8df4275a4fc HEAD
      - name: Verify frozen Gate1 without external data
        run: python -m pytest -q tests/test_soutpansberg_leopard_gate1_zip_metadata.py
      - name: Compile runner
        run: python -m py_compile validation/soutpansberg_leopard_endpoint3/gate1_zip_metadata.py validation/soutpansberg_leopard_endpoint3/run_gate1_once.py

  live-gate1:
    needs: synthetic-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute bounded ZIP metadata Gate1 once
        run: python validation/soutpansberg_leopard_endpoint3/run_gate1_once.py
      - name: Audit response firewall and terminal category
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/soutpansberg_leopard_endpoint3/gate1_zip_metadata_result.json')
          d = json.loads(p.read_text())
          assert d['status'] in {
              'gate1_zip_metadata_ready',
              'stop_pre_response_zip_transport_container_or_inventory',
          }
          assert d['member_payload_bytes_opened'] == 0
          assert d['deployment_payload_bytes_opened'] == 0
          assert d['capture_header_bytes_opened'] == 0
          assert d['capture_payload_bytes_opened'] == 0
          assert d['response_rows_opened'] == 0
          assert d['response_values_opened'] is False
          assert d['model_fits'] == 0
          assert d['heldout_scores'] == 0
          assert d['counts_as_predictive_evidence'] is False
          if d['status'] == 'gate1_zip_metadata_ready':
              pairs = d['survey_pair_inventory']
              assert pairs['survey_count'] == 24
              assert pairs['deployment_member_count'] == 24
              assert pairs['capture_member_count'] == 24
              assert list(pairs['pairs']) == [f's{i:02d}' for i in range(1, 25)]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: soutpansberg-leopard-gate1-certificate
          path: build/soutpansberg_leopard_endpoint3/gate1_zip_metadata_result.json
          if-no-files-found: error
