name: Rhode Island raccoon response-blind deployment preflight

on:
  push:
    branches:
      - agent/ri-raccoon-fresh-paired-preflight
    paths:
      - ".github/workflows/ri_raccoon_deployment_preflight.yml"
      - "validation/ri_raccoon_paired_complementarity/**"
      - "src/eog/v2/world_scale_ladder.py"
      - "src/eog/v2/world_adequacy.py"
  pull_request:
    paths:
      - ".github/workflows/ri_raccoon_deployment_preflight.yml"
      - "validation/ri_raccoon_paired_complementarity/**"
      - "src/eog/v2/world_scale_ladder.py"
      - "src/eog/v2/world_adequacy.py"
  workflow_dispatch:

concurrency:
  group: ri-raccoon-deployment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deployment-only:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Execute frozen response-blind deployment gate
        run: python validation/ri_raccoon_paired_complementarity/deployment_preflight.py
      - name: Assert deployment-only response firewall
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("build/ri_raccoon_preflight/preflight.json")
          if not p.exists():
              raise SystemExit("Rhode Island preflight result missing")
          r = json.loads(p.read_text())
          assert r["detection_member_payload_requests"] == 0
          assert r["detection_member_payload_bytes_opened"] == 0
          assert r["detection_header_bytes_opened"] == 0
          assert r["response_rows_opened"] is False
          assert r["response_values_opened"] is False
          assert r["model_fits"] == 0 and r["heldout_scores"] == 0
          print(f"RI raccoon response firewall PASS: {r['status']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ri-raccoon-deployment-preflight
          path: build/ri_raccoon_preflight/preflight.json
          if-no-files-found: error
