name: Known-truth BAM v2

on:
  pull_request:
    paths:
      - "src/eog/v2/known_truth_bam.py"
      - "validation/known_truth_bam_v2/**"
      - "benchmarks/run_known_truth_bam_v2.py"
      - "tests/test_known_truth_bam.py"
      - ".github/workflows/known-truth-bam.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Run frozen BAM factorial
        run: |
          python benchmarks/run_known_truth_bam_v2.py \
            --output build/known_truth_bam_v2/factorial_result_v2.json
      - name: Verify BAM focused tests
        run: python -m pytest tests/test_known_truth_bam.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: known-truth-bam-v2
          path: build/known_truth_bam_v2/factorial_result_v2.json
          if-no-files-found: error
