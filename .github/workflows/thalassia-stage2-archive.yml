name: Thalassia one-time Stage 2 artifact archive

on:
  pull_request:
    paths:
      - ".github/workflows/thalassia-stage2-archive.yml"

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Download exact successful Stage-2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e benchmarks/frozen/thalassia_stage2_predictors
          mkdir -p /tmp/thalassia_stage2 benchmarks/frozen/thalassia_stage2_predictors
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9168592579/zip" \
            -o /tmp/thalassia-stage2.zip
          unzip -q /tmp/thalassia-stage2.zip -d /tmp/thalassia_stage2
          echo "05c3a2e65029d44532e55436bc97c33482f96fb2d1951d79a0b50c776b02b7e1  /tmp/thalassia_stage2/predictors.csv" | sha256sum --check
          echo "38f677f4d5f864d7d661e251c4e3970f2098ae2155a0125bb88045aa55fc442f  /tmp/thalassia_stage2/manifest.json" | sha256sum --check
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/thalassia_stage2/manifest.json').read_text())
          assert m['fingerprint']=='ef119675a596fe2044aca97b43efc618cfb7b00aee1dc3a1663ff5736c0a94ea'
          assert m['candidate_family_fingerprint']=='2895d0b1420fbd80cfabec7336bb2aa6b4fa501a452c90102859c3fe486f3ecb'
          assert m['graph_fingerprint']=='4523868e8536805c7b90df870f0e49cc22080470701e0bf7b13dd8e169ef752e'
          assert m['operator_fingerprint']=='50a9b3456027ea24d6e9effddca9988288972e18e23fe084fb0970f4f2675d8a'
          assert m['connectivity_fingerprint']=='e0ab1d046906d362b6766ec7b887e300d25efb119282406a0daf319abd156f89'
          assert m['genetic_workbook_contents_accessed'] is False
          assert m['genetic_response_attached'] is False
          assert m['n_populations']==17 and m['n_pairs']==136
          PY
          cp /tmp/thalassia_stage2/predictors.csv benchmarks/frozen/thalassia_stage2_predictors/predictors.csv
          cp /tmp/thalassia_stage2/manifest.json benchmarks/frozen/thalassia_stage2_predictors/manifest.json
          cat > benchmarks/frozen/thalassia_stage2_predictors/README.md <<'EOF'
          # Frozen Thalassia Stage-2 response-free predictors

          These files are copied byte-for-byte from the successful response-free Stage-2 artifact created before any microsatellite workbook content was opened.

          - source workflow run: `31667833942`;
          - source head: `b965bc55bcf9104a88464c43a03776dfaba6111b`;
          - artifact ID: `9168592579`;
          - artifact digest: `sha256:85f5871215275f4c4c113ff8b00dc2035dca96a0d923dfef4bfaa11eb877a961`;
          - predictors CSV SHA-256: `05c3a2e65029d44532e55436bc97c33482f96fb2d1951d79a0b50c776b02b7e1`;
          - manifest JSON SHA-256: `38f677f4d5f864d7d661e251c4e3970f2098ae2155a0125bb88045aa55fc442f`;
          - manifest fingerprint: `ef119675a596fe2044aca97b43efc618cfb7b00aee1dc3a1663ff5736c0a94ea`;
          - candidate-family fingerprint: `2895d0b1420fbd80cfabec7336bb2aa6b4fa501a452c90102859c3fe486f3ecb`;
          - graph fingerprint: `4523868e8536805c7b90df870f0e49cc22080470701e0bf7b13dd8e169ef752e`;
          - operator fingerprint: `50a9b3456027ea24d6e9effddca9988288972e18e23fe084fb0970f4f2675d8a`;
          - exact-eventual connectivity fingerprint: `e0ab1d046906d362b6766ec7b887e300d25efb119282406a0daf319abd156f89`.

          The candidate family is permanently frozen as `gabriel_current_flow`, `gabriel_shortest_path`, and `geographic`. EOG is not part of conventional-reference selection. Any later genetic response is attached to this immutable bundle; these predictors are not regenerated after response visibility.
          EOF
      - name: Commit immutable artifact bytes to the PR branch
        run: |
          set -euo pipefail
          git config user.name "EOG Stage-2 archive"
          git config user.email "actions@users.noreply.github.com"
          git add benchmarks/frozen/thalassia_stage2_predictors
          git diff --cached --quiet && { echo "nothing to archive"; exit 1; }
          git commit -m "Archive Thalassia response-free Stage 2 predictors"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
