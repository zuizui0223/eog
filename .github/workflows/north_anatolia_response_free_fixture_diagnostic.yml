name: North Anatolia roe deer response-free fixture diagnostic

on:
  push:
    branches:
      - agent/north-anatolia-preflight
    paths:
      - ".github/workflows/north_anatolia_response_free_fixture_diagnostic.yml"
      - "validation/north_anatolia_roe_deer_complementarity/diagnose_response_free_fixture.py"
      - "validation/north_anatolia_roe_deer_complementarity/response_free_smoke_harness.py"
      - "validation/north_anatolia_roe_deer_complementarity/paired_runner.py"
      - "validation/north_anatolia_roe_deer_complementarity/source_freeze.json"
      - "validation/north_anatolia_roe_deer_complementarity/geometry_gate_contract.json"
      - "validation/north_anatolia_roe_deer_complementarity/gate2_prediction_contract.json"
  pull_request:
    paths:
      - ".github/workflows/north_anatolia_response_free_fixture_diagnostic.yml"
      - "validation/north_anatolia_roe_deer_complementarity/diagnose_response_free_fixture.py"
      - "validation/north_anatolia_roe_deer_complementarity/response_free_smoke_harness.py"
      - "validation/north_anatolia_roe_deer_complementarity/paired_runner.py"
      - "validation/north_anatolia_roe_deer_complementarity/source_freeze.json"
      - "validation/north_anatolia_roe_deer_complementarity/geometry_gate_contract.json"
      - "validation/north_anatolia_roe_deer_complementarity/gate2_prediction_contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen runtime
        run: |
          python -m pip install .
          python -m pip install numpy==2.1.3 pandas==2.2.3 scikit-learn==1.5.2
      - name: Download only pinned response-independent inputs
        run: |
          set -euo pipefail
          mkdir -p build/north_anatolia_fixture_diagnostic/input build/north_anatolia_fixture_diagnostic/output
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          root = Path("validation/north_anatolia_roe_deer_complementarity")
          source = json.loads((root / "source_freeze.json").read_text(encoding="utf-8"))
          assert source["response_content_opened"] is False
          assert source["response"]["content_opened"] is False
          repo = source["upstream_repository"]
          commit = source["upstream_commit"]
          targets = [
              (
                  "stations.csv",
                  source["geometry"]["stations_path"],
                  source["geometry"]["stations_size_bytes"],
                  source["geometry"]["stations_git_blob_sha1"],
              ),
              (
                  "variable_data.csv",
                  source["geometry"]["variables_path"],
                  source["geometry"]["variables_size_bytes"],
                  source["geometry"]["variables_git_blob_sha1"],
              ),
              (
                  "camtrap_effort_Ndays.csv",
                  "data/camtrap_effort_Ndays.csv",
                  source["response_independent_predictors"]["camtrap_effort_Ndays.csv"]["size_bytes"],
                  source["response_independent_predictors"]["camtrap_effort_Ndays.csv"]["git_blob_sha1"],
              ),
          ]
          opened = []
          for local_name, remote_path, expected_size, expected_blob in targets:
              url = f"https://raw.githubusercontent.com/{repo}/{commit}/{remote_path}"
              req = Request(url, headers={"User-Agent": "EOG-response-free-fixture-diagnostic/1.0"})
              with urlopen(req, timeout=30) as response:
                  payload = response.read()
                  final_url = response.geturl()
              blob = hashlib.sha1(f"blob {len(payload)}\0".encode("ascii") + payload).hexdigest()
              if len(payload) != int(expected_size) or blob != expected_blob:
                  raise RuntimeError(f"pinned response-independent source drift: {remote_path}")
              Path("build/north_anatolia_fixture_diagnostic/input", local_name).write_bytes(payload)
              opened.append({"path": remote_path, "url": final_url, "git_blob_sha1": blob})
          Path("build/north_anatolia_fixture_diagnostic/output/source_audit.json").write_text(
              json.dumps({
                  "opened_response_independent_sources": opened,
                  "response_file_downloads": 0,
                  "response_content_opened": False,
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Diagnose selection-time versus post-audit source sets
        run: |
          set -euo pipefail
          python validation/north_anatolia_roe_deer_complementarity/diagnose_response_free_fixture.py \
            --stations build/north_anatolia_fixture_diagnostic/input/stations.csv \
            --variables build/north_anatolia_fixture_diagnostic/input/variable_data.csv \
            --effort build/north_anatolia_fixture_diagnostic/input/camtrap_effort_Ndays.csv \
            --output build/north_anatolia_fixture_diagnostic/output/fixture_diagnostic.json
      - name: Assert diagnostic stays response-blind
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("build/north_anatolia_fixture_diagnostic/output/fixture_diagnostic.json").read_text())
          assert result["response_content_opened"] is False
          assert result["scientific_contract_changed"] is False
          print(json.dumps({
              "status": result["status"],
              "first_mismatch": result["first_mismatch"],
              "possible_source_counts": result["possible_source_counts"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload response-free diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: north-anatolia-response-free-fixture-diagnostic
          path: build/north_anatolia_fixture_diagnostic/output/
          if-no-files-found: error
