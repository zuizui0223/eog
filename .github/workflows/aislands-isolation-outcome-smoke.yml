name: A-Islands isolation outcome smoke

on:
  push:
    branches:
      - agent/aislands-isolation-adequacy-outcome
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aislands-isolation-outcome-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-without-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and audit dependencies
        run: |
          python -m pip install -e .
          python -m pip install pyshp==2.3.1 rasterio==1.4.3 pytest

      - name: Run runner unit and contract tests
        run: |
          python -m pytest -q \
            tests/test_aislands_isolation_outcome_runner.py \
            tests/test_aislands_isolation_adequacy_contract.py \
            tests/test_island_isolation_reference.py \
            tests/test_aislands_polygon_area.py \
            tests/test_aislands_mainland_distance.py

      - name: Reproduce exact A-Islands v1.0 source
        run: |
          python benchmarks/fetch_aislands_zenodo.py \
            --record-id 10775809 \
            --expected-version 1.0 \
            --output-dir build/island_outcome_smoke/source

      - name: Reproduce frozen 886-taxon cohort
        run: |
          python benchmarks/aislands_species_screen.py \
            --island-data build/island_outcome_smoke/source/island_data.csv \
            --species-data build/island_outcome_smoke/source/species_data.csv \
            --output build/island_outcome_smoke/species_screen.csv \
            --min-present-islands 10 \
            --min-absent-islands 10 \
            --min-prevalence 0 \
            --max-prevalence 1
          python benchmarks/audit_aislands_taxon_status.py \
            --species-data build/island_outcome_smoke/source/species_data.csv \
            --species-screen build/island_outcome_smoke/species_screen.csv \
            --output-csv build/island_outcome_smoke/taxon_status_audit.csv \
            --output-summary build/island_outcome_smoke/taxon_status_summary.json
          python benchmarks/freeze_aislands_native_cohort.py \
            --status-audit build/island_outcome_smoke/taxon_status_audit.csv \
            --output-cohort build/island_outcome_smoke/frozen_taxon_cohort.csv \
            --output-summary build/island_outcome_smoke/frozen_taxon_cohort_summary.json

      - name: Rebuild frozen 842-island model audit
        run: |
          python benchmarks/audit_aislands_model_islands.py \
            --island-data build/island_outcome_smoke/source/island_data.csv \
            --species-data build/island_outcome_smoke/source/species_data.csv \
            --shapefile build/island_outcome_smoke/source/raw/A-Island_shape.shp \
            --projection build/island_outcome_smoke/source/raw/A-Island_shape.prj \
            --output-csv build/island_outcome_smoke/island_model_audit.csv \
            --output-summary build/island_outcome_smoke/island_model_audit_summary.json

      - name: Reproduce frozen five-fold spatial partition
        run: |
          python benchmarks/freeze_aislands_spatial_folds.py \
            --audit-csv build/island_outcome_smoke/island_model_audit.csv \
            --output-folds build/island_outcome_smoke/spatial_folds.csv \
            --output-summary build/island_outcome_smoke/spatial_folds_summary.json \
            --block-size-degrees 5 \
            --n-folds 5

      - name: Reproduce frozen CHELSA climate artifact
        run: |
          python benchmarks/extract_aislands_chelsa_climate.py \
            --island-audit build/island_outcome_smoke/island_model_audit.csv \
            --output-csv build/island_outcome_smoke/island_climate.csv \
            --output-manifest build/island_outcome_smoke/climate_manifest.json

      - name: Hard-match frozen cohort fold and climate fingerprints
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'frozen_taxon_cohort.csv': 'cf645d55b8bcc46be8a8dc5399db736bbcc20bb7114a72c79a5dee61ec918e12',
              'spatial_folds.csv': '221a925e289347069c89354d26acfab83fa3d4bc130b56f0178b8db30ab427fa',
              'island_climate.csv': '6ae7f4a78eea28f074ef3c3399368a4886b09d2d0714e723e957d0a99b524285',
          }
          root = Path('build/island_outcome_smoke')
          for name, accepted in expected.items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              print(name, actual)
              assert actual == accepted, (name, actual, accepted)
          PY

      - name: Reproduce frozen 842-island polygon areas
        run: |
          python benchmarks/audit_aislands_polygon_area.py \
            --audit-csv build/island_outcome_smoke/island_model_audit.csv \
            --shapefile build/island_outcome_smoke/source/raw/A-Island_shape.shp \
            --projection build/island_outcome_smoke/source/raw/A-Island_shape.prj \
            --output-csv build/island_outcome_smoke/island_area.csv \
            --output-summary build/island_outcome_smoke/island_area_summary.json

      - name: Reproduce frozen Natural Earth mainland geometry
        run: |
          python benchmarks/fetch_natural_earth_australia_mainland.py \
            --declared-version 5.1.1 \
            --output-dir build/island_outcome_smoke/mainland

      - name: Reproduce frozen 842-island mainland distances
        run: |
          python benchmarks/build_aislands_mainland_distance.py \
            --island-audit-csv build/island_outcome_smoke/island_model_audit.csv \
            --mainland-ring-csv build/island_outcome_smoke/mainland/australia_continental_mainland_ring.csv \
            --output-csv build/island_outcome_smoke/mainland_distance.csv \
            --output-summary build/island_outcome_smoke/mainland_distance_summary.json

      - name: Hard-match outcome-independent geographic fingerprints
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          area = json.loads(Path('build/island_outcome_smoke/island_area_summary.json').read_text())
          mainland = json.loads(Path('build/island_outcome_smoke/mainland/mainland_source_manifest.json').read_text())
          distance = json.loads(Path('build/island_outcome_smoke/mainland_distance_summary.json').read_text())
          area_expected = json.loads(Path('validation/aislands_isolation_adequacy_20260812/area_gate_expected.json').read_text())
          mainland_expected = json.loads(Path('validation/aislands_isolation_adequacy_20260812/mainland_gate_expected.json').read_text())
          assert area['output_area_table_sha256'] == area_expected['derived_area']['area_table_sha256']
          assert mainland['archive_sha256'] == mainland_expected['natural_earth']['archive_sha256']
          assert mainland['selected_mainland_ring_sha256'] == mainland_expected['australia_feature']['selected_mainland_ring_sha256']
          assert distance['output_distance_table_sha256'] == mainland_expected['mainland_distance']['distance_table_sha256']
          assert area['species_outcomes_used'] is False
          assert mainland['species_outcomes_used'] is False
          assert distance['species_outcomes_used'] is False
          PY

      - name: Validate real input identities and schemas without model fitting
        run: |
          python benchmarks/validate_aislands_isolation_outcome_inputs.py \
            --repo-root . \
            --island-data build/island_outcome_smoke/source/island_data.csv \
            --species-data build/island_outcome_smoke/source/species_data.csv \
            --island-audit-csv build/island_outcome_smoke/island_model_audit.csv \
            --area-csv build/island_outcome_smoke/island_area.csv \
            --mainland-csv build/island_outcome_smoke/mainland_distance.csv \
            --output build/island_outcome_smoke/input_validation.json

      - name: Prove no extension outcome was scored
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/island_outcome_smoke/input_validation.json').read_text())
          assert result['islands'] == 842
          assert result['taxa'] == 886
          assert result['folds'] == 5
          assert result['models_fitted'] == 0
          assert result['heldout_predictions_scored'] == 0
          assert result['c_minus_r3_inspected'] is False
          print(json.dumps(result, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: aislands-isolation-outcome-smoke
          path: |
            build/island_outcome_smoke/input_validation.json
            build/island_outcome_smoke/frozen_taxon_cohort_summary.json
            build/island_outcome_smoke/spatial_folds_summary.json
            build/island_outcome_smoke/climate_manifest.json
            build/island_outcome_smoke/island_model_audit_summary.json
            build/island_outcome_smoke/island_area_summary.json
            build/island_outcome_smoke/mainland/mainland_source_manifest.json
            build/island_outcome_smoke/mainland_distance_summary.json
          if-no-files-found: error
