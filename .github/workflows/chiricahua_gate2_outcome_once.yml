name: Chiricahua Gate 2 once-only empirical outcome

on:
  pull_request:
    paths:
      - ".github/workflows/chiricahua_gate2_outcome_once.yml"

permissions:
  contents: read

jobs:
  outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen runner identity
        run: |
          test "$(git hash-object benchmarks/run_chiricahua_gate2_outcome.py)" = 'e40c7252419a52c6605b46caa27a5f7de47b1774'
          test -s validation/chiricahua_two_layer/gate2_outcome_smoke_result.json
          test -s validation/chiricahua_two_layer/gate2_prediction_comparator_contract.json
          test -s validation/chiricahua_two_layer/gate2_amendment_v1_1.json
          test -s validation/chiricahua_two_layer/gate2_amendment_v1_2.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the smoke-frozen numerical runtime and EOG
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==2.3.2' \
            'scipy==1.16.1' \
            'scikit-learn==1.7.1' \
            .
          mkdir -p build/chiricahua_gate2_outcome
          python -m pip freeze > build/chiricahua_gate2_outcome/runtime_freeze.txt

      - name: Fetch exact frozen response-free inputs
        run: |
          curl -L --fail --retry 3 'https://ndownloader.figshare.com/files/10458202' -o /tmp/coords.dryad.csv
          curl -L --fail --retry 3 'https://ndownloader.figshare.com/files/10458193' -o /tmp/water.dryad.csv
          curl -L --fail --retry 3 'https://ndownloader.figshare.com/files/10458190' -o /tmp/temp.wide.dryad.csv
          curl -L --fail --retry 3 'https://ndownloader.figshare.com/files/10458196' -o /tmp/wind.wide.dryad.csv
          test "$(md5sum /tmp/coords.dryad.csv | awk '{print $1}')" = '3df38d6b4aa7d52f8dea01aa6d8ca164'
          test "$(md5sum /tmp/water.dryad.csv | awk '{print $1}')" = '63deb40bf290a794cd39dc760629f4ab'
          test "$(md5sum /tmp/temp.wide.dryad.csv | awk '{print $1}')" = 'c32a57c8053e34d71990f0fa6e0bb95b'
          test "$(md5sum /tmp/wind.wide.dryad.csv | awk '{print $1}')" = '6ff1e576989da12d728951517a81967d'

      - name: Open the exact detection history once
        run: |
          test ! -e /tmp/y.wide.dryad.csv
          curl -L --fail --retry 3 'https://ndownloader.figshare.com/files/10458199' -o /tmp/y.wide.dryad.csv
          test "$(stat -c%s /tmp/y.wide.dryad.csv)" = '5859'
          test "$(md5sum /tmp/y.wide.dryad.csv | awk '{print $1}')" = '1a71e692356300fcf181fe77347da1b6'
          test "$(sha256sum /tmp/y.wide.dryad.csv | awk '{print $1}')" = '29f18ccaad9f9882bdb93e246ba12e58816c186b0833474c16fd8430ce566438'
          {
            echo "runner_blob_sha=e40c7252419a52c6605b46caa27a5f7de47b1774"
            echo "coords_md5=3df38d6b4aa7d52f8dea01aa6d8ca164"
            echo "water_md5=63deb40bf290a794cd39dc760629f4ab"
            echo "temperature_md5=c32a57c8053e34d71990f0fa6e0bb95b"
            echo "wind_md5=6ff1e576989da12d728951517a81967d"
            echo "response_md5=1a71e692356300fcf181fe77347da1b6"
            echo "response_sha256=29f18ccaad9f9882bdb93e246ba12e58816c186b0833474c16fd8430ce566438"
          } > build/chiricahua_gate2_outcome/source_identity.txt

      - name: Run the frozen empirical outcome exactly once
        run: |
          python benchmarks/run_chiricahua_gate2_outcome.py \
            --coords /tmp/coords.dryad.csv \
            --hydroperiod /tmp/water.dryad.csv \
            --temperature /tmp/temp.wide.dryad.csv \
            --wind /tmp/wind.wide.dryad.csv \
            --response /tmp/y.wide.dryad.csv \
            --output build/chiricahua_gate2_outcome/result.json \
            --annual-output build/chiricahua_gate2_outcome/annual_metrics.csv \
            --prediction-output build/chiricahua_gate2_outcome/predictions.csv
          python - <<'PY'
          import json
          import pathlib

          result = json.loads(pathlib.Path('build/chiricahua_gate2_outcome/result.json').read_text())
          allowed = {
              'universe_falsified_before_complete_scoring',
              'completed_universe_falsified_after_final_scoring',
              'non_estimable_response_or_representation',
              'completed_favorable_layer_b',
              'completed_adverse_layer_b',
              'completed_no_confirmed_layer_b_added_value',
          }
          assert result['status'] in allowed
          assert result['response_file_read'] is True
          assert result['response_rows_opened'] is True
          assert result['response_sha256'] == '29f18ccaad9f9882bdb93e246ba12e58816c186b0833474c16fd8430ce566438'
          print(json.dumps({
              'status': result['status'],
              'result_fingerprint': result['result_fingerprint'],
              'layer_b_decision': result['layer_b_decision'],
              'external_added_value_decision': result['external_added_value_decision'],
              'calibration_positive_first_detections': result['calibration_positive_first_detections'],
              'heldout_positive_first_detections': result['heldout_positive_first_detections'],
              'universe_falsified_year': result['universe_falsified_year'],
              'runtime': result['runtime'],
          }, indent=2, sort_keys=True))
          PY

      - name: Remove every downloaded source byte
        if: always()
        run: |
          rm -f \
            /tmp/coords.dryad.csv \
            /tmp/water.dryad.csv \
            /tmp/temp.wide.dryad.csv \
            /tmp/wind.wide.dryad.csv \
            /tmp/y.wide.dryad.csv

      - name: Upload authoritative once-only outcome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chiricahua-gate2-once-only-outcome
          path: build/chiricahua_gate2_outcome
