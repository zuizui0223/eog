name: Algar Restoration response-blind Gate0

on:
  push:
    branches:
      - agent/algar-restoration-v2-gate0-live
    paths:
      - validation/algar_restoration_v2_prelock/execute_once.json

permissions:
  contents: read

jobs:
  gate0:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e . --no-deps

      - name: Verify authorization bindings
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path("validation/algar_restoration_v2_prelock")
          marker = json.loads((root / "execute_once.json").read_text())
          assert marker["execute_once"] is True
          auth = json.loads((root / marker["authorization"]).read_text())
          for field, path in {
              "contract_git_blob_sha1": root / "source_discovery_contract.json",
              "evaluator_git_blob_sha1": root / "gate0_safe_registry.py",
          }.items():
              actual = subprocess.check_output(["git","hash-object",str(path)], text=True).strip()
              assert actual == auth[field], (field, actual, auth[field])
          PY

      - name: Fetch only frozen safe source blobs
        env:
          SOURCE_REPO: WildCoLab/Introduction-to-Camera-Trap-Data-Management-and-Analysis-in-R
          SOURCE_COMMIT: 6b4170abbad9f7f7762ef6874e1246b28000f371
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path

          root = Path("validation/algar_restoration_v2_prelock")
          contract = json.loads((root / "source_discovery_contract.json").read_text())
          safe = {
              row["source_id"]: row
              for row in contract["metadata_only_discovery"]["sources"]
              if row["source_id"] in {"algar_deployments","algar_projects"}
          }
          base = (
              "https://raw.githubusercontent.com/"
              + os.environ["SOURCE_REPO"] + "/"
              + os.environ["SOURCE_COMMIT"] + "/"
          )
          out = Path("/tmp/algar-safe")
          out.mkdir()
          for source_id, row in safe.items():
              url = base + row["path"].replace(" ", "%20")
              request = urllib.request.Request(
                  url, headers={"User-Agent":"EOG-WF-v2-safe-source/1.0"}
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  body = response.read(row["byte_count"] + 1)
              assert len(body) == row["byte_count"], (source_id, len(body), row["byte_count"])
              target = out / f"{source_id}.csv"
              target.write_bytes(body)
          PY

      - name: Evaluate safe registry only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from validation.algar_restoration_v2_prelock.gate0_safe_registry import run_from_safe_bytes

          root = Path("validation/algar_restoration_v2_prelock")
          contract = json.loads((root / "source_discovery_contract.json").read_text())
          safe = Path("/tmp/algar-safe")
          result = run_from_safe_bytes(
              contract,
              deployments_text=(safe / "algar_deployments.csv").read_text(encoding="utf-8-sig"),
              projects_text=(safe / "algar_projects.csv").read_text(encoding="utf-8-sig"),
          )
          assert result["candidate_locked"] is False
          assert result["focal_species_selected"] is False
          assert result["response_rows_opened"] is False
          assert result["response_bytes_opened"] is False
          assert result["biological_response_values_opened"] is False
          assert result["model_fits"] == 0
          assert result["heldout_scores"] == 0
          path = root / "gate0_safe_registry_result.json"
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps({
              "status":result["status"],
              "candidate_ready":result["candidate_ready"],
              "safe_registry":result["safe_registry"],
              "fingerprint":result["fingerprint"],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: algar-restoration-v2-gate0-safe-registry
          path: validation/algar_restoration_v2_prelock/gate0_safe_registry_result.json
          if-no-files-found: error
