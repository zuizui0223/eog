name: BBS Northern Bobwhite replication 2 Gate3

on:
  push:
    branches:
      - agent/bbs-northern-bobwhite-replication-2
    paths:
      - validation/bbs_northern_bobwhite_replication_2/gate2_structural_certificate.json
      - validation/bbs_northern_bobwhite_replication_2/gate3_conventional_feature_profile.py
      - .github/workflows/bbs_northern_bobwhite_replication_2_gate3.yml

permissions:
  contents: read

jobs:
  gate3:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen structural dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Compile Gate3
        run: python -m py_compile validation/bbs_northern_bobwhite_replication_2/gate3_conventional_feature_profile.py
      - name: Run response-independent feature profile
        id: gate
        continue-on-error: true
        run: python validation/bbs_northern_bobwhite_replication_2/gate3_conventional_feature_profile.py
      - name: Assert bird response stayed closed
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/bbs_northern_bobwhite_replication_2/gate3_conventional_feature_profile.json')
          assert p.exists()
          r=json.loads(p.read_text()); a=r['response_firewall']
          assert a['avian_payload_requests']==0 and a['avian_payload_bytes_opened']==0 and a['avian_header_bytes_opened']==0
          assert a['avian_rows_opened'] is False and a['avian_values_opened'] is False
          assert a['model_fits']==0 and a['heldout_scores']==0
          print(json.dumps({'status':r['status'],'analysis_registry':r.get('analysis_registry'),'bcr':r.get('bcr'),'weather_profiles':r.get('weather_profiles'),'fingerprint':r['fingerprint'],'response_firewall':a},indent=2,sort_keys=True))
          PY
      - name: Upload Gate3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbs-northern-bobwhite-replication-2-gate3
          path: build/bbs_northern_bobwhite_replication_2/gate3_conventional_feature_profile.json
          if-no-files-found: error
      - name: Propagate engineering failure only
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/bbs_northern_bobwhite_replication_2/gate3_conventional_feature_profile.json').read_text())
          if r['status'].startswith('engineering_failure'):
              raise SystemExit(r['reason'])
          print('Gate3 terminal status:',r['status'])
          PY
