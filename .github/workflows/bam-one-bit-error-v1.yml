name: BAM one erroneous assay read (finite-world, exploratory)

on:
  pull_request:
    paths:
      - "benchmarks/bam_one_bit_error_v1.py"
      - "tests/test_bam_one_bit_error_v1.py"
      - "validation/bam_assay_bit_error_v1/protocol_v1.json"
      - ".github/workflows/bam-one-bit-error-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-error-correcting-assays:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed EOG development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Original generator and contract tests
        run: |
          test "$(git hash-object src/eog/v2/known_truth_bam_generality.py)" = "ab852b02bccdfb2f065717f89b482b7cf15778d3"
          python -m pytest -q tests/test_bam_one_bit_error_v1.py tests/test_bam_one_missed_G_v1.py
      - name: Replay original 768 worlds, 2627 D and globally optimal fixed panels
        run: |
          python benchmarks/bam_one_bit_error_v1.py --output-dir /tmp/bam_assay_bit_error
          test -s /tmp/bam_assay_bit_error/observed_D_panels.csv
          test -s /tmp/bam_assay_bit_error/true_G_max_cost.csv
      - name: Post-exposure regression and error-safety checks
        run: |
          python - <<'PY'
          import csv,json
          from collections import Counter
          from pathlib import Path
          p=Path('/tmp/bam_assay_bit_error')
          s=json.loads((p/'result.json').read_text())
          assert s['source']=={'systems':12,'worlds':768,'exact_G_fibres':129,'observed_D_fibres':2627,'perfect_G_M_direction_known':121}
          assert s['no_error_reads_histogram']=={'0':2483,'1':87,'2':53,'3':4}
          assert s['one_error_reads_histogram']=={'0':2483,'3':87,'6':53,'9':4}
          assert [s['one_error_observation_fibres_by_budget'][str(x)] for x in (0,1,2,3,6,9)]==[2483,2483,2483,2570,2623,2627]
          assert [s['one_error_robust_true_G_by_budget'][str(x)] for x in (0,1,2,3,6,9)]==[86,86,86,117,121,129]
          rows=list(csv.DictReader((p/'observed_D_panels.csv').open()))
          assert len(rows)==2627
          assert all(int(r['one_error_min_reads'])==3*int(r['zero_error_min_reads']) for r in rows)
          assert sum(int(r['one_error_min_reads'])>0 for r in rows)==144
          print('BAM_ONE_ASSAY_BIT_ERROR_POST_EXPOSURE_REPLAY_MATCHED')
          PY
      - name: Archive all verified source-dependent panels and numeric receipts
        uses: actions/upload-artifact@v4
        with:
          name: bam-one-bit-error-correcting-assay-panels-v1
          path: /tmp/bam_assay_bit_error/*
