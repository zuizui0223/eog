name: Giant kelp once-only outcome audit

on:
  push:
    branches:
      - agent/giant-kelp-preflight
    paths:
      - ".github/workflows/giant_kelp_outcome_audit.yml"
  pull_request:
    paths:
      - ".github/workflows/giant_kelp_outcome_audit.yml"

permissions:
  contents: read
  actions: read

jobs:
  locate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Locate immutable once-only push run
        run: |
          set -euo pipefail
          mkdir -p build/giant_kelp_outcome_audit
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          repo=os.environ['REPOSITORY']
          token=os.environ['GH_TOKEN']
          workflow='giant_kelp_outcome_once.yml'
          expected_head='ee1d99e21b34e430c39d7d38e42b551fc0d806c0'
          branch='agent/giant-kelp-preflight'
          url=(f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?'
               + urllib.parse.urlencode({'branch':branch,'event':'push','per_page':20}))
          req=urllib.request.Request(url,headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'eog-giant-kelp-outcome-audit/1.1',
          })
          with urllib.request.urlopen(req,timeout=60) as r:
              payload=json.load(r)
          runs=payload.get('workflow_runs') or []
          matches=[r for r in runs if r.get('run_number')==1 and r.get('run_attempt')==1 and r.get('head_sha')==expected_head]
          if len(matches)!=1:
              raise RuntimeError(f'expected exactly one once-only run #1 attempt #1 at {expected_head}, found {[(r.get("id"),r.get("run_number"),r.get("run_attempt"),r.get("head_sha"),r.get("status")) for r in runs]}')
          run=matches[0]
          out={
              'run_id':run['id'],
              'run_number':run['run_number'],
              'run_attempt':run['run_attempt'],
              'head_sha':run['head_sha'],
              'event':run['event'],
              'status':run['status'],
              'conclusion':run.get('conclusion'),
              'jobs_url':run.get('jobs_url'),
              'artifacts_url':run.get('artifacts_url'),
              'rerun_performed':False,
              'response_reexecution_performed':False,
          }
          open('build/giant_kelp_outcome_audit/outcome_run_locator.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: giant-kelp-outcome-run-locator
          path: build/giant_kelp_outcome_audit/outcome_run_locator.json
          if-no-files-found: error
